    body: |
      #### US-018: Step to the previous or next occurrence of a series

      **Epic:** EP-003 | **Priority:** MEDIUM | **Points:** 2 | **Status:** TODO
      **Blocked by:** -
      **Type:** Feature
      **Traces to:** FR-004 (MoSCoW: Must)

      **User Story**
      As the operator,
      I want the detail page of a recurring meeting to carry a control for the previous and the next occurrence of that same series, each opening beside the page I am on,
      so that preparing this week's standing meeting from last week's note is one click rather than a detour back through the agenda.

      **Demonstrates**
      After implementing this spec, opening any occurrence of a weekly series at `http://personal-kbms.test/meetings/{key}` shows two controls naming the adjacent occurrences by their own date and time; clicking one opens that occurrence in a new tab while the original stays put; the earliest occurrence the mirror holds renders the previous control inert with its reason stated; and a one-off meeting shows neither control.

      **Acceptance Criteria**
      - [ ] On the detail page of an occurrence whose `recurrence_id` is non-empty, two controls render — previous occurrence and next occurrence of the same `source_uid` — each labelled with the neighbour's own date and time, and each a real `<a href>` to `route('meetings.show', …)` built from that neighbour's `OccurrenceKey::toRouteKey()`
      - [ ] Each control carries `target="_blank"` and `rel="noopener"`, so a plain click opens a new tab while cmd/ctrl-click, middle-click, the context menu, and back/forward keep their ordinary meaning — no `window.open`, no click handler that swallows modifier keys
      - [ ] *Previous* resolves to the occurrence of the same `source_uid` with the greatest `starts_at` strictly earlier than the current one; *next* to the smallest `starts_at` strictly later. Ties on `starts_at` are broken deterministically on `recurrence_id`, so an occurrence is never its own neighbour and two rows never resolve to each other
      - [ ] Occurrences cancelled upstream are included in the chain and are reachable by prev/next; the destination page's existing "Cancelled upstream" banner is what states their status — the control itself does not mark them
      - [ ] **Boundary:** when the mirror holds no occurrence in that direction, the control renders disabled with an adjacent reason wired through `aria-describedby`, in the same shape as the existing "Open in Outlook" fallback. The reason speaks about the mirror holding nothing earlier/later and never claims the series begins or ends there
      - [ ] **One-off meetings:** an occurrence whose `recurrence_id` is empty renders neither control. Recurrence is decided by the feed-carried `recurrence_id`, not by counting stored rows — a series whose sync window holds exactly one occurrence still renders both controls, both disabled with their reason
      - [ ] The accessible name carries direction *and* destination (for example "Previous occurrence, Mon 8 Sep 09:00") and announces that the link opens in a new tab; a disabled control's reason remains reachable to a screen reader
      - [ ] Each direction is a single indexed lookup served by the leading column of the `(source_uid, recurrence_id)` unique index — the full series is never loaded, and no N+1 is introduced on the detail page
      - [ ] Feature tests cover: both neighbours present, first stored occurrence (previous disabled), last stored occurrence (next disabled), a cancelled occurrence as a neighbour, a single-occurrence series (both disabled), and a one-off meeting (neither control rendered)
