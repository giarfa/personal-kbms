    code: US-005
    title: 'Agenda view, meeting detail and Open in Outlook'
    epic:
      code: EP-003
      title: 'Meeting Workspace'
      objective: "Every mirrored meeting is browsable and carries the operator's own notes, transcript, and route back to Outlook"
    priority: HIGH
    points: 10
    status: DONE
    body: |-
      #### US-005: Agenda view, meeting detail and Open in Outlook

      **Epic:** EP-003 | **Priority:** HIGH | **Points:** 10 | **Status:** TODO
      **Blocked by:** US-003

      **Traces to:** FR-003, FR-004, FR-009 (MoSCoW: Must)

      **User Story**
      As the operator,
      I want a chronological agenda I can scan and a canonical page per meeting that also gets me into Outlook when I need a real calendar action,
      so that triaging my day and opening a specific meeting is one continuous motion instead of a hunt across tools.

      **Demonstrates**
      After implementing this spec, the agenda lists recent and upcoming meetings defaulting to today, each row opens a meeting detail page showing all mirrored feed data, and an "Open in Outlook" call-to-action reaches the right place in Outlook on the web.

      **Acceptance Criteria**
      - [x] The agenda lists meetings chronologically, **defaults to today**, and supports date-range navigation forward and back
      - [x] The agenda is fully **keyboard navigable** with visible focus states, and rows are reachable without a pointer
      - [x] Each meeting occurrence has a canonical detail route addressed by (`source_uid`, `recurrence_id`) — **not** by a surrogate row id that a resync could change
      - [x] The detail page shows mirrored feed fields read-only: title, start, end, duration, location, organizer, attendees, description
      - [x] Mirrored feed data is **visually distinct** from operator-owned surfaces, so it is obvious which side can change under you on the next sync
      - [x] Cancelled occurrences are clearly marked in both agenda and detail rather than hidden
      - [x] "Open in Outlook" **prefers a feed-carried link** (`event_url`) when present, and otherwise falls back to the configurable `KBMS_OUTLOOK_URL_TEMPLATE` with the event's date and time substituted
      - [x] When a Teams join URL was captured, it is offered as a **distinct action** from the Outlook calendar call-to-action
      - [x] Both links open in a new tab and are safe against tab-nabbing (`rel="noopener"`)
      - [x] Layout is desktop-first, does not break below `768px`, and meets WCAG 2.2 AA contrast in both light and dark themes
      - [x] **Error case:** requesting a detail route for an occurrence that no longer exists returns a clear not-found state, not an exception
      - [x] **Edge case:** with `KBMS_OUTLOOK_URL_TEMPLATE` unset and no feed-carried link, the call-to-action is disabled with an explanatory tooltip rather than producing a broken URL
      - [x] **Edge case:** a date range containing no meetings shows an explicit empty state
      - [x] **Edge case:** overlapping and multi-day events render without collapsing into each other or being dropped
      - [x] Feature tests cover agenda ranges, detail rendering, link preference order, and the disabled call-to-action path


      ## Rework Feedback

      Review verdict: **request changes**. Tests (188/188), Pint, Larastan level 5, Gitflow hygiene, factory/seeder coverage, N+1 posture and the Lars scheme-validation fix (`bb30005`) are all green. Two reproduced defects block acceptance — both falsify or undercut a stated acceptance criterion, and both are contained in files this spec already owns.

      - app/Meetings/AgendaQuery.php:41 — **a multi-day *timed* event overlapping the window start is silently dropped.** The clamp back to the range's first visible day is gated on `$row->isAllDay`, so a timed event that begins before the range is matched by the overlap predicate (`starts_at < $to AND ends_at > $from`), then grouped under a `toDateString()` key that is not in `$range->dates()`, and disappears from the rendered agenda. Reproduced: an event `2026-09-09 22:00 → 2026-09-10 06:00` in a window anchored on `2026-09-10` yields **0 rows**. This contradicts AC 14 verbatim: "overlapping and multi-day events render without collapsing into each other **or being dropped**". Apply the same first-visible-day clamp to timed rows, not only all-day ones (a spanning timed event should render once, in the first day of the range it is visible in, with its span label).

      - tests/Unit/Meetings/AgendaQueryTest.php — **the multi-day clamp is only tested for all-day events.** The plan's test strategy promised "multi-day clamped to the first visible day and rendered once" without qualifying it to all-day, and the shipped assertions only exercise `spanning()` all-day fixtures. Add a timed-span case covering the scenario above so the fix is locked in.

      - app/Livewire/Agenda.php:53 — **a malformed `?date=` query string returns HTTP 500.** `date` carries `#[Url]`, so it is a bookmarkable, hand-editable surface, and `CarbonImmutable::parse($this->date)` throws `DateMalformedStringException` on anything it cannot read. Reproduced: `GET /?date=not-a-date` → **500**, uncaught, on the application's index route. The spec's error-handling posture for the sibling detail route is "a clear not-found state, not an exception"; the agenda should degrade the same way — fall back to today's range (or 404) on an unparseable anchor rather than throwing. Cover it with a feature test in tests/Feature/AgendaPageTest.php.

      Not blocking, carried forward as accepted:

      - database/migrations/2026_09_07_230706_create_calendar_events_table.php — `ends_at` has no dedicated index despite appearing in every agenda-window predicate. Fine at this table's bounded (~270-day mirror) size; revisit only if the window grows well past current expectations.
      - .larapilot/plans/US-005-plan.yaml.lock — untracked 0-byte session artifact, same pattern as US-001/US-002/US-004. Housekeeping, not implementation drift.

      Manual test handoff in .larapilot/docs/test-results/US-005.md is still owed by the operator after rework (keyboard-only, screen reader, light/dark theme, 375px, reduced motion) — the `NORMAL` testing bar ships no browser suite.
