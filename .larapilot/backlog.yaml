    code: US-008
    title: 'Calendar views: month, week and day'
    epic:
      code: EP-003
      title: 'Meeting Workspace'
      objective: "Every mirrored meeting is browsable and carries the operator's own notes, transcript, and route back to Outlook"
    priority: HIGH
    points: 8
    status: DONE
    body: |-
      #### US-008: Calendar views: month, week and day

      **Epic:** EP-003 | **Priority:** HIGH | **Points:** 8 | **Status:** TODO
      **Blocked by:** US-006, US-007

      **User Story**
      As the operator,
      I want month, week, and day views of my mirrored calendar that show me at a glance which meetings I have already annotated,
      so that the calendar doubles as a coverage map and I can see where my knowledge base has gaps.

      **Traces to:** FR-002 (MoSCoW: Must). Sequenced after US-006 and US-007 because the note and transcript presence indicators cannot be demonstrated until those surfaces exist.

      **Demonstrates**
      After implementing this spec, month, week, and day views render the mirrored calendar, meetings carrying notes or a linked transcript are visually distinguished from bare ones, and clicking any event opens its detail page.

      **Acceptance Criteria**
      - [x] Month, week, and day views render mirrored events using FullCalendar **MIT core plugins only** — no premium plugins
      - [x] Meetings carrying notes and/or a linked transcript are **visually distinguished** from bare ones, with the distinction legible without hovering
      - [x] The indicator distinguishes "has notes", "has transcript", and "has both"
      - [x] Clicking or activating an event opens the US-005 detail route
      - [x] Views are **keyboard navigable** with visible focus, and the calendar grid carries deliberate screen-reader semantics — FullCalendar's defaults alone are not sufficient
      - [x] Events render in `KBMS_TIMEZONE` and remain correct across a DST boundary
      - [x] All-day events render in the all-day lane, not as midnight-to-midnight blocks
      - [x] Cancelled occurrences are visually distinct from active ones
      - [x] View and date position survive navigation to a meeting and back
      - [x] AA contrast holds for every event state in both light and dark themes
      - [x] Only the visible range is queried — the view does not load the whole mirror
      - [x] **Error case:** a range with no events renders an empty grid, not a broken layout
      - [x] **Edge case:** a day with many overlapping meetings degrades gracefully (stacking or a "+N more" affordance) without hiding events silently
      - [x] **Edge case:** multi-day events span correctly in month view


      ## Rework Feedback

      **Rework scope: one finding.** Everything else in the US-008 review passes — 353/353 tests green, Pint + Larastan level 5 clean, `npm run build` succeeds, Lars GO, all acceptance criteria met except the keyboard-navigation gap below. Do not re-open the copy, CHANGELOG or design-system notes from the review; they were explicitly deferred.

      - `resources/js/calendar.js:pageView()` — `PageUp`/`PageDown` drops keyboard focus out of the grid in **Month** view. `stepDays` is computed only for `week` (7) and `day` (1); for `month` it is `null`, so the `if (stepDays)` block never runs and no `pendingFocusDate` is queued before `this.calendar.next()` / `.prev()`. `datesSet` therefore takes the `else` branch and calls `syncRovingTabindex()`, which reassigns `tabindex` but never calls `.focus()` — and FullCalendar has already destroyed the previously focused cell during the re-render, so focus falls back to `<body>`. Week and Day views are unaffected (they queue the focus correctly), and arrow-key navigation past the edge of the visible range is unaffected (`focusOn()` queues `pendingFocusDate` on its own).
      - `resources/js/calendar.js:pageView()` — the Month branch must queue a focus target too. Stepping by a fixed day count is wrong for months of unequal length; queue the same day-of-month in the adjacent month (clamped to that month's last day when it does not exist, e.g. 31 January → 28/29 February), or another deterministic in-range date, then set `pendingFocusShouldMoveFocus = true` so `datesSet` restores focus through `focusOn()` exactly as the Week and Day paths already do.
      - `.larapilot/docs/test-results/US-008-manual.md` — the "Keyboard-only pass" section states `PageUp` / `PageDown` "step to the previous/next range (month, week, or day) and land focus on the corresponding day" for all three views. That is the correct target behaviour; it just does not hold in Month view today. No edit needed once the code matches it — but the manual pass must actually exercise Month-view paging, not only Week and Day.
      - `tests/Feature/CalendarPageTest.php` — automated coverage at the `NORMAL` bar cannot reach FullCalendar's rendered DOM, which is why this slipped through. Do not add a browser suite for it (that is the `BEST` bar). Instead, extract the month-paging focus-target computation into a pure helper in `resources/js/calendar.js` so its clamping behaviour is inspectable, and rely on the manual handoff for the DOM-level assertion.
