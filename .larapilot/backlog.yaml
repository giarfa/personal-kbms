    code: US-001
    title: 'Application scaffold and local environment'
    epic:
      code: EP-001
      title: 'Foundation & Environment'
      objective: 'The application runs locally under Herd with its scaffold, storage, and every integration assumption verifiable in one command'
    priority: HIGH
