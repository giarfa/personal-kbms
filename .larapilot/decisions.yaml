    ts: '2026-09-08T19:31:54+02:00'
    user: 'git:giarfa <giarfa@outlook.com>'
    phase: larapilot-plan
    topic: 'us-005 occurrence route addressing'
    label: 'us-005 occurrence route addressing'
    value: 'Detail route is /meetings/{occurrence}, one URL-safe segment = base64url(source_uid) [. base64url(recurrence_id)]; decoded by an OccurrenceKey value object + Route::bind that 404s on miss. Chosen over raw path segments because Laravel matches parameters against decodedPath(), so %2F in an RFC 5545 UID breaks [^/]+ matching; no occurrence_key column added, the existing (source_uid, recurrence_id) unique index serves the lookup.'
    question: null
    rationale: null
