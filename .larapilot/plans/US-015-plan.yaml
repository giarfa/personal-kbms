    id: TASK-01
    title: 'Verify the .txt context sibling before it is handed to the launcher'
    body: |-
      ## Description
      Close the gap where `LaunchPreflight::for()` swaps the resolved `.md` transcript path to `.txt` (for the launcher script contract) **after** every containment/readability check has already run, so a missing or unreadable `.txt` sibling silently reaches the job instead of blocking the launch with a named reason.

      ## Files Involved
      - app/Launcher/LaunchPreflight.php
      - app/Launcher/LaunchBlock.php
      - app/Launcher/LaunchBlockDetail.php
      - database/seeders/MeetingTranscriptSeeder.php
      - README.md
      - CHANGELOG.md

      ## Steps
      1. In `LaunchPreflight`, promote the private `withTxtExtension()` swap into a single named, reusable place (e.g. `public static function txtSiblingPath(string $mdPath): string`) so both `for()` and `LaunchBlockDetail` derive the `.txt` path from the same method — no second place re-implements the swap.
      2. In `for()`, call that method immediately after the existing `.md` checks pass, then run the same rigour on the result: `TranscriptsDirectory::contains($txtPath)` and `is_readable($txtPath)`. On failure, return a new distinct `LaunchBlock` case (never `NoTranscript` or `TranscriptUnreadable`). On success, build `LaunchCommand` with the already-verified `.txt` path (question checks still run after, unchanged order).
      3. Add the new case to `LaunchBlock` (enum + `message(?string $detail)` match arm) naming the expected `.txt` path and the action that fixes it (the recording pipeline must write the sibling alongside the `.md` transcript) — follow the existing wording style of `TranscriptUnreadable`/`LauncherMissing`.
      4. Wire `LaunchBlockDetail::for()` to compute the detail for the new case via the same `txtSiblingPath()` helper on the `$transcriptPath` (`.md`) it already receives — no view/template change needed since `AskClaude::render()` and the Blade view already render `$blockMessage` generically for any `LaunchBlock` (US-014).
      5. Update `MeetingTranscriptSeeder`: for every seeded `.md` fixture meant to demonstrate a ready-to-launch panel (exact match, weekly-sync drift, ambiguous-but-resolvable, manual link — **not** the deliberately broken link), also write a `.txt` sibling with placeholder content, so `migrate:fresh --seed` keeps showing a real, launchable demo.
      6. Update `README.md` §"The launcher script contract" (around line 190) to state the `.txt` sibling is verified for containment and readability before being handed to the script, not merely derived from the `.md` path.
      7. Add a line to `CHANGELOG.md` `[Unreleased] -> ### Fixed` describing the fix.
      8. `php artisan migrate:fresh --seed` — confirm seeded launch-ready meetings still show "Launcher ready" on the meeting detail page.

      ## Completion Criteria
      - [x] `.txt` sibling is checked for containment and readability with the same rigour as the `.md` path
      - [x] A missing/unreadable sibling returns its own distinct `LaunchBlock` case, message names the expected path and the fix action
      - [x] The extension swap exists in exactly one named place; checks run after it in both `for()` and `LaunchBlockDetail`
      - [x] `LaunchClaudeSession`'s second preflight pass refuses the same way when the sibling is deleted between dispatch and execution
      - [x] Seeded demo data still demonstrates a real, launchable meeting after `migrate:fresh --seed`
      - [x] README launcher-script contract section and CHANGELOG updated

      ## Test Data
      - N/A — no Eloquent model/migration changes; `MeetingTranscriptSeeder` fixture files updated per Steps 5 (not a factory/seeder schema change)

      ## Git Deliverables
      - Commit: `fix(US-015): TASK-01 verify txt context sibling before launch`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes only
