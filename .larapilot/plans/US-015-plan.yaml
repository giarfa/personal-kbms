    id: TASK-02
    title: 'Fix stale .md-path test expectations and add sibling regression coverage'
    body: |-
      ## Description
      Correct the 14 tests already red on `develop` (stale `.md`-path expectations from the extension-swap commit `d6d8ea5`, not introduced by this spec), and add regression coverage for the new sibling-verification behaviour from TASK-01.

      ## Files Involved
      - tests/Unit/Launcher/LaunchPreflightTest.php
      - tests/Feature/LaunchClaudeSessionJobTest.php
      - tests/Feature/AskClaudePanelTest.php

      ## Steps
      1. Update the three shared test fixture helpers to also write a `.txt` sibling alongside the `.md` file they create: `LaunchPreflightTest::readableTranscriptPath()`, `AskClaudePanelTest::readableTranscriptPath()`, `LaunchClaudeSessionJobTest::contextPath()` — every other passing test in these files depends on these helpers and would otherwise start failing once TASK-01 lands.
      2. Fix `LaunchClaudeSessionJobTest::test_every_adversarial_question_reaches_the_process_as_a_single_intact_argument` (all 13 datasets): assert the process ran with the `.txt` sibling path, not `$launch->context_path` (`.md`).
      3. Fix `AskClaudePanelTest::test_the_rendered_invocation_matches_launch_command_display_for_an_adversarial_question`: build the expected `LaunchCommand` with the `.txt` sibling path, not the raw `.md` path from `readableTranscriptPath()`.
      4. Add new tests to `LaunchPreflightTest`: sibling present returns `LaunchCommand` with the `.txt` path (already covered by existing happy-path tests once step 1 lands — confirm); sibling absent returns the new `LaunchBlock` case; sibling present but unreadable (e.g. `chmod` the `.txt` file to `0000`) returns the same new case.
      5. Add a feature-level test (`AskClaudePanelTest` and/or `LaunchClaudeSessionJobTest`) asserting: no `.txt` sibling → Launch button disabled, new block message rendered, nothing queued/dispatched; second-pass job re-check catches a sibling deleted between dispatch and execution (extend the existing `test_a_second_pass_preflight_failure_blocks_and_runs_nothing` pattern, deleting only the `.txt` sibling while the `.md` stays).
      6. `php artisan test` — confirm the full suite is green, including `tests/Unit/Launcher/LaunchCommandTest.php`'s adversarial-question datasets (unaffected by this change, re-run to confirm no regression).

      ## Completion Criteria
      - [ ] All 14 previously-failing tests pass, asserting the `.txt` path deliberately
      - [ ] New regression tests cover: sibling present (proceeds), sibling absent (new block, nothing dispatched), sibling unreadable (same block)
      - [ ] Full suite green

