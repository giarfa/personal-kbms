code: US-015
plan_body: |-
  ## Technical Solution

  **Root cause.** `LaunchPreflight::for()` (`app/Launcher/LaunchPreflight.php:65-80`) validates the resolved `.md` transcript (`TranscriptsDirectory::contains()` + `is_readable()`), then privately calls `withTxtExtension()` to rewrite the extension **after** every check — so the path actually handed to the launcher script (the `.txt` sibling) is never itself checked for containment or readability. FR-006's promise ("verified to exist and be readable") is applied to a file the script never opens.

  **Fix shape.**
  1. Promote the extension swap out of a private, late-called helper into the **single named place** where the `.txt` path is derived (e.g. `LaunchPreflight::txtSiblingPath(string $mdPath): string`, public static so `LaunchBlockDetail` can reuse the same swap instead of re-deriving it). `for()` calls it once, immediately followed by the same rigour already applied to the `.md` path: `TranscriptsDirectory::contains()` then `is_readable()` on the `.txt` result.
  2. Add one new `LaunchBlock` case (e.g. `TranscriptSiblingUnreadable`) covering both "missing" and "unreadable" for the sibling — same precedent as the existing `TranscriptUnreadable` case, which already covers both "gone" and "unreadable" for the `.md` path. Message names the expected `.txt` path and states the fix action (the recording pipeline must (re)write it) — never collapsed into `NoTranscript` or `TranscriptUnreadable`.
  3. Wire the new case's detail through `LaunchBlockDetail::for()` (reusing the same swap helper from step 1 on the `.md` path already passed in) so both the Livewire panel (`AskClaude::render()`) and the job's second pass (`LaunchClaudeSession::handle()`) render it without any view change — the panel already renders `$blockMessage` generically for any `LaunchBlock`, per US-014.
  4. No change to `LaunchCommand`, `ClaudeSessionLauncher`, or the Blade view — the sibling check is a new refusal branch inside `LaunchPreflight::for()`, and the resulting `LaunchCommand`'s `contextPath` is still the `.txt` path (unchanged behaviour on the happy path).
  5. Dev demo data: `database/seeders/MeetingTranscriptSeeder.php` currently writes only `.md` fixture files. Once the sibling check lands, every seeded meeting would show the new blocked state instead of the intended launch-ready demo — write a matching `.txt` sibling alongside every seeded `.md` that is meant to demonstrate a ready-to-launch panel (not the deliberately-broken-link case, which stays broken on purpose).
  6. `README.md`'s launcher-script contract section (line ~190) and the `CHANGELOG.md` `Unreleased -> Fixed` section get a line each describing the verified-sibling behaviour.

  ## Git & Branching
  - Mode: GITFLOW (from settings.git_mode)
  - Branch: `feature/US-015-verify-txt-sibling` from `develop`
  - TASK-00: bootstrap (no push — PR prepared locally only, per GITFLOW)
  - Per task: one Conventional Commit; no push/remote PR under GITFLOW
  - Merge after human `larapilot-review` approval (auto_approve is YES, so autopilot may approve after implement with no open Critical blockers)

  ## Test Data Strategy
  - No new/changed Eloquent models or migrations — `Test Data` is N/A on every task except the seeder demo-data update noted in TASK-01
  - `MeetingTranscriptSeeder` keeps writing real fixture files (not factories) for the `.md`/`.txt` panel-state demo per README §Transcripts; TASK-01 adds the missing `.txt` sibling for every seeded launch-ready meeting so `migrate:fresh --seed` keeps demonstrating every panel state, including a real successful launch
  - Verify `php artisan migrate:fresh --seed` still succeeds and the seeded "ready to launch" meetings show the enabled Launch button after TASK-01

  ## Test Strategy
  - Bar: NORMAL (settings.testing) — Pest/PHPUnit feature + unit tests only, no browser/E2E
  - Anne (TASK-02): correct the 14 tests already red on `develop` at `fca3fd4` (stale `.md`-path expectations from the extension-swap commit `d6d8ea5`, not a second defect) by updating the three shared test fixture helpers (`LaunchPreflightTest::readableTranscriptPath()`, `AskClaudePanelTest::readableTranscriptPath()`, `LaunchClaudeSessionJobTest::contextPath()`) to also write the `.txt` sibling, and updating the two directly-affected tests' assertions to the `.txt` path
  - Anne (TASK-02): new regression coverage for the sibling check — sibling present launch proceeds with the `.txt` path (unit, `LaunchPreflightTest`); sibling absent returns the new block and no job is dispatched (feature, `AskClaudePanelTest` + `LaunchClaudeSessionJobTest`); sibling present but unreadable (e.g. `chmod 0000`) returns the same block
  - No regression to shell-argument safety: `LaunchCommandTest`'s adversarial-question datasets are unaffected by this change (they exercise `LaunchCommand::toArray()` directly) — re-run to confirm
  - Full suite green (`php artisan test`); `vendor/bin/pint --dirty` and Larastan clean before handoff
