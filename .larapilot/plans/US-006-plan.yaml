    id: TASK-09
    title: 'Feature-test recurrence isolation, resync durability, coverage and the delete path'
    type: Test
    status: TODO
    assignee: Anne
    estimate_hours: 5
    dependencies:
      - TASK-06
      - TASK-07
      - TASK-08
    body: |-
      ## Description
      The acceptance suite for this spec. The recurrence-isolation case is the one the spec and the PRD both name as the highest-value test in the codebase; the durability cases pin properties that nothing in the code actively enforces, so a later refactor could break them in silence.

      `NORMAL` bar — PHPUnit feature tests via `Livewire::test()` and HTTP assertions. No Playwright, Dusk, Pest browser or viewport suites.

      ## Files Involved
      - tests/Feature/MeetingNotesTest.php
      - tests/Feature/MeetingNoteDurabilityTest.php
      - tests/Unit/Meetings/MeetingCoverageLookupTest.php
      - tests/Feature/AgendaPageTest.php (extended)

      ## Steps
      1. `php artisan make:test --phpunit MeetingNotesTest`, `MeetingNoteDurabilityTest`, and a unit test for the lookup; use `CalendarEventFactory` and `MeetingNoteFactory` throughout — no hand-built rows
      2. **`MeetingNotesTest`** — recurrence isolation first: two occurrences of one `source_uid` with different `recurrence_id`s, a note written on one, then assert the sibling's component mounts with an empty body **and** the sibling's page does not render the first's text. Then: autosave persists with no save action; the indicator advances `saving` → `saved`; a forced write failure renders `Not saved` + `Retry`, leaves `$body` intact, and a successful `retry()` persists it; Preview renders through the renderer and an HTML-bearing note appears escaped in the response; the component behaves identically for a **past** and a **future** occurrence and on a **cancelled** one (no state gate); clearing the editor persists a blank body and keeps the row; the delete path removes the row, renders both required dialog strings, and empties the editor without recreating it
      3. **`MeetingNoteDurabilityTest`** — drive `EventSynchronizer` (not a hand-written `update()`) so the test exercises the real sync path: a note survives a run that retitles, reschedules and relocates its occurrence and is still reachable at the same route; survives an upstream `STATUS:CANCELLED` and stays editable on the cancelled occurrence; survives the disappearance sweep; and survives outright deletion of the `calendar_events` row, re-attaching when the same (`source_uid`, `recurrence_id`) reappears
      4. **`MeetingCoverageLookupTest`** — a non-blank note flags only its own occurrence; a blank-bodied note does not flag; an occurrence with no row does not flag; assert the **query count** via `DB::listen` so a future N+1 fails here
      5. **`AgendaPageTest`** — extend with the badge assertions: annotated vs `Not annotated`, blank note reads `Not annotated`, the day header's annotated count, and one occurrence of a series badged without its siblings
      6. `php artisan test` (full suite — this spec changes `AgendaRow`'s constructor signature, so the existing agenda and detail suites must be re-verified, not just the new files)
      7. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Recurrence isolation asserted at both the component and the rendered-page level
      - [ ] Resync durability asserted across retitle, reschedule, relocate, cancel and disappearance — driven through `EventSynchronizer`
      - [ ] The orphan edge case asserted: the note survives its occurrence row and re-attaches
      - [ ] Autosave-failure path asserted to preserve typed content
      - [ ] Delete path and both required dialog strings asserted
      - [ ] Agenda coverage badges and the query-count bound asserted
      - [ ] Full suite green; Pint + Larastan level 5 clean
      - [ ] Coverage matches the `NORMAL` bar — no browser or viewport suites added

      ## Git Deliverables
      - Commit: `test(US-006): TASK-09 cover recurrence isolation, resync durability and note coverage`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
