    id: TASK-11
    title: 'Fix the stale and inert agenda query-count assertion'
    type: Fix
    status: DONE
    assignee: Anne
    estimate_hours: 1
    dependencies: {}
    body: |
      ## Description
      Fix: `tests/Unit/Meetings/AgendaQueryTest.php` still asserts the agenda costs **one** query, while TASK-08 made it two. The suite fails on ~1 run in 3, and on the runs where it passes it asserts nothing about batching.

      `AgendaQuery::for()` now issues exactly two queries — the `calendar_events` overlap read, plus `MeetingCoverageLookup::for()` — and `app/Meetings/AgendaQuery.php:36-38` documents that as the intended contract. **The implementation is correct; the test is wrong.** Do not "fix" this by reverting the batched lookup.

      The test is intermittent rather than always-red because `CalendarEventFactory::definition()` draws `dateTimeBetween('-30 days', '+45 days')` while `AgendaRange::today()` spans a single day: the three unpinned fixture events usually fall outside the window, `MeetingCoverageLookup::for()` returns early on an empty `$uids`, and the count is 1. Pinning the fixtures into the range is therefore not cosmetic — it is what makes the test able to observe anything at all.

      ## Files Involved
      - tests/Unit/Meetings/AgendaQueryTest.php

      ## Steps
      1. Reproduce first, so the fix is anchored to a real failure rather than a description of one: `vendor/bin/phpunit --random-order-seed=6` and `--random-order-seed=9` both fail with `Failed asserting that 2 is identical to 1` at `AgendaQueryTest.php:287`; seeds 3 and 11 pass.
      2. Rename `test_the_agenda_is_built_with_a_single_query` — the name is now false. Use `test_the_agenda_costs_a_fixed_two_queries_regardless_of_event_count` or equivalent.
      3. Pin every fixture event **into** the range with `->at(now('Europe/Rome')->setTime(...), 30)`, the pattern the rest of the file already uses. The class freezes time to `2026-09-08 12:00:00 Europe/Rome` in `setUp()`, so this is deterministic.
      4. Assert the contract, not a constant: count queries via `DB::listen` for **3** in-range events, then again for **12**, and assert both are `2`. A future N+1 in either the events read or the coverage lookup then fails the suite, which is what the original test was written to do and has never actually done.
      5. Add one in-range event carrying a `MeetingNote` so the coverage query returns rows rather than an empty set — the empty path is what masked the bug, and it must not be the only path exercised.
      6. Prove the repaired test can fail: temporarily add a throwaway extra query inside `AgendaQuery::for()` (e.g. `CalendarEvent::query()->count()`), observe the test go red at 3, then revert. Record the observation in the completion criteria below.
      7. `vendor/bin/phpunit tests/Unit/Meetings/AgendaQueryTest.php`

      ## Completion Criteria
      - [x] `AgendaQueryTest` asserts a fixed **2** queries at both 3 and 12 in-range events
      - [x] Fixtures are pinned into `AgendaRange::today()`; no assertion depends on `dateTimeBetween` randomness
      - [x] At least one fixture carries a `MeetingNote`, so the coverage query returns rows
      - [x] The test name no longer claims a single query
      - [x] Mutation observed: an injected extra query in `AgendaQuery::for()` turns the test red; mutation reverted
      - [x] `vendor/bin/phpunit --random-order-seed=6` and `--random-order-seed=9` both pass

