code: US-006
plan_body: |
  ## Technical Solution

  US-006 is the first spec that gives the operator a **write** surface, and the first to add a table since US-003. Every decision in it follows from one property the spec calls non-negotiable: a note must outlive anything the feed can do to the meeting it hangs on. That rules out any dependency on `calendar_events.id`.

  ### 1. Occurrence-keyed storage, and deliberately no foreign key (Mike + John)

  `meeting_notes` — `id` (UUID, `HasUuids` like `calendar_events`), `event_uid` (string), `event_recurrence_id` (string, default `''`), `body` (text, default `''`), timestamps. `unique(['event_uid', 'event_recurrence_id'])`.

  **No foreign key to `calendar_events`, on purpose.** The only column an FK could target is the UUID surrogate `id`, which is exactly the identity a resync is allowed to change; and `ON DELETE CASCADE` against it would hand the feed a route to destroy operator data. Keying on (`event_uid`, `event_recurrence_id`) instead means a note is addressed by the same pair the detail route already uses, and is reachable the moment an occurrence with that pair exists — before it, after it, or never.

  **Trap — Eloquent has no composite-key relation.** `hasOne(MeetingNote::class, 'event_uid', 'source_uid')->where('event_recurrence_id', $this->recurrence_id)` reads correctly and is wrong under eager loading: `with()` builds the relation from a single parent instance, so that one parent's `recurrence_id` is applied to the whole `whereIn` batch and every sibling occurrence on an agenda page receives the first occurrence's note. **Do not add such a relation to `CalendarEvent`.** Reads go through `MeetingNote::scopeForOccurrence(OccurrenceKey)` for the single case and `MeetingCoverageLookup` for the batch case (§5).

  Storage is plain text. `body` is written and read verbatim; the only transformation ever applied is at render time (§2), so nothing is lost or mangled between what the operator typed and what is stored.

  ### 2. Markdown rendering — one hardened choke point (Lars + Alex)

  `Str::markdown()` is built on `GithubFlavoredMarkdownConverter` (`vendor/laravel/framework/src/Illuminate/Support/Str.php:817`), so GFM tables, task lists, strikethrough and autolinks come free — and FR-016's `- [ ]` checklists already render as checkboxes without extra work.

  But league/commonmark's defaults are hostile here, verified in `vendor/league/commonmark/src/Environment/Environment.php:434-436`:

  | Option | Library default | Required here |
  | --- | --- | --- |
  | `html_input` | `allow` | **`escape`** |
  | `allow_unsafe_links` | `true` | **`false`** |
  | `max_nesting_level` | `PHP_INT_MAX` | **`20`** |

  A bare `Str::markdown($note->body)` therefore renders an embedded `<script>` verbatim and lets a `javascript:` href through — the precise opposite of the acceptance criterion. `escape` rather than `strip` is chosen on purpose: the operator sees the HTML they typed rendered as literal text, instead of it silently vanishing.

  `app/Meetings/MarkdownRenderer.php` — one `final` class, one `render(string $body): HtmlString` method, that option set applied in exactly one place. Views call it and nothing else calls `Str::markdown()` on note content. **No dependency change:** `league/commonmark ^2.8.1` is a hard `require` of `laravel/framework` (`composer.lock:1372`), so this is a framework API, not a vendor addition.

  ### 3. Autosave (Alex + Joe)

  `App\Livewire\MeetingNotes` — class-based per the recorded `livewire component style` decision, mounted into the owned column of `resources/views/pages/meeting.blade.php`. That is the seam US-005 left open: the page stays a controller + Blade view, and this spec replaces its `Meeting notes arrive with US-006.` placeholder with `<livewire:meeting-notes :occurrence="$row->event" />`.

  - `wire:model.live.debounce.750ms` on `$body`, the mapping the mockup README records for `kb-textarea` + autosave. `updatedBody()` performs the write.
  - `$saveState` (`idle` | `saving` | `saved` | `error`) drives `kb-savestate`; `$savedAt` renders the mockup's `Saved 12:04`. The indicator is `aria-live="polite"`; the error variant is `role="alert"` — per the mockup a11y contract, Livewire must update **inside** these nodes, not replace them.
  - **A failure never discards typed content.** The write is wrapped so a failure sets `error` and leaves `$body` alone; Livewire's client already holds the typed value, so a failed round-trip cannot roll the textarea back. A `retry()` action re-attempts the same write, matching `states.html`: `Not saved` + `Retry` + `Typed content stays in the editor. Nothing is discarded silently.`
  - **No save button and no state gate.** The component is byte-identical before and after `starts_at`; there is deliberately no `isPast()` branch anywhere in this spec, and a test pins that.
  - **Write / Preview is a hand-rolled ARIA tablist, not `<flux:tab.group>`.** The mockup README's implementation mapping names Flux tabs, but tabs are a **Flux Pro** component and this project has free `livewire/flux 2.19.0` — `vendor/livewire/flux/stubs/resources/views/flux/` contains no `tab` directory. The mockup's own markup is already the correct contract (`role="tablist"`, `role="tab"`, `aria-selected`) and ports as-is with a `$mode` property. `<flux:modal>` **is** in the free set and carries the delete confirmation (§4).
  - Preview renders `$body` — the live property, not the stored row — so it reflects text that has not finished saving.

  ### 4. Delete path (Violet + Alex)

  `Delete notes…` sits in the panel footer as a ghost-destructive control and opens a `<flux:modal>`. Both strings the mockup marks as spec commitments are kept in meaning:

  - `Only this occurrence is affected — other meetings in the series keep theirs.`
  - `The linked transcript file is not touched. The pipeline owns it.`

  Confirming deletes the row, resets `$body` to `''` and returns the save state to `idle`. This is the concrete discharge of PRD **Privacy & data handling** obligation 2.

  Autosave never deletes. Per the recorded `meeting note blank body semantics` decision, clearing the editor is an **edit**: the blank body is persisted and the row is kept, so a stray select-all-delete cannot destroy a note without confirmation, while the coverage badge still drops off (§5).

  ### 5. Coverage — filling the US-005 seam (Mike)

  `MeetingCoverage::$hasNotes` is a hard `false` marked for this spec. Filling it from the agenda is the one place in US-006 where an N+1 is genuinely available, since `AgendaQuery` renders a whole week of rows.

  `app/Meetings/MeetingCoverageLookup.php` takes the `CalendarEvent` collection `AgendaQuery` has already fetched and issues **one** query — `select event_uid, event_recurrence_id from meeting_notes where event_uid in (…) and body <> ''` — returning a map keyed on `sourceUid."\0".recurrenceId`. `AgendaRow::__construct()` gains a second parameter defaulting to an empty `MeetingCoverage`, so `MeetingController` and every existing test keep compiling; the controller passes its own single-occurrence lookup.

  Result: **two queries per agenda page** regardless of how dense the week is. The `unique(['event_uid','event_recurrence_id'])` index serves the `whereIn('event_uid', …)` by leftmost prefix and the single-occurrence read outright — no additional index is warranted on a table this size.

  Coverage reads the **body**, not row existence, per the recorded decision, so `Notes` / `Not annotated` on the agenda is an honest coverage map rather than a record of which meetings were once opened. `AgendaDay::$annotatedCount` and the existing legend light up with no view restructuring — which is what the US-005 seam was for.

  ### 6. Resync durability and the orphan edge case (Sabrine + Anne)

  Nothing in this spec has to *act* to achieve durability — that is the whole point of keying on the natural key — but three paths must be pinned by tests, because a later refactor could break them in silence:

  - **retitle / reschedule / relocate** — `EventSynchronizer::upsertOne()` updates mirrored fields on the same row; the note is untouched and still reachable at the same route.
  - **upstream cancellation** — `sweep()` sets `cancelled_at` and never deletes a row (its own docblock states this); the note stays editable on the cancelled occurrence, beneath the banner US-005 already renders.
  - **disappearance from the feed window** — no row is ever deleted, so this cannot orphan a note. The test proves the stronger property instead: delete the `calendar_events` row outright, and the `meeting_notes` row survives and re-attaches when an occurrence with the same (`source_uid`, `recurrence_id`) reappears.

  ### 7. Out of scope, stated rather than assumed

  - **Note history / versioning** — not in the spec and not in the PRD; autosave overwrites, and nothing here promises otherwise.
  - **FTS5 indexing of note bodies** — FR-013, Future Phases.
  - **Extracting action items from note checklists** — FR-016, Future Phases. GFM task lists render from day one, but nothing reads them.
  - **Notes on anything other than a meeting occurrence** — the only key this table knows.

  ## Git & Branching

  - **Mode:** `GITFLOW` (from `settings.git_mode`) — branch, atomic per-task commits, PR body prepared **locally**; nothing is pushed.
  - **Branch point:** `feature/US-006-meeting-notes` from `develop`. `develop` is at `5bc10b2` and already contains the US-005 merge (`59ef569`), so this branches cleanly — no repeat of the US-004/US-005 catch-up TASK-00.
  - Per task: one Conventional Commit `type(US-006): TASK-NN summary`. No batched multi-task commits.
  - `php artisan larapilot:quality` (Pint + Larastan level 5) green before every `task-done`.
  - `CHANGELOG.md` `[Unreleased]` entry lands with the docs task, not after review — the US-004 review gate found that omission once already.
  - Merge to `develop` only after human `larapilot-review` approval.

  ## Test Data Strategy

  - **New model → new factory, same task as the migration.** `MeetingNoteFactory` with:
    - `forOccurrence(CalendarEvent $event)` — derives `event_uid` / `event_recurrence_id` from the occurrence, so no test hand-copies a natural key.
    - `blank()` — empty `body`, for the coverage-honesty path (row present, badge off).
    - default `body` is realistic multi-section Markdown (`## Prep` / `## Outcomes`, a bold decision line, a `- [ ]` item), matching the mockup's fixture note so the preview surface is meaningful without editing the database.
  - **`MeetingNoteSeeder`** (registered in `DatabaseSeeder` after `CalendarEventSeeder`, which it depends on):
    - a note on **exactly one** occurrence of the seeded 12-week `Weekly sync` series — the current week's — so sibling isolation is visible in the running app, not only green in the suite;
    - a note on today's `Client kickoff` and on the cancelled `Budget review`, so the cancelled-but-annotated combination is on screen;
    - one **blank-bodied** note on `Design review`, so an emptied note visibly reads `Not annotated`;
    - the deliberately empty day and the un-annotated meetings are left alone — the agenda must still show `Not annotated` rows.
  - `php artisan migrate:fresh --seed` must produce an agenda with mixed `Notes` / `Not annotated` badges before the entity task is done.

  ## Test Strategy

  **Bar: `NORMAL`** (from `settings.testing`) — PHPUnit feature and unit tests. No Playwright, Dusk, Pest browser, or viewport matrix. Test tasks are interleaved with implementation, not stacked at the end.

  | Layer | Coverage |
  | --- | --- |
  | Unit — `MeetingNoteTest` | `forOccurrence()` scope hits the composite key; `occurrenceKey()` round-trips; the unique constraint rejects a second note on the same occurrence; factory `forOccurrence()` / `blank()` produce valid rows |
  | Unit — `MarkdownRendererTest` | `<script>alert(1)</script>` is **escaped**, not emitted; `<img onerror=…>` escaped; a `javascript:` link is neutralised; an `onclick` attribute in raw HTML never reaches the output; a normal heading/list/bold/table/task-list body renders as expected HTML; deeply nested input is bounded rather than exhausting the stack |
  | Unit — `MeetingCoverageLookupTest` | a non-blank note flags its occurrence and **only** its occurrence; a blank-bodied note does not flag; an occurrence with no row does not flag; the batch issues one query for N events (`DB::listen` count assertion, so a future N+1 fails the suite) |
  | Feature — `MeetingNotesTest` (Livewire) | **recurrence isolation — the highest-value test in the suite:** two occurrences of one series, a note written on one, the sibling's component mounts empty and the sibling's page does not render the first's text; autosave writes without any explicit save action; the saved indicator advances `saving` → `saved`; a forced write failure renders `Not saved` with `Retry`, **keeps `$body` intact**, and a successful retry persists it; Write/Preview renders the body through the hardened renderer and an HTML-bearing note appears escaped on the page; the component behaves identically for a past and a future occurrence (no state gate); clearing the editor persists a blank body and **keeps** the row; the delete path removes the row, renders both required dialog strings, and resets the editor |
  | Feature — `MeetingNoteDurabilityTest` | a note survives an `EventSynchronizer` run that retitles, reschedules and relocates the occurrence, and is still reachable at the same route; survives upstream `STATUS:CANCELLED` and stays editable on the cancelled occurrence; survives the disappearance sweep; survives outright deletion of the `calendar_events` row and re-attaches when the same (`source_uid`, `recurrence_id`) reappears |
  | Feature — `AgendaPageTest` (extended) | an annotated meeting renders the `Notes` badge and an un-annotated one renders `Not annotated`; a blank-bodied note reads `Not annotated`; the day header's annotated count reflects reality; a note on one occurrence of the seeded series does not badge its siblings |

  **Manual test handoff** (Anne — required at this bar for UI, per the mockup test contract): keyboard-only pass over the note panel — tab into the tablist, switch Write/Preview with the keyboard, reach `Delete notes…`, open and dismiss the modal with `Esc` and confirm focus returns to the trigger; type and confirm the save indicator announces without stealing focus; theme toggle in both directions with the preview rendered; 375 px pass against `mobile.html`; contrast spot-check of `kb-savestate` in its three states in light and dark.

  ## Rework — round 1 (2026-09-09, larapilot-review)

  The increment was rejected at the human gate. **No production defect was found**: every acceptance criterion is implemented, Larastan level 5 and Pint are clean, and Lars returned GO with no Critical/High/Medium. All three findings are on the test and presentation side, and the branch `feature/US-006-meeting-notes` stays open — TASK-00 is not repeated.

  ### What went wrong, and why it survived the first pass

  1. **A red suite reported as green.** TASK-08 changed `AgendaQuery::for()` from one query to two (the events read plus the batched `MeetingCoverageLookup`), and correctly documented that in its own docblock — but the US-005 assertion `AgendaQueryTest::test_the_agenda_is_built_with_a_single_query` still demands `1`. It fails on roughly one run in three (`--random-order-seed=6` and `=9` fail, `=3` and `=11` pass; 5 of 15 sampled seeds fail). The implementation round happened to observe a passing seed and recorded "238/238".

     The failure is intermittent because `CalendarEventFactory::definition()` draws `dateTimeBetween('-30 days', '+45 days')` while `AgendaRange::today()` is a one-day window. The three fixture events usually miss the range entirely, `MeetingCoverageLookup::for()` short-circuits on an empty `$uids`, and the count comes back 1. **On the runs where it passes it is therefore asserting nothing about batching either** — the regression guard against a future N+1 on the agenda has been inert since the day it was written.

  2. **Two new assertions that cannot fail.** `resources/views/livewire/agenda.blade.php:37` renders `Not annotated` unconditionally in the coverage legend, above every day group. `assertSee('Not annotated')` is therefore satisfied on any agenda page whatever the badges say. Confirmed empirically at the gate: the blank-note test's exact assertion still passes when the note is given real content. One of the two affected tests is the agenda-level form of the spec's highest-value criterion, so this is the worst possible place for a no-op.

  3. **Convention drift.** `resources/views/livewire/meeting-notes.blade.php` is the only view in the project carrying inline `style=` attributes — six of them. Every sibling view has zero, and the same commit added 161 lines of `kb-*` CSS, so the escape hatch was never needed.

  ### Rework principles

  - **Assert the contract, not the current number.** The agenda's real guarantee is *a fixed, small query count independent of how many meetings the week holds*. Encode that — two queries at 3 events and at 12 — rather than swapping `1` for `2` and leaving the fixtures where a change of window silently disarms the test again.
  - **Row-scoped assertions.** Coverage badges are per-row; assert inside the row's markup, never against the whole page, so the legend can never stand in for a badge. `resources/views/livewire/agenda.blade.php` gives a clean anchor: `kb-row__title` carries the summary and `kb-row__badges` follows it inside the same `<a>`.
  - **Every repaired assertion must be proven to fail.** Re-running a rewritten test green proves nothing — it is what produced this round. Each fixed test is temporarily exercised against an inverted badge condition (or an added query) and observed red before the mutation is reverted. The observation is recorded in the task's completion criteria.
  - **No production code changes** beyond promoting six presentation attributes to classes. `app/` is untouched.

  ### Deliberately not in this round

  - The two single-row `meeting_notes` reads on the detail page (badge lookup + editor `mount()`) stay unconsolidated — both are indexed single-row lookups and merging them would couple `MeetingController` to the Livewire component for no measurable gain. Accepted at review.
  - `MeetingNote::flushEventListeners()` in the forced-failure test stays. It clears all listeners rather than just the injected `saving` closure, but no other listener exists on the model and Laravel's per-test container prevents leakage. Revisit only if a real Observer is added.
  - The delete modal's `@if ($hasNote)` wrapper stays. It unmounts the `<flux:modal>` in the same request that closes it, which could in principle race Flux's close animation; no functional defect was found and focus-return is already asserted. It remains on the manual keyboard-only handoff below, which is still owed.

  ### Exit gate for this round

  The full suite must be observed green across **several** `--random-order-seed` values, not one run, and `php artisan larapilot:quality` must stay clean, before the spec returns to REVIEW. This is TASK-14 and it runs after all three fixes land.
