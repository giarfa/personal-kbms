    body: |-
      ## Description
      Add the `MeetingNotes` Livewire component and mount it into the owned column of the meeting detail page, replacing the `Meeting notes arrive with US-006.` placeholder US-005 left there. Autosave with a visible save state, Write/Preview tabs, and no state gate of any kind.

      Class-based component per the recorded `livewire component style` decision — `php artisan make:livewire MeetingNotes --class`, tests written separately with `make:test --phpunit`.

      **Write/Preview is a hand-rolled ARIA tablist, not `<flux:tab.group>`.** The mockup README's implementation table names Flux tabs, but tabs are **Flux Pro** and this project has free `livewire/flux 2.19.0` (`vendor/livewire/flux/stubs/resources/views/flux/` has no `tab`). The mockup's own markup — `role="tablist"` + `role="tab"` + `aria-selected` — is the contract and ports directly. Flag the README mapping as corrected in TASK-10.

      ## Files Involved
      - app/Livewire/MeetingNotes.php
      - resources/views/livewire/meeting-notes.blade.php
      - resources/views/pages/meeting.blade.php

      ## Steps
      1. `php artisan make:livewire MeetingNotes --class --no-interaction`
      2. `mount(CalendarEvent $occurrence)`: store the `OccurrenceKey` parts as plain string properties (never the model — a Livewire-hydrated model would reintroduce the surrogate id as the identity), load the existing note via `MeetingNote::forOccurrence()`, seed `$body`.
      3. `$body` bound with `wire:model.live.debounce.750ms` — the mapping recorded in the mockup README for `kb-textarea` + autosave. `updatedBody()` performs an `updateOrCreate` on (`event_uid`, `event_recurrence_id`).
      4. `$saveState` (`idle`|`saving`|`saved`|`error`) and `$savedAt` drive `kb-savestate`: `Saving…`, `Saved H:i`, `Not saved` + a `Retry` button calling `retry()`. Wrap the write so a failure sets `error` and **leaves `$body` untouched** — never reassign the property from the database on the error path, or typed content is silently discarded. Log the throwable.
      5. Indicator markup: `aria-live="polite"` on the container, `role="alert"` on the error variant. Livewire must update **inside** these nodes, not replace them — keep them outside any `@if` that would swap the element.
      6. Write/Preview: `$mode` property, `role="tablist"` with two `role="tab"` buttons and `aria-selected`; textarea gets a `kb-sronly` label (`Meeting notes, Markdown`); Preview renders `{!! app(MarkdownRenderer::class)->render($this->body) !!}` inside `.kb-md` — from the **live property**, so preview reflects text that has not finished saving.
      7. Panel footer per the mockup: `Autosaves as you type · Markdown supported · stored as plain text, rendered without HTML`.
      8. **No state gate.** No `starts_at`/`isPast()` branch anywhere in this component or view — a note is writable before and after the meeting, and on a cancelled occurrence.
      9. Replace the placeholder in `resources/views/pages/meeting.blade.php` with `<livewire:meeting-notes :occurrence="$row->event" />`, keeping the existing `kb-panel` / `Yours` flag / `#notes-h` heading structure the mirror-vs-owned contract depends on.
      10. Smoke-check layout at 375, 768 and 1280 px against `meeting.html` and `mobile.html`
      11. `php artisan larapilot:quality`

