      ## Description
      The exit gate for this rework round. A single green run is precisely what let a ~1-in-3 failure reach the human gate reported as "238/238 passing", so the suite is observed across several random orderings before the spec goes back to REVIEW.

      ## Files Involved
      - (verification only — no application files)

      ## Steps
      1. Run the full suite across several orderings, including the two seeds that reproduced the original failure:
         ```
         for s in 3 6 9 11 17 23; do vendor/bin/phpunit --random-order-seed=$s | tail -1; done
         ```
         Every run must report `"result":"passed"`. A single failure on any seed blocks the gate — re-open the responsible task rather than re-rolling for a green seed.
      2. `php artisan larapilot:quality` — Pint and Larastan level 5 must both stay clean after TASK-13's CSS and Blade edits.
      3. `php artisan migrate:fresh --seed` — confirm the demo dataset is still coherent and the seeded `Weekly sync` series still carries a note on exactly one occurrence. No schema changed this round, so this is a regression check, not a new verification.
      4. Record the seeds used and their results in `.larapilot/docs/review/US-006.md` under a `## Rework round 1` heading, so the next gate can see the evidence rather than a claim. Include the mutation observations from TASK-11 and TASK-12.
      5. Hand off the manual checks still owed from the original plan's Test Strategy — they were never run and are unaffected by this round: keyboard-only pass over the note panel (tablist, Write/Preview, `Delete notes…`, `Esc` dismiss, focus return to the trigger), save-indicator announcement without focus theft, 375 px pass against `mobile.html`, and a contrast spot-check of `kb-savestate` in all three states in both themes.

      ## Completion Criteria
      - [ ] Full suite green on at least six distinct `--random-order-seed` values, including 6 and 9
      - [ ] `larapilot:quality` clean (Pint + Larastan level 5, 0 errors)
      - [ ] `migrate:fresh --seed` coherent
      - [ ] Seeds, results and both mutation observations recorded in `.larapilot/docs/review/US-006.md`
