    id: TASK-13
    title: "Promote the note panel's inline styles into kb-* classes"
    type: Fix
    status: DONE
    assignee: Joe
    estimate_hours: 1
    dependencies: {}
    body: |
      ## Description
      Fix: `resources/views/livewire/meeting-notes.blade.php` is the only view in the project carrying inline `style=` attributes — six of them. Every sibling view (`agenda`, `sync-alert`, `sync-status`, `pages/meeting`, `pages/calendar`) has zero. TASK-02 already ported 161 lines of `kb-*` CSS for this panel in the same round, so the escape hatch was never needed.

      The occurrences:

      | Line context | Inline style | Replace with |
      | --- | --- | --- |
      | error hint under the textarea | `margin-top:0.5rem` | a modifier on the existing `kb-note-inline`, e.g. `kb-note-inline kb-note-inline--spaced` |
      | footer delete wrapper | `margin-left:auto` | a `kb-panel__foot__end` (or equivalent) class beside the existing `kb-panel__foot` rules |
      | delete-modal heading | `margin:0;font-size:0.9375rem` | a `kb-modal__title` class |
      | delete-modal body copy | `margin:0;font-size:0.8125rem` | a `kb-modal__body` class |
      | delete-modal footnote | `margin:0` | fold into `kb-modal__body` or reuse `kb-note-inline` with the spacing modifier |
      | `Delete notes…` button | `color:var(--kb-danger)` | a `kb-btn--danger-ghost` class, keeping the `--kb-danger` token |

      Keep every token reference (`var(--kb-danger)` in particular) — the mockup README maps `--kb-danger` to the destructive role and that mapping is the contract, not the hex value. This is a class-extraction task, not a restyle: the rendered appearance must be identical in light and dark.

      `kb-panel__foot` (app.css:711), `kb-note-inline` (:214), `kb-stack` (:771) and `kb-inline` (:777) already exist — extend them rather than introducing a parallel naming scheme.

      ## Files Involved
      - resources/views/livewire/meeting-notes.blade.php
      - resources/css/app.css
      - .larapilot/mockups/kbms-app/README.md (implementation mapping table, if the new class names belong there)

      ## Steps
      1. Add the new `kb-*` rules to `resources/css/app.css` next to the block TASK-02 added, following the file's existing ordering and comment style.
      2. Replace all six `style=` attributes in `meeting-notes.blade.php`. Confirm none remain: `grep -c 'style="' resources/views/livewire/meeting-notes.blade.php` returns `0`.
      3. `npm run build` (or `composer run dev`) and eyeball the panel in both themes — the footer's right-aligned delete control, the modal's type scale, and the danger-coloured ghost button must be visually unchanged.
      4. Update the mockup README's implementation mapping table if it names any of the replaced inline styles.
      5. `vendor/bin/phpunit tests/Feature/MeetingNotesTest.php` — the delete-path test asserts on both dialog strings and must stay green.

      ## Completion Criteria
      - [x] `grep -c 'style="' resources/views/livewire/meeting-notes.blade.php` returns `0`
      - [x] New rules live in `resources/css/app.css` under `kb-*` names consistent with the existing scheme
      - [x] `--kb-danger` is still the source of the delete control's colour — no hard-coded hex
      - [x] Panel renders identically in light and dark, desktop and 375 px
      - [x] `MeetingNotesTest` still passes

