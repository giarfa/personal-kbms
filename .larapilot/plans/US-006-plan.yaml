    id: TASK-12
    title: 'Make the agenda coverage-badge assertions row-scoped so they can fail'
    type: Fix
    status: DONE
    assignee: Anne
    estimate_hours: 1.5
    dependencies: {}
    body: |
      ## Description
      Fix: three assertions in `tests/Feature/AgendaPageTest.php` are satisfied by the coverage legend rather than by any badge, so they cannot fail.

      `resources/views/livewire/agenda.blade.php:37` renders `<span class="kb-tag kb-tag--bare">Not annotated</span>` unconditionally in the legend, above every day group. `assertSee('Not annotated')` therefore passes on any agenda page regardless of badge state. Verified at the review gate: the blank-note test's exact assertion still passes when the note is given real content.

      Affected:
      - `test_a_blank_bodied_note_reads_not_annotated` (TASK-09) — asserts nothing.
      - `test_one_occurrence_of_a_series_is_badged_without_its_siblings` (TASK-09) — asserts nothing. This is the agenda-level form of the spec's highest-value criterion, *"a note written on one occurrence never appears on its siblings"*.
      - `test_the_not_annotated_badge_appears_for_every_row` (inherited from US-005) — same flaw; repair it in this pass.

      **The behaviour itself is correct and is genuinely covered** by `tests/Unit/Meetings/MeetingCoverageLookupTest.php::test_a_non_blank_note_flags_only_its_own_occurrence`. What is missing is any assertion that the agenda *renders* that correctly. Do not change `agenda.blade.php` to make testing easier — the legend is a deliberate PRD density requirement (mockup README line 79) and stays.

      ## Files Involved
      - tests/Feature/AgendaPageTest.php

      ## Steps
      1. Add a private helper to the test class that slices a single row's markup out of the response, so the legend is structurally out of reach:

         ```php
         private function badgesFor(string $html, string $summary): string
         {
             $start = strpos($html, 'kb-row__title">'.e($summary));
             $this->assertNotFalse($start, "No agenda row found for [{$summary}].");
             $end = strpos($html, '</a>', $start);

             return substr($html, $start, $end - $start);
         }
         ```

         The `assertNotFalse` matters: without it a renamed class or a missing row would make every caller silently vacuous again, which is the exact failure mode being repaired.
      2. Rewrite `test_a_blank_bodied_note_reads_not_annotated` to give the event a distinct summary and assert `assertStringContainsString('Not annotated', $this->badgesFor($html, 'Blank note meeting'))` **and** `assertStringNotContainsString('Notes', ...)` — both directions, so a badge that renders both tags is caught.
      3. Rewrite `test_one_occurrence_of_a_series_is_badged_without_its_siblings` to assert on both occurrences of the series explicitly: the annotated one's row contains `Notes` and not `Not annotated`; the sibling's row contains `Not annotated` and not `Notes`. Give the two occurrences distinguishable summaries so the helper can address each. Keep the existing `Livewire::test(Agenda::class)->call('next')` navigation if the sibling sits in the following week, or place both in the default window — either is fine, but the assertion must name each row.
      4. Repair `test_the_not_annotated_badge_appears_for_every_row` the same way: assert the badge inside each row's slice, not on the page.
      5. Migrate `test_an_annotated_meeting_renders_the_notes_badge` and `test_the_day_headers_annotated_count_reflects_reality` to the helper as well. The former is currently sound — `assertSeeInOrder` happens to work because the legend precedes the rows — but it is sound by accident, and one helper for all five reads better than two conventions in one file.
      6. Prove each repaired test can fail: temporarily invert the badge condition in `resources/views/livewire/agenda.blade.php` (swap `@if ($row->coverage->hasNotes)` for `@if (! $row->coverage->hasNotes)`), observe all repaired tests go red, then revert. Record the observation below.
      7. `vendor/bin/phpunit tests/Feature/AgendaPageTest.php`

      ## Completion Criteria
      - [x] All five coverage-badge assertions are row-scoped via the helper; none can be satisfied by the legend
      - [x] The helper fails loudly when the row is not found, rather than returning an empty slice
      - [x] The recurrence-isolation test names both occurrences and asserts the presence *and* absence of each badge
      - [x] `test_the_not_annotated_badge_appears_for_every_row` is repaired in the same pass
      - [x] Mutation observed: inverting `$row->coverage->hasNotes` in `agenda.blade.php` turns the repaired tests red; mutation reverted
      - [x] `resources/views/livewire/agenda.blade.php` is unchanged at the end of the task

      ## Test Data
