    id: TASK-08
    title: 'Wire note coverage into the agenda without an N+1 (parallel with TASK-06)'
    type: Impl
    status: TODO
    assignee: Mike
    estimate_hours: 2.5
    dependencies:
      - TASK-01
    body: |-
      ## Description
      Fill `MeetingCoverage::$hasNotes` — hard `false` and marked for this spec since US-005 — so meetings carrying notes are flagged in the agenda and the list doubles as a coverage map. Touches no file TASK-06 owns, so it can run beside it.

      This is the one place in US-006 where an N+1 is genuinely available: `AgendaQuery` renders a whole week of rows. The lookup is therefore a **single batched query**, and the test asserts the query count so a future regression fails the suite.

      Coverage reads the **body**, not row existence, per the recorded `meeting note blank body semantics` decision — an emptied note reads `Not annotated`.

      ## Files Involved
      - app/Meetings/MeetingCoverageLookup.php
      - app/Meetings/MeetingCoverage.php
      - app/Meetings/AgendaRow.php
      - app/Meetings/AgendaQuery.php
      - app/Http/Controllers/MeetingController.php

      ## Steps
      1. `php artisan make:class Meetings/MeetingCoverageLookup --no-interaction`
      2. `for(Collection $events): array` — one query, `MeetingNote::query()->select('event_uid', 'event_recurrence_id', 'body')->whereIn('event_uid', $uids)->get()`, filtered on `hasContent()` in PHP so the "annotated" definition stays in the model. Return a map keyed on `sourceUid."\0".recurrenceId`. Add `forOccurrence(CalendarEvent $event): MeetingCoverage` for the single-row detail case.
      3. The `unique(['event_uid','event_recurrence_id'])` index serves the `whereIn('event_uid', …)` by leftmost prefix — do **not** add another index; note that in the class docblock so it is not "optimised" later.
      4. `AgendaRow::__construct()`: add a second parameter `MeetingCoverage $coverage = new MeetingCoverage` and assign it instead of constructing one. The default keeps `MeetingController` and every existing test compiling.
      5. `AgendaQuery::for()`: build the row collection, run the lookup once over the fetched events, and pass each row its coverage. Two queries per agenda page, regardless of week density.
      6. `MeetingController`: pass `$lookup->forOccurrence($occurrence)` into the `AgendaRow`, so the detail page's badge agrees with the agenda's.
      7. Update `MeetingCoverage`'s docblock — `hasNotes` is now real; `hasTranscript` stays `false` and stays marked for US-007.
      8. `php artisan migrate:fresh --seed` and eyeball the agenda: mixed `Notes` / `Not annotated` badges, the seeded series badged on exactly one occurrence, and the day header's annotated count matching.
      9. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] An annotated meeting renders the `Notes` badge; an un-annotated one renders `Not annotated`
      - [ ] A blank-bodied note reads `Not annotated`
      - [ ] A note on one occurrence of a series does not badge its siblings
      - [ ] The agenda issues **two** queries regardless of how many rows the week holds
      - [ ] `AgendaDay::$annotatedCount` and the existing legend are correct with no view restructuring
      - [ ] No new index added; the composite unique index is documented as serving both reads
      - [ ] Pint + Larastan level 5 clean

