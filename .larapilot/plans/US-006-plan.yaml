    body: |-
      ## Description
      Add the explicit delete path for a meeting's notes — PRD **Privacy & data handling** obligation 2. A ghost-destructive `Delete notes…` in the panel footer opens a `<flux:modal>`; confirming removes the row.

      Autosave must **not** delete. Per the recorded `meeting note blank body semantics` decision, clearing the editor persists a blank body and keeps the row; only this dialog removes it.

      `<flux:modal>` is in the free Flux set (`vendor/livewire/flux/stubs/resources/views/flux/modal/`) — do not hand-roll a dialog.

      ## Files Involved
      - app/Livewire/MeetingNotes.php
      - resources/views/livewire/meeting-notes.blade.php

      ## Steps
      1. Footer control: ghost variant tinted `--kb-danger`, label `Delete notes…`, wired to open the modal. Render it only when a note row exists — there is nothing to delete otherwise.
      2. `<flux:modal>` body carries both strings the mockup marks as spec commitments, in meaning: `The note on {title}, {when} will be permanently removed. Only this occurrence is affected — other meetings in the series keep theirs.` and `The linked transcript file is not touched. The pipeline owns it.` Do not soften either.
      3. `deleteNote()`: delete via `MeetingNote::forOccurrence()`, reset `$body` to `''`, `$saveState` to `idle`, `$savedAt` to `null`, close the modal. Deleting must not trip `updatedBody()` into recreating the row — reset the property without going through the autosave path.
      4. Confirm keyboard behaviour: `Esc` and the scrim both close, focus moves into the dialog on open and returns to the trigger on close (Flux handles this — verify it, do not reimplement it).
      5. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Deletion requires confirmation; the dialog renders both required strings
      - [ ] Confirming removes the row and empties the editor without recreating it
      - [ ] Cancelling leaves the note untouched
      - [ ] Autosave still never deletes — an emptied editor keeps the row with a blank body
      - [ ] `Esc` closes the dialog and focus returns to the trigger
      - [ ] Pint + Larastan level 5 clean

      ## Test Data
      - N/A — no model or schema change in this task

