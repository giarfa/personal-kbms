    id: TASK-04
    title: 'Add the hardened MarkdownRenderer (parallel with TASK-01)'
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 1.5
    dependencies:
      - TASK-00
    body: |-
      ## Description
      Add the single choke point through which note Markdown becomes HTML, with league/commonmark's unsafe defaults overridden. Shares no files with TASK-01 or TASK-02, so it can run beside them.

      `Str::markdown()` is a `GithubFlavoredMarkdownConverter` (`vendor/laravel/framework/src/Illuminate/Support/Str.php:817`), so GFM tables and task lists come free. Its inherited defaults are the problem — verified at `vendor/league/commonmark/src/Environment/Environment.php:434-436`: `html_input => 'allow'`, `allow_unsafe_links => true`, `max_nesting_level => PHP_INT_MAX`. A bare call renders an embedded `<script>` verbatim.

      **No dependency change:** `league/commonmark ^2.8.1` is a hard `require` of `laravel/framework` (`composer.lock:1372`). Do not touch `composer.json`.

      ## Files Involved
      - app/Meetings/MarkdownRenderer.php

      ## Steps
      1. `php artisan make:class Meetings/MarkdownRenderer --no-interaction`
      2. `final` class, one method: `render(string $body): HtmlString`, delegating to `Str::markdown($body, ['html_input' => 'escape', 'allow_unsafe_links' => false, 'max_nesting_level' => 20])`
      3. `html_input => 'escape'`, not `'strip'`: the operator must see the HTML they typed rendered as literal text rather than silently losing it. Record that reasoning in the class docblock, along with the three overridden defaults and why each matters — the next reader must not "simplify" this back to a bare `Str::markdown()`.
      4. Return `HtmlString` so views read `{!! $renderer->render($body) !!}` at exactly one call site and the escaping guarantee travels with the value
      5. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] All three unsafe defaults explicitly overridden
      - [ ] Docblock states why `escape` beats `strip` and why the nesting level is bounded
      - [ ] `composer.json` untouched
      - [ ] Pint + Larastan level 5 clean

      ## Test Data
      - N/A — no model or schema change in this task

      ## Git Deliverables
      - Commit: `feat(US-006): TASK-04 add hardened Markdown renderer for note bodies`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
