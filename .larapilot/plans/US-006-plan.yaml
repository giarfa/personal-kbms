    id: TASK-05
    title: 'Unit-test Markdown rendering safety'
    type: Test
    status: TODO
    assignee: Anne
    estimate_hours: 1.5
    dependencies:
      - TASK-04
    body: |-
      ## Description
      Pin the acceptance criterion that note content renders without executing embedded HTML or scripts. These assertions are the only thing standing between the renderer and a future "simplification" back to a bare `Str::markdown()`.

      ## Files Involved
      - tests/Unit/Meetings/MarkdownRendererTest.php

      ## Steps
      1. `php artisan make:test --phpunit --unit MarkdownRendererTest` and move it under `tests/Unit/Meetings/`
      2. Escaping: `<script>alert(1)</script>` appears **escaped** in the output and no literal `<script` tag is emitted; `<img src=x onerror=alert(1)>` likewise; a raw `<div onclick="…">` never reaches the output as an attribute
      3. Links: a `[x](javascript:alert(1))` link does not produce a `javascript:` href; a normal `https://` link does
      4. Correct rendering still works: heading, unordered list, `**bold**`, inline `code`, a GFM table, and a `- [ ]` task list all produce their expected elements
      5. Bounding: a pathologically nested body (e.g. 200 levels of `>` blockquote) returns rather than exhausting the stack
      6. `php artisan test --filter=MarkdownRendererTest`
      7. Do **not** add Playwright, Dusk, Pest browser or viewport suites

