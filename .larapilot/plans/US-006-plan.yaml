    id: TASK-01
    title: 'Add MeetingNote with migration, factory and seeder'
    type: Impl
    status: DONE
    assignee: Alex
    estimate_hours: 3
    dependencies:
      - TASK-00
    body: |-
      ## Description
      Add the `meeting_notes` table and `MeetingNote` model keyed on the occurrence's natural key (`event_uid`, `event_recurrence_id`) — never on `calendar_events.id` — plus the factory and seeder entries that make the coverage and isolation shapes demonstrable in the running app.

      **Do not add a foreign key to `calendar_events`.** The only targetable column is the UUID surrogate `id`, which is exactly the identity a resync may change, and a cascade against it would give the feed a route to delete operator data. See plan `## Technical Solution` §1.

      **Do not add a `hasOne`/`hasMany` relation between `CalendarEvent` and `MeetingNote`.** Eloquent has no composite-key relation, and the `->where('event_recurrence_id', $this->recurrence_id)` workaround silently cross-contaminates siblings under `with()` — the trap is documented in plan §1. Reads use the scope and (from TASK-08) the batch lookup.

      ## Files Involved
      - app/Models/MeetingNote.php
      - database/migrations/xxxx_create_meeting_notes_table.php
      - database/factories/MeetingNoteFactory.php
      - database/seeders/MeetingNoteSeeder.php
      - database/seeders/DatabaseSeeder.php

      ## Steps
      1. `php artisan make:model MeetingNote -mf --no-interaction`
      2. Migration: `uuid('id')->primary()`, `string('event_uid')`, `string('event_recurrence_id')->default('')`, `text('body')->default('')`, `timestamps()`, `unique(['event_uid', 'event_recurrence_id'])`. No foreign key.
      3. Model: `HasFactory`, `HasUuids`, `$guarded = []`, PHPDoc `@property` block matching `CalendarEvent`'s style. Add `scopeForOccurrence(Builder $query, OccurrenceKey $key): Builder` and `occurrenceKey(): OccurrenceKey`, mirroring `CalendarEvent`. Add `hasContent(): bool` returning `trim($this->body) !== ''` — the single definition of "annotated", consumed by TASK-08.
      4. Factory: default `body` is realistic multi-section Markdown (`## Prep` / `## Outcomes`, a bold `**Decision:**` line, a `- [ ]` item) matching the mockup fixture note; `forOccurrence(CalendarEvent $event): static` deriving both key columns from the occurrence; `blank(): static` with an empty body.
      5. `MeetingNoteSeeder`: a note on **exactly one** occurrence of the seeded 12-week `Weekly sync` series (the current week's), one on today's `Client kickoff`, one on the cancelled `Budget review`, and a `blank()` one on `Design review`. Resolve the targets by querying `calendar_events`, so the seeder cannot drift from `CalendarEventSeeder`. Register it in `DatabaseSeeder` **after** `CalendarEventSeeder`.
      6. `php artisan migrate:fresh --seed`
      7. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `meeting_notes` exists with the composite unique index and **no** foreign key
      - [x] `MeetingNote::forOccurrence()` returns the single row for a natural key and nothing for a sibling
      - [x] No Eloquent relation was added between `CalendarEvent` and `MeetingNote`
      - [x] `migrate:fresh --seed` succeeds and the seeded series carries a note on exactly one occurrence
      - [x] Pint + Larastan level 5 clean

      ## Test Data
      - [x] `database/factories/MeetingNoteFactory.php` created with `forOccurrence()` and `blank()` states
      - [x] `MeetingNoteSeeder` registered in `DatabaseSeeder`, producing mixed annotated / blank / un-annotated meetings
      - [x] Factory and seeder land in **this** task, alongside the migration

      ## Git Deliverables
      - Commit: `feat(US-006): TASK-01 add MeetingNote with factory and seeder`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
