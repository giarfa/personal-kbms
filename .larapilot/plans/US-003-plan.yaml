    id: TASK-05
    title: 'Build IcsParser: window-bounded recurrence expansion, TZID and all-day handling'
    body: |-
      ## Description
      Turn an iCalendar body into a stream of individually addressable occurrences. This is the correctness centre of the spec — recurrence identity, timezone fidelity, and all-day handling all live or die here.

      ## Files Involved
      - app/Calendar/ParsedOccurrence.php
      - app/Calendar/IcsParser.php
      - app/Calendar/Exceptions/FeedUnparsable.php
      - tests/Unit/Calendar/IcsParserTest.php
      - tests/Fixtures/ics/recurring-weekly.ics
      - tests/Fixtures/ics/recurrence-override.ics
      - tests/Fixtures/ics/exdate.ics
      - tests/Fixtures/ics/cancelled.ics
      - tests/Fixtures/ics/all-day.ics
      - tests/Fixtures/ics/dst-transition.ics
      - tests/Fixtures/ics/unbounded-series.ics
      - tests/Fixtures/ics/truncated.ics
      - tests/Fixtures/ics/not-calendar.html

      ## Steps
      1. **Read `vendor/sabre/vobject` first.** The expansion API moved between 4.x and 5.0; confirm the exact `VCalendar::expand()` signature, whether it mutates in place or returns a new document, and how it reports failure, before writing against it. This plan deliberately does not assert which shape 5.0 ships
      2. `ParsedOccurrence` — `final readonly`, promoted properties: `sourceUid`, `recurrenceId`, `summary`, `description`, `location`, `organizer`, `attendees` (array shape `array<int, array{name: ?string, email: ?string}>`, documented in PHPDoc), `startsAt`, `endsAt`, `isAllDay`, `timezone`, `joinUrl`, `eventUrl`, `isCancelled`. Plus `contentHash(): string` — sha-256 over the normalized user-visible fields with **attendees sorted** and `last_seen_at` excluded, so the hash does not flap between runs
      3. `FeedUnparsable extends RuntimeException` with named constructors `notCalendar()` and `expansionFailed(string $reason)`
      4. `IcsParser::parse(string $body, CarbonInterface $windowStart, CarbonInterface $windowEnd): Generator` — **yields**, never materializes an array; a 270-day window across several long series is thousands of `VEVENT`s
      5. Order of operations inside `parse()`:
         a. `Reader::read()` inside try/catch → `FeedUnparsable::notCalendar()` on `ParseException`, and also when the document is not a `VCalendar`
         b. **Harvest `TZID` per `UID` from each master `VEVENT`'s `DTSTART` before expanding** — expansion normalizes to UTC and discards `VTIMEZONE`, so the original zone is unrecoverable afterwards. This map is the only source for the `timezone` column
         c. Expand across the window in the event's own timezone, so a weekly 09:00 Europe/Rome meeting stays 09:00 across the March and October transitions instead of drifting an hour. `EXDATE` and `RECURRENCE-ID` overrides are the library's job — do not reimplement them
         d. Wrap expansion in try/catch → `FeedUnparsable::expansionFailed()`; a malformed `RRULE` must become a recorded failure, not an uncaught throwable
         e. Do not read the parsed document again after expansion — it may have been mutated
      6. Per expanded `VEVENT`, build the `ParsedOccurrence`:
         - `recurrenceId`: `RECURRENCE-ID` in UTC as `Y-m-d\TH:i:s\Z` (timed) or `Y-m-d` (all-day); **empty string `''`** for a non-recurring event. This normalization is a **contract** — `US-005` routes on it and `US-006` keys notes on it, so changing the format later orphans every note
         - all-day (`DTSTART;VALUE=DATE`): `isAllDay = true`, `timezone = null`, `startsAt` / `endsAt` are the **naive dates** at `00:00:00` with **no** timezone conversion in either direction. Converting midnight-local to UTC shifts the event a day back for every positive offset, and Europe/Rome is always positive — this would be wrong every single time. Keep iCalendar's exclusive end date as-is
         - timed: `startsAt` / `endsAt` in UTC, `timezone` from the harvested map
         - `isCancelled`: `STATUS:CANCELLED`
         - `eventUrl` ← the `URL` property
         - `joinUrl` ← `X-MICROSOFT-SKYPETEAMSMEETINGURL`, falling back to a Teams meeting URL matched in `DESCRIPTION`
         - `attendees` ← `ATTENDEE` properties, `CN` as name and the `mailto:` value as email
      7. Fixtures: hand-write all nine files listed above. `dst-transition.ics` must cross **2026-03-29**, the real Europe/Rome spring transition. `unbounded-series.ics` carries an `RRULE` with neither `UNTIL` nor `COUNT`
      8. `tests/Unit/Calendar/IcsParserTest.php` — one focused test per fixture:
         - weekly series expands to the expected occurrence count inside the window, each with a distinct `recurrenceId`
         - `EXDATE` date is absent from the yielded set
         - the `RECURRENCE-ID` override yields its own retitled occurrence while its siblings keep the series title — **not** flattened to the series default
         - a 09:00 Europe/Rome weekly series stays 09:00 local on both sides of 2026-03-29, and `timezone` is `Europe/Rome` on every occurrence
         - the all-day event yields the exact calendar date with `isAllDay = true` and **no** day shift
         - `STATUS:CANCELLED` yields `isCancelled = true`
         - the unbounded series yields a finite count bounded by the window — assert an exact number, not merely "not empty"
         - `truncated.ics` and `not-calendar.html` each throw `FeedUnparsable`
         - `URL`, `X-MICROSOFT-SKYPETEAMSMEETINGURL`, and Teams-link-in-description each populate the right field
         - `contentHash()` is stable across two parses of the same body and changes when the summary changes
      9. `php artisan test --compact --filter=IcsParser` and `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `parse()` yields occurrences lazily and is bounded by the window even for a series with no `UNTIL`/`COUNT`
      - [x] `TZID` is captured before expansion and lands on every timed occurrence
      - [x] A DST-crossing weekly series keeps its local wall-clock time
      - [x] All-day events carry the correct date with no shift
      - [x] `EXDATE` and `RECURRENCE-ID` overrides are honored, not flattened
      - [x] `recurrenceId` normalization matches the documented contract exactly, including `''` for non-recurring
      - [x] Malformed and truncated bodies throw `FeedUnparsable`
      - [x] Tests pass; `larapilot:quality` green

      ## Test Data
      - N/A — no model or schema changes in this task; `.ics` fixtures are test inputs, not seed data

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-05 add IcsParser with window-bounded recurrence expansion`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
