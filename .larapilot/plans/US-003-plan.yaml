    id: TASK-06
    title: 'Build EventSynchronizer: cancellation-safe upsert and window-scoped sweep'
    body: |-
      ## Description
      Persist parsed occurrences without ever destroying one. This is where the PRD's promise that annotated history survives an upstream change is either kept or broken.

      ## Files Involved
      - app/Calendar/EventSynchronizer.php
      - app/Calendar/SyncResult.php
      - tests/Unit/Calendar/EventSynchronizerTest.php

      ## Steps
      1. `SyncResult` — `final readonly`: `int $upserted`, `int $cancelled`. The job writes these onto the run row
      2. `EventSynchronizer::synchronize(iterable $occurrences, CarbonInterface $runStartedAt, CarbonInterface $windowStart, CarbonInterface $windowEnd): SyncResult`
      3. Everything below runs inside a single `DB::transaction` — a mid-stream failure must leave the mirror exactly as it was
      4. Per occurrence, match on (`source_uid`, `recurrence_id`):
         - no row → insert, `last_seen_at = $runStartedAt`, count toward `upserted`
         - row exists and `content_hash` matches → touch **only** `last_seen_at`; do **not** count toward `upserted`
         - row exists and hash differs → update every mirrored field, count toward `upserted`
         - `isCancelled` → set `cancelled_at` (preserve an existing value rather than overwriting the timestamp)
         - previously cancelled and now arriving active → **un-cancel** (`cancelled_at = null`), so an upstream flap does not leave a permanently struck-through meeting
         - **never** delete
      5. Consume the generator in chunks rather than collecting it, so memory stays flat on a large feed
      6. Cancellation sweep, after the upserts and inside the same transaction:
         `cancelled_at IS NULL` AND `starts_at` between `$windowStart` and `$windowEnd` AND `last_seen_at < $runStartedAt` → set `cancelled_at = $runStartedAt`, counting into `cancelled`.
         **The window predicate is not optional.** Without it the first run marks every event older than the past window as cancelled — a silent, total corruption of exactly the annotated history this product exists to protect
      7. `tests/Unit/Calendar/EventSynchronizerTest.php` (`RefreshDatabase`, factories from TASK-02):
         - two occurrences of one series with different `recurrence_id`s produce two rows; editing one leaves the other untouched — **the highest-value assertion in this spec**
         - a non-recurring event round-trips with `recurrence_id = ''` and a second run does not duplicate it
         - an unchanged second run reports `upserted: 0` and bumps only `last_seen_at`
         - a changed summary reports `upserted: 1` and rewrites the row
         - an occurrence that stops appearing gets `cancelled_at` set and **still exists** — assert the row count is unchanged
         - an event outside the window with a stale `last_seen_at` is **not** swept
         - `STATUS:CANCELLED` marks `cancelled_at` on the upsert path
         - a cancelled occurrence reappearing active is un-cancelled
         - a mid-stream throwable rolls the whole transaction back and leaves pre-existing rows untouched
      8. `php artisan test --compact --filter=EventSynchronizer` and `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Occurrences of one series are independently addressable and independently writable
      - [x] Unchanged occurrences skip the write and only bump `last_seen_at`
      - [x] Disappearance and `STATUS:CANCELLED` both mark `cancelled_at`; nothing is ever deleted
      - [x] The sweep is scoped to the window and cannot touch rows outside it
      - [x] Reappearance un-cancels
      - [x] A failure mid-run rolls back cleanly
      - [x] Tests pass; `larapilot:quality` green

      ## Test Data
      - [x] Reuses `CalendarEventFactory` from TASK-02 — no duplicate factory definitions in the test file
      - [x] No schema change in this task

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-06 add EventSynchronizer with cancellation-safe upsert`
