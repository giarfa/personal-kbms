    id: TASK-04
    title: 'Build IcsFeedClient with conditional GET and bounded timeouts'
    body: |-
      ## Description
      Fetch the feed over HTTPS with `ETag` / `If-Modified-Since` validators, bounded timeouts, and a typed failure. The client knows HTTP and nothing about calendars — it never sees a `VEVENT`.

      ## Files Involved
      - app/Calendar/FeedResponse.php
      - app/Calendar/IcsFeedClient.php
      - app/Calendar/Exceptions/FeedUnavailable.php
      - tests/Unit/Calendar/IcsFeedClientTest.php

      ## Steps
      1. `FeedResponse` — `final readonly` class, constructor property promotion: `int $httpStatus`, `?string $body`, `?string $etag`, `?string $lastModified`, `bool $notModified`. Named constructors `ok()` and `notModified()`
      2. `FeedUnavailable extends RuntimeException` with named constructors `connectionFailed(string $url, string $reason)`, `httpError(int $status)`, and a nullable `httpStatus` property so the job can record it on the run row
      3. `IcsFeedClient::fetch(?string $etag, ?string $lastModified): FeedResponse`:
         - read the URL from `config('kbms.ics_url')`; a null/empty URL throws `FeedUnavailable` naming `KBMS_ICS_URL`
         - `Http::connectTimeout(self::CONNECT_TIMEOUT)->timeout(self::TIMEOUT)` — `5` and `30` as class constants, deliberately more generous than the doctor's interactive 3s/5s
         - send `If-None-Match: {etag}` and `If-Modified-Since: {lastModified}` only when the value is non-null
         - `304` → `FeedResponse::notModified()` carrying the validators forward (a 304 may or may not repeat them; fall back to the ones sent)
         - `2xx` → `FeedResponse::ok()` with body plus the response `ETag` / `Last-Modified` headers
         - anything else → `FeedUnavailable::httpError()`
         - catch `Illuminate\Http\Client\ConnectionException` → `FeedUnavailable::connectionFailed()`; never let it escape as a raw client exception
      4. Explicit return types and parameter type hints throughout; PHPDoc over inline comments per project PHP conventions
      5. `tests/Unit/Calendar/IcsFeedClientTest.php` with `Http::fake()`:
         - 200 captures body, `ETag`, `Last-Modified`
         - 304 returns `notModified: true` with a null body
         - validators are sent as `If-None-Match` / `If-Modified-Since` when supplied, and **omitted** when null (`Http::assertSent`)
         - `Http::assertSent` asserts the bounded connect/total timeouts are applied
         - a 500 throws `FeedUnavailable` carrying `httpStatus: 500`
         - a thrown `ConnectionException` becomes `FeedUnavailable` with a null `httpStatus`
         - an unset `KBMS_ICS_URL` throws with a message naming the key
      6. `php artisan test --compact --filter=IcsFeedClient` and `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Conditional headers sent only when a validator exists
      - [x] `304` short-circuits with no body
      - [x] Every transport failure surfaces as `FeedUnavailable`, never a raw HTTP client exception
      - [x] Timeouts are bounded and asserted
      - [x] Tests pass; `larapilot:quality` green

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-04 add IcsFeedClient with conditional GET`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
