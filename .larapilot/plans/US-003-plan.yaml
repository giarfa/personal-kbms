    id: TASK-08
    title: 'Close the acceptance-criteria coverage gaps end to end'
    body: |-
      ## Description
      Add the cross-cutting coverage that could not be written before the pipeline was assembled, and confirm every acceptance criterion in the spec maps to a passing assertion.

      ## Files Involved
      - tests/Feature/CalendarIngestionTest.php
      - tests/Unit/Calendar/IcsParserTest.php (extend)
      - tests/Feature/SyncCalendarFeedJobTest.php (extend)

      ## Steps
      1. Walk the spec's acceptance criteria against the coverage map in `plan_body` → `## Test Strategy` and write a test for anything not yet asserted
      2. `tests/Feature/CalendarIngestionTest.php` — full-pipeline scenarios driven from `.ics` fixtures through `Http::fake()`, asserting rows in `calendar_events`:
         - a recurring series lands as N independently addressable rows
         - re-running against an identical feed reports `events_upserted: 0`
         - re-running against a feed with one occurrence removed cancels exactly that occurrence and leaves its siblings active
