    id: TASK-02
    title: 'Add the CalendarEvent model, migration, factory and seeder'
    body: |-
      ## Description
      Add `CalendarEvent` — the mirrored occurrence — with the unique key that makes a single occurrence of a recurring series independently addressable. This is the first Eloquent model in the project, so it also creates `database/factories/`.

      ## Files Involved
      - app/Models/CalendarEvent.php
      - database/migrations/xxxx_create_calendar_events_table.php
      - database/factories/CalendarEventFactory.php
      - database/seeders/CalendarEventSeeder.php
      - database/seeders/DatabaseSeeder.php
      - tests/Unit/Models/CalendarEventTest.php

      ## Steps
      1. `php artisan make:model CalendarEvent -mf --no-interaction`
      2. Migration columns: `uuid('id')->primary()`, `string('source_uid')`, `string('recurrence_id')` **NOT NULL** (default `''`), `string('summary')->nullable()`, `text('description')->nullable()`, `string('location')->nullable()`, `string('organizer')->nullable()`, `json('attendees')->nullable()`, `dateTime('starts_at')`, `dateTime('ends_at')`, `boolean('is_all_day')->default(false)`, `string('timezone')->nullable()`, `string('join_url')->nullable()`, `string('event_url')->nullable()`, `string('content_hash', 64)`, `dateTime('last_seen_at')`, `dateTime('cancelled_at')->nullable()`, `timestamps()`
      3. Indexes **in this same migration**: `unique(['source_uid', 'recurrence_id'])`, `index('starts_at')`, `index('cancelled_at')`. `recurrence_id` must **not** be nullable — SQLite treats `NULL`s as distinct inside a unique index, so a nullable column would let unlimited duplicate rows through for every non-recurring event while the constraint appears to exist
      4. Model: `use HasUuids`, `$fillable` or `$guarded = []` matching project convention, casts for `attendees` (`array`), `starts_at` / `ends_at` / `last_seen_at` / `cancelled_at` (`datetime`), `is_all_day` (`boolean`). Add a `scopeInWindow(Builder $query, CarbonInterface $from, CarbonInterface $to)` — the cancellation sweep and `US-005` both need it. Explicit return types on every method
      5. Factory: meeting-shaped Faker summaries (not `lorem`), realistic organizer addresses, `Europe/Rome` timezone, `starts_at` inside the window, `recurrence_id` defaulting to `''`. States: `allDay()`, `cancelled()`, `occurrenceOf(string $uid, string $recurrenceId)`, `withTeamsLink()`, `stale()` (old `last_seen_at`)
      6. `CalendarEventSeeder`: ~40 occurrences from −30 to +45 days; one weekly series of 12 occurrences sharing a `source_uid` with distinct `recurrence_id`s; one of them retitled to stand in for a `RECURRENCE-ID` override; two all-day; three cancelled; four with a `join_url`. Register it in `DatabaseSeeder::run()`
      7. `php artisan migrate:fresh --seed` — must succeed and produce that dataset
      8. `tests/Unit/Models/CalendarEventTest.php`: assert the unique constraint actually fires for a duplicate (`''`) `recurrence_id`, and that casts resolve
      9. `php artisan test --compact --filter=CalendarEvent` and `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Migration creates the table with the unique (`source_uid`, `recurrence_id`) index and both secondary indexes
      - [x] A second insert with the same `source_uid` and `recurrence_id = ''` is rejected by the database
      - [x] `CalendarEventFactory` produces domain-realistic records; every listed state works
      - [x] `migrate:fresh --seed` succeeds and yields the described fixture calendar
      - [x] Tests pass; `larapilot:quality` green

      ## Test Data
      - [x] `database/factories/CalendarEventFactory.php` created with all five states
      - [x] `CalendarEventSeeder` registered in `DatabaseSeeder` with meaningful volumes
      - [x] Factory and seeder land in **this same commit** as the migration and model

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-02 add CalendarEvent with factory and seeder`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
