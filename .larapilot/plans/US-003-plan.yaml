    id: TASK-09
    title: 'Swap the doctor ICS check onto sabre/vobject and land the deferred timeout assertion'
    body: |-
      ## Description
      Execute the recorded decision **"doctor ics parse validation"** (superseding `6b3a5c34` from US-002): now that `sabre/vobject` is installed, the doctor parses the feed for real instead of matching strings, and a valid-but-empty calendar passes. Also lands the `Http::assertSent` bounded-timeout assertion that US-002 accepted as a residual risk.

      ## Files Involved
      - app/Doctor/Checks/IcsFeedCheck.php
      - tests/Unit/Doctor/IcsFeedCheckTest.php

      ## Steps
      1. Keep the check's existing shape: unset `KBMS_ICS_URL` → `notConfigured`; `ConnectionException` → `failed` with the timeout hint; non-2xx → `failed` carrying the status. The bounded `connectTimeout(3)->timeout(5)` stays as-is — the doctor is an interactive gate and must never hang
      2. Replace the four `str_contains` body assertions with `Sabre\VObject\Reader::read($body)` inside try/catch:
         - `ParseException`, or a document that is not a `VCalendar` → `failed`, hint naming `KBMS_ICS_URL` and calling out an HTML sign-in page as the usual cause of a 200 that will not parse
         - parses cleanly → count `VEVENT` components and return `CheckResult::pass("HTTP {$status}, {$count} event(s)")`
      3. **Zero events now PASSES.** Per the recorded decision, under a real parser an empty-but-valid calendar is a legitimate state, not evidence of a wrong subscription URL. Delete the zero-events failure branch — do not downgrade it to a warning, the `CheckStatus` enum has no such state
      4. Update `tests/Unit/Doctor/IcsFeedCheckTest.php`:
         - the HTML-sign-in-page-with-200 scenario still fails, now via `ParseException`
         - a truncated body still fails
         - **new expectation:** a valid calendar with zero `VEVENT`s now passes, with `0 event(s)` in the detail — this test inverts, so update it deliberately rather than deleting it
         - **deferred assertion, now landed:** `Http::assertSent` verifies the connect and total timeouts are applied
      5. `php artisan test --compact --filter=Doctor` — the whole doctor suite, since `DoctorCommandTest` exercises this check too
      6. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `IcsFeedCheck` parses with `sabre/vobject`; no `str_contains` body assertions remain
      - [x] A parseable feed with zero events reports `PASS`
      - [x] A 200 returning HTML still reports `FAIL` with a hint naming `KBMS_ICS_URL`
      - [x] The bounded-timeout assertion exists and passes
      - [x] The full doctor suite, including `DoctorCommandTest`, is green
      - [x] `larapilot:quality` green

