    id: TASK-03
    title: 'Add the CalendarSyncRun model, status enum, migration, factory and seeder'
    body: |-
      ## Description
      Add the per-run audit row that records every sync attempt and carries the conditional-GET validators forward. `US-004` reads this table; this task writes its shape.

      ## Files Involved
      - app/Calendar/SyncRunStatus.php
      - app/Models/CalendarSyncRun.php
      - database/migrations/xxxx_create_calendar_sync_runs_table.php
      - database/factories/CalendarSyncRunFactory.php
      - database/seeders/CalendarSyncRunSeeder.php
      - database/seeders/DatabaseSeeder.php
      - tests/Unit/Models/CalendarSyncRunTest.php

      ## Steps
      1. `php artisan make:enum` is not available — create `app/Calendar/SyncRunStatus.php` as a backed string enum with **TitleCase** keys per the project PHP conventions: `Running`, `Success`, `NotModified`, `Failed`
      2. `php artisan make:model CalendarSyncRun -mf --no-interaction`
      3. Migration: `uuid('id')->primary()`, `dateTime('started_at')`, `dateTime('finished_at')->nullable()`, `string('status')`, `unsignedSmallInteger('http_status')->nullable()`, `string('etag')->nullable()`, `string('last_modified')->nullable()`, `unsignedInteger('events_upserted')->default(0)`, `unsignedInteger('events_cancelled')->default(0)`, `text('error')->nullable()`, `timestamps()`. Indexes: `index('started_at')`, `index(['status', 'finished_at'])` — the composite is what `US-004` will use for "last successful sync"
      4. Model: `use HasUuids`; cast `status` to `SyncRunStatus`, the three datetimes to `datetime`. Add:
         - `public static function start(): self` — creates a `Running` row with `started_at = now()`
         - `public function succeed(int $httpStatus, ?string $etag, ?string $lastModified, int $upserted, int $cancelled): void`
         - `public function markNotModified(?string $etag, ?string $lastModified): void`
         - `public function fail(string $error, ?int $httpStatus = null): void`
         - `public static function latestValidators(): ?self` — the most recent run whose status is `Success` or `NotModified`, the source of the conditional-GET headers
         Keeping the lifecycle on the model avoids a fourth collaborator class that would only forward calls
      5. Factory states: `successful()`, `failed()` (legible error text, no `lorem`), `notModified()`, `running()` (null `finished_at`)
      6. `CalendarSyncRunSeeder`: ~12 runs over the last few days — mostly `Success`, one `Failed` with a readable error, one `NotModified`, so `US-004` has every state to render. Register in `DatabaseSeeder::run()`
      7. `php artisan migrate:fresh --seed`
      8. `tests/Unit/Models/CalendarSyncRunTest.php`: lifecycle helpers set the right status and timestamps; `latestValidators()` prefers the most recent `Success`/`NotModified` and ignores `Failed` and `Running`
      9. `php artisan test --compact --filter=CalendarSyncRun` and `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `SyncRunStatus` enum with TitleCase keys, cast on the model
      - [x] Migration creates the table with both indexes
      - [x] Lifecycle helpers behave as specified; `latestValidators()` ignores `Failed` and `Running` rows
      - [x] `migrate:fresh --seed` succeeds and yields runs in every status
      - [x] Tests pass; `larapilot:quality` green

