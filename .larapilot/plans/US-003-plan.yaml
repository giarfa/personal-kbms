    id: TASK-07
    title: 'Assemble the SyncCalendarFeed job and replace the kbms:sync-calendar stub'
    body: |-
      ## Description
      Wire client → parser → synchronizer behind a queued job, record the run, prune old runs, and turn the US-002 command stub into the real entry point.

      ## Files Involved
      - app/Jobs/SyncCalendarFeed.php
      - app/Console/Commands/SyncCalendarCommand.php
      - tests/Feature/SyncCalendarFeedJobTest.php
      - tests/Feature/SyncCalendarCommandTest.php

      ## Steps
      1. `php artisan make:job SyncCalendarFeed --no-interaction`. `implements ShouldQueue, ShouldBeUnique`; `use Queueable`. Set `public int $tries = 1` — a retry would write a second run row for the same attempt and double-count, and the scheduler returns in 15 minutes anyway. Set `public int $timeout = 120`. `ShouldBeUnique` complements the `withoutOverlapping()` already registered on the schedule by US-001; do not touch `routes/console.php`
      2. Constructor: `public function __construct(public bool $force = false) {}` — `--force` bypasses the conditional-GET validators
      3. `handle(IcsFeedClient $client, IcsParser $parser, EventSynchronizer $synchronizer): void`:
         a. `$run = CalendarSyncRun::start()`
         b. resolve validators via `CalendarSyncRun::latestValidators()` unless `$this->force`
         c. `$client->fetch(...)`; on `FeedUnavailable` → `$run->fail($e->getMessage(), $e->httpStatus)`, log at `warning` with structured context, return
         d. `notModified` → `$run->markNotModified(...)` and **return before touching the parser** — no parse, no upsert, no sweep
         e. compute the window from `config('kbms.window_past_days')` / `window_future_days` relative to `now()`
         f. `$synchronizer->synchronize($parser->parse(...), ...)`; on `FeedUnparsable` → `$run->fail(...)` with the HTTP status, return — zero writes, previous mirror intact
         g. `$run->succeed($httpStatus, $etag, $lastModified, $result->upserted, $result->cancelled)`
         h. prune: delete runs with a non-null `finished_at` older than `config('kbms.sync_run_retention_days')` days — per the decision journal entry "calendar sync run retention"
         i. structured `Log::info('kbms.calendar.sync', [...])` with run id, status, counts — matching the `kbms.*` log-key convention set by `QueueSelfTestJob`
      4. Rewrite `SyncCalendarCommand`: keep the `#[Signature]` / `#[Description]` attribute style already used in the codebase. Signature `kbms:sync-calendar {--sync : Run inline instead of queueing} {--force : Ignore stored ETag/Last-Modified}`. Default dispatches to the queue (the acceptance criterion: no operator-facing path blocks on the fetch); `--sync` uses `dispatchSync` and prints the resulting run's status and counts. Exit `0` on dispatch or a successful inline run, `1` when an inline run ends `Failed`
      5. `tests/Feature/SyncCalendarFeedJobTest.php` (`RefreshDatabase`, `Http::fake()`, fixtures from TASK-05):
         - a successful run writes a `Success` row with `http_status`, `etag`, and both counts, and populates `calendar_events`
         - a 304 writes a `NotModified` row and performs **zero** writes to `calendar_events`
         - validators from the latest successful run are sent on the next fetch; `--force` omits them
         - an unreachable feed writes `Failed` and leaves pre-seeded events **byte-identical**
         - a 500 writes `Failed` with `http_status: 500` and leaves the mirror intact
         - `truncated.ics` writes `Failed` and leaves the mirror intact — nothing partially wiped
         - runs older than the retention window are pruned; newer ones survive
         - the job is `ShouldBeUnique`
      6. `tests/Feature/SyncCalendarCommandTest.php`: default invocation `Queue::assertPushed(SyncCalendarFeed::class)`; `--sync` runs inline and reports counts; a failed inline run exits non-zero
      7. `php artisan migrate:fresh --seed`, `php artisan test --compact --filter=SyncCalendar`, `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Every run writes exactly one `calendar_sync_runs` row with start, finish, status, HTTP status, counts, and error
      - [x] A 304 short-circuits before the parser is constructed
      - [x] Unreachable, HTTP-error, and malformed-body paths all record a failure and leave the mirror intact
      - [x] Sync runs on the queue by default; `--sync` and `--force` behave as documented
      - [x] Runs older than `KBMS_SYNC_RUN_RETENTION_DAYS` are pruned
      - [x] The US-002 "not implemented" stub is gone
      - [x] Tests pass; `larapilot:quality` green

      ## Test Data
      - [x] Reuses `CalendarEventFactory` and `CalendarSyncRunFactory` — no new factory definitions
      - [x] `migrate:fresh --seed` re-verified before `task-done`

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-07 add SyncCalendarFeed job and implement kbms:sync-calendar`
