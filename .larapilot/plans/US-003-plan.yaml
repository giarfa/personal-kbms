code: US-003
plan_body: |
  ## Technical Solution

  `US-003` builds the ingestion half of the calendar mirror: a queued job that fetches the subscribed `.ics` feed, expands recurrences into individually addressable occurrences, and upserts them into local storage without ever destroying an occurrence the operator may later annotate. `US-004` owns the reading surface for sync health; this spec owns the tables it will read.

  ### Dependency — `sabre/vobject ^5.0`

  Approved in the PRD (`## Technical Architecture` → Vendor policy) and named in the acceptance criteria: no Laravel first-party or Spatie package covers `RRULE` handling. Verified against the registry before planning:

  | Field | Value |
  | --- | --- |
  | Version | `5.0.0` |
  | License | BSD-3-Clause |
  | Requires | `php ^8.2`, `ext-mbstring`, `ext-json`, `sabre/xml ^3.0 \|\| ^4.0` |

  Compatible with the installed PHP 8.4.23. `composer audit` runs immediately after install (TASK-01). This is the **only** dependency this spec adds.

  ### Components

  New namespace `App\Calendar` — a sibling of the existing `App\Doctor`, not a new base folder.

  | Class | Responsibility |
  | --- | --- |
  | `App\Calendar\SyncRunStatus` (enum) | `Running`, `Success`, `NotModified`, `Failed` — TitleCase keys per project PHP conventions |
  | `App\Calendar\FeedResponse` (readonly DTO) | `httpStatus`, `body` (nullable), `etag`, `lastModified`, `notModified` |
  | `App\Calendar\IcsFeedClient` | Conditional `GET` with bounded timeouts; emits `FeedResponse`; throws `FeedUnavailable` |
  | `App\Calendar\ParsedOccurrence` (readonly DTO) | One expanded occurrence + `contentHash()` |
  | `App\Calendar\IcsParser` | `sabre/vobject` wrapper; window-bounded `RRULE` expansion, `TZID` capture, all-day normalization, URL extraction; throws `FeedUnparsable` |
  | `App\Calendar\EventSynchronizer` | Cancellation-safe upsert on (`source_uid`, `recurrence_id`), content-hash skip, window-scoped cancellation sweep |
  | `App\Calendar\Exceptions\FeedUnavailable` | Transport failure: connection refused, timeout, non-2xx/304 status |
  | `App\Calendar\Exceptions\FeedUnparsable` | The body is not usable iCalendar, or expansion failed |
  | `App\Models\CalendarEvent` | `HasUuids`; the mirrored occurrence |
  | `App\Models\CalendarSyncRun` | `HasUuids`; run lifecycle + carrier of the conditional-GET validators |
  | `App\Jobs\SyncCalendarFeed` | `ShouldQueue` + `ShouldBeUnique`; orchestrates client → parser → synchronizer → run row |
  | `App\Console\Commands\SyncCalendarCommand` | Replaces the US-002 stub; dispatches the job (`--sync` to run inline, `--force` to bypass conditional GET) |

  The pipeline is deliberately three collaborators rather than one service: the client knows HTTP and nothing about calendars, the parser knows iCalendar and nothing about the database, and the synchronizer knows persistence and nothing about HTTP. Each is independently testable with no fakes beyond its own boundary, and `US-004`'s manual resync reuses the job untouched.

  ### Schema

  **`calendar_events`** — UUID primary key, plus the natural key from the feed.

  | Column | Type | Notes |
  | --- | --- | --- |
  | `id` | uuid, primary | |
  | `source_uid` | string, indexed | the `VEVENT` `UID` |
  | `recurrence_id` | string, **NOT NULL** | see *Occurrence identity* below |
  | `summary` | string, nullable | |
  | `description` | text, nullable | |
  | `location` | string, nullable | |
  | `organizer` | string, nullable | |
  | `attendees` | json, nullable | array of `{name, email}` |
  | `starts_at` / `ends_at` | datetime | UTC for timed events; naive local date for all-day (see below) |
  | `is_all_day` | boolean, default false | |
  | `timezone` | string, nullable | the original `TZID`, captured before expansion |
  | `join_url` / `event_url` | string, nullable | consumed by `US-005` |
  | `content_hash` | string(64) | sha-256 over the normalized field set |
  | `last_seen_at` | datetime | bumped every run the occurrence appears in the feed |
  | `cancelled_at` | datetime, nullable | never a delete |

  Indexes: **unique** (`source_uid`, `recurrence_id`); index on `starts_at`; index on `cancelled_at`.

  **`calendar_sync_runs`** — `id` (uuid), `started_at`, `finished_at` (nullable), `status`, `http_status` (nullable), `etag` (nullable), `last_modified` (nullable), `events_upserted`, `events_cancelled`, `error` (nullable text). Indexes on `started_at` and (`status`, `finished_at`) — the latter is what `US-004` will query for "last successful sync".

  `last_modified` is an addition to the column list the PRD sketches. `If-Modified-Since` is an explicit acceptance criterion and cannot be served from the `ETag` alone; TASK-10 records the addition in the PRD.

  ### Occurrence identity — the contract the rest of the product hangs off

  `recurrence_id` is a **non-nullable string**, normalized as:

  - timed occurrence → `RECURRENCE-ID` in UTC, `Y-m-d\TH:i:s\Z`
  - all-day occurrence → `Y-m-d`
  - non-recurring event → **empty string `''`**

  The empty string is not cosmetic. **SQLite treats `NULL`s as distinct inside a unique index**, so a nullable `recurrence_id` would silently permit unlimited duplicate rows for every single-occurrence event — the unique constraint would exist and never fire. This is the single most important schema decision in the spec.

  This normalization is a **public contract**, not an implementation detail: `US-005` routes meeting detail pages on (`source_uid`, `recurrence_id`) and `US-006` keys notes on it. Changing the format later orphans every note. It is asserted directly in `EventSynchronizerTest`.

  ### Recurrence expansion

  `IcsParser` expands over the window `now() - KBMS_ICS_WINDOW_PAST_DAYS` … `now() + KBMS_ICS_WINDOW_FUTURE_DAYS` (default −90/+180) using `sabre/vobject`'s expansion API. That API is what makes the *unbounded series* acceptance criterion tractable: a series with no `UNTIL` and no `COUNT` is expanded only inside the requested range, so it cannot run away. `EXDATE` exclusions and `RECURRENCE-ID` overrides are handled by the library rather than reimplemented.

  Three implementation traps, in order of how much time they cost if missed:

  1. **Expansion discards `VTIMEZONE` and normalizes to UTC.** The `TZID` must be harvested from each master `VEVENT`'s `DTSTART` into a `UID → TZID` map **before** expanding; afterwards it is gone. This is how the `timezone` column gets populated at all.
  2. **Expansion mutates the document.** The parsed `VCalendar` must not be read again after expansion. Verify the exact `expand()` signature and return semantics against the installed `vendor/sabre/vobject` before relying on either — the 4.x → 5.0 API moved, and this plan deliberately does not assert which shape 5.0 ships.
  3. **Expansion must happen in the event's own timezone.** A weekly 09:00 Europe/Rome meeting must stay 09:00 across the March and October transitions, not drift by an hour. Expanding in UTC produces exactly that drift. The DST fixture (TASK-05) crosses `2026-03-29`, the real Europe/Rome spring transition.

  The parser **yields** occurrences (generator) rather than materializing an array: a 270-day window across several long-running series is thousands of `VEVENT`s, and there is no reason to hold them all in memory.

  ### All-day events

  An all-day `VEVENT` carries `DTSTART;VALUE=DATE`. Storing that as midnight-local converted to UTC shifts the event to the previous day for any positive UTC offset — Europe/Rome is `+01:00`/`+02:00`, so this would be wrong every single time. Instead: `is_all_day = true`, `timezone = null`, and `starts_at` / `ends_at` hold the **naive dates** at `00:00:00` with no conversion applied in either direction. Every consumer formats `is_all_day` rows from the raw date and never timezone-converts them. `ends_at` keeps iCalendar's exclusive end date as-is.

  ### Conditional GET

  Validators live on the run rows, not in a separate cache. `IcsFeedClient` is handed the `etag` / `last_modified` from the most recent run whose status is `Success` or `NotModified` (a 304 carries the validators forward) and sends `If-None-Match` / `If-Modified-Since`. A `304` returns `FeedResponse` with `notModified: true`; the job writes a `NotModified` run and **returns before constructing the parser at all** — no parse, no upsert, no cancellation sweep.

  If the app sits idle longer than the retention window and every run is pruned, the validators are lost and the next sync is a full fetch. Harmless, and cheaper than a second storage mechanism.

  ### Cancellation, and what must never happen

  Two paths mark `cancelled_at`, and neither ever deletes a row:

  1. The `VEVENT` arrives with `STATUS:CANCELLED` → marked during upsert.
  2. The occurrence stops appearing in the feed → marked by the post-upsert sweep.

  The sweep is **scoped to the window**: `cancelled_at IS NULL` AND `starts_at` inside the current window AND `last_seen_at < $run->started_at`. Dropping the window predicate would cancel every event older than 90 days on the first run — a silent, total corruption of the annotated history the PRD exists to protect. An occurrence that reappears active after being swept is **un-cancelled** (`cancelled_at = null`), so an upstream flap does not leave a permanently struck-through meeting.

  Upserts and the sweep run inside a single `DB::transaction`, and a parse failure aborts before any write — which is how the "malformed body must not partially wipe existing events" criterion is satisfied structurally rather than by careful ordering.

  ### Content hashing

  `content_hash` is sha-256 over the normalized user-visible field set (summary, description, location, organizer, sorted attendees, start, end, all-day flag, timezone, URLs, cancelled state). **Attendees are sorted before hashing** and `last_seen_at` is excluded — otherwise the hash flaps on every run and the write-skip optimization does nothing. When the hash matches, only `last_seen_at` is touched; the row does not count toward `events_upserted`.

  ### Failure handling

  Every failure path writes a `Failed` run with a legible `error` and leaves the previous mirror intact:

  | Failure | Recorded |
  | --- | --- |
  | Connection refused / DNS / timeout | `FeedUnavailable`, `http_status` null |
  | Non-2xx, non-304 | `FeedUnavailable`, `http_status` set |
  | Body is not iCalendar, or expansion throws | `FeedUnparsable`, `http_status` set, zero writes |

  `SyncCalendarFeed` sets `$tries = 1`: a retry would write a second run row for the same attempt and double-count, and the scheduler comes back in 15 minutes regardless. `ShouldBeUnique` prevents a duplicate queued run from stacking on top of one already in flight, complementing the `withoutOverlapping()` already registered on the schedule by US-001.

  ### Run retention

  Per the decision journal entry **"calendar sync run retention"** (2026-09-07): after each run the job deletes finished runs older than `KBMS_SYNC_RUN_RETENTION_DAYS` (default 30). At a 15-minute interval that bounds the table at roughly 2,900 rows while keeping a month of failure history for `US-004`. This is the only new configuration key the spec adds.

  ### `kbms:doctor` — recorded decision, superseding US-002

  Per the decision journal entry **"doctor ics parse validation"** (superseding `6b3a5c34`): now that `sabre/vobject` is installed, `IcsFeedCheck` drops its string-matching envelope validation and parses the body for real. A `ParseException` becomes a `Failed` result naming `KBMS_ICS_URL`; **a feed that parses cleanly with zero events now PASSES** rather than failing, because under a real parser an empty-but-valid calendar is a legitimate state rather than evidence of a wrong subscription URL. TASK-09 also lands the `Http::assertSent` bounded-timeout assertion that US-002 accepted as a residual risk.

  ### Bounded timeouts

  `IcsFeedClient` uses `connectTimeout(5)->timeout(30)` as class constants — deliberately more generous than the doctor's 3s/5s, because the doctor is an interactive gate and the sync is a background job against a feed that may be large. They are constants rather than env keys to keep the configuration surface at the one key the retention decision requires; promoting them later is a one-line change.

  ### Non-goals

  No UI of any kind — sync health and manual resync are `US-004`, agenda and detail are `US-005`. No `OutlookLinkBuilder` (`US-005` owns it; this spec only *captures* `join_url` / `event_url`). No transcript resolution, no FTS5, no notes. No new base directory. No dependency beyond `sabre/vobject`.

  ## Git & Branching

  - Mode: `GITFLOW` (from `settings.git_mode`) — Gitflow **without** automatic push
  - Branch: `feature/US-003-ics-calendar-ingestion` from `develop` (US-001 and US-002 are both merged, so `develop` is the branch point — no repeat of the US-002 stacked-branch situation)
  - TASK-00: bootstrap the branch and draft the internal PR description locally
  - Per task: exactly one Conventional Commit `type(US-003): TASK-NN summary` — never batch tasks
  - Push: **skip** — no `git push`, no remote PR, unless the operator asks in-session
  - `php artisan larapilot:quality` (Pint + Larastan level 5+) green before every `task-done`
  - `composer audit` immediately after the `sabre/vobject` install in TASK-01
  - `CHANGELOG.md` Unreleased updated in TASK-10 — this spec changes user-visible behaviour (`kbms:sync-calendar` and `kbms:doctor`)
  - Merge to `develop` only after human `/larapilot-review` approval

  ## Test Data Strategy

  This is the first spec in the project to introduce Eloquent models, so it also establishes `database/factories/` — the directory does not exist yet.

  - **`CalendarEventFactory`** — domain-realistic Faker values (meeting-shaped summaries, real-looking organizer addresses, Europe/Rome timezone), never `lorem` filler. States: `allDay()`, `cancelled()`, `occurrenceOf(string $uid, string $recurrenceId)`, `withTeamsLink()`, `stale()` (an old `last_seen_at`, for sweep tests).
  - **`CalendarSyncRunFactory`** — states: `successful()`, `failed()`, `notModified()`, `running()` (no `finished_at`).
  - **Seeders** — `CalendarEventSeeder` and `CalendarSyncRunSeeder`, both called from `DatabaseSeeder`, producing a fixture calendar the `US-004`/`US-005` interface can be built against with no live feed:
    - ~40 occurrences spread across −30 to +45 days
    - one weekly recurring series of 12 occurrences sharing a `source_uid` with distinct `recurrence_id`s — the dataset that makes recurrence-isolation bugs visible by eye
    - one occurrence of that series retitled, to stand in for a `RECURRENCE-ID` override
    - two all-day events, three cancelled occurrences, four carrying a Teams `join_url`
    - ~12 sync runs: mostly `Success`, one `Failed` with a legible error, one `NotModified`, so `US-004` has every state to render
  - **Verify** `php artisan migrate:fresh --seed` before `task-done` on TASK-02, TASK-03, and TASK-07.
  - **`.ics` fixtures** live in `tests/Fixtures/ics/` and are test inputs, not seed data: `recurring-weekly.ics`, `recurrence-override.ics`, `exdate.ics`, `cancelled.ics`, `all-day.ics`, `dst-transition.ics`, `unbounded-series.ics`, `truncated.ics`, `not-calendar.html`.

  ## Test Strategy

  - **Bar: `NORMAL`** (from `settings.testing`) — PHPUnit feature and unit tests. **No** Playwright, Dusk, Pest browser, or viewport matrix. This spec has no UI, so the question does not arise.
  - Style follows the existing suite: PHPUnit classes with `public function test_snake_case(): void`, `Tests\TestCase`, `RefreshDatabase` where the database is touched, `Http::fake()` as already used in `QueueAndScheduleTest` and `IcsFeedCheckTest`.
  - **Interleaved, not deferred:** TASK-04, TASK-05, TASK-06, TASK-07 and TASK-09 each ship their own tests in the same commit. TASK-08 adds only the cross-cutting end-to-end and error-case layer that cannot be written until the pipeline is assembled.
  - Coverage map:

  | Acceptance criterion | Covered by |
  | --- | --- |
  | Scheduled every `KBMS_ICS_SYNC_MINUTES`, `withoutOverlapping()` | `QueueAndScheduleTest` (already green from US-001) + `ShouldBeUnique` assertion in `SyncCalendarFeedJobTest` |
  | Conditional GET; `304` short-circuits without parsing | `IcsFeedClientTest` (headers sent) + `SyncCalendarFeedJobTest` (a 304 run performs zero writes) |
  | `RRULE` expansion across the configured window | `IcsParserTest` — `recurring-weekly.ics` |
  | Upsert keyed on (`source_uid`, `recurrence_id`), siblings independent | `EventSynchronizerTest` — the highest-value assertion in this spec |
  | `EXDATE` honored | `IcsParserTest` — `exdate.ics` |
  | `RECURRENCE-ID` override not flattened | `IcsParserTest` — `recurrence-override.ics` (retitled single occurrence) |
  | `TZID` preserved; correct across a DST boundary | `IcsParserTest` — `dst-transition.ics` crossing 2026-03-29 |
  | All-day stored date-only, no day shift | `IcsParserTest` + `EventSynchronizerTest` — `all-day.ics` |
  | Absent or `STATUS:CANCELLED` → `cancelled_at`, never deleted | `EventSynchronizerTest` — sweep scoping, un-cancel on reappearance, row-count assertions |
  | Content hash skips unchanged writes | `EventSynchronizerTest` — second run reports `events_upserted: 0` and bumps only `last_seen_at` |
  | `join_url` / `event_url` captured | `IcsParserTest` — `URL`, `X-MICROSOFT-SKYPETEAMSMEETINGURL`, and Teams-link-in-description paths |
  | `calendar_sync_runs` row per run with full detail | `SyncCalendarFeedJobTest` |
  | Runs as a queued job | `SyncCalendarCommandTest` — `Queue::assertPushed` |
  | **Error:** unreachable / HTTP error / timeout leaves mirror intact | `SyncCalendarFeedJobTest` — pre-seeded events survive unchanged |
  | **Error:** malformed / truncated body does not partially wipe | `SyncCalendarFeedJobTest` — `truncated.ics`, `not-calendar.html` |
  | **Edge:** unbounded series bounded by the window | `IcsParserTest` — `unbounded-series.ics`, asserts a finite bounded count |
  | Doctor parses with `sabre/vobject`; zero events passes | `IcsFeedCheckTest` (rewritten in TASK-09) |
  | Bounded timeout never hangs (deferred from US-002) | `IcsFeedCheckTest` — `Http::assertSent` timeout assertion |

  - Run `php artisan test --compact --filter=Calendar` during implement; full `php artisan test` before the final `task-done`.
  - **Manual test handoff (NORMAL bar):** after TASK-08, point `KBMS_ICS_URL` at the operator's real Outlook subscription, run `php artisan kbms:sync-calendar --sync`, and confirm against Outlook that a known recurring series, a known all-day event, and a known cancelled meeting each landed correctly. Fixtures cannot prove the real feed's dialect.
