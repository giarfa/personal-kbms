      2. `readUnbounded()`: a file larger than a deliberately lowered `kbms.transcript_preview_bytes` comes back complete — assert the **tail** of the content is present and `truncated === false` and `bytesRead === totalBytes`. Assert `read()` on the same file still truncates, so the two paths are proven independent.
      3. `readUnbounded()` on a `.txt` path returns `isMarkdown === false` with escaped content; on `.md` it returns rendered Markdown — the same contract as the preview.
      4. `verify()`: distinct `Rejected` (path outside the base, including a symlink escaping it), `Broken` (contained but absent), `Unreadable` (chmod 000), and null for a healthy file.
      5. `TranscriptExporter`: `Missing` with no row, `Suppressed` for a null-path tombstone row, a verified path for a healthy row, and the row's verification state for a broken/unreadable/escaped stored path.
