  -
    id: TASK-07
    title: 'Feature tests for export routes, states and recurrence identity'
    body: |-
      ## Description
      Feature coverage for the export routes and the panel affordances, at the `NORMAL` bar, plus the manual handoff for what a browser has to verify.

      ## Files Involved
      - tests/Feature/MeetingExportTest.php (new)
      - tests/Feature/MeetingNotesTest.php
      - tests/Feature/TranscriptPanelTest.php

      ## Steps
      1. `php artisan make:test --phpunit MeetingExportTest`; reuse `TranscriptPanelTest`'s temp-directory and `seedFile()` patterns for on-disk fixtures.
      2. Print (note): 200 with the meeting title, date and time and the rendered body; 404 with the empty-note reason for a blank body and for no row at all.
      3. Print (transcript): 200 with the header, the date/time and the **source filename**; `.md` rendered, `.txt` escaped monospace; a file larger than a lowered `kbms.transcript_preview_bytes` prints **complete** (assert the tail).
      4. Request-time verification: create a healthy row, delete the file, then request — assert the stated "gone" page at 404, not a blank document. Repeat for unreadable (chmod 000), for a path escaping the base, and for the tombstone row. Assert the **distinct** wording per state, not just the status code.
      5. Raw source route: byte-for-byte equality with the file on disk, `text/plain; charset=utf-8`, complete past the preview bound; 404 with its reason for each refusal state.
      6. **Recurrence identity** — the highest-value assertion here: two occurrences of one series, each with its own note and its own linked transcript; assert each print route returns that occurrence's content and never the sibling's. Address both through `OccurrenceKey::toRouteKey()`.
      7. A cancelled occurrence still exports — sharing never gates on upstream feed state.
      8. Livewire: extend `MeetingNotesTest` (no actions with a blank body; both present once a body exists) and `TranscriptPanelTest` (both actions in `Linked`; neither in `Broken`, `Unreadable`, `Rejected`, `Suppressed`, `Missing`). Assert the `rel="noopener"` and `target="_blank"` on the print link, matching the standing external-CTA convention.
      9. No Playwright, Dusk, Pest browser or viewport suite — `settings.testing` is `NORMAL`.
      10. `php artisan test`, then `php artisan larapilot:quality`.
      11. Write the **manual test handoff** into the review notes: on `http://personal-kbms.test` — paste a copied note back into the editor unchanged; copy a >2 MiB transcript and check the tail; confirm the transient "Copied" and that a denied clipboard reports failure rather than success; print both surfaces with the app in **dark** mode and check header, absent chrome, and white-paper legibility; keyboard-only pass over both action pairs.

      ## Completion Criteria
      - [x] Full suite green
      - [x] Every acceptance criterion reachable from PHP is asserted, by distinguishing string where one exists
      - [x] Recurring-series identity asserted on both print routes
      - [x] Manual handoff steps written down for review
      - [x] Pint clean, Larastan level 5 clean

      ## Git Deliverables
      - Commit: `test(US-017): TASK-07 cover export routes, states and recurrence identity`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
