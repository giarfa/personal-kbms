    id: TASK-05
    title: 'Verbatim transcript source route for the clipboard'
    body: |-
      ## Description
      Serve the transcript's verbatim bytes for the clipboard path — complete, unbounded, and re-verified at request time. Runs in parallel with TASK-03; no shared files.

      ## Files Involved
      - routes/web.php
      - app/Http/Controllers/MeetingTranscriptSourceController.php (new)

      ## Steps
      1. `php artisan make:controller MeetingTranscriptSourceController --invokable --no-interaction`
      2. Register `GET meetings/{occurrence}/transcript/source` → `meetings.transcript.source`.
      3. Resolve with `TranscriptExporter::pathFor()`. A `TranscriptState` returns a `text/plain` body naming that state's reason at 404 — the copy button surfaces it as a failure rather than pretending a copy happened.
      4. On success stream with `response()->file($path, ['Content-Type' => 'text/plain; charset=utf-8'])`. Explicit charset, never `text/markdown` or `text/html`: a transcript is untrusted third-party content and must not be interpretable as markup by the browser. Do not read the file into PHP memory — a transcript has no size bound here by design.
      5. `KBMS_TRANSCRIPT_PREVIEW_BYTES` must not appear anywhere on this path.
      6. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] The route returns the file byte-for-byte, complete, with `text/plain; charset=utf-8`
      - [x] Containment and readability are re-verified on this request, not trusted from the row
      - [x] Every refusal names its own reason at 404
      - [x] Pint clean, Larastan level 5 clean

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-017): TASK-05 serve verbatim transcript source for the clipboard`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
