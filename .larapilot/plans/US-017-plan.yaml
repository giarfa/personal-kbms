    id: TASK-01
    title: 'Unbounded transcript read, shared verification, export resolution'
    body: |-
      ## Description
      Give the reader an unbounded read and a shared verification step, and add the occurrence→transcript resolution both export routes need. The preview path keeps its `KBMS_TRANSCRIPT_PREVIEW_BYTES` bound untouched.

      ## Files Involved
      - app/Transcripts/TranscriptReader.php
      - app/Transcripts/TranscriptExporter.php (new)
      - app/Transcripts/TranscriptExport.php (new)

      ## Steps
      1. Extract the containment/existence/readability ladder from `read()` into `public function verify(string $absolutePath): ?TranscriptState` — `Rejected` when `TranscriptsDirectory::contains()` fails, `Broken` when not a file, `Unreadable` when unreadable or when `filesize`/`filemtime` fail. Null means usable. Keep the existing class docblock's reasoning intact and extend it rather than replacing it.
      2. Route both reads through one private method taking an explicit `?int $limit`. `read()` passes `config('kbms.transcript_preview_bytes')` and keeps the `fread($handle, $limit + 1)` truncation probe plus the `mb_strcut` UTF-8 boundary cut; the unbounded path reads the stream whole and sets `truncated: false`, `bytesRead === totalBytes`.
      3. Add `public function readUnbounded(string $absolutePath): TranscriptContent|TranscriptState` — same verification, same `MarkdownRenderer` for `.md`, same `e()` escaping for `.txt`. **No second converter.**
      4. Add readonly `TranscriptExport{string $path, TranscriptContent $content}` with `filename(): string` returning `basename($path)`.
      5. Add `TranscriptExporter` (constructor-injected `TranscriptReader`) with `pathFor(OccurrenceKey): string|TranscriptState` — `Missing` when no `MeetingTranscript` row, `Suppressed` when the row's `path` is null (the manual-unlink tombstone), otherwise `verify()` the stored path and return it — and `forOccurrence(OccurrenceKey): TranscriptExport|TranscriptState` layering `readUnbounded()` on top. Deliberately no convention-candidate fallback: document that in the class docblock.
      6. `vendor/bin/pint --dirty --format agent` and `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `read()` behaviour is byte-for-byte unchanged — existing `TranscriptReaderTest` passes untouched
      - [x] `readUnbounded()` returns the whole file, never truncated, for a file past the preview bound
      - [x] `verify()` is the single source of the `Rejected` / `Broken` / `Unreadable` distinction
      - [x] `TranscriptExporter` resolves from the persisted row only and states why in its docblock
      - [x] Pint clean, Larastan level 5 clean

      ## Test Data
      - N/A — no model, migration or schema change

      ## Git Deliverables
      - Commit: `feat(US-017): TASK-01 add unbounded transcript read and export resolution`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
