    id: TASK-04
    title: 'Print stylesheet for the exported surfaces'
    body: |-
      ## Description
      Style the print surface for paper: a `kb-print*` block plus `@media print` rules, derived from the existing `kb-*` vocabulary rather than a parallel design layer (recorded decision `print layout mockups` — no mockup round).

      ## Files Involved
      - resources/css/app.css

      ## Steps
      1. Append a `kb-print` section after the existing component blocks, following the file's established ordering and comment style: `.kb-print` page frame, `.kb-print__head` (title, meta line, source filename), `.kb-print__meta`, `.kb-print__body`, `.kb-print--mono` for `.txt` transcripts reusing `--kb-mono`.
      2. Reuse `.kb-md` for rendered Markdown — do not restate its typography.
      3. `@media print`: sensible page margins, `print-color-adjust` where a token background matters, `orphans`/`widows`, avoid breaking inside `pre`/`code`/table rows, no fixed positioning, and no background fills that waste ink. Force black-on-white body text explicitly so a token drift cannot produce grey-on-grey on paper.
      4. Screen rendering of the print route (the tab the operator sees before the dialog) must also be readable — this is not a print-only stylesheet.
      5. `npm run build` to confirm the bundle compiles; check both surfaces in the browser's print preview.

