    body: |-
      ## Description
      Unit coverage for the new read and resolution seams, before any route depends on them.

      ## Files Involved
      - tests/Unit/Transcripts/TranscriptReaderTest.php
      - tests/Unit/Transcripts/TranscriptExporterTest.php (new)

