    id: TASK-03
    title: 'Print routes, controllers and chrome-free print views'
    body: |-
      ## Description
      Add the two print routes, their single-action controllers, the chrome-free print layout, the meeting header component, and the stated-unavailable page.

      ## Files Involved
      - routes/web.php
      - app/Http/Controllers/MeetingNotePrintController.php (new)
      - app/Http/Controllers/MeetingTranscriptPrintController.php (new)
      - resources/views/layouts/print.blade.php (new)
      - resources/views/pages/print/note.blade.php (new)
      - resources/views/pages/print/transcript.blade.php (new)
      - resources/views/pages/print/unavailable.blade.php (new)
      - resources/views/components/meeting/print-header.blade.php (new)

      ## Steps
      1. `php artisan make:controller MeetingNotePrintController --invokable --no-interaction` and the same for `MeetingTranscriptPrintController`.
      2. Register `GET meetings/{occurrence}/note/print` → `meetings.note.print` and `GET meetings/{occurrence}/transcript/print` → `meetings.transcript.print`, using the existing `{occurrence}` binding so `UID` + `RECURRENCE-ID` identity is preserved. They inherit `EnsureLoopbackRequest` from the global stack — do not re-declare it.
      3. Note controller: load the occurrence's `MeetingNote`; a missing row or a blank body renders `pages.print.unavailable` at 404 with the empty-note reason. Otherwise render the note body through `MarkdownRenderer`.
      4. Transcript controller: `TranscriptExporter::forOccurrence()`; a `TranscriptState` renders `pages.print.unavailable` at 404 with **that state's own wording** — missing, gone, not readable, rejected, suppressed must not collapse into one sentence. Verification happens on this request, so a file deleted after the detail page loaded produces the stated page, never a blank or partial document.
      5. `layouts/print.blade.php`: minimal `<html lang>` with no `dark` class, `<meta name="robots" content="noindex, nofollow">`, a per-surface `<title>`, `@vite(['resources/css/app.css'])`, **no** `@fluxAppearance`, **no** `app.js`, no sidebar/header/breadcrumbs/nav/buttons. Inline `window.addEventListener('load', () => window.print())` on the two content views only — the unavailable page must **not** auto-print.
      6. `components/meeting/print-header.blade.php`: meeting title, date and time (all-day and multi-day handled like the detail page's head, but without todo glyphs, tags or CTAs), timezone from `config('kbms.timezone')`, and an optional source filename slot for the transcript. Semantic `kb-print__*` classes only — the stylesheet lands in TASK-04.
      7. Transcript view echoes `{!! $content->rendered !!}` inside `kb-md` for Markdown or the monospace print class for `.txt`; it must never re-render the raw file through a converter of its own.
      8. `php artisan test --filter=Meeting` (smoke), `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Both print routes render for a healthy note and a healthy linked transcript
      - [x] The printed document carries the meeting name, date and time — and the source filename for a transcript
      - [x] Every refusal renders the stated reason at 404 in the print layout without invoking the print dialog
      - [x] No application chrome on any print view — no nav, breadcrumbs, or action buttons
      - [x] The views render legibly with the app in dark mode, because the layout never applies the `dark` class
      - [x] Pint clean, Larastan level 5 clean

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-017): TASK-03 add chrome-free print views for note and transcript`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
