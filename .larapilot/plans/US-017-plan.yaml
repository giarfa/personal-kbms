code: US-017
plan_body: |-
  ## Technical Solution

  Two surfaces, two exits, no new dependency. Everything below reuses seams that already exist — `TranscriptsDirectory` for containment, `TranscriptReader` for the state ladder, `MarkdownRenderer` as the single converter, `OccurrenceKey` for identity. Nothing here introduces a second rendering path, a PDF engine, or a `KBMS_*` key.

  **Routes** (all inherit the global `EnsureLoopbackRequest`; all bound through the existing `Route::bind('occurrence', …)` so `UID` + `RECURRENCE-ID` identity is the route's identity — a sibling occurrence of a recurring series can never be addressed by accident):

  | Route | Name | Controller | Returns |
  | --- | --- | --- | --- |
  | `GET meetings/{occurrence}/note/print` | `meetings.note.print` | `MeetingNotePrintController` | chrome-free print view of the stored note |
  | `GET meetings/{occurrence}/transcript/print` | `meetings.transcript.print` | `MeetingTranscriptPrintController` | chrome-free print view of the full transcript |
  | `GET meetings/{occurrence}/transcript/source` | `meetings.transcript.source` | `MeetingTranscriptSourceController` | `text/plain; charset=utf-8`, the file verbatim and complete |

  Single-action invokable controllers, matching `MeetingController` / `CalendarEventsController`.

  **Reading the full file.** `TranscriptReader::read()` stays exactly as it is — it is the preview, and `KBMS_TRANSCRIPT_PREVIEW_BYTES` is its bound. The state ladder it walks (`Rejected` → `Broken` → `Unreadable`) is extracted into `TranscriptReader::verify(string $path): ?TranscriptState` (null when the path is usable), so the print view, the raw route and the preview cannot drift apart on what "readable" means. A new `TranscriptReader::readUnbounded(string $path): TranscriptContent|TranscriptState` runs the same verification and then reads the whole file (`truncated: false`, `bytesRead === totalBytes`). Both public methods delegate to one private read that takes an explicit byte limit or none — the fixed `fread($handle, $limit + 1)` truncation-detection trick stays on the bounded path only.

  **Resolving a surface for an occurrence.** `App\Transcripts\TranscriptExporter` answers "what, if anything, can leave the tool for this occurrence" for both transcript routes:

  - `pathFor(OccurrenceKey): string|TranscriptState` — persisted row only, then `verify()`. No row → `Missing`; tombstone row (`path === null`) → `Suppressed`; otherwise the verified absolute path. Deliberately does **not** fall back to convention candidates: the export actions are only offered from a `Linked` panel, which means a row exists, and a route that silently resolves a file the page never showed is a worse failure than a stated one.
  - `forOccurrence(OccurrenceKey): TranscriptExport|TranscriptState` — the above plus `readUnbounded()`, wrapped in a readonly `TranscriptExport{path, content}` with a `filename()` accessor for the print header.

  The note needs no such service: `MeetingNote::query()->forOccurrence(…)->first()` in the controller, and an absent row or a blank body is the note's own unavailable reason.

  **Print views.** A dedicated `resources/views/layouts/print.blade.php`: no sidebar, no `flux:header`, no breadcrumbs, no Livewire panels, no `app.js`. It loads `resources/css/app.css` through Vite for the `kb-md` typography and the `--kb-*` tokens, and it deliberately omits `@fluxAppearance` — the `dark` class is therefore never applied and the page renders light-on-white regardless of the app's theme when the export was triggered. A single inline `window.addEventListener('load', () => window.print())` opens the browser dialog; macOS *Save as PDF* does the rest.

  Three page views: `pages/print/note.blade.php`, `pages/print/transcript.blade.php`, `pages/print/unavailable.blade.php`. The first two open with `<x-meeting.print-header>` — meeting title, date and time, and for a transcript the source filename. This header is exactly the asymmetry FR-025 asks for against the verbatim clipboard payload; it is not a bug to reconcile. The header component carries its own simplified when-line rather than sharing the detail page's `kb-page-head` (which also renders todo glyphs, cancelled state and span labels) — the print header is a different, deliberately plainer artifact, and coupling them would drag page chrome onto paper.

  Body rendering repeats no logic: a note goes through `MarkdownRenderer`, and a transcript is echoed from `TranscriptContent::$rendered`, which is already `MarkdownRenderer` output for `.md` and `e()`-escaped text for `.txt`. The `.txt` branch keeps the monospace treatment the in-page preview uses. There is no second converter anywhere in this spec.

  **Unavailable is a stated page, not a blank one.** Every refusal renders `pages/print/unavailable.blade.php` in the print layout with the reason spelled out and **without** auto-invoking `window.print()`, at HTTP 404. The wording comes from the same vocabulary the panel already uses per state — missing, gone, not readable, rejected, suppressed, empty note — because `states.html` settled that these must not collapse into one message, and a PDF is exactly where a collapsed message does the most damage.

  **Copying as Markdown.** One Alpine behaviour, `resources/js/copy-export.js` (registered on `alpine:init` like `launch-shortcut.js`), two payload sources:

  - **Note** — `$wire.body`. The live editor value, which is what autosave persists; no round trip, no staleness window, and nothing prepended.
  - **Transcript** — `fetch()` of `meetings.transcript.source`, cached on the component after the first call. The file is not in component state and must not be: embedding an unbounded transcript in the DOM would ride along on every Livewire request payload.

  The write itself feature-detects: `navigator.clipboard?.writeText` when the browser exposes it, otherwise a hidden `<textarea>` + `document.execCommand('copy')`. On `http://personal-kbms.test` the fallback **is** the live path — `.test` over HTTP is not a secure context (only `localhost` and `127.0.0.1` are exempt), so `navigator.clipboard` is undefined there. The Clipboard API branch still exists and still runs wherever it is available; this is a fallback, not a replacement.

  `execCommand('copy')` requires transient user activation, so the transcript fetch happens inside the click handler and its result is cached: the common case resolves in single-digit milliseconds, far inside the activation window, and a rare expiry surfaces as a reported failure with the payload already cached, so the next click succeeds. A failed or rejected write sets an error state on the button — it never leaves a "Copied" confirmation on a clipboard that received nothing.

  **Where the actions live.** Notes panel: rendered when `trim($body) !== ''`, so the actions appear and disappear with the live editor content. Transcript panel: rendered only when `$state === TranscriptState::Linked` — `Broken`, `Unreadable`, `Rejected`, `Suppressed`, `Missing`, `Ambiguous` and `NotConfigured` offer nothing rather than offering something that fails. Print is an `<a target="_blank" rel="noopener">` styled as a Flux button, matching the external-link convention already asserted in tests.

  **What this spec does not do:** no combined meeting brief, no PDF package, no new `.env` key, no bound on the exported artifact, no consent machinery, and no change to what the in-page preview shows.

  ## Architecture & quality notes

  - **N+1 / query shape:** each print route runs one occurrence lookup (route binding) plus one note or transcript row lookup. No loops, no relations, no eager-load surface. The raw route streams with `response()->file()` rather than materialising the file in PHP memory.
  - **SOLID:** `TranscriptReader` keeps its single responsibility (turn a path into content-or-state); `TranscriptExporter` adds occurrence→surface resolution and owns nothing else; controllers stay thin and hold no domain rules.
  - **Security (Lars):** containment is re-verified at request time on every route, never trusted from the persisted row — `KBMS_TRANSCRIPTS_PATH` is a `.env` value that can move under a stored absolute path. The raw route serves `text/plain` with an explicit charset so a `.md` file can never be interpreted as HTML by the browser. No route accepts a path parameter: the only input is the occurrence route key.
  - **Privacy (Violet):** this is the first capability whose purpose is to move content off the machine. No machinery is added — disproportionate for a single-operator local tool — but the mockup README's current claim that "there is no export or share affordance anywhere, and that absence is intentional" becomes false the moment this ships and must be rewritten, not deleted, in TASK-08.
  - **Larastan level 5:** `TranscriptReader::verify()` returning `?TranscriptState` and the union returns on the exporter need accurate PHPDoc; `php artisan larapilot:quality` runs before every task commit.

  ## Git & Branching

  - Mode: `GITFLOW` (from `settings.git_mode`) — Gitflow **without** automatic push
  - Branch: `feature/US-017-share-note-transcript` from `develop`
  - TASK-00: bootstrap the branch and draft the internal PR description locally
  - Per task: exactly one Conventional Commit, `type(US-017): TASK-NN summary`; never batch two tasks into one commit
  - Push and remote PR: **skipped** — nothing leaves the machine unless the operator asks in-session
  - Merge to `develop` only after human `larapilot-review` approval

  ## Test Data Strategy

  - **No new model, migration, factory or seeder.** This spec adds routes, views, a stylesheet block, one JS module and two read-side classes; it touches no schema and no Eloquent attribute.
  - Existing `CalendarEventFactory`, `MeetingNoteFactory` and `MeetingTranscriptFactory` cover every fixture these tests need; `TranscriptPanelTest`'s temp-directory helpers (`configureDirectory()` / `seedFile()`) are the established pattern for on-disk transcript fixtures and are reused rather than reinvented.
  - One new fixture shape is required: a transcript **larger than `kbms.transcript_preview_bytes`**, written in the test by lowering the config bound rather than by committing a large file.
  - `php artisan migrate:fresh --seed` is unaffected; no seeder needs updating. Any task that turns out to need a schema change is out of this plan's scope and goes back through `larapilot-spec`.

  ## Test Strategy

  - Bar: `NORMAL` (from `settings.testing`) — PHPUnit feature and unit tests. **No** Playwright, Dusk, Pest browser, or viewport matrix.
  - Tests are class-based PHPUnit under `tests/Feature` and `tests/Unit`, created with `php artisan make:test --phpunit`, matching the existing suite.
  - **Unit (TASK-02):** `readUnbounded()` returns the whole file past the preview bound with `truncated === false`; `verify()` returns `Rejected` / `Broken` / `Unreadable` distinctly; `TranscriptExporter` maps no-row to `Missing` and a tombstone row to `Suppressed`.
  - **Feature (TASK-07):** each print route — 200 with header and body on the happy path; 404 with the **distinct** stated reason for empty note, no link, tombstone, deleted file, unreadable file, and escaped path; a file deleted *after* the row was written still yields the stated page (request-time verification); a transcript past the preview bound prints complete; the raw route returns the file byte-for-byte with `text/plain`; and — the highest-value assertion in this spec per the PRD — one occurrence of a recurring series never prints a sibling's note.
  - **Livewire (TASK-07):** the notes panel renders neither action with a blank body and both once a body exists; the transcript panel renders both actions only in `Linked` and none in `Broken` / `Unreadable` / `Rejected` / `Suppressed` / `Missing`.
  - Assert the **distinguishing strings**, not just status codes — the standing contract from the mockups' test section.
  - **Manual test handoff (Anne).** The clipboard path cannot be covered at this bar: `execCommand`, secure-context detection and transient user activation all live in the browser. Before review, on `http://personal-kbms.test`: copy a note and paste it back into the editor unchanged; copy a transcript larger than 2 MiB and check the tail arrived; confirm the transient "Copied" state and that a denied clipboard permission reports a failure instead of a confirmation; print both surfaces and check the header, the absence of app chrome, and legibility on white paper with the app in **dark** mode; keyboard-only pass over both new action pairs.
