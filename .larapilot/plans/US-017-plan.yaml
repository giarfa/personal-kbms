    id: TASK-08
    title: 'Document the export surface in the mockups and changelog'
    body: |-
      ## Description
      Record the new surface where the project records surfaces: the mockup README's visual contract and copy rules, and the changelog. The print view is a new visual surface, so `.ai/rules/views.md` makes this mandatory, not optional.

      ## Files Involved
      - .larapilot/mockups/kbms-app/README.md
      - CHANGELOG.md
      - README.md (only if a section turns out to be inaccurate)

      ## Steps
      1. Add the `kb-print*` vocabulary to the README's implementation mapping table: which class maps to which Blade view, that the print layout deliberately omits `@fluxAppearance` so paper is always light, and that `kb-md` is reused rather than restated.
      2. **Rewrite Violet's paragraph.** It currently reads "there is no export or share affordance anywhere, and that absence is intentional" — that statement stops being true when this ships. Replace it with the FR-025 position: export exists, deliberately per surface, and the household exemption now rests on the operator's judgement at the moment of sharing. Do not delete the paragraph; the reasoning still has to be on the record.
      3. Add the two export actions to Marika's copy notes — the exact button labels, the transient "Copied" wording, and the rule that a failed copy reports the failure rather than claiming success.
      4. Extend the README's test contract section with the manual clipboard/print pass from TASK-07.
      5. `CHANGELOG.md` → `## [Unreleased]` → `### Added`: one entry in the file's established voice covering both surfaces, the verbatim clipboard payload versus the headed printed document, the unbounded export, request-time verification, the `.test` secure-context fallback, and the deliberate absences — no PDF package, no combined meeting brief, no new `KBMS_*` key.
      6. Confirm `README.md` needs no change (no new `.env` key, no new command); update only if something is now inaccurate.

      ## Completion Criteria
      - [x] Mockup README documents the print surface and its `kb-*` vocabulary
      - [x] The "no export affordance" claim is corrected rather than dropped
      - [x] `CHANGELOG.md` Unreleased carries the feature in the file's existing style
      - [x] No new configuration key is introduced anywhere in the docs

      ## Test Data
      - N/A — documentation only

