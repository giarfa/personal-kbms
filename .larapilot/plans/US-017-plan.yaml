  -
    id: TASK-06
    title: 'Copy and print actions on the note and transcript panels'
    body: |-
      ## Description
      Wire the four actions onto the two panels: `Copy as Markdown` with a secure-context-aware clipboard path, and `Print / Save as PDF` opening the print view in a new tab.

      ## Files Involved
      - resources/js/copy-export.js (new)
      - resources/js/app.js
      - resources/views/livewire/meeting-notes.blade.php
      - resources/views/livewire/transcript-panel.blade.php

      ## Steps
      1. `copy-export.js`: register `Alpine.data('kbCopy', …)` on `alpine:init`, mirroring `launch-shortcut.js`'s structure and comment discipline. State machine `idle → copying → copied → idle` on a timer, plus an `error` state.
      2. Payload resolution by config: `source: 'wire'` reads `this.$wire.body` synchronously (the note — live editor value, nothing prepended, round-trips back into the editor unchanged); `source: 'url'` fetches `meetings.transcript.source` inside the click handler and caches the text on the component for subsequent clicks.
      3. Write path: use `navigator.clipboard.writeText` when `navigator.clipboard?.writeText` exists, otherwise a hidden `<textarea>` + `select()` + `document.execCommand('copy')`. Comment the reason inline: `http://personal-kbms.test` is not a secure context — only `localhost` and `127.0.0.1` are exempt — so `navigator.clipboard` is undefined there and the fallback is the live path on this origin. Keep the API branch: it is a fallback, not a replacement.
      4. Any rejection, exception, non-ok fetch, or `execCommand` returning false sets the error state and shows it in place. Never show "Copied" for a write that did not happen.
      5. Import the module from `resources/js/app.js`.
      6. Notes panel: inside `kb-panel__actions`, render `Copy as Markdown` (button, `kbCopy` with `source: 'wire'`) and `Print / Save as PDF` (`<a href="{{ route('meetings.note.print', …) }}" target="_blank" rel="noopener">` as a Flux button) **only when** `trim($body) !== ''`, so the pair appears and disappears with the live editor content.
      7. Transcript panel: the same pair, `source: 'url'`, rendered **only** when `$state === TranscriptState::Linked`. No action in `Missing`, `Ambiguous`, `Broken`, `Unreadable`, `Rejected`, `Suppressed` or `NotConfigured`.
      8. Both buttons carry accessible names and an `aria-live` region for the copied/failed state; keyboard reachable in the existing focus order. Do not disturb the existing transcript path-copy icon button.
      9. `npm run build`, then a manual pass on `http://personal-kbms.test`.

      ## Completion Criteria
      - [x] Both panels expose both actions in the states that permit them, and neither action in the states that do not
      - [x] Copy places the body verbatim on the clipboard — a note pasted back into the editor is unchanged
      - [x] A transcript past 2 MiB copies complete
      - [x] Copy succeeds on `http://personal-kbms.test` via the fallback, and still uses the Clipboard API where it exists
      - [x] A successful copy shows a transient "Copied" on the button it came from; a failed one reports the failure in place
      - [x] Print opens a new tab and the browser's print dialog
      - [x] Pint clean, Larastan level 5 clean, `npm run build` succeeds

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-017): TASK-06 add copy and print actions to the note and transcript panels`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
