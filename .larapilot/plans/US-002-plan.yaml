  -
    id: TASK-05
    title: 'Build the kbms:doctor command with per-check reporting and a gating exit code'
    body: |
      ## Description
      Replace nothing and add the operator-facing surface: `php artisan kbms:doctor` runs the suite, prints one clearly-marked line per check with the remediation hint on every non-passing result, and exits non-zero when any check does not pass — so the command is usable as a gate in a shell pipeline.

      ## Files Involved
      - app/Console/Commands/DoctorCommand.php
      - tests/Feature/DoctorCommandTest.php (smoke assertions only; TASK-06 owns full coverage)

      ## Steps
      1. `php artisan make:command DoctorCommand --no-interaction`, then match the existing command style in `app/Console/Commands/` — `#[Signature('kbms:doctor')]` and `#[Description('Check every environment assumption this product makes about the machine')]` attributes, `handle(): int`
      2. Inject `CheckSuite` via constructor property promotion; call `run()`
      3. Render each result with `$this->components->twoColumnDetail($label, $badge)` where the badge is `<fg=green>PASS</>`, `<fg=yellow>NOT CONFIGURED</>`, or `<fg=red>FAIL</>` — the yellow badge is what makes "unset" visually distinct from "configured but invalid"
      4. Under every non-passing line print the `detail` and then the `remediation` (indented, e.g. via `$this->components->bulletList`) so the operator sees both what was observed and what to change
      5. Print a closing summary line: `N passed, M failed` (counting `NotConfigured` among the failures)
      6. `return $suite->hasFailures($results) ? self::FAILURE : self::SUCCESS;`
      7. Smoke test: command runs, prints all six labels, and returns an int exit code
      8. `vendor/bin/pint --dirty --format agent` then `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `php artisan kbms:doctor` prints exactly one status line per registered check
      - [x] Every non-passing check prints its remediation hint naming the configuration key at fault
      - [x] `NOT CONFIGURED` renders distinctly from `FAIL`
      - [x] Exit code is `0` only when every check passes, non-zero otherwise
      - [x] `larapilot:quality` green

      ## Test Data
