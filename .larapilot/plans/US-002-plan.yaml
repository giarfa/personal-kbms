    id: TASK-02
    title: 'Implement the configuration and filesystem checks (timezone, transcripts, launcher)'
    body: |
      ## Description
      Implement the three checks that read `config/kbms.php` and the local filesystem. Each distinguishes an unset value (`NotConfigured`) from a configured-but-wrong value (`Failed`), and every non-passing result names the `KBMS_*` key at fault.

      ## Files Involved
      - app/Doctor/Checks/TimezoneCheck.php
      - app/Doctor/Checks/TranscriptsDirectoryCheck.php
      - app/Doctor/Checks/LauncherScriptCheck.php
      - app/Providers/AppServiceProvider.php
      - tests/Unit/Doctor/TimezoneCheckTest.php
      - tests/Unit/Doctor/TranscriptsDirectoryCheckTest.php
      - tests/Unit/Doctor/LauncherScriptCheckTest.php

      ## Steps
      1. `TimezoneCheck` — label `Timezone`. Read `config('kbms.timezone')`; empty → `NotConfigured` naming `KBMS_TIMEZONE`. Validate with `in_array($tz, timezone_identifiers_list(), true)`; invalid → `Failed` with hint "`KBMS_TIMEZONE` is not a valid IANA timezone identifier (e.g. `Europe/Rome`)". Pass detail states the resolved identifier.
      2. `TranscriptsDirectoryCheck` — label `Transcripts directory`. `config('kbms.transcripts_path')` null → `NotConfigured` naming `KBMS_TRANSCRIPTS_PATH`. Then `is_dir()` false → `Failed` ("path does not exist or is not a directory"); `is_readable()` false → `Failed` ("directory exists but is not readable by the web/CLI user — check permissions"). Pass detail states the absolute path.
      3. `LauncherScriptCheck` — label `Claude launcher script`. `config('kbms.claude_launcher')` null → `NotConfigured` naming `KBMS_CLAUDE_LAUNCHER`. Then `is_file()` false → `Failed` ("no file at the configured path"); **`is_executable()` false → `Failed` with the specific reason "the script exists but is not executable — run `chmod +x <path>`"**. The two failures must be separately reported, per the acceptance criteria.
      4. Register all three in the `CheckSuite` binding in `AppServiceProvider::register()`, in report order
      5. Write the three unit tests: for each, cover unset / invalid / valid, and assert on `CheckStatus` **and** on the `KBMS_*` key appearing in `remediation`. Filesystem tests use real temp directories from `sys_get_temp_dir()` created in `setUp()` and removed in `tearDown()` — `Storage::fake()` cannot model the executable bit. The not-executable case creates the file then `chmod($path, 0644)`.
      6. `php artisan test --compact --filter=Doctor`
      7. `vendor/bin/pint --dirty --format agent` then `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Three checks implement `EnvironmentCheck` with explicit return types
      - [x] Unset config yields `NotConfigured`; configured-but-invalid yields `Failed` — never conflated
      - [x] Every non-passing `remediation` names its `KBMS_*` key
      - [x] A launcher script that exists without the executable bit fails with that specific reason
      - [x] Unit tests pass; `larapilot:quality` green

      ## Test Data
      - N/A — no model or schema changes in this task; fixtures are per-test temp files

      ## Git Deliverables
