code: US-002
plan_body: |
  ## Technical Solution

  `php artisan kbms:doctor` verifies every assumption this product makes about the operator's machine and reports each one independently. The design goal is that check independence and the "not configured" vs "configured but invalid" distinction are **structural properties of the types**, not conventions the command has to remember.

  ### Components

  New namespace `App\Doctor` (no new base folder — `app/` already hosts `Support/`, `Jobs/`, `Console/`):

  | Class | Responsibility |
  | --- | --- |
  | `App\Doctor\EnvironmentCheck` (interface) | `label(): string` and `run(): CheckResult` — the seam every check implements |
  | `App\Doctor\CheckStatus` (enum) | `Pass`, `NotConfigured`, `Failed` — TitleCase keys per PHP conventions |
  | `App\Doctor\CheckResult` (readonly) | `status`, `detail` (what was observed), `remediation` (nullable; names the config key at fault) |
  | `App\Doctor\CheckSuite` | Ordered list of checks; runs each inside `try/catch (Throwable)` so one failure never aborts the rest; returns `array<string, CheckResult>` |
  | `App\Doctor\Checks\IcsFeedCheck` | Bounded-timeout HTTPS GET + iCalendar envelope validation |
  | `App\Doctor\Checks\TranscriptsDirectoryCheck` | Directory exists and is readable |
  | `App\Doctor\Checks\LauncherScriptCheck` | File exists **and** carries the executable bit |
  | `App\Doctor\Checks\QueueConnectionCheck` | Configured queue connection resolves and answers `size()` |
  | `App\Doctor\Checks\SchedulerRegistrationCheck` | `kbms:sync-calendar` is registered on the schedule |
  | `App\Doctor\Checks\TimezoneCheck` | `KBMS_TIMEZONE` is a valid timezone identifier |
  | `App\Console\Commands\DoctorCommand` | Renders one line per check; exit `0` / `1` |

  `CheckSuite` is bound in `AppServiceProvider::register()` with the ordered check list, so registration is one readable place and tests can swap individual checks.

  ### Three-state result, and why

  `CheckStatus::NotConfigured` exists because "you never set `KBMS_ICS_URL`" and "you set `KBMS_ICS_URL` and the feed returns 404" are different operator problems with different remedies. Both are **non-passing** and both contribute to a non-zero exit code — the command is a gate, and an unconfigured integration point is not a passing environment. The distinction is in the rendered label (`NOT CONFIGURED` vs `FAIL`) and in the remediation text.

  ### Check independence

  `CheckSuite::run()` wraps every `EnvironmentCheck::run()` in `try/catch (Throwable $e)` and converts an escaped exception into `CheckStatus::Failed` with the exception message as detail. An `IcsFeedCheck` that throws a connection exception, or a `QueueConnectionCheck` that hits a missing `jobs` table, therefore degrades to a failed line rather than a stack trace that kills the remaining checks. This is asserted directly in the test suite with a deliberately throwing stub check.

  ### ICS feed check — recorded decision

  Per the decision journal entry **"doctor ICS parse validation"** (2026-09-07): US-002 validates the iCalendar envelope **structurally**, with **no composer change**. `sabre/vobject` stays with US-003, the spec that owns ICS sync.

  Sequence:

  1. `kbms.ics_url` unset → `NotConfigured`, hint names `KBMS_ICS_URL`.
  2. `Http::connectTimeout(3)->timeout(5)->get($url)` — bounded, so the command can never hang. Connection/timeout exceptions are caught inside the check and reported as `Failed` with a timeout-specific hint.
  3. Non-2xx → `Failed`, hint carries the HTTP status.
  4. Body validation, in order, each with its own remediation text:
     - no `BEGIN:VCALENDAR` → "responded 200 but the body is not iCalendar (an HTML sign-in page is the usual cause)"
     - no `VERSION:` property → "iCalendar envelope is malformed"
     - no `BEGIN:VEVENT` → "feed parsed but contains no events — verify the subscription URL covers a calendar with entries"
     - no `END:VCALENDAR` → "the feed body is truncated"

  **Known trade-off (accepted by the operator):** a genuinely empty calendar fails check 4c. It is reported with its own hint rather than a generic parse error, so the reason is legible. When US-003 installs `sabre/vobject`, replace the body assertions with the real parser and reconsider whether "zero events" should stay a failure.

  ### Queue check under test

  `phpunit.xml` forces `QUEUE_CONNECTION=sync` so queued jobs run inline. `QueueConnectionCheck` therefore reads the **configured** connection at runtime rather than hardcoding `database`, and the test sets `queue.default` explicitly per scenario — mirroring how `QueueAndScheduleTest` already handles this asymmetry.

  ### Non-goals

  No new dependencies. No models, migrations, or schema. No `--json` output mode, no auto-remediation, no additional checks beyond the six the acceptance criteria name — the exit code is the machine-readable surface.

  ## Git & Branching

  - Mode: `GITFLOW` (from `settings.git_mode`) — Gitflow **without** automatic push
  - Branch: `feature/US-002-environment-doctor` from `develop`
  - TASK-00: bootstrap the branch and draft the internal PR description locally
  - Per task: exactly one Conventional Commit `type(US-002): TASK-NN summary` — never batch tasks
  - Push: **skip** — no `git push`, no remote PR, unless the operator asks in-session
  - `php artisan larapilot:quality` (Pint + Larastan level 5+) green before every `task-done`
  - Merge to `develop` only after human `/larapilot-review` approval

  ## Test Data Strategy

  - **N/A for factories and seeders** — this spec introduces no Eloquent model, migration, or schema change. `database/factories/` and `DatabaseSeeder` are untouched.
  - Test fixtures are created and torn down per test, not seeded:
    - **Filesystem:** real temporary directories under `sys_get_temp_dir()`, created in `setUp()` and removed in `tearDown()`. `Storage::fake()` is deliberately **not** used — it cannot model a missing executable bit, which is an explicit acceptance criterion.
    - **HTTP:** `Http::fake()` with inline iCalendar fixture strings (valid feed, HTML sign-in page, truncated body, event-free calendar, 404, connection exception).
  - No `migrate:fresh --seed` verification step is required for any task in this plan.

  ## Test Strategy

  - Bar: `NORMAL` (from `settings.testing`) — PHPUnit feature and unit tests. **No** Playwright, Dusk, Pest browser, or viewport matrix. This spec has no UI.
  - Style follows the existing suite: PHPUnit class tests with `public function test_snake_case(): void` methods, `Tests\TestCase`, `Http::fake()` / `Log::spy()` as already used in `QueueAndScheduleTest`.
  - **Interleaved, not deferred:** every check task (TASK-02 → TASK-04) ships its own targeted unit test in the same commit. TASK-06 then adds the command-level feature test the acceptance criteria mandate.
  - Coverage map:

  | Acceptance criterion | Covered by |
  | --- | --- |
  | Six checks report pass/fail independently | `DoctorCommandTest::test_all_checks_pass_...` + per-check unit tests |
  | Every failure names the config key at fault | Per-check unit tests assert `remediation` content |
  | Exit `0` all-pass / non-zero on any failure | `DoctorCommandTest` — `assertExitCode(0)` and `assertExitCode(1)` |
  | One failure does not abort the rest | `CheckSuiteTest` with a deliberately throwing stub check |
  | "not configured" ≠ "configured but invalid" | `CheckStatus` assertions in each config-backed check test |
  | ICS bounded timeout, never hangs | `IcsFeedCheckTest` asserts `Http::assertSent` timeout config + `ConnectionException` handling |
  | Launcher exists but not executable | `LauncherScriptCheckTest` — `chmod 0644` fixture |
  | ICS parses as iCalendar, not merely 200 | `IcsFeedCheckTest` — HTML-body-with-200 scenario |
  | Feature test: all-pass + each failure mode | `tests/Feature/DoctorCommandTest.php` |

  - Run: `php artisan test --compact --filter=Doctor` during implement; full `php artisan test` before the final task-done.
