    id: TASK-06
    title: 'Cover the doctor command: all-pass, every failure mode and the exit-code gate'
    body: |
      ## Description
      Add the feature test the acceptance criteria mandate: the all-pass path and each individual failure mode, with faked HTTP and a temporary filesystem, asserting both the rendered output and the exit code. Bar is `settings.testing: NORMAL` — PHPUnit feature tests only, no browser or E2E tooling.

      ## Files Involved
