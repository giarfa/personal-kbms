    id: TASK-03
    title: 'Implement the ICS feed reachability and iCalendar validation check'
    body: |
      ## Description
      Implement `IcsFeedCheck`: a bounded-timeout HTTPS GET of `KBMS_ICS_URL` that then validates the response body is genuinely iCalendar, not merely an HTTP 200. Per the decision journal entry **"doctor ICS parse validation"**, validation is structural — **do not add `sabre/vobject` or any other dependency in this task**; US-003 owns that.

      ## Files Involved
      - app/Doctor/Checks/IcsFeedCheck.php
      - app/Providers/AppServiceProvider.php
      - tests/Unit/Doctor/IcsFeedCheckTest.php

      ## Steps
      1. Label `ICS calendar feed`. `config('kbms.ics_url')` null → `NotConfigured` naming `KBMS_ICS_URL`.
      2. Request with an explicit bound so the command can never hang: `Http::connectTimeout(3)->timeout(5)->get($url)`. Wrap the call in `try/catch (\Illuminate\Http\Client\ConnectionException $e)` → `Failed` with hint "the feed at `KBMS_ICS_URL` did not respond within 5s — check the URL and network reachability". (`CheckSuite` also catches `Throwable`, but this check owns the timeout-specific message.)
      3. Non-2xx (`$response->successful()` false) → `Failed` with the status code in the detail and a hint naming `KBMS_ICS_URL` (mention that a 401/403 usually means the subscription URL requires its secret token).
      4. Validate the body in order, each with its own remediation string:
         - no `BEGIN:VCALENDAR` → "the feed responded 200 but the body is not iCalendar — an HTML sign-in page is the usual cause; re-copy the subscription URL into `KBMS_ICS_URL`"
         - no `VERSION:` → "the iCalendar envelope is malformed — `VERSION` is missing"
         - no `BEGIN:VEVENT` → "the feed parsed as iCalendar but contains no events — verify `KBMS_ICS_URL` points at a calendar with entries"
         - no `END:VCALENDAR` → "the feed body is truncated — `END:VCALENDAR` is missing"
      5. Pass detail reports the HTTP status and the `VEVENT` count.
      6. Register in the `CheckSuite` binding in `AppServiceProvider::register()`
      7. `IcsFeedCheckTest` with `Http::fake()`: valid feed; HTML page with 200; truncated body; calendar with zero `VEVENT`; 404; `ConnectionException`; unset URL. Assert `CheckStatus` and remediation text per scenario.
      8. `php artisan test --compact --filter=IcsFeedCheck`
      9. `vendor/bin/pint --dirty --format agent` then `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `composer.json` and `composer.lock` are **unchanged** by this task
      - [x] The request carries an explicit bounded timeout and a connection failure is reported, never thrown to the operator
      - [x] A 200 response with a non-iCalendar body **fails** the check
      - [x] Unset `KBMS_ICS_URL` yields `NotConfigured`, distinct from a reachable-but-invalid feed
      - [x] Unit tests cover all seven scenarios; `larapilot:quality` green

      ## Test Data
      - N/A — no model or schema changes; iCalendar fixtures are inline strings in the test

      ## Git Deliverables
      - Commit: `feat(US-002): TASK-03 add the ICS feed reachability and iCalendar validation check`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
