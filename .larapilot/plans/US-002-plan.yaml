    id: TASK-01
    title: 'Define the doctor check contract, result type and suite'
    body: |
      ## Description
      Introduce the `App\Doctor` seam every check plugs into: the `EnvironmentCheck` interface, the three-state `CheckStatus` enum, the `CheckResult` value object, and the `CheckSuite` that runs checks independently. No individual check is implemented here — this task is the contract plus the exception-isolation guarantee.

      ## Files Involved
      - app/Doctor/EnvironmentCheck.php
      - app/Doctor/CheckStatus.php
      - app/Doctor/CheckResult.php
      - app/Doctor/CheckSuite.php
      - app/Providers/AppServiceProvider.php
      - tests/Unit/Doctor/CheckSuiteTest.php

      ## Steps
      1. `php artisan make:interface Doctor/EnvironmentCheck --no-interaction` (or `make:class`) — methods `label(): string` and `run(): CheckResult`
      2. `php artisan make:enum Doctor/CheckStatus --no-interaction` — cases `Pass`, `NotConfigured`, `Failed` (TitleCase keys); add `isPassing(): bool` returning `true` only for `Pass`
      3. `App\Doctor\CheckResult` — `final readonly` class with promoted constructor properties `CheckStatus $status`, `string $detail`, `?string $remediation = null`; named constructors `pass(string $detail)`, `notConfigured(string $detail, string $remediation)`, `failed(string $detail, string $remediation)`
      4. `App\Doctor\CheckSuite` — constructor promotes `private array $checks` with PHPDoc `@param list<EnvironmentCheck> $checks`; `run(): array` (PHPDoc `@return array<string, CheckResult>` keyed by `label()`) wraps every `EnvironmentCheck::run()` in `try/catch (\Throwable $e)` and converts an escaped exception into `CheckResult::failed($e->getMessage(), ...)`; add `hasFailures(array $results): bool`
      5. Bind `CheckSuite` in `AppServiceProvider::register()` with the ordered check list (empty array for now; TASK-02 → TASK-04 append their checks as they land)
      6. `vendor/bin/pint --dirty --format agent` then `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `EnvironmentCheck`, `CheckStatus`, `CheckResult`, `CheckSuite` exist with explicit return types and parameter type hints
      - [x] `CheckSuite::run()` catches `Throwable` per check — a throwing check yields a `Failed` result and the remaining checks still run
      - [x] `CheckSuiteTest` proves independence with a deliberately throwing stub check plus a passing one
      - [x] `larapilot:quality` green (Pint + Larastan level 5+)

      ## Test Data
