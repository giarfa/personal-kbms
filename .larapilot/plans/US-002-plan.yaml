    id: TASK-04
    title: 'Implement the queue connection and scheduler registration checks'
    body: |
      ## Description
      Implement the two runtime checks: the configured queue connection is reachable, and `kbms:sync-calendar` is actually registered on the scheduler. Both are assumptions US-001 wired up and that silently rot when a driver or a schedule entry changes.

      ## Files Involved
      - app/Doctor/Checks/QueueConnectionCheck.php
      - app/Doctor/Checks/SchedulerRegistrationCheck.php
      - app/Providers/AppServiceProvider.php
      - tests/Unit/Doctor/QueueConnectionCheckTest.php
      - tests/Unit/Doctor/SchedulerRegistrationCheckTest.php

      ## Steps
      1. `QueueConnectionCheck` — label `Queue connection`. Read the **configured** connection name (`config('queue.default')`) rather than hardcoding `database`; `phpunit.xml` forces `sync`, so the check must reflect runtime config the way `QueueAndScheduleTest` already does. Resolve `Queue::connection($name)` and call `->size()` inside `try/catch (\Throwable $e)` → `Failed` with a hint naming `QUEUE_CONNECTION` and, for the `database` driver, pointing at `php artisan migrate` when the `jobs` table is missing. Pass detail reports the driver and pending job count, and notes that a reachable queue is not the same as a *running* worker (`php artisan queue:work`).
      2. `SchedulerRegistrationCheck` — label `Calendar sync schedule`. Resolve `Illuminate\Console\Scheduling\Schedule` from the container, search `events()` for a command containing `kbms:sync-calendar`. Absent → `Failed` with hint "`kbms:sync-calendar` is not registered — check `routes/console.php`". Present → `Pass` reporting the cron expression, sourced from `KBMS_ICS_SYNC_MINUTES`.
      3. Register both in the `CheckSuite` binding in `AppServiceProvider::register()` — the suite's check list is now complete (six checks, report order: ICS feed, transcripts, launcher, queue, schedule, timezone)
      4. Unit tests: queue check passing on a reachable connection and failing when `Queue::connection()` throws; scheduler check passing against the real registered event and failing when the schedule is emptied
      5. `php artisan test --compact --filter=Doctor`
      6. `vendor/bin/pint --dirty --format agent` then `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Queue check reads the configured connection at runtime and never hardcodes a driver
      - [x] An unreachable queue is reported as a failure with a remediation hint, not an uncaught exception
      - [x] Scheduler check detects both the registered and the missing `kbms:sync-calendar` entry
      - [x] All six checks are registered in `AppServiceProvider` in report order
      - [x] Unit tests pass; `larapilot:quality` green

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-002): TASK-04 add the queue connection and scheduler registration checks`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
