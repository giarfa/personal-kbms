    id: TASK-06
    title: 'Show status on the meeting detail page without hiding the raw summary'
    body: |
      ## Description
      The detail page is the one surface where both truths have to coexist: the parsed status, and the feed summary exactly as it arrived (FR-004).

      ## Files Involved
      - resources/views/pages/meeting.blade.php

      ## Steps
      1. Page `<title>` and breadcrumb: use `$row->displayTitle`, so a browser tab does not read `[] Call the vendor`.
      2. `<h1>`: render the glyph, then `$row->displayTitle`, then a visible status tag — `To do`, `Done`, or `Overdue` — using the existing `.kb-tag` idiom with a todo modifier. Add the same `.kb-sronly` status wording so the heading's accessible name carries it too.
      3. **Leave `resources/views/components/meeting/mirror-panel.blade.php` completely untouched.** Its `<h2>{{ $event->summary }}</h2>` already renders the raw feed summary verbatim, marker and all, inside the `Mirrored from the feed · read-only` surface — which is exactly what the acceptance criterion asks for. Do not add a duplicate `Summary` row: the point is that the raw value is visible among the mirrored fields, and it already is.
      4. Record that reasoning in the commit body, so a later reader does not "fix" the apparent inconsistency between a stripped `<h1>` and a raw `<h2>` — the difference is the deliverable.
      5. Do not colour the detail page: US-012's rule colour stays excluded there, and `AgendaRow`'s `$colourRule` default keeps it that way.
      6. `php artisan larapilot:quality`; `php artisan test --compact --filter=MeetingDetail`

      ## Completion Criteria
      - [ ] The heading shows glyph, stripped title and a visible status tag
      - [ ] The mirror panel still shows the raw summary verbatim, including the marker
      - [ ] Page title and breadcrumb use the stripped title
      - [ ] The detail page carries no rule colour
      - [ ] A non-todo meeting's detail page is unchanged
      - [ ] Existing detail tests pass; Pint and Larastan clean

      ## Test Data
      - N/A — no model or schema changes in this task

