code: US-013
plan_body: |
  ## Technical Solution

  A read-time parse of the mirrored `summary`, folded against `ends_at` and the current clock. **No migration, no column, no write-back, no change to `kbms:sync-calendar`** — the mirror stays a mirror and Outlook stays the only mutation surface.

  **Two small types.**

  - `TodoState` — a backed enum with `Open` and `Done`, and nothing else. It is what the *title* says.
  - `MeetingTodo` — a `final readonly` value object carrying `TodoState $state`, `string $displayTitle`, and `bool $isOverdue`, built by `MeetingTodo::for(CalendarEvent): ?self`. Returns `null` when the summary is not a todo, which is the single source of "renders exactly as it does today".

  **Parsing — anchored, tolerant, hardcoded.** The marker is recognised only at the very start, with leading whitespace forgiven: `/^\s*\[(?:\s*|x|X)\]\s*/`. The alternation sits *inside* the brackets so it must consume everything up to `]` — which is what makes `[ x ]` an ordinary title rather than a sloppy todo. `[]` and `[ ]` (one or more spaces) are open; `[x]` and `[X]` are done. `Review [x] doc` and `Sprint [] planning` are ordinary meetings, because the marker is not at position zero. The vocabulary is hardcoded: **no configuration key and no `KBMS_*` env var**, per the recorded decision (`calendar todo marker parsing strictness`).

  `displayTitle` is the summary with the marker and the whitespace after it removed. A summary that is *only* a marker strips to nothing, so `displayTitle` falls back to `__('Untitled')` rather than producing a blank row or a blank event body — the acceptance criterion names this case, and the application has no prior empty-title treatment to inherit. The raw `summary` is never mutated in storage and is still rendered verbatim in the meeting detail page's mirror panel.

  A `null` summary parses to "not a todo" and raises nothing, on every surface.

  **Time — re-derived, never captured.** `MeetingTodo::for()` compares `ends_at` against `CarbonImmutable::now(config('kbms.timezone'))` **on every call**, and it is called once per row per render. That is the whole mechanism behind "an open item crosses into overdue on the next self-refresh (US-011) with no operator action": there is no cached timestamp to go stale. An occurrence is overdue when it is **open**, its `ends_at` is strictly in the past, and it is **not cancelled**. A **done** item is never overdue however old. An **all-day** item's `ends_at` is the exclusive midnight boundary, so it becomes overdue once its day has ended rather than reading as late all day — that falls out of the same comparison, with no special case. **Cancelled wins over late**, by an explicit guard rather than by CSS.

  **Where it is computed.** Inside `AgendaRow`'s constructor, from the event it already holds. This is deliberately the mirror image of US-012: there, an optional constructor argument defaulting to `null` was what *excluded* the detail page; here, computing it unconditionally in the constructor is what *includes* all three surfaces, since `MeetingController` builds an `AgendaRow` too. `AgendaRow` also gains a `displayTitle` property so no view has to remember to strip the marker itself. `CalendarEventPayload::from()` calls `MeetingTodo::for()` on the same terms.

  **Rendering — a third channel that consumes neither of the other two.** The channel contract from US-012 is extended, not renegotiated:

  | Channel | Owns |
  | --- | --- |
  | Rule colour (FR-023) | the event/row `background` fill |
  | Coverage (FR-002) | edge borders, the dot/square marks, the agenda tags |
  | **Todo (FR-024)** | **a checkbox glyph, the title's weight and strike, and `color` on the glyph and status tag only** |
  | Cancelled | dashed border, transparent fill, strike, muted — and wins over late |

  Todo never sets a `background`, so a rule fill survives underneath it, and it colours only its own glyph and tag rather than the whole chip, so it does not fight the rule colour's `color` on a calendar chip. An overdue, rule-coloured, annotated occurrence therefore renders all three at once, which is an acceptance criterion and is tested as one.

  **Glyphs, shape-first.** `☐` for open, `☑` for done, and `☐ !` for overdue — overdue is distinguished by an added shape, not only by the alert colour, so the AC's "never signalled by colour alone" holds for a reader who cannot see the treatment *and* for one who cannot distinguish the hue. Glyphs are `aria-hidden` decoration on the agenda and CSS `::before` content on the calendar chip; the authoritative wording rides the accessible name in both cases. An occurrence that is not a todo renders **no glyph and no reserved gutter**, so existing layout does not shift.

  **The overdue token.** The spec forbids an alert treatment that collides with a configured rule colour, so overdue gets its **own** token — `--kb-todo-overdue` at hue `40`, sitting clear of `--kb-danger` (`25`, cancelled and failure), `--kb-warn` (`70`/`80`, stale), and both shipped rule defaults (`yellow` `90`, `purple` `320`). Same inherited lightness pairs as every other `--kb-*` token, so AA carries over by construction. Done items use `--muted-foreground` and a strike, so they recede.

  **Accessible names.** The status wording — "to do", "done", or "to do, overdue" — is appended alongside the coverage words and the FR-023 rule label already there: on the calendar through `CalendarEventPayload::accessibleName()`, on the agenda through a `.kb-sronly` span beside the existing rule-label span.

  **Legends.** Both scanning pages gain open / done / overdue entries beside the coverage and rule-colour entries already present.

  **Performance.** Parsing reads `summary`, `ends_at` and `cancelled_at`, all already hydrated by `AgendaQuery` and `CalendarFeedQuery`. No per-occurrence query is added — proven with `DB::listen`, the same way US-012 proved it, not asserted in prose.

  ## Git & Branching
  - Mode: `GITFLOW` (from `settings.git_mode`)
  - Branch: `feature/US-013-calendar-as-todo` from `develop`
  - TASK-00: bootstrap the branch and prepare the internal PR description locally
  - Per task: one Conventional Commit `type(US-013): TASK-NN summary`; **no push**, no remote PR
  - Merge into `develop` after the review gate

  ## Test Data Strategy
  - **No new database column, migration, index, model, factory or seeder** — that is an explicit out-of-scope item, and the absence is itself part of the deliverable.
  - Tests reuse `CalendarEventFactory` (`at()`, `allDay()`, `cancelled()`, `spanning()`), setting `summary` and `location` explicitly. `location` must be set on every fixture for the same reason as US-012: the factory's 50/50 null would otherwise let the shipped "location is empty" colour rule decide an unrelated assertion.
  - `migrate:fresh --seed` unaffected.

  ## Test Strategy
  - Bar: `NORMAL` (from `settings.testing`) — PHPUnit feature and unit tests. **No** Playwright, Dusk, Pest browser, or viewport matrix.
  - **Unit** (`tests/Unit/Meetings/MeetingTodoTest.php`): the full accepted marker set and its boundaries (`[]`, `[ ]`, `[   ]`, `[x]`, `[X]`, `[x]Call` with no space); rejection of a mid-title marker, `[ x ]`, `[y]`, and a bare `[`; leading-whitespace tolerance; marker stripping including the whitespace after it; the marker-only summary falling back to `Untitled`; a `null` summary; the overdue boundary at exactly `ends_at` (strictly past, so equality is **not** overdue); done never overdue however old; all-day overdue only once its day has ended, and **not** during it; cancelled never overdue; and "now" re-derived — the same event returning not-overdue then overdue as `Carbon::setTestNow()` advances, with no new object.
  - **Feature** — agenda, calendar feed, and meeting detail: glyph and stripped title on each surface; all three views on the calendar; done muted and struck; overdue alert treatment; the three-channel case (overdue + rule-coloured + annotated) rendering all three; a non-todo unchanged; the detail page showing status **and** the raw summary verbatim in the mirror panel; legends carrying the three states; accessible names carrying the status wording alongside coverage and rule label.
  - **Self-refresh integration**: an open item rendered before its end time, then `$refresh`ed after the clock passes it, must come back overdue — the US-011 seam, asserted end to end.
  - **Query count**: `DB::listen` equality across a dense window with and without todo-marked summaries, on both surfaces.
  - Visual confirmation (both themes, glyph legibility, overdue distinguishable from cancelled) goes to a manual handoff at `.larapilot/docs/test-results/US-013-manual.md`.
  - `larapilot:quality` before each backend `task-done`; `npm run build` after CSS changes.
