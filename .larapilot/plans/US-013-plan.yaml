    id: TASK-03
    title: 'Todo treatments: glyphs, the overdue token, and the third channel'
    body: |
      ## Description
      Style the three states without letting them touch the fill or the borders the other two channels own.

      ## Files Involved
      - resources/css/app.css

      ## Steps
      1. Add `--kb-todo-overdue` and `--kb-todo-overdue-bg` at hue `40`, on the same inherited lightness pairs as every other `--kb-*` token (`0.45`/`0.955` light, `0.80`/`0.28` dark). Comment why hue 40: the spec forbids an alert treatment that collides with a configured rule colour, and 40 sits clear of `--kb-danger` (`25`), `--kb-warn` (`70`/`80`), and both shipped rule defaults (`yellow` `90`, `purple` `320`).
      2. Agenda glyph — `.kb-todo` inline span: monospace box, `aria-hidden` in the markup, `flex-shrink: 0`. Modifiers `--open`, `--done`, `--overdue`.
      3. Agenda states — `.kb-row--todo-done .kb-row__title { color: var(--muted-foreground); text-decoration: line-through; }` and `.kb-row--todo-overdue .kb-row__title { color: var(--kb-todo-overdue); font-weight: 600; }`. Open stays at normal weight and is styled only by its glyph.
      4. Calendar glyphs — `.kb-cal .fc-event.kb-ev--todo-open .fc-event-title::before { content: '☐ '; }`, `--todo-done` `'☑ '`, `--todo-overdue` `'☐ ! '`. Generated content is presentational, and the chip's `aria-label` replaces the whole subtree name, so the wording is never doubled up.
      5. Calendar states — done: muted `color` and `line-through` on `.fc-event-title` only; overdue: `color: var(--kb-todo-overdue)` and `font-weight: 600` on `.fc-event-title` only.
      6. **Scope every todo rule to the glyph or to `.fc-event-title` / `.kb-row__title` — never to the chip or row itself.** That is what keeps the US-012 rule fill (`background`, and `color` at chip level) intact underneath. Do not add a `background` to any todo rule.
      7. Add a `.kb-todo-legend` swatch style reusing the existing legend idiom.
      8. `npm run build`; check `/` and `/calendar` in both themes, and confirm an overdue rule-coloured annotated event still shows all three signals.

      ## Completion Criteria
      - [x] `--kb-todo-overdue` defined in both themes, colliding with no rule-palette token
      - [x] Glyphs render on both surfaces in all three views
      - [x] No todo rule sets `background`, and none targets the chip or row element itself
      - [x] Done reads muted and struck; overdue reads in the alert treatment; open reads at normal weight
      - [x] `npm run build` succeeds

      ## Test Data
      - N/A — stylesheet only

      ## Git Deliverables
      - Commit: `feat(US-013): TASK-03 add todo glyphs, the overdue token and its treatments`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
