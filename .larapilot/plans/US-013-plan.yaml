    title: 'Document the todo convention in README and CHANGELOG'
    body: |
      ## Description
      The convention is typed into Outlook, not into this application, so the README is the only place it can be written down.

      ## Files Involved
      - README.md
      - CHANGELOG.md

      ## Steps
      1. README: a `## Calendar as todo` section covering — the accepted markers (`[]`, `[ ]`, `[x]`, `[X]`), that they are recognised **only** at the start with leading whitespace forgiven, and that a marker elsewhere is ordinary text; that the marker is stripped from the display while the raw summary stays visible on the detail page.
      2. README: what **overdue** means (open **and** past `ends_at`), that done is never overdue, that cancelled wins over late, and that all-day items turn overdue only once their day has ended.
      3. README: that status is **derived at read time** — no column, no migration, no write-back — and that status changes happen in Outlook, because this product cannot write to the calendar (FR-021).
      4. README: that the marker vocabulary is hardcoded, with **no `KBMS_*` key and no configuration**, so nobody goes looking for one.
      5. README: that todo is a third independent channel alongside coverage and rule colour, and that there is deliberately no filtering, no overdue badge, no pinned strip, and no notification of any kind.
      6. CHANGELOG: entry under `Unreleased` → `Added`, referencing US-013 and FR-024.
      7. Additive edits only.

      ## Completion Criteria
      - [ ] README documents the marker set, the anchoring rule, overdue semantics, the read-only derivation, and the absence of configuration
      - [ ] The deliberate omissions (no filtering, no badge, no notification, no write-back) are stated
