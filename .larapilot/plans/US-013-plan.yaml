    id: TASK-07
    title: 'Feature-test the three surfaces, the channels, the self-refresh seam and the query count'
    body: |
      ## Description
      Cover the rendered contract everywhere it lands, plus the two integration promises that only show up across seams.

      ## Files Involved
      - tests/Feature/TodoRenderingTest.php (new)
      - .larapilot/docs/test-results/US-013-manual.md (new)

      ## Steps
      1. `php artisan make:test --phpunit TodoRenderingTest`. Set `location` explicitly on every fixture, for the same reason as US-012.
      2. **Agenda:** `[] Call the vendor` renders the open glyph and the stripped title; `[x] …` renders done, muted and struck (assert the class); an open item past its end renders overdue; `Review [x] doc` renders as an ordinary meeting with no glyph and no todo class; a marker-only summary renders `Untitled` rather than a blank row.
      3. **Calendar feed:** the same matrix on the JSON payload — `title`, `classNames`, and `accessibleName`.
      4. **All three views:** assert the overdue class is present in the month, week and day windows.
      5. **Detail page:** the heading shows the stripped title and the status tag; the mirror panel still contains the raw `[] Call the vendor` verbatim.
      6. **Three channels at once:** `[] PING sync` with notes and no location must render, simultaneously and each identifiably — the overdue todo treatment, the FR-023 rule colour class, and the FR-002 coverage tag/marks. Assert all three on both surfaces, and assert the accessible name carries coverage words, rule label **and** status wording.
      7. **Cancelled wins:** a cancelled, long-past `[] …` occurrence keeps its cancelled treatment and is **not** overdue.
      8. **All-day:** an open all-day item is not overdue during its day and is once it has ended.
      9. **US-011 seam:** render the agenda with an open item before its end time, advance `Carbon::setTestNow()` past it, `->call('$refresh')`, and assert the row comes back overdue — no reload, no new mount.
      10. **Query count:** `DB::listen` equality across a dense window of todo-marked and ordinary summaries, on both surfaces.
      11. `.larapilot/docs/test-results/US-013-manual.md`: the visual half — glyphs legible at agenda and chip sizes in both themes; overdue clearly distinguishable from cancelled, from the note teal and from the transcript indigo; done receding without becoming unreadable; all three channels legible together; no layout shift on rows that are not todos; and the overdue flip observed live on a page left open across an item's end time.
      12. `php artisan test --compact` (full suite); `php artisan larapilot:quality`

