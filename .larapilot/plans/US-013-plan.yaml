    id: TASK-04
    title: 'Render todo status on the agenda'
    body: |
      ## Description
      Carry the parsed status onto agenda rows, strip the marker from the displayed title, and extend the legend.

      ## Files Involved
      - app/Meetings/AgendaRow.php
      - app/Livewire/Agenda.php
      - resources/views/livewire/agenda.blade.php

      ## Steps
      1. `AgendaRow`: compute `public MeetingTodo|null $todo` and `public string $displayTitle` in the constructor from the event it already holds. `displayTitle` is `$todo?->displayTitle ?? (string) $event->summary`. Docblock the contrast with US-012's colour rule: colouring is passed **in** so the detail page can opt out, todo is computed **here** so all three surfaces — including `MeetingController`'s row — get it automatically.
      2. `Agenda::render()`: nothing new to pass; the legend states are static, unlike the config-generated colour legend.
      3. Blade: render the glyph before the title when `$row->todo` is set — `<span class="kb-todo kb-todo--{state}" aria-hidden="true">` with `☐`, `☑`, or `☐ !`.
      4. Blade: use `$row->displayTitle` in `.kb-row__title` instead of `$row->event->summary`.
      5. Blade: add `kb-row--todo-open` / `--todo-done` / `--todo-overdue` to the row class list, beside the existing cancelled, now and colour classes.
      6. Blade: add a `.kb-sronly` span carrying the status wording — `To do`, `Done`, or `To do, overdue` — beside the existing rule-label span, so the accessible name carries coverage, rule label **and** status.
      7. Blade: extend the legend with the three todo states and their glyphs.
      8. A non-todo row must render **byte-identically** to before: no glyph, no reserved gutter, no class.
      9. `php artisan larapilot:quality`; `php artisan test --compact --filter=Agenda`

      ## Completion Criteria
      - [ ] Glyph and stripped title render for each state
      - [ ] A non-todo row is unchanged, with no layout shift
      - [ ] Status wording is in the accessible name alongside coverage and the rule label
      - [ ] Coverage tags and rule colour still render on a todo row
      - [ ] Legend carries open, done and overdue
      - [ ] Existing agenda tests pass; Pint and Larastan clean

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-013): TASK-04 render todo status on the agenda`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
