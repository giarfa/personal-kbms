    id: TASK-05
    title: 'Render todo status on the calendar'
    body: |
      ## Description
      Put the stripped title, the state class and the status wording into the FullCalendar payload, and extend the calendar legend.

      ## Files Involved
      - app/Meetings/CalendarEventPayload.php
      - resources/views/pages/calendar.blade.php

      ## Steps
      1. `CalendarEventPayload::from()`: call `MeetingTodo::for($event)`; set `title` to the todo's `displayTitle` when present (falling back to the raw summary otherwise), append `kb-ev--todo-{state}` to `classNames`, and append the status wording to `accessibleName` after the coverage words and the rule label but **before** the `cancelled` suffix.
      2. Add a `?string $todoStatus` property so the state is inspectable in tests and in `extendedProps`; extend the `toArray()` array-shape PHPDoc.
      3. Overdue takes the `kb-ev--todo-overdue` class in place of `--todo-open`, not in addition, so the glyph is chosen by one class.
      4. No change to `resources/js/calendar.js`: the class arrives through FullCalendar's own `classNames`, the glyph is CSS `::before`, and `eventDidMount` already writes `accessibleName`. Verify this rather than assuming it.
      5. `resources/views/pages/calendar.blade.php`: extend the legend with the three todo states beside the coverage and rule-colour entries.
      6. `php artisan larapilot:quality`; `php artisan test --compact --filter=Calendar`; `npm run build` and check month, week and day.

      ## Completion Criteria
      - [ ] Glyph and stripped title render in month, week **and** day views
      - [ ] The accessible name carries coverage, rule label and status, in that order, with `cancelled` last
      - [ ] A coloured, annotated, overdue event shows all three channels at once
      - [ ] Cancelled styling still wins and a cancelled occurrence is never overdue
      - [ ] `calendar.js` needed no change
      - [ ] Existing calendar tests pass; Pint and Larastan clean; build clean

      ## Test Data
