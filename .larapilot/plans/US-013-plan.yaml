    id: TASK-02
    title: 'Unit-test parsing and the overdue boundary'
    body: |
      ## Description
      Pin the marker vocabulary and the time comparison before anything renders them.

      ## Files Involved
      - tests/Unit/Meetings/MeetingTodoTest.php (new)

      ## Steps
      1. `php artisan make:test --phpunit --unit MeetingTodoTest`, moved under `tests/Unit/Meetings/`.
      2. Use the `Carbon::setTestNow()` setUp/tearDown pattern from the existing tests, and `CalendarEventFactory` with explicit `summary` / `location`.
      3. Accepted markers: `[] Call the vendor`, `[ ] Call the vendor`, `[   ] Call the vendor`, `  [ ] Call the vendor`, `[x]Call the vendor` (no space), `[X] Call the vendor`.
      4. Rejected: `Review [x] doc`, `Sprint [] planning`, `[ x ] Call`, `[y] Call`, `[ Call`, `Call []`.
      5. Stripping: every accepted form yields `Call the vendor`; the raw `summary` on the model is unchanged after parsing.
      6. Marker-only: `[]` and `[x]` yield their state plus the `Untitled` fallback, never an empty string.
      7. `null` summary → `null`, no error.
      8. Overdue boundary: an open item whose `ends_at` is exactly now is **not** overdue; one second later it is. Assert both sides.
      9. A done item ten days past its end is **not** overdue.
      10. All-day: an open all-day item is **not** overdue during its own day, and **is** overdue once the day has ended (its exclusive `ends_at` midnight has passed).
      11. Cancelled: an open, long-past, cancelled occurrence is **not** overdue — cancelled wins over late.
      12. Re-derivation: build the event, assert not overdue, advance `Carbon::setTestNow()` past `ends_at`, call `MeetingTodo::for()` again on the **same** event, assert overdue. This is the US-011 seam.
      13. `php artisan test --compact --filter=MeetingTodoTest`

      ## Completion Criteria
      - [x] Every bullet above is a named test and passes
      - [x] Pint and Larastan clean

      ## Test Data
      - N/A — reuses `CalendarEventFactory` with explicit overrides

      ## Git Deliverables
      - Commit: `test(US-013): TASK-02 cover todo parsing and the overdue boundary`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
