    id: TASK-01
    title: 'Todo parsing and time-aware status'
    body: |
      ## Description
      Add the read-time parse and the overdue derivation. Nothing renders yet.

      ## Files Involved
      - app/Meetings/TodoState.php (new)
      - app/Meetings/MeetingTodo.php (new)

      ## Steps
      1. `TodoState: string` — `Open`, `Done` (TitleCase keys). This is what the *title* says, before time is considered.
      2. `MeetingTodo` — `final readonly`, promoted constructor (`TodoState $state`, `string $displayTitle`, `bool $isOverdue`), plus `public static function for(CalendarEvent $event): ?self`.
      3. Parsing, in `for()`: match `/^\s*\[(?:\s*|x|X)\]\s*/` against `$event->summary`. Return `null` on no match, on a `null` summary, and on a marker that is not at position zero. Document why the alternation lives **inside** the brackets: it must consume everything up to `]`, which is what makes `[ x ]` an ordinary title rather than a sloppy todo.
      4. `displayTitle` = the summary with the matched prefix removed. When that leaves an empty string, fall back to `__('Untitled')` — the acceptance criterion forbids a blank row or a blank event body, and the application has no prior empty-title treatment. Never mutate `$event->summary`.
      5. Overdue: `state === Open && $event->cancelled_at === null && $event->ends_at < CarbonImmutable::now(config('kbms.timezone'))`. Strictly past, so an occurrence sitting exactly on its end time is **not** yet overdue.
      6. Docblock the two rules that are easiest to break later: **cancelled wins over late** (guarded here, not in CSS), and **now is re-derived on every call** — there is no cached timestamp, which is what lets an item cross into overdue on a US-011 self-refresh.
      7. Note in the docblock that all-day needs no special case: `ends_at` is the exclusive midnight boundary, so the same comparison makes an all-day item overdue once its day has ended rather than during it.
      8. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Only `[]`, `[ ]` (one or more spaces), `[x]`, `[X]` are accepted, only at the start, with leading whitespace forgiven
      - [x] A mid-title marker, `[ x ]`, `[y]` and a bare `[` are all ordinary titles
      - [x] `displayTitle` strips the marker and the whitespace after it; a marker-only summary yields `Untitled`
      - [x] A `null` summary returns `null` and raises nothing
      - [x] Overdue is open **and** strictly past **and** not cancelled; done is never overdue
      - [x] No configuration key and no `KBMS_*` env var added
      - [x] No migration, column, model, factory or seeder touched
      - [x] Pint and Larastan (level 5) clean

      ## Test Data
      - N/A — no model or schema changes in this task, by design

      ## Git Deliverables
      - Commit: `feat(US-013): TASK-01 parse todo markers and derive time-aware status`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
