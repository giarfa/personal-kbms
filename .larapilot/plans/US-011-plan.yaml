    id: TASK-04
    title: 'Cover the agenda refresh and write the manual test handoff'
    body: |
      ## Description
      Prove the server-side half of the self-refresh contract with PHPUnit, and hand the browser-only half to the operator as explicit manual steps.

      ## Files Involved
      - tests/Feature/AgendaSelfRefreshTest.php (new)
      - .larapilot/docs/test-results/US-011-manual.md (new)

      ## Steps
      1. `php artisan make:test --phpunit AgendaSelfRefreshTest`
      2. Reuse the `Carbon::setTestNow()` setUp/tearDown pattern and `CalendarEventFactory::at()` from `AgendaPageTest` — do not duplicate factory definitions.
      3. Cover, through `Livewire::test(Agenda::class)` and `->call('$refresh')` (the exact path the tick triggers):
         - a meeting created after mount appears on refresh, in its correct day group, with no manual reload
         - a meeting whose summary changed upstream after mount renders its new title on refresh
         - a note added after mount flips the row's coverage tag from `Not annotated` to `Notes` on refresh
         - a refresh from a **past** anchor (`?date=` a week back) keeps that anchor and does not snap back to today
         - the `Now` divider re-derives: render at a time before a meeting, advance `Carbon::setTestNow()` past it, refresh, and assert the divider's rendered clock label moved
         - the relative last-successful-sync wording re-derives when the clock advances between renders
      4. Assert the root element carries the self-refresh hook so the wiring cannot be silently dropped: `assertSee('kbSelfRefresh', false)` on `GET /`.
      5. Assert the silence contract server-side: the refreshed render emits no flash message and no new `aria-live` region beyond the pre-existing range label.
      6. Write `.larapilot/docs/test-results/US-011-manual.md` covering what has no server seam: the ~60s cadence on both pages; scroll position preserved; `Jump to` focus and value preserved mid-refresh; calendar view, anchor and keyboard-focused day cell preserved across a refetch; hidden-tab pause verified in devtools Network (no requests while backgrounded) and the catch-up request on return; quiet degradation with the app stopped (agenda keeps its last render with no Livewire error modal, calendar keeps its last good events); and the meeting detail page confirmed **not** refreshing while typing in the notes editor.
      7. `php artisan test --compact --filter=AgendaSelfRefreshTest` then the full suite; `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] New feature test passes and covers every bullet above
      - [ ] Full suite green
      - [ ] Manual handoff document written with steps, expected observation, and failure modes
      - [ ] Pint and Larastan (level 5) clean

      ## Test Data
      - N/A — reuses existing factories; no factory or seeder changes

      ## Git Deliverables
      - Commit: `test(US-011): TASK-04 cover agenda self-refresh and document manual checks`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
    type: Test
    status: TODO
