    id: TASK-02
    title: 'Subscribe the agenda to the refresh cadence'
    body: |
      ## Description
      Make the agenda list at `/` bring itself up to date on the shared 60 second tick, silently, without disturbing the range anchor, the `Jump to` input, focus, or scroll position.

      ## Files Involved
      - resources/views/livewire/agenda.blade.php

      ## Steps
      1. Add `x-data="kbSelfRefresh"` to the component's root `<div>`. That is the whole wiring: the Alpine component from TASK-01 calls `$wire.$refresh()` on each tick.
      2. Verify nothing else needs to move — `render()` already re-resolves `AgendaQuery::for($range)` and `SyncHealthReporter::current()` on every request, and the `Now` divider and `diffForHumans()` wording are computed in the Blade from `now()`, so they re-derive per render rather than freezing at first paint.
      3. Leave `mount()` alone: it must keep running only on the initial request so a refresh cannot snap a past or future range back to today.
      4. Leave the `aria-live="polite"` range label as-is. Its content is `$range->label()`, which does not change across a refresh, so Livewire's morph does not touch the node and nothing is announced.
      5. Do **not** add a spinner, `wire:loading` indicator, toast, banner, or flash message anywhere in this view.
      6. Smoke-check the layout at 375, 768 and 1280 px — the markup change is a single attribute, so this is a regression check, not a redesign.
      7. `php artisan larapilot:quality` and `php artisan test --compact --filter=AgendaPageTest`

      ## Completion Criteria
      - [ ] The agenda root subscribes to the shared cadence
      - [ ] A refresh preserves the `#[Url] date` anchor, the `Jump to` value, focus and scroll position
      - [ ] No toast, banner, flash, spinner, new `aria-live` region, or full-page reload is introduced
      - [ ] `Now` divider and last-successful-sync wording re-derive on each refresh
      - [ ] Existing agenda tests pass; Pint and Larastan clean

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-011): TASK-02 self-refresh the agenda view`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 1.5
    dependencies:
      - TASK-01
  -
    id: TASK-03
    title: 'Refetch the calendar feed on the same cadence, with a last-good fallback'
    body: |
      ## Description
      Make `/calendar` refetch `calendar.events` on the shared 60 second tick in month, week and day views, keeping view, anchor date and keyboard focus, and keeping the last good render on screen when a refetch fails.

      ## Files Involved
      - resources/js/calendar.js

      ## Steps
      1. Import `onRefreshTick` from `./self-refresh.js`.
      2. Add a `lastFetch` field to the Alpine data (`{ key: null, events: [] }`). In the existing `events` function, build `key = from + '|' + to`; on success store `{ key, events }` before calling `successCallback`.
      3. In the `events` function's `.catch`, degrade quietly: when `lastFetch.key === key`, call `successCallback(this.lastFetch.events)` so the grid keeps its last good render; otherwise fall through to `failureCallback(error)` — a first fetch for a range has nothing to fall back to, and `hasEvents` stays `null` so the empty-state block stays hidden rather than claiming an empty range.
      4. In `init()`, after `this.calendar.render()`, subscribe: `this.$cleanup(onRefreshTick(() => this.calendar.refetchEvents()))`. `refetchEvents()` re-runs the `events` function for the visible window only — it does not change the view or the anchor date, and does not fire `datesSet`, so the URL state and the pending-focus machinery are untouched.
      5. Add an `eventsSet` callback that calls `this.syncRovingTabindex()`. It only reassigns `tabindex` on day cells and never moves focus, so it is a safe idempotent guard that the keyboard-focused day cell survives an event re-render.
      6. Do not add any loading indicator, toast, or banner; do not touch `datesSet`, `replaceUrlState`, or the keyboard navigation.
      7. `npm run build`, then check `/calendar` in month, week and day views.

      ## Completion Criteria
      - [ ] All three views refetch on the shared cadence and render newly synced meetings and changed coverage marks in place
      - [ ] Current view, anchor date, URL state and the keyboard-focused day cell survive a refetch
      - [ ] A failed refetch for an already-rendered range leaves the last good events on screen; no blanking, no empty state, no visible error
      - [ ] Scroll position is preserved (week/day time grid included)
      - [ ] No new UI affordance and no new configuration key
      - [ ] `npm run build` succeeds

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-011): TASK-03 self-refresh the calendar views`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 2.5
    dependencies:
      - TASK-01
