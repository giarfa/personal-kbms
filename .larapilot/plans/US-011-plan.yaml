    id: TASK-01
    title: 'Shared 60s refresh cadence module and silent-failure interceptor'
    body: |
      ## Description
      Add the single module that owns the refresh cadence for the whole application, and the Livewire interceptor that makes a failed `$refresh` silent. Nothing subscribes to it yet — TASK-02 and TASK-03 do.

      ## Files Involved
      - resources/js/self-refresh.js (new)
      - resources/js/app.js

      ## Steps
      1. Create `resources/js/self-refresh.js` exporting:
         - `export const KB_REFRESH_MS = 60000;` — the cadence, with a docblock stating it is deliberately hardcoded to match the sync indicator's `wire:poll.60s`, and that US-011 adds no `KBMS_*` key and no operator control
         - `export function onRefreshTick(callback)` — registers `callback` against **one** shared `setInterval(KB_REFRESH_MS)` created lazily on first subscription and cleared when the last subscriber leaves; returns a teardown closure
      2. Hidden-tab policy inside the module:
         - a tick that fires while `document.hidden` is skipped and sets a "missed a tick" flag
         - a single module-level `visibilitychange` listener fires every subscriber once, immediately, when the document becomes visible **and** the flag is set, then clears it
         - document in a comment why this is hand-rolled rather than `wire:poll`: Livewire's poll directive throttles background ticks to a 5% chance instead of pausing, and never catches up on return (`vendor/livewire/livewire/dist/livewire.esm.js`, `throttleWhile(() => theTabIsInTheBackground() ...)`)
      3. Register the Alpine data component in the same module, on `alpine:init`:
         `Alpine.data('kbSelfRefresh', () => ({ init() { this.$cleanup(onRefreshTick(() => this.$wire.$refresh())) } }))`
      4. Register the silent-failure interceptor in the same module, guarded on `Livewire` being present:
         `Livewire.interceptAction(({ action, onError }) => { if (action.name !== '$refresh') return; onError(({ preventDefault }) => preventDefault()) })`
         Comment why: `$refresh` is a no-side-effect re-render, so a failed one has nothing to report; suppressing it here keeps a request error, a stopped worker, or an expired session from raising Livewire's full-screen HTML modal or the 419 confirm over the last good render. Every user-initiated action keeps Livewire's default error surface.
      5. Import the module from `resources/js/app.js` alongside `./calendar.js`
      6. `npm run build`

      ## Completion Criteria
      - [ ] `KB_REFRESH_MS` is 60000 and is the only place the cadence is written
      - [ ] One shared interval regardless of subscriber count; teardown clears it when empty
      - [ ] Ticks are skipped while `document.hidden`; a catch-up fires on return to visible only when a tick was missed
      - [ ] `$refresh` failures raise no visible Livewire error UI; non-`$refresh` actions are untouched
      - [ ] No new configuration key anywhere (`config/kbms.php` and `.env.example` unchanged)
      - [ ] `npm run build` succeeds

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-011): TASK-01 add shared self-refresh cadence and silent refresh failures`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 2
    dependencies:
      - TASK-00
