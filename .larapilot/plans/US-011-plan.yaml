code: US-011
plan_body: |
  ## Technical Solution

  Both scanning surfaces already re-derive everything they show from a single render pass — the agenda from `AgendaQuery` inside a Livewire `render()`, the calendar from `CalendarFeedQuery` behind the `calendar.events` JSON route. Nothing about the data layer has to change: this spec only has to make each surface run that pass again, on its own, roughly once a minute, without disturbing anything the operator is looking at.

  **One shared cadence, two subscribers.** A new `resources/js/self-refresh.js` owns the interval and the visibility policy, and exposes it to both pages:

  - `KB_REFRESH_MS = 60_000` — the cadence, hardcoded to match the `wire:poll.60s` the sync indicator already uses. No `KBMS_*` key, no `config/kbms.php` entry, no operator-facing control (spec: "deliberately hardcoded").
  - `onRefreshTick(callback)` — registers `callback` on a single shared `setInterval`, so the agenda, the calendar and any later subscriber wake on the same tick rather than each owning a timer. Returns a teardown closure.
  - **Hidden-tab policy:** a tick that fires while `document.hidden` is skipped outright, and a `visibilitychange` back to visible fires the callback once immediately when at least one tick was skipped. That is a deliberate departure from Livewire's own `wire:poll`, which *throttles* background polling to a 5% chance per tick rather than pausing it, and never catches up on return. The acceptance criterion asks for a pause plus a catch-up, so the cadence is ours rather than the directive's. Recorded as a plan note, not a silent deviation.
  - **Alpine data component `kbSelfRefresh`** — registered in the same module on `alpine:init`, so a Livewire component can subscribe with a single `x-data` attribute and unsubscribe through `this.$cleanup()` (the same teardown idiom `calendar.js` already uses for its FullCalendar instance).

  **Agenda (`/`).** The `Agenda` Livewire component root gains `x-data="kbSelfRefresh"`; the tick calls `$wire.$refresh()`. `$refresh` re-enters `render()`, which re-resolves `AgendaQuery::for($range)` and `SyncHealthReporter::current()` from scratch — so a meeting the background sync upserted appears, the coverage tags re-derive, the `Now` divider re-computes against the current clock, and `diffForHumans()` on the last successful sync stays accurate on a page left open for hours. No component state is touched: `mount()` does not re-run, so the `#[Url] date` anchor survives, and Livewire's morph patches the existing DOM in place rather than replacing it, so scroll position, the `Jump to` input's value, and its focus survive too. The `aria-live="polite"` range label is left exactly as it is: its content does not change across a refresh, so morph does not touch it and nothing is announced.

  **Calendar (`/calendar`).** The `kbCalendar` Alpine component subscribes to the same tick and calls `this.calendar.refetchEvents()`, which re-runs the existing `events` function for the *currently visible* window only and re-renders the event layer. `refetchEvents()` does not change the view, the anchor date, or the day-cell DOM, so the current view, the URL state, and the roving-tabindex focus target all survive; a `eventsSet` callback re-runs `syncRovingTabindex()` after each event render as a cheap idempotent guard (it reassigns `tabindex` attributes and never moves focus). `datesSet` does not fire on a refetch, so the URL is not rewritten and no pending-focus machinery is disturbed.

  **Quiet degradation** is handled once per surface, at the two places a refresh can fail:

  - *Calendar* — the `events` function caches the last successful payload keyed by `from|to`. On a fetch rejection or a non-OK response for a range we have already rendered, it calls `successCallback(lastGoodEvents)` instead of `failureCallback`, so the grid keeps its last good render instead of blanking. Only a *first* fetch for a range still fails through to `failureCallback`, which is the pre-spec behaviour and leaves `hasEvents` at `null` so the empty-state block stays hidden.
  - *Agenda* — a failed Livewire request would otherwise raise Livewire's own full-screen HTML error modal (or the 419 "page has expired" confirm). A `Livewire.interceptAction` registration calls `preventDefault()` on the error path for actions named `$refresh` **only** — the no-side-effect re-render, whether it came from our tick or from the sync indicator's existing `wire:poll`. Every user-initiated action keeps Livewire's default error surface untouched.

  Sync failure itself keeps being reported only by `SyncStatus` and `SyncAlert` (FR-010). Neither component is edited by this spec.

  **Out of scope, enforced:** the meeting detail page is untouched — no `x-data`, no tick subscription — so the notes editor and the prompt panel keep their current behaviour, including `AskClaude`'s short-lived launch poll. No websockets, no Echo, no change to sync scheduling.

  ## Git & Branching
  - Mode: `GITFLOW` (from `settings.git_mode`)
  - Branch: `feature/US-011-self-refreshing-views` from `develop`
  - TASK-00: bootstrap the branch and prepare the internal PR description locally
  - Per task: one Conventional Commit `type(US-011): TASK-NN summary`; **no push**, no remote PR (push only on explicit request)
  - Merge into `develop` after the review gate

  ## Test Data Strategy
  - No new or changed Eloquent model, migration, factory or seeder in this spec — it is a render-cadence change over data US-005 and US-008 already produce.
  - Tests reuse `CalendarEventFactory` (`at()`, `allDay()`, `cancelled()`) and `MeetingNoteFactory` / `MeetingTranscriptFactory` exactly as `AgendaPageTest` already does.
  - `migrate:fresh --seed` is unaffected; no seeder changes.

  ## Test Strategy
  - Bar: `NORMAL` (from `settings.testing`) — PHPUnit feature and unit tests only. **No** Playwright, Dusk, Pest browser, or viewport matrix.
  - Agenda refresh is server-testable through the Livewire test harness: `Livewire::test(Agenda::class)->call('$refresh')` exercises exactly the path the tick triggers. Coverage: a meeting created after mount appears on refresh; the `#[Url] date` anchor is preserved across a refresh from a past range; the `Now` divider and the relative sync wording re-derive when the clock advances between renders; a coverage change (a note added after mount) shows up on refresh.
  - The cadence module, the hidden-tab pause, the catch-up, the FullCalendar refetch, and the last-good fallback are browser behaviours with no server seam and no JS test runner in this project (`package.json` ships Vite only). They are covered by a **manual test handoff** at `.larapilot/docs/test-results/US-011-manual.md`, per Anne's NORMAL-bar allowance — with the exact steps, the expected observation, and the failure modes to look for.
  - `larapilot:quality` (Pint + Larastan level 5) before each backend `task-done`; `npm run build` must succeed after every JS change.
