    id: TASK-05
    title: 'Document the self-refresh behaviour in README and CHANGELOG'
    body: |
      ## Description
      Baseline documentation for a behaviour the operator will notice but cannot configure: say the cadence out loud, and say that it is deliberately not tunable.

      ## Files Involved
      - README.md
      - CHANGELOG.md

      ## Steps
      1. README: in the section describing the agenda and calendar surfaces, add a short paragraph — both views bring themselves up to date about once a minute while the tab is visible, pause while it is hidden and catch up on return, and there is no setting for it. Name `resources/js/self-refresh.js` as the single place the cadence lives. State explicitly that no `KBMS_*` key controls it, so nobody goes looking for one.
      2. README: note that the meeting detail page deliberately does **not** self-refresh, because it hosts the notes editor.
      3. CHANGELOG: add the entry under `Unreleased` → `Added`, referencing US-011.
      4. Do not restructure either document; this is an additive edit.

      ## Completion Criteria
      - [ ] README describes the cadence, the visibility policy, the detail-page exclusion, and the absence of a config key
      - [ ] CHANGELOG `Unreleased` → `Added` carries the US-011 entry
      - [ ] No configuration surface documented that does not exist

      ## Test Data
      - N/A — documentation only

      ## Git Deliverables
      - Commit: `docs(US-011): TASK-05 document the self-refreshing views`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
