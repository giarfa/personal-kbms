  -
    id: TASK-01
    title: 'Add the CalendarView enum and the CalendarRange window'
    type: Impl
    status: DONE
    assignee: Alex
    estimate_hours: 2
    dependencies:
      - TASK-00
    body: |
      ## Description
      Give the three views a single vocabulary and a single place that computes what each one shows. `CalendarView` is the enum every other layer branches on; `CalendarRange` turns an anchor date plus a view into the visible local-date window, its label, and its neighbours. Both are pure value types with no database access — `AgendaRange` is the shape to follow.

      ## Files Involved
      - app/Meetings/CalendarView.php
      - app/Meetings/CalendarRange.php

      ## Steps
      1. `php artisan make:enum CalendarView` is not a generator this project has — create `app/Meetings/CalendarView.php` by hand as a backed string enum with TitleCase cases `Month`, `Week`, `Day` and values `month`, `week`, `day` (PHP rules: TitleCase enum keys, explicit return types)
      2. Add `CalendarView::fullCalendarView(): string` returning `dayGridMonth` / `timeGridWeek` / `timeGridDay`, and `CalendarView::fromRequest(?string $value): self` returning `self::Month` for anything unrecognised — the URL is a hand-editable surface and must degrade, never throw (US-005 review precedent for `Agenda::$date`)
      3. Create `app/Meetings/CalendarRange.php` as a `final readonly` class holding `CalendarView $view` and `CarbonImmutable $anchor`, normalising the anchor with `startOfDay()` in its constructor for the same structural reason `AgendaRange` does
      4. Implement `visibleStart()` / `visibleEnd()` (exclusive) per view: **month** — first day of the anchor's month rolled back to Monday, through the last day of the month rolled forward to Sunday, always a whole number of weeks; **week** — Monday of the anchor's week through the following Monday; **day** — the anchor day through the next day
      5. Implement `previous()` / `next()` stepping one month, one week or one day per view, and `label()` rendering `September 2026` (month), `7 – 13 September 2026` (week) and `Tuesday 8 September 2026` (day)
      6. Add `static today(CalendarView $view): self` built from `CarbonImmutable::now(config('kbms.timezone'))`, and `static fromRequest(?string $view, ?string $date): self` wrapping the parse in a `try`/`catch` that falls back to today — the same defensive pattern `Agenda::anchor()` uses
      7. Use `CarbonImmutable` throughout and never `addHours(24)`; day arithmetic must go through `addDays()` / `subDays()` so the 25 October 2026 DST boundary in `Europe/Rome` cannot shift a window edge
      8. `vendor/bin/pint --dirty --format agent` then `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `CalendarView` exists with the three TitleCase cases and maps to FullCalendar view ids in exactly one place
      - [x] `CalendarView::fromRequest()` returns `Month` for null, empty, unknown and malformed input rather than throwing
      - [x] `CalendarRange::visibleStart()` / `visibleEnd()` return the window each view actually paints, month always whole weeks starting Monday
      - [x] `previous()` / `next()` / `label()` behave per view
      - [x] `CalendarRange::fromRequest()` degrades to today on an unparseable date
      - [x] Everything is `CarbonImmutable` in `config('kbms.timezone')`; no UTC conversion anywhere
      - [x] `php artisan larapilot:quality` passes

      ## Test Data
      - N/A — value objects only; no model, migration, factory or seeder change

      ## Git Deliverables
      - Commit: `feat(US-008): TASK-01 add CalendarView and CalendarRange`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes only
    commit:
      sha: 23ba03b7ce15801f69d1b3db9414f8043b2381e7
      short_sha: 23ba03b
      subject: 'feat(US-008): TASK-01 add CalendarView and CalendarRange'
      committed_at: '2026-09-09T23:20:11+02:00'
      url: 'https://github.com/giarfa/personal-kbms/commit/23ba03b7ce15801f69d1b3db9414f8043b2381e7'
  -
    id: TASK-02
    title: 'Add the bounded calendar feed query and its JSON route'
    type: Impl
    status: DONE
    assignee: Mike
    estimate_hours: 3
    dependencies:
      - TASK-01
    body: |
      ## Description
      Build the read path the grid pulls from: a window-bounded query that returns the visible occurrences with coverage already folded in, and the JSON route that exposes it. This is the task that makes "only the visible range is queried" true, and it is where the wall-clock timezone convention is honoured or lost.

      ## Files Involved
      - app/Meetings/CalendarEventPayload.php
      - app/Meetings/CalendarFeedQuery.php
      - app/Http/Controllers/CalendarEventsController.php
      - routes/web.php

      ## Steps
      1. Create `app/Meetings/CalendarEventPayload.php` — a `final readonly` DTO carrying `id` (the occurrence route key from `OccurrenceKey::toRouteKey()`), `title`, `start`, `end`, `allDay`, `url` (`route('meetings.show', $routeKey)`), `classNames`, and `extendedProps` (`hasNotes`, `hasTranscript`, `cancelled`, `accessibleName`). Give it `toArray(): array` with an array-shape PHPDoc so Larastan can see the shape
      2. Create `app/Meetings/CalendarFeedQuery.php` with `public const MAX_RANGE_DAYS = 62;` and `for(CarbonImmutable $from, CarbonImmutable $to): Collection`
      3. Reuse the overlap predicate from `AgendaQuery` verbatim — `where('starts_at', '<', $to)->where('ends_at', '>', $from)->orderBy('starts_at')` — with `$from` / `$to` built in `config('kbms.timezone')`. Read `AgendaQuery`'s docblock before touching it: `starts_at` / `ends_at` hold local wall-clock digits, so **do not** convert either side to UTC
      4. Resolve coverage through `app(MeetingCoverageLookup::class)->for($events)` — the batched lookup, keyed `source_uid."\0".recurrence_id`. Never call `forOccurrence()` in a loop; that is the N+1 this class exists to avoid
      5. Format `start` / `end` as **naive local ISO strings without an offset**: `$date->format('Y-m-d\TH:i:s')`. For an all-day row emit `Y-m-d` for both ends and pass the stored **exclusive** end through unchanged — FullCalendar's all-day end is exclusive too, so no adjustment is correct here
      6. Build `classNames` from coverage and state: `kb-ev--note`, `kb-ev--transcript`, `kb-ev--both`, `kb-ev--allday`, `kb-ev--cancelled` — matching the mockup vocabulary the TASK-05 stylesheet targets
      7. Build `accessibleName` as words, not marks: `"09:30 Q4 roadmap review, has notes and transcript"`, `"All day, Company offsite, not annotated"`, appending `", cancelled"` for a cancelled occurrence. Wrap every fragment in `__()` so the string set stays translatable like the rest of the app
      8. Create `app/Http/Controllers/CalendarEventsController.php` as a single-action controller: read `from` / `to` as `Y-m-d` date-only strings, parse defensively (fall back to the current month's window on anything unparseable), clamp `$to` to `$from->addDays(self::MAX_RANGE_DAYS)` via the query constant, and return `response()->json($payloads)`
      9. Register `Route::get('calendar/events', CalendarEventsController::class)->name('calendar.events');` in `routes/web.php`, above the existing `calendar` route for readability. `EnsureLoopbackRequest` is global middleware, so the endpoint inherits the loopback gate — confirm with `php artisan route:list --path=calendar`
      10. `vendor/bin/pint --dirty --format agent` then `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `GET /calendar/events?from=&to=` returns JSON for the requested window only
      - [x] Window is clamped at `MAX_RANGE_DAYS = 62`; a wider or malformed request cannot return the whole mirror
      - [x] Timed events emit naive local ISO strings with **no** offset and no UTC conversion
      - [x] All-day events emit `allDay: true` with the stored exclusive end passed through unchanged
      - [x] A multi-day occurrence is emitted once, spanning its whole range — not clamped to day one like the agenda
      - [x] Coverage resolves through the batched `MeetingCoverageLookup`; the endpoint costs one events query plus the two coverage queries plus one shared directory listing, regardless of density
      - [x] Every payload carries `url` to the US-005 occurrence route and an `accessibleName` stating time, title and coverage in words
      - [x] `php artisan route:list --path=calendar` shows both routes; the endpoint is behind `EnsureLoopbackRequest`
      - [x] `php artisan larapilot:quality` passes

      ## Test Data
      - N/A — reads existing `calendar_events`, `meeting_notes` and `meeting_transcripts`; no migration, model, factory or seeder change

      ## Git Deliverables
      - Commit: `feat(US-008): TASK-02 add the bounded calendar feed query and JSON route`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes only
    commit:
      sha: d01cc8edd085f3986ae2a1e62eb3072a80d2a9a9
      short_sha: d01cc8e
      subject: 'feat(US-008): TASK-02 add the bounded calendar feed query and JSON route'
      committed_at: '2026-09-09T23:21:54+02:00'
      url: 'https://github.com/giarfa/personal-kbms/commit/d01cc8edd085f3986ae2a1e62eb3072a80d2a9a9'
  -
    id: TASK-03
    title: 'Unit- and feature-test the range, the feed query and the endpoint'
    type: Test
    status: DONE
    assignee: Anne
    estimate_hours: 3
    dependencies:
      - TASK-02
    body: |
      ## Description
      Cover the read path before any of it is visible in a browser: the window arithmetic, the payload contract, and the endpoint's bounds. These are the assertions that keep the timezone and "visible range only" guarantees honest — they are worth more than any assertion about the grid's markup.

      ## Files Involved
      - tests/Unit/Meetings/CalendarRangeTest.php
      - tests/Unit/Meetings/CalendarFeedQueryTest.php
      - tests/Feature/CalendarFeedTest.php

      ## Steps
      1. `php artisan make:test --phpunit --unit CalendarRangeTest` and `CalendarFeedQueryTest`, then move both under `tests/Unit/Meetings/` with the `Tests\Unit\Meetings` namespace, matching `AgendaRangeTest` / `AgendaQueryTest`
      2. Pin the clock the way `AgendaPageTest` does — `Carbon::setTestNow(Carbon::parse('2026-09-08 12:00:00', 'Europe/Rome'))` in `setUp()`, cleared in `tearDown()`
      3. `CalendarRangeTest`: the month window for September 2026 starts Monday 31 August and ends exclusive on Monday 5 October (whole weeks); the week window is Monday-to-Monday; the day window is one day; `previous()` / `next()` step by the right unit per view; `label()` renders per view; `fromRequest()` falls back to month and today for `null`, `''`, `'quarter'` and `'not-a-date'`; and a window spanning **25 October 2026** (the `Europe/Rome` DST end) still contains exactly seven days in week view
      4. `CalendarFeedQueryTest`: use `CalendarEventFactory` for a timed occurrence, an all-day occurrence, a multi-day occurrence and a cancelled one. Assert the emitted `start` / `end` strings contain **no** `+` offset and no trailing `Z`; assert the all-day end is the stored exclusive end verbatim; assert the multi-day row appears once with its full span rather than clamped to day one; assert `classNames` and `extendedProps` for each coverage combination using `MeetingNoteFactory` and `MeetingTranscriptFactory`
      5. `php artisan make:test --phpunit CalendarFeedTest` for `tests/Feature/`, using `RefreshDatabase` like `AgendaPageTest`
      6. `CalendarFeedTest`: an occurrence one day outside the requested window is absent while one inside is present; a request for a 400-day window returns no more than `MAX_RANGE_DAYS` worth of days; `?from=nonsense&to=` returns HTTP 200 with a sane default window rather than a 500; an empty window returns `[]` with HTTP 200; notes-only, transcript-only and both-coverage occurrences each carry the right flags and `accessibleName` wording; a cancelled occurrence is flagged and still present, never hidden; an occurrence at `2026-10-25 02:30` keeps those wall-clock digits in the response
      7. Assert the query count for a dense window with `DB::enableQueryLog()` (or `assertDatabaseCount`-style bounding) so a future N+1 regression fails here rather than at review
      8. `php artisan test --filter=Calendar` while iterating, then the full `php artisan test`
      9. Do **not** add Playwright, Dusk, Pest browser or viewport suites — `settings.testing` is `NORMAL`

      ## Completion Criteria
      - [x] All three test files pass, and the full suite stays green
      - [x] Timezone assertions prove no offset and no UTC conversion in the payload
      - [x] Range-clamp, malformed-input and empty-window behaviours are all asserted
      - [x] Coverage combinations (none / notes / transcript / both) and the cancelled state are each asserted on the right occurrence
      - [x] A query-count assertion bounds the endpoint against a future N+1
      - [x] `php artisan larapilot:quality` passes

      ## Git Deliverables
      - Commit: `test(US-008): TASK-03 cover the calendar range, feed query and endpoint`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes only
    commit:
      sha: ea291f44488d72420daa018c2bd743aac8ef9bab
      short_sha: ea291f4
      subject: 'test(US-008): TASK-03 cover the calendar range, feed query and endpoint'
      committed_at: '2026-09-09T23:23:30+02:00'
      url: 'https://github.com/giarfa/personal-kbms/commit/ea291f44488d72420daa018c2bd743aac8ef9bab'
  -
    id: TASK-04
    title: 'Wire FullCalendar MIT into the calendar page with a custom toolbar'
    type: Impl
    status: DONE
    assignee: Alex
    estimate_hours: 5
    dependencies:
      - TASK-02
    body: |
      ## Description
      Replace the US-005 placeholder at `/calendar` with a working grid: FullCalendar MIT core in a thin Alpine wrapper, our own toolbar (prev / next / Today / month label / Month-Week-Day switcher), and the query string as the single source of truth for view and date. Runs in parallel with TASK-03 — they share no files.

      ## Files Involved
      - package.json / package-lock.json
      - resources/js/app.js
      - resources/js/calendar.js
      - resources/views/pages/calendar.blade.php
      - routes/web.php
      - database/seeders/CalendarEventSeeder.php (only if the seeded month renders empty — same-task rule)

      ## Steps
      1. `npm install --save-dev @fullcalendar/core @fullcalendar/daygrid @fullcalendar/timegrid` — latest 6.x. **MIT core only**: do not install `@fullcalendar/interaction` (no drag, resize or `dateClick` is needed and FR-021 forbids writes), and never `@fullcalendar/resource*`, `@fullcalendar/timeline` or `@fullcalendar/adaptive`. FullCalendar 6 injects its own CSS from JS, so there is no stylesheet import to add
      2. Verify the installed licences are MIT before committing the lockfile, and record the resolved versions in the commit body
      3. Create `resources/js/calendar.js` exporting an Alpine component registered on `alpine:init`: `Alpine.data('kbCalendar', (config) => ({ ... }))`. Import it from `resources/js/app.js` (currently empty), which `partials/head.blade.php` already loads through `@vite`
      4. Component `init()`: construct `new Calendar(this.$refs.grid, {...})` with `plugins: [dayGridPlugin, timeGridPlugin]`, `initialView` and `initialDate` from the server-rendered config, `headerToolbar: false`, `firstDay: 1`, `timeZone: 'local'` (the default — leave it, and read the timezone section of the plan before changing it), `dayMaxEventRows: true` for the month `+N more` affordance, `eventDisplay: 'block'`, `nowIndicator: true`, `height: 'auto'`
      5. `events` is a **function**, not a URL: take `fetchInfo.startStr.slice(0, 10)` and `fetchInfo.endStr.slice(0, 10)` and `fetch('/calendar/events?from=&to=')`, calling `failureCallback` on a non-OK response so a broken feed surfaces as a stated error rather than an empty month
      6. `datesSet` callback: update the toolbar label from `calendar.view.title`, and `history.replaceState` the current `?view=&date=` so Back from a meeting returns to the same position. Do not push a new history entry per navigation — replace, so Back leaves the calendar rather than walking its history
      7. Toolbar in `resources/views/pages/calendar.blade.php`, following the mockup's `kb-toolbar` + `kb-segmented` structure: prev / next icon buttons, a `Today` button, the live range label, and a three-button view switcher. Wire each to `calendar.prev()` / `next()` / `today()` / `changeView()` through Alpine
      8. Server-render the initial state: resolve `CalendarRange::fromRequest(request('view'), request('date'))` in the Blade page (or a tiny controller — keep the route a `Route::view` only if no PHP is needed) so a bookmarked `?view=week&date=2026-09-08` opens on that view, and the first toolbar label is correct before JavaScript runs
      9. Add the empty-range note: when the feed returns zero events for the visible window, show a `kb-empty` block reusing the agenda's sync-health-aware wording ("the mirror is current — this range is genuinely empty rather than unsynced") rather than a bare "no events". Read `SyncHealthReporter` in the Blade page for the sync sentence, exactly as `livewire/agenda.blade.php` does
      10. Destroy the calendar in the Alpine component's `destroy()` so no instance leaks if the page is ever reached through a `wire:navigate` link elsewhere in the shell
      11. Confirm the sidebar's existing `Calendar` item still marks `:current` (it keys on `request()->routeIs('calendar')` — unchanged)
      12. `npm run build`, then `php artisan test` and `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Month, week and day views render mirrored events at `/calendar`
      - [x] MIT plugins only — `package.json` contains no premium FullCalendar package and the config carries no `schedulerLicenseKey`
      - [x] The grid fetches only the visible window; navigating months issues a new bounded request rather than loading the mirror
      - [x] `?view=` and `?date=` are honoured on load and kept current with `history.replaceState`
      - [x] Clicking an event opens the US-005 detail route
      - [x] All-day events render in the all-day lane, never as midnight-to-midnight blocks; a multi-day event spans correctly in month view as a single bar
      - [x] A day with many overlapping meetings shows `+N more` and expands — nothing is silently dropped
      - [x] An empty range renders an empty grid plus the sync-health-aware note, with no layout break
      - [x] Events render in `KBMS_TIMEZONE` digits and stay correct across the DST week
      - [x] `npm run build` succeeds and the full test suite stays green
      - [x] `php artisan larapilot:quality` passes

