code: US-008
plan_body: |
  ## Technical Solution

  US-008 adds the third reading surface over the existing mirror: month, week and day grids at `/calendar`, replacing the placeholder page US-005 left there. **No new tables, no new model, no schema change** — every row it renders already exists (`calendar_events`, `meeting_notes`, `meeting_transcripts`) and coverage is already computed by `App\Meetings\MeetingCoverageLookup`. The work is a range/query seam in PHP, a JSON feed the grid pulls from, a FullCalendar MIT wrapper, and a deliberate accessibility layer on top of it.

  ### Layering (John)

  | Layer | Class / file | Responsibility |
  | --- | --- | --- |
  | View vocabulary | `app/Meetings/CalendarView.php` (enum `Month` / `Week` / `Day`) | The only place the three views are named; maps to the FullCalendar view ids (`dayGridMonth`, `timeGridWeek`, `timeGridDay`) |
  | Visible window | `app/Meetings/CalendarRange.php` | anchor + view -> the visible `[from, to)` local-date window (month view includes the leading and trailing days FullCalendar paints), `label()`, `previous()`, `next()` |
  | Feed | `app/Meetings/CalendarFeedQuery.php` + `app/Meetings/CalendarEventPayload.php` | window -> the event array the grid consumes, coverage folded in through the batched `MeetingCoverageLookup` |
  | HTTP | `app/Http/Controllers/CalendarEventsController.php` (`GET /calendar/events`) | date-only `from` / `to` params, clamped, JSON out |
  | Page | `resources/views/pages/calendar.blade.php` + `resources/js/calendar.js` | Alpine wrapper around FullCalendar, custom toolbar, URL state |

  `AgendaQuery` is left untouched. `CalendarFeedQuery` repeats its overlap predicate rather than sharing it, because the two surfaces disagree on what to do with a multi-day row — the agenda emits it once, clamped to the range's first visible day (recorded decision `agenda multi-day event rendering`), while the calendar must render it as one spanning bar across every day it covers. A shared abstraction here would have to be parameterised until it said nothing.

  ### Storage convention and timezone (Mike + Emily)

  `EventSynchronizer` stores `starts_at` / `ends_at` as **`KBMS_TIMEZONE`-local wall-clock digits, never UTC** (see its docblock, and `AgendaQuery`'s). Two consequences this plan is built on, and which tasks must not "fix":

  1. The window predicate compares against dates built in `config('kbms.timezone')`, exactly as `AgendaQuery` does. Do not convert to UTC anywhere in this path.
  2. The feed emits **naive local ISO strings with no offset** (`2026-09-08T09:30:00`) and the grid runs on FullCalendar's default `timeZone: 'local'`. Parse-as-local followed by render-as-local is the identity function, so the digits the operator sees are the digits stored in the row — and a DST boundary cannot shift them, because no conversion happens anywhere along the path. Emitting an offset (or UTC) would reintroduce precisely the double-conversion defect the wall-clock storage convention exists to avoid.

  All-day rows are emitted with `allDay: true` and the stored **exclusive** end passed straight through: FullCalendar's all-day end is exclusive too, so no plus-or-minus-one-day arithmetic is needed, and adding any would break the multi-day span.

  ### Only the visible range (John + Mike)

  The grid never holds the mirror. FullCalendar's `events` is a **function**, not a URL string: it takes `fetchInfo.startStr` / `endStr`, truncates both to `YYYY-MM-DD` (discarding the browser offset, which is meaningless against wall-clock storage), and fetches `GET /calendar/events?from=...&to=...`. Server side the window is clamped to `CalendarFeedQuery::MAX_RANGE_DAYS = 62`, so a hand-edited or malformed range cannot ask for the whole mirror. Query cost stays flat: one events query plus the two batched coverage queries plus one shared directory listing — the same shape the agenda already pays, over a wider window.

  **No new `.env` key.** The clamp is a class constant, so this spec leaves the PRD configuration surface unchanged and needs no PRD revision row.

  ### State ownership (Joe)

  The grid is **Alpine + FullCalendar, not a Livewire component.** `view` and `date` live in the query string (`?view=week&date=2026-09-08`); the server reads them to render the initial toolbar label and the initial grid config, and `history.replaceState` keeps them current as the operator navigates. Event links are **plain anchors** (FullCalendar's `url` prop) producing a full page load — no `wire:navigate` on chips.

  Rationale: a Livewire round-trip would re-render and destroy the DOM FullCalendar owns, and reaching for `$wire.$set(..., false)` to dodge that leaves two sources of truth for one piece of state. With the URL as the only source, "view and date position survive navigation to a meeting and back" is satisfied by the browser rather than by a cache — Back returns to `?view=week&date=...` and the page rebuilds from it. This does not contradict the recorded `livewire component style` decision, which governs how Livewire components are written, not where one is required. `SyncStatus` and `SyncAlert` stay Livewire in the layout and are unaffected.

  ### Coverage indicator (Elise)

  Per the mockup contract: left border plus marks on the event chip — `has notes` teal (`--kb-note`), `has transcript` indigo (`--kb-transcript`), `has both` carrying both borders. **One documented departure from the mockup:** the two marks differ in **shape as well as hue** — notes a filled circle, transcript a filled square — because two dots separated only by colour is a WCAG 2.2 **1.4.1 Use of Colour** failure for the sighted operator, and the mockup's own answer (the accessible name) only reaches screen-reader users. The legend states both shapes in words.

  Every chip carries an accessible name stating **time, title and coverage in words** ("09:30 Q4 roadmap review, has notes and transcript"), so the marks are `aria-hidden` decoration on top of a signal that already exists — the rule the mockup README sets for the whole app. Cancelled occurrences stay dashed, struck and muted; all-day rows keep their own lane and are never drawn as midnight-to-midnight blocks.

  ### Accessibility beyond FullCalendar (Elise + Anne)

  The spec is explicit that FullCalendar's defaults are not sufficient, so TASK-06 owns the gap as work in its own right: roving-tabindex arrow-key / `Home` / `End` movement across day cells, real focusable anchors for events, an `aria-pressed` segmented view switcher in our own toolbar (`headerToolbar: false`), an `aria-live="polite"` announcement of the range label on every navigation, a visible 3 px `--ring` focus halo on cells, chips and toolbar controls (never outline-only, never suppressed), and `prefers-reduced-motion` respected. Contrast is verified for every event state — bare, notes, transcript, both, all-day, cancelled, today — against `--card` in **both** themes.

  ## Git & Branching
  - Mode: `GITFLOW` (from `settings.git_mode`) — Gitflow without automatic push
  - Branch: `feature/US-008-calendar-views` from `develop`. Clean branch point: `develop` is at `edb1c5a` with US-007 already merged, so nothing has to be stacked on an unmerged branch
  - TASK-00: bootstrap the branch and prepare the internal PR title and body toward `develop` **locally**
  - Per task: exactly one atomic Conventional Commit, `type(US-008): TASK-NN short summary` — never batch two tasks into one commit
  - Push and remote PR: **skipped** under `GITFLOW`; open only if the operator explicitly asks in-session
  - `php artisan larapilot:quality` (Pint + Larastan level 5) must pass before every `larapilot:task-done`
  - Merge into `develop` only after human `/larapilot-review` approval

  ## Test Data Strategy
  - **No schema change and no new model in this spec.** `CalendarEventFactory`, `MeetingNoteFactory` and `MeetingTranscriptFactory` already exist and are the fixture source for every test here; no factory and no seeder is added by US-008
  - `CalendarEventFactory::at()` (existing state) supplies timed occurrences; tests build all-day, multi-day, cancelled and DST-straddling rows through the same factory rather than through raw inserts
  - The seeded dataset from `migrate:fresh --seed` is the development fixture for the grid. If a month window against it renders visibly empty, extend `CalendarEventSeeder` volumes **inside TASK-04's commit**, not in a follow-up — same-task rule
  - Each task below states `## Test Data` explicitly; `N/A` where the task genuinely touches no model or migration

  ## Test Strategy
  - Bar: `NORMAL` (from `settings.testing`) — PHPUnit feature and unit only. **No Playwright, no Dusk, no Pest browser, no viewport matrix, no axe automation.**
  - **Unit** (`tests/Unit/Meetings/`): `CalendarRangeTest` — the month window includes leading and trailing days, the week window starts Monday, the day window is one day, `previous()` / `next()` / `label()` per view, and day arithmetic across the 25 October 2026 DST boundary in `Europe/Rome`. `CalendarFeedQueryTest` — payload shape, naive local strings with no offset, all-day exclusive end passed through unchanged, multi-day span kept whole, coverage flags, cancelled flag
  - **Feature** (`tests/Feature/`): `CalendarFeedTest` — only the requested window comes back (an occurrence one day outside is absent), the clamp bounds an oversized window, malformed `from` / `to` degrade instead of throwing, an empty window returns `[]` with HTTP 200, notes-only / transcript-only / both coverage each appear on the right occurrence, a cancelled occurrence is flagged, and an occurrence straddling the DST boundary keeps its wall-clock digits. `CalendarPageTest` — `/calendar` renders each of the three views from `?view=`, an unknown `view` or unparseable `date` falls back to month and today rather than 500 (the `Agenda` `#[Url]` precedent from US-005 review), the legend states both coverage shapes, and the empty-range copy is the sync-health-aware wording, not "no data"
  - **Manual test handoff** (Anne, TASK-07, written to `.larapilot/docs/test-results/US-008-manual.md`): keyboard-only pass across month, week and day (`Tab` into the grid, arrows between days, `Home` / `End`, `Enter` on a chip, `Esc` out of the `+N more` popover); theme toggle in both directions with every event state on screen; 375 px pass confirming the month grid is the only surface that scrolls horizontally; and a visual check of the DST week
  - Every task ends with `php artisan test` (a targeted `--filter` is fine while iterating, full suite before `task-done`) and `php artisan larapilot:quality`

  ## Risks & residual concerns
  - **FullCalendar DOM ownership.** Styling reaches into `.fc-*` internals, which a future major version can move. Mitigation: prefer FullCalendar's own CSS custom properties (`--fc-border-color`, `--fc-page-bg-color`, `--fc-today-bg-color`, `--fc-event-*`, `--fc-small-font-size`) over element selectors wherever a variable exists, and keep the remaining `.fc-*` overrides in one clearly commented block in `resources/css/app.css`
  - **MIT-only constraint (hard).** `@fullcalendar/core`, `@fullcalendar/daygrid` and `@fullcalendar/timegrid` only. No `@fullcalendar/resource*`, `@fullcalendar/timeline`, `@fullcalendar/adaptive`, and no `schedulerLicenseKey` key anywhere in the config. `@fullcalendar/interaction` is deliberately **not** installed either: the grid needs no drag, resize or `dateClick`, and this product cannot write to the calendar at all (FR-021)
  - **Convention-resolution cost over a wider window.** `MeetingCoverageLookup` resolves transcript candidates by convention for occurrences with no `meeting_transcripts` row. Across a 42-day month window that is one shared directory listing plus in-memory matching — the same shape the agenda already pays across 7 days. If a very large transcripts directory ever makes it visible, the fix belongs in a cached index inside `TranscriptsDirectory`, not in a per-view special case
