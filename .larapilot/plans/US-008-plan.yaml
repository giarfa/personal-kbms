    id: TASK-05
    title: 'Style the grid to the mockup contract in both themes'
    type: Impl
    status: DONE
    assignee: Joe
    estimate_hours: 4
    dependencies:
      - TASK-04
    body: |
      ## Description
      Map the `--kb-*` token layer onto FullCalendar's DOM so the grid reads as the same product as the agenda and the meeting page, in light and dark. The mockup's `calendar.html` defines the visual result; FullCalendar's markup, not the mockup's, is what gets styled. Runs in parallel with TASK-06 — this task owns `resources/css/app.css`, that one owns the JS and Blade.

      ## Files Involved
      - resources/css/app.css

      ## Steps
      1. Add one clearly delimited `/* --- FullCalendar (US-008) --- */` block at the end of `resources/css/app.css`, after the existing `kb-*` component rules
      2. Drive as much as possible through FullCalendar's own custom properties rather than element selectors — `--fc-border-color: var(--border)`, `--fc-page-bg-color: var(--card)`, `--fc-neutral-bg-color: var(--muted)`, `--fc-today-bg-color`, `--fc-small-font-size`, `--fc-event-*` — so a FullCalendar upgrade cannot silently break the theme
      3. Port the mockup's event chip: `.fc-event` picking up the `kb-ev` treatment (compact, monospace time via `--kb-mono`, tabular numerals, truncating title), with the coverage variants `kb-ev--note` (3 px left border `--kb-note`), `kb-ev--transcript` (3 px left border `--kb-transcript`), `kb-ev--both` (note left, transcript right), `kb-ev--allday` (`--kb-transcript-bg` fill in the all-day lane) and `kb-ev--cancelled` (dashed border, muted fill, struck title)
      4. Render the coverage marks with **distinct shapes as well as hues** — notes a filled circle, transcript a filled square (`border-radius: 0`). This is the documented departure from the mockup's dot-only rendering and it is what keeps the indicator out of a WCAG 1.4.1 Use-of-Colour failure. Marks stay `aria-hidden`; TASK-06 owns the accessible name underneath
      5. Style the legend above the grid to state both shapes in words, mirroring the agenda's `kb-legend`: notes, transcript, both, cancelled
      6. Week and day views: hour gutter in `--kb-mono` at the mockup's scale, all-day lane with its own label cell, today column tint via `--fc-today-bg-color`, `nowIndicator` line in `--kb-transcript`
      7. Month view: `min-height` on day cells per `kb-cal__day`, out-of-month cells on `--muted` with a dimmed day number, today's number as a filled pill, `+N more` styled as the mockup's `kb-cal__more` underlined text button and its popover on `--card` with the standard border
      8. Below 768 px: `overflow-x: auto` on the month grid only — the one place horizontal scroll is accepted, per the mockup's responsive table — with a `2.5rem` minimum column, and hide the chip time label the way `kb-ev__time` does at that width. Icon buttons and segmented-control buttons reach 44 px minimum
      9. Neutralise FullCalendar's transitions under `prefers-reduced-motion: reduce`, matching the blanket rule the mockup sets
      10. Verify AA contrast for **every** event state — bare, notes, transcript, both, all-day, cancelled, today, out-of-month — against `--card` in light **and** dark. The `--kb-*` dark values flip lightness rather than reusing light values; do not "simplify" that
      11. `npm run build`, then `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Grid, chips, hour gutter, all-day lane and `+N more` match the mockup's visual result in both themes
      - [x] Coverage marks differ in shape and colour, and the legend states both in words
      - [x] Cancelled occurrences are visually distinct — dashed, muted, struck — and never hidden
      - [x] AA contrast verified for every event state in light and dark
      - [x] Month grid is the only surface that scrolls horizontally below 768 px; nothing is clipped at 375 px
      - [x] `prefers-reduced-motion` neutralises animation
      - [x] All overrides live in one commented block and prefer FullCalendar CSS variables over element selectors
      - [x] `npm run build` succeeds; `php artisan larapilot:quality` passes

      ## Test Data
      - N/A — stylesheet only; no model, migration, factory or seeder change

