    id: TASK-06
    title: 'Add the keyboard and screen-reader layer FullCalendar does not ship'
    type: Impl
    status: DONE
    assignee: Elise
    estimate_hours: 4
    dependencies:
      - TASK-04
    body: |
      ## Description
      The acceptance criteria call FullCalendar's defaults insufficient, and they are: the grid is a table of divs with no roving focus, and the view switcher has no pressed state. This task makes the calendar operable and legible without a mouse. Runs in parallel with TASK-05 — this task owns the JS and Blade, that one owns the stylesheet.

      ## Files Involved
      - resources/js/calendar.js
      - resources/views/pages/calendar.blade.php
      - resources/css/app.css (focus-ring rules only — coordinate with TASK-05 to avoid a conflicting edit in the same block)

      ## Steps
      1. Give the grid container an accessible name that states the view and range (`aria-label="September 2026, month view"`, per the mockup's `kb-cal` section) and keep it updated from `datesSet`
      2. Roving tabindex across day cells: exactly one `.fc-daygrid-day` / `.fc-timegrid-col` carries `tabindex="0"` at a time, the rest `-1`. Arrow keys move one day (left/right) or one week (up/down) in month view and one day left/right in week view; `Home` / `End` jump to the first and last day of the visible row; `PageUp` / `PageDown` step the view. Moving past an edge navigates the calendar and lands focus on the corresponding cell in the newly rendered range
      3. Event chips are **real anchors** — FullCalendar's `url` prop already produces one; confirm each is reachable with `Tab` from its day cell and activates on `Enter`
      4. Set each chip's accessible name from the payload's `extendedProps.accessibleName` in `eventDidMount`, and mark the decorative coverage marks `aria-hidden="true"` — the name already states the coverage in words, so the marks are never the only signal
      5. View switcher: three buttons in a `role="group"` with `aria-label`, each carrying `aria-pressed="true|false"` and updated on `datesSet` — the mockup's `kb-segmented` contract
      6. Add an `aria-live="polite"` region (visually hidden or the visible label itself, as `livewire/agenda.blade.php` does with `kb-toolbar__range`) announcing the range label after every navigation, so a screen-reader user knows the grid moved
      7. Focus ring: a visible 3 px `--ring` halo on day cells, chips, toolbar buttons and the `+N more` control. Never `outline: none` without a replacement, and never rely on hover alone
      8. `+N more` popover: confirm focus moves into it, `Esc` closes it, and focus returns to the trigger. If FullCalendar's own popover does not return focus, add the handler rather than accepting the drop
      9. Confirm the skip link still reaches `#main` ahead of the grid and that the page has exactly one `<h1>`, with the grid section under an `<h2>`
      10. Keyboard-only pass over month, week and day before `task-done` — this is the acceptance criterion, not a nicety
      11. `npm run build`, then `php artisan test` and `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Every view is fully operable from the keyboard: into the grid, across days, onto a chip, through to the meeting page
      - [x] Focus is visible at every stop and never suppressed
      - [x] Each chip's accessible name states time, title and coverage in words; marks are `aria-hidden`
      - [x] The view switcher exposes `aria-pressed`; the grid exposes a range-stating accessible name
      - [x] Range changes are announced through a polite live region
      - [x] `+N more` traps and returns focus correctly and closes on `Esc`
      - [x] One `<h1>`; skip link still lands ahead of the grid
      - [x] `npm run build` succeeds; the full test suite stays green; `php artisan larapilot:quality` passes

      ## Test Data
      - N/A — no model, migration, factory or seeder change

