      2. Assert `/calendar` returns 200 and server-renders the initial view and range label for `?view=month`, `?view=week` and `?view=day`
      3. Assert the degradation path the US-005 review made a standing rule: `?view=quarter`, `?view=`, `?date=not-a-date` and a truncated bookmark each return 200 on month/today rather than a 500
