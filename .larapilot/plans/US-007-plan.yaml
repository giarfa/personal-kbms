  -
    id: TASK-10
    title: 'Fill the transcript coverage seam without an N+1'
    body: |-
      ## Description
      `MeetingCoverage::$hasTranscript` is the hard `false` US-005 marked for this spec, and `resources/views/livewire/agenda.blade.php` already renders the `Transcript` badge behind it — so this is a lookup change with no view restructuring. Plan §8.

      **Define coverage narrowly: a transcript is linked and currently readable.** `Broken`, `Unreadable`, `Ambiguous` and `Suppressed` all badge `false`. The agenda's vocabulary is `Notes` / `Transcript` / `Not annotated` with no room for "probably, pending a choice", and claiming coverage the meeting page then contradicts is worse than under-claiming. State this in the docblock.

      **Do not write from the agenda.** Auto-linking stays in `TranscriptPanel::mount()`; a list render must not mutate thirty rows as a side effect of being looked at.

      ## Files Involved
      - app/Meetings/MeetingCoverage.php
      - app/Meetings/MeetingCoverageLookup.php
      - app/Meetings/AgendaQuery.php
      - tests/Unit/Meetings/MeetingCoverageLookupTest.php

      ## Steps
      1. `MeetingCoverageLookup::for()`: add one batched `meeting_transcripts` query (`whereIn('event_uid', …)`, served by the composite unique index on its leftmost prefix) and consult the **already-built** `TranscriptsDirectory` index — injected, not constructed, so the `scoped` binding from TASK-02 does its job
      2. `forOccurrence()`: same rules for the single-occurrence path used by `MeetingController`
      3. Update the `MeetingCoverage` docblock — it currently says `hasTranscript` is a hard `false` marked for US-007 — and the `MeetingCoverageLookup` docblock's "one query" claim
      4. Update the `AgendaQuery` comment that states "two queries per agenda page"; it is three plus one directory listing now
      5. Update the existing `DB::listen` count assertion in `MeetingCoverageLookupTest` to the new number **deliberately** — the US-006 rework already caught one stale-and-inert version of it. Add an assertion that the directory is listed exactly once for N events
      6. `php artisan test --filter=MeetingCoverage`
      7. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] A readable linked transcript badges its occurrence and only its occurrence
      - [x] Broken, unreadable, ambiguous and suppressed all badge `Not annotated`
      - [x] Query count is fixed for N events and the directory is listed once
      - [x] No writes occur on an agenda render
      - [x] Stale docblocks corrected in all three classes
      - [x] Pint + Larastan level 5 clean

      ## Test Data
      - N/A — no model or schema change in this task

      ## Git Deliverables
      - Commit: `feat(US-007): TASK-10 surface transcript coverage on the agenda`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
