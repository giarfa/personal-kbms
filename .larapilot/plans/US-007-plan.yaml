    id: TASK-03
    title: 'Add TranscriptResolver with the tolerance window and candidate ordering'
    body: |-
      ## Description
      Turn an occurrence into an ordered candidate set, and decide link / ambiguous / nothing. Plan §3. Shares no files with TASK-05, so the two can run in parallel.

      **The resolver never guesses.** Two or more candidates always surface for the operator, *including* when one is an exact datetime and slug match — `states.html` draws exactly that case with the exact-prefix file merely pre-selected. The slug orders the list; it never filters and never breaks a tie.

      **Do not scan per meeting.** Parse each indexed filename once through `TranscriptPattern` into a map keyed `Y-m-d H:i`, then do 21 map lookups per occurrence. The naive rendering of the pattern at every minute for every meeting is O(rows × window × files) and is the wrong shape for the agenda in TASK-10.

      ## Files Involved
      - app/Transcripts/TranscriptResolver.php
      - app/Transcripts/TranscriptCandidate.php
      - app/Transcripts/TranscriptState.php
      - app/Transcripts/TranscriptLinkSource.php

      ## Steps
      1. `php artisan make:class Transcripts/TranscriptResolver --no-interaction`; `TranscriptCandidate` as a `final readonly` DTO (absolute path, filename, drift minutes, bytes, mtime, `slugMatches`); `TranscriptState` as a backed enum (`NotConfigured`, `Missing`, `Ambiguous`, `Linked`, `Broken`, `Unreadable`, `Rejected`, `Suppressed`); `TranscriptLinkSource` as a backed enum (`convention`, `manual`)
      2. Build the minute-keyed index once per resolver instance from `TranscriptsDirectory::files()` + `TranscriptPattern::parse()`
      3. `candidatesFor(CalendarEvent $event): array<int, TranscriptCandidate>` — timed occurrences take `[start − tolerance, start + tolerance]` in `config('kbms.timezone')`; **all-day occurrences match `{date}` alone across every time** (plan §3)
      4. Order by absolute drift, then `slugMatches` first, then filename
      5. `stateFor(...)`: 0 candidates → `Missing`, 1 → `Linked` by convention, ≥2 → `Ambiguous`
      6. Resolution is pure — **no writes here**. Persistence is TASK-09's job, and only from the detail page
      7. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] A single in-window file resolves; a file outside the tolerance does not
      - [x] Three in-window files return three ordered candidates and link nothing
      - [x] All-day occurrences match on date alone
      - [x] The pattern is compiled once and the file index parsed once per resolver instance
      - [x] The resolver performs no database writes
      - [x] Pint + Larastan level 5 clean

      ## Test Data
      - N/A — no model or schema change in this task

      ## Git Deliverables
      - Commit: `feat(US-007): TASK-03 add transcript resolver with drift tolerance`
      - Push: **skip** (`git_mode: GITFLOW`)
