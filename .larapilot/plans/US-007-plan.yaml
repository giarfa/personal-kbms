    id: TASK-11
    title: 'Feature-test the panel, coverage and resync durability'
    body: |-
      ## Description
      The end-to-end bar: every state's wording, the write-once auto-link, manual precedence including the tombstone, traversal refusal at the action boundary, coverage badges, and durability across a resync.

      ## Files Involved
      - tests/Feature/TranscriptPanelTest.php
      - tests/Feature/TranscriptDurabilityTest.php
      - tests/Feature/AgendaPageTest.php
      - tests/Feature/MeetingDetailTest.php
      - tests/Unit/Models/MeetingTranscriptTest.php

      ## Steps
      1. `php artisan make:test --phpunit TranscriptPanelTest` and `TranscriptDurabilityTest`; `--unit` for `MeetingTranscriptTest`
      2. `MeetingTranscriptTest`: `forOccurrence()` hits the composite key and not a sibling; the unique constraint rejects a second row per occurrence; `link_source` casts to the enum; a null-path manual row is valid and reads as suppressed
      3. `TranscriptPanelTest`: assert the **distinguishing string** for each of the eight states, not just a status code; an unambiguous match auto-links and persists `link_source = convention`; a second render does not write again (assert `updated_at` / a write count); the chooser links the selected candidate as `manual`; the picker lists only files inside the base and a submitted filename outside it is refused at the action boundary; `Clear link` writes the tombstone, **leaves the file on disk** (`assertFileExists` after) and the next render does not re-link; `Use the convention again` deletes the row and re-resolves; the path renders and is copyable; the preview region carries `role="region"`, `tabindex="0"` and its accessible name; the panel behaves identically on a cancelled occurrence
      4. `TranscriptDurabilityTest`: a link survives an `EventSynchronizer` run that retitles, reschedules and relocates the occurrence and stays reachable at the same route; **a retitle does not invalidate a convention link even though the slug no longer matches** — the persisted path wins over re-derivation; survives upstream `STATUS:CANCELLED`; survives deletion of the `calendar_events` row and re-attaches when the same (`source_uid`, `recurrence_id`) reappears; **changing `KBMS_TRANSCRIPT_PATTERN` does not break an existing persisted link** — the criterion the `link_source` column exists for
      5. Extend `AgendaPageTest`: linked meeting badges `Transcript`; a broken link badges `Not annotated`; notes + transcript badges both; a transcript on one occurrence of the series does not badge its siblings
      6. Extend `MeetingDetailTest` for the panel's presence on the detail route
      7. `php artisan test`
      8. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Eight states asserted by wording, not by status code
      - [x] Auto-link writes once; ambiguity writes nothing
      - [x] Tombstone precedence and file preservation both asserted
      - [x] Traversal refused at the Livewire action boundary, not only in the unit layer
      - [x] Pattern change does not break an existing link
      - [x] Full suite green; Pint + Larastan level 5 clean

      ## Git Deliverables
      - Commit: `test(US-007): TASK-11 cover transcript panel, coverage and durability`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
