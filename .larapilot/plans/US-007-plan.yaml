    id: TASK-07
    title: 'Add MeetingTranscript with migration, factory and seeder'
    body: |-
      ## Description
      The persisted association, plus the demo data that makes every panel state visible after a plain `migrate:fresh --seed`. Plan §4 and `## Test Data Strategy`.

      **Do not add a foreign key to `calendar_events`,** and **do not add an Eloquent relation** between the two — identical reasoning to `meeting_notes`, recorded as decision `meeting note storage keying`: the only targetable column is the surrogate UUID a resync may change, and `hasOne(...)->where('event_recurrence_id', $this->recurrence_id)` cross-contaminates siblings under `with()`.

      **`path` is nullable on purpose.** A row with `link_source = manual` and `path = NULL` is the manual-unlink tombstone (recorded decision `transcript clear link semantics`) — it is what stops the convention from re-linking a file the operator just rejected. Do not add a `NOT NULL` constraint.

      ## Files Involved
      - app/Models/MeetingTranscript.php
      - database/migrations/xxxx_create_meeting_transcripts_table.php
      - database/factories/MeetingTranscriptFactory.php
      - database/seeders/MeetingTranscriptSeeder.php
      - database/seeders/DatabaseSeeder.php

      ## Steps
      1. `php artisan make:model MeetingTranscript -mf --no-interaction`
      2. Migration: `uuid('id')->primary()`, `string('event_uid')`, `string('event_recurrence_id')->default('')`, `string('path')->nullable()`, `string('link_source')`, `unsignedBigInteger('file_size')->nullable()`, `timestamp('file_mtime')->nullable()`, `timestamp('linked_at')->nullable()`, `timestamps()`, `unique(['event_uid','event_recurrence_id'])`. No foreign key
      3. Model: `HasFactory`, `HasUuids`, `$guarded = []`, `@property` PHPDoc matching `MeetingNote`'s style, `link_source` cast to `TranscriptLinkSource`, `scopeForOccurrence(Builder, OccurrenceKey)`, `occurrenceKey()`, `isSuppressed(): bool` (`manual` + null path) and `isManual(): bool`
      4. Factory: `forOccurrence(CalendarEvent)`, plus states `convention()`, `manual()`, `suppressed()`, `broken()`
      5. `MeetingTranscriptSeeder` — writes real sample files into `storage/app/transcripts/` (gitignored; the **seeder** writes there, the application never does), rendering filenames through `TranscriptPattern::render()` so demo data cannot drift from the matcher. Produce: an exact match for today's `Client kickoff` (`.md`, realistic multi-speaker content); a −3 min drift match on **exactly one** occurrence of the `Weekly sync` series; **two** in-tolerance files for `Design review` so the chooser is on screen; a `.txt` for `Sprint planning`; a `manual` link on `Architecture discussion` to a file matching no pattern; a `broken()` row on `Retro` whose file is deliberately not created; `Budget review` (cancelled) and the empty day left alone. Resolve targets by querying `calendar_events` so the seeder cannot drift from `CalendarEventSeeder`
      6. Register in `DatabaseSeeder` **after** `CalendarEventSeeder`
      7. `php artisan migrate:fresh --seed`, then point `KBMS_TRANSCRIPTS_PATH` at `storage/app/transcripts` and confirm the agenda shows mixed `Notes` / `Transcript` / `Not annotated`
      8. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `meeting_transcripts` exists with the composite unique index, a nullable `path`, and **no** foreign key
      - [x] No Eloquent relation added between `CalendarEvent` and `MeetingTranscript`
      - [x] `migrate:fresh --seed` succeeds and the seeded series carries a transcript on exactly one occurrence
      - [x] Sample files land in `storage/app/transcripts/` and are gitignored
      - [x] Pint + Larastan level 5 clean

      ## Test Data
