code: US-007
plan_body: |
  ## Technical Solution

  US-007 joins the second of the product's two sources to the first. Everything in it follows from one asymmetry the PRD states outright: **the pipeline owns the files, this application owns nothing but the association.** So the tool reads on demand, never copies, never writes and never deletes a transcript — and the only thing it persists is a path plus how that path was chosen.

  The spec's nineteen acceptance criteria collapse into four hard problems: compiling a *configurable* convention into something matchable, tolerating drift without guessing, refusing to leave the transcripts directory, and reading a file that may be enormous, missing, or unreadable — each of those a distinct state, never one collapsed "error".

  ### 1. Where the code lives (John)

  A new `app/Transcripts/` domain folder, sibling to the existing `app/Calendar/` and `app/Meetings/`. That mirrors the shape already in the repo: `Calendar` holds the ICS integration, `Transcripts` holds the filesystem integration, `Meetings` holds the surfaces that compose them. Nothing new is introduced at the `app/` root beyond that one folder.

  | Class | Responsibility |
  | --- | --- |
  | `App\Transcripts\TranscriptsDirectory` | Canonical base path, the one-shot file index, containment checks. Bound **`scoped`** so an agenda render lists the directory once. |
  | `App\Transcripts\TranscriptPattern` | Compiles `KBMS_TRANSCRIPT_PATTERN` into a regex **once**; parses an indexed filename into (datetime, slug part). |
  | `App\Transcripts\TranscriptResolver` | Tolerance window → ordered candidates; the one place that decides link vs. ambiguity vs. nothing. |
  | `App\Transcripts\TranscriptCandidate` | Readonly DTO: absolute path, filename, drift minutes, bytes, mtime, whether the slug matched. |
  | `App\Transcripts\TranscriptReader` | Bounded, UTF-8-safe read; distinguishes missing / unreadable / rejected. |
  | `App\Transcripts\TranscriptState` | Backed enum: the eight states below. |
  | `App\Transcripts\TranscriptLinkSource` | Backed enum `convention` \| `manual`. |
  | `App\Models\MeetingTranscript` | The persisted association. |
  | `App\Livewire\TranscriptPanel` | The meeting-detail surface. Named `TranscriptPanel`, **not** `MeetingTranscript`, to avoid colliding with the model. |

  `MarkdownRenderer` is **reused, not duplicated**. It already applies `html_input => escape`, `allow_unsafe_links => false` and `max_nesting_level => 20` (US-006 §2), and a transcript is far more obviously untrusted third-party content than a note the operator typed. Do not introduce a second converter, and do not call `Str::markdown()` anywhere outside that class.

  ### 2. The pattern is compiled once, not matched per meeting (Mike + Alex)

  The naive reading of "tolerate drift" is: for each meeting, render the pattern at every minute in the window and test every filename against every rendering. On a week of 30 rows with a ±10-minute window that is 30 × 21 prefix comparisons against the whole directory.

  Invert it instead. `KBMS_TRANSCRIPT_PATTERN` is compiled **once per request** into a regex — literals escaped, placeholders substituted:

  | Placeholder | Renders as | Regex |
  | --- | --- | --- |
  | `{date}` | `Y-m-d` | `(\d{4}-\d{2}-\d{2})` |
  | `{time}` | `Hi` | `(\d{4})` |
  | `{slug}` | `Str::slug($summary)` | `(.*)` |

  **`{time}` is `Hi`, with no colon** — a filename cannot portably carry `:` (it is the legacy path separator on macOS), and the recorded `transcript filename convention` decision's own example is `2026-09-07-1430-standup.md`. Note the deliberate divergence from `KBMS_OUTLOOK_URL_TEMPLATE`, where `{time}` *is* `H:i`. The two templates address different media; the README and `.env.example` must say so, because a silent mismatch here produces zero matches and no error.

  Every file in the index is parsed once through that regex into `(datetime, slugPart)` and bucketed into a map keyed `Y-m-d H:i`. Resolution is then 21 map lookups per meeting. Filenames the regex does not match are simply not candidates — an unparseable name is not an error, it is a file this convention does not claim.

  The pattern must end with `{slug}`: the acceptance criterion says the trailing portion varies freely and the prefix carries identity. A pattern that puts `{slug}` before `{date}` still compiles, but `(.*)` would swallow the date — validate at compile time and fall back to the packaged default with a logged warning rather than matching nothing in silence.

  ### 3. Tolerance, ambiguity, and the refusal to guess (Tom + Alex)

  For a timed occurrence starting at local `S`, candidates are every indexed file in `[S − tolerance, S + tolerance]`, ordered by absolute drift, then exact-slug-match first, then filename. `KBMS_TRANSCRIPT_TOLERANCE_MINUTES` defaults to **10**.

  | Candidate count | Outcome |
  | --- | --- |
  | 0 | `Missing` — no transcript found; the picker is still offered |
  | 1 | Auto-link, `link_source = convention` |
  | ≥ 2 | `Ambiguous` — every candidate surfaced with its drift and size, operator chooses |

  **An exact-minute match does not break a tie.** Three candidates where one has zero drift and an exactly-matching slug still renders the chooser, because the spec says the resolver surfaces them and does not guess, and `states.html` draws precisely that case with the exact-prefix file merely pre-selected. The slug is a *hint that orders the list*, never a filter and never a tiebreaker that links on its own.

  **All-day occurrences** have no meaningful start minute, so they match on `{date}` alone across every time. Two files on that date are two candidates, and the operator chooses — the same rule, with a wider window.

  Auto-linking is a write, so it happens **only** when the meeting detail page resolves — never from the agenda. An agenda render must not mutate thirty rows as a side effect of being looked at.

  ### 4. Persistence, and the manual-unlink tombstone (Mike + Violet)

  `meeting_transcripts` — `id` (UUID), `event_uid`, `event_recurrence_id` (default `''`), `path` (**nullable**), `link_source` (`convention` \| `manual`), `file_size` (nullable), `file_mtime` (nullable), `linked_at` (nullable), timestamps, `unique(['event_uid','event_recurrence_id'])`.

  **No foreign key to `calendar_events`, for exactly the reason recorded for `meeting_notes`** (decision `meeting note storage keying`): the only targetable column is the UUID surrogate `id`, which is precisely the identity a resync may change, and a cascade would hand the feed a route to destroy operator data. **No Eloquent relation either** — Eloquent has no composite-key relation, and the `hasOne(...)->where('event_recurrence_id', $this->recurrence_id)` workaround applies one parent's recurrence id to the whole `whereIn` batch under `with()`, cross-contaminating siblings. Reads go through `scopeForOccurrence(OccurrenceKey)` and the batched lookup in §8.

  Precedence, in order:

  1. **A `manual` row wins absolutely** — including a row whose `path` is `NULL`.
  2. A `convention` row is revalidated (§5) and used; if its file is gone it renders `Broken` and the row is **kept**, never silently re-resolved to some other file. `states.html`: *"The link is kept so nothing is lost silently."*
  3. No row → resolve by convention (§3).

  `path` is nullable to carry the **manual-unlink tombstone** (recorded decision `transcript clear link semantics`). Without it, `Clear link` on a convention-resolved file is a no-op the operator can see: the next render finds the same single candidate and re-links it. With it, clearing writes `link_source = manual, path = NULL`, the panel states *"the convention will not re-link this meeting"*, and a `Use the convention again` action deletes the row to reopen convention resolution. That is `a manual link always wins` applied honestly to a manual **non**-link.

  `file_size` / `file_mtime` are link-time provenance. The panel footer shows the **current** stat, so a file that changed under the link is visible rather than described from a stale row. Neither column, nor any other, ever holds transcript **content** — PRD privacy obligation 3.

  ### 5. Containment: nothing escapes `KBMS_TRANSCRIPTS_PATH` (Lars)

  `TranscriptsDirectory` resolves the base with `realpath()` once. Unset, non-existent, not a directory, or unreadable → `NotConfigured`, which is a configuration prompt, never an exception (`states.html`: *"Set `KBMS_TRANSCRIPTS_PATH` … A configuration prompt — not an error page."*).

  Containment has one subtlety worth stating, because getting it wrong collapses two states the spec requires to stay distinct: **`realpath()` returns `false` for a file that does not exist**, so it cannot be the only check — a deleted-but-legitimate path would report as an escape attempt rather than a broken link. Therefore:

  1. Reject any candidate name containing a directory separator, a null byte, or `..` **before** joining it to the base.
  2. **Lexically** canonicalize the joined path (resolve `.` / `..` on the string) and require the base plus a separator as a prefix. Failing this is `Rejected`, whether or not the file exists.
  3. Only then `realpath()`. If it succeeds and the *resolved* path falls outside the base — a symlink pointing out of the directory — that is also `Rejected`.
  4. A path that passes 1–3 but does not exist is `Broken`. One that exists and is not readable is `Unreadable`.

  Every persisted path is revalidated on **every** read, not only at link time: `KBMS_TRANSCRIPTS_PATH` is a `.env` value that can change under a stored absolute path.

  The picker (recorded decision `transcript manual override mechanism`) removes most of this surface by construction — the operator can only select an entry the server itself indexed inside the base — but the server revalidates the submitted choice anyway, because a Livewire action parameter is client input.

  ### 6. Bounded, on-demand reading (Alex + Anne)

  `KBMS_TRANSCRIPT_PREVIEW_BYTES` defaults to **2 MiB** (`2097152`).

  - **Never `file_get_contents()`.** `fopen` + a single `fread($handle, $limit + 1)`: the extra byte is how truncation is detected without reading the rest of the file.
  - Truncate on a UTF-8 boundary with `mb_strcut($chunk, 0, $limit, 'UTF-8')`. A byte-count truncation mid-codepoint yields invalid UTF-8, which Blade renders as a replacement character and CommonMark can choke on.
  - Truncated reads render the mockup's notice: *"showing first 2 MB — open the file for the rest"*.
  - `.md` → `MarkdownRenderer`. `.txt` → escaped text in `kb-scroll--mono` (`white-space: pre-wrap`). Extension decides, and the footer states which rendering was applied.
  - Content is read at render time and held only for that render. Nothing is cached to disk or database.

  ### 7. The eight states, and why they must not collapse (Elise + Tom)

  `states.html` says it plainly: *"'Missing', 'unreadable' and 'unconfigured' must not collapse into one message."* The wording is contract, not decoration — Anne asserts the distinguishing strings, not just a status code.

  | State | Surface |
  | --- | --- |
  | `NotConfigured` | `kb-empty`: *Transcripts directory not configured* + `KBMS_TRANSCRIPTS_PATH` + `php artisan kbms:doctor` |
  | `Missing` | No transcript found for this meeting; `Browse for a file…` offered |
  | `Ambiguous` | `kb-panel` chooser: radio per candidate with drift (`−2 min`) and size, `Link selected` + `Browse for another file…`, `Choose one` warn tag |
  | `Linked` | `Linked by convention` / `Linked manually` tag, copyable absolute path, bounded scroll preview, footer `{size} · modified {when} · .md rendered as Markdown`, `Relink…` + `Clear link` |
  | `Broken` | `kb-banner` alert: *Linked file is gone*, the path, *The link is kept so nothing is lost silently*, `Relink…` + `Clear link` |
  | `Unreadable` | `kb-banner` alert: *File exists but is not readable* — *the fix is different: `chmod`, not relink* |
  | `Rejected` | `Rejected` tag: a resolved path escaping the base is refused outright, whether or not the file exists |
  | `Suppressed` | Manual unlink: *the convention will not re-link this meeting* + `Use the convention again` |

  Panel chrome follows the mockup's owned-surface contract: `Yours` flag, `kb-scroll` with `tabindex="0"`, `role="region"` and an accessible name so it is keyboard-scrollable, and the footer line **Read on demand — never copied into the database**. That last string is a stated privacy commitment; keep it.

  ### 8. Coverage on the agenda without an N+1 (Mike)

  `MeetingCoverage::$hasTranscript` is the hard `false` US-005 left marked for this spec, and the agenda blade already renders the `Transcript` badge behind it — no view restructuring is needed, which is what the seam was for.

  `MeetingCoverageLookup::for()` gains one batched `meeting_transcripts` query (`whereIn('event_uid', …)`, served by the composite unique index on its leftmost prefix) and consults the **already-built** directory index for convention candidates. The agenda page goes from **two queries to three**, plus exactly one directory listing per request — hence `TranscriptsDirectory` being bound `scoped`. The existing `DB::listen` count assertion in `MeetingCoverageLookupTest` must be updated deliberately, not deleted; the US-006 rework already caught one stale-and-inert version of it.

  `hasTranscript` is defined narrowly and honestly: **a transcript is linked and currently readable**. `Broken`, `Unreadable`, `Ambiguous` and `Suppressed` all badge `false`, because the agenda's three-tag vocabulary (`Notes` / `Transcript` / `Not annotated`) has no room for "probably, pending a choice", and claiming coverage the meeting page then contradicts is worse than under-claiming. The docblocks on `MeetingCoverage` and `MeetingCoverageLookup` currently say the opposite is pending — update them in the same task.

  ### 9. Configuration surface additions (Albert)

  Two new keys, both with working defaults, plus a fixed extension list in `config/kbms.php` (not env — one place, not two):

  | Key | Default |
  | --- | --- |
  | `KBMS_TRANSCRIPT_TOLERANCE_MINUTES` | `10` |
  | `KBMS_TRANSCRIPT_PREVIEW_BYTES` | `2097152` |
  | `kbms.transcript_extensions` (no env) | `['md', 'txt']` |

  `config/kbms.php`'s array-shape PHPDoc, `.env.example`, **both** assertions in `ConfigurationSurfaceTest`, the README configuration section, and the PRD `### Configuration surface` list all move together. The PRD also gains a revision-history row (living document) recording the two keys, the `{time}` = `Hi` divergence, and the nullable `path` on `meeting_transcripts`.

  ### 10. Out of scope, stated rather than assumed

  - **FR-014 unmatched-transcript inbox** and the `kbms:scan-transcripts` command — Future Phases. `TranscriptsDirectory` deliberately exposes the index that FR-014 will need, but nothing lists orphans in US-007.
  - **FR-013 FTS5 indexing of transcript content** — Future Phases, and it would be the first derived copy of content, so it needs its own rebuildable/droppable design.
  - **Recursive directory scanning.** The convention is flat and the index is a single-level listing. A nested pipeline layout is a pattern change, not a code change — say so in the README instead of walking arbitrary depth.
  - **US-009 launch bridge.** This spec produces the resolved context path that FR-008 consumes; the `Ask Claude Code` placeholder panel stays untouched.
  - **Writing, editing, moving or deleting a transcript file.** Never, in any release. The pipeline owns them (PRD privacy obligation 2).

  ## Git & Branching

  - **Mode:** `GITFLOW` (from `settings.git_mode`) — branch, atomic per-task commits, PR body prepared **locally**; nothing is pushed.
  - **Branch point:** `feature/US-007-transcript-linking` from `develop`. `develop` is at `999d2aa` (the US-006 merge), so this branches cleanly.
  - Per task: one Conventional Commit `type(US-007): TASK-NN summary`. No batched multi-task commits.
  - `php artisan larapilot:quality` (Pint + Larastan level 5) green before every `task-done`.
  - `CHANGELOG.md` `[Unreleased]` entry lands with the docs task, not after review.
  - Merge to `develop` only after human `larapilot-review` approval.

  ## Test Data Strategy

  - **New model → new factory, same task as the migration.** `MeetingTranscriptFactory` with `forOccurrence(CalendarEvent $event)` deriving both key columns, and states `convention()`, `manual()`, `suppressed()` (manual + `path = null`), `broken()` (a path inside the base that does not exist).
  - **`MeetingTranscriptSeeder` writes real sample files.** Static fixture files cannot work: the seeded calendar is relative to *today*, so filenames matching the convention have to be generated. The seeder renders them through `TranscriptPattern` — the same compiler the resolver uses, so the demo data cannot drift from the matcher — into `storage/app/transcripts/` (already gitignored; dev-only, and it is the *seeder* writing there, never the application). It produces:
    - an **exact match** for today's `Client kickoff` (`.md`, realistic multi-speaker transcript);
    - a **drift match** at −3 minutes for one occurrence of the `Weekly sync` series, and for that same occurrence **only** — sibling isolation must be visible in the running app, not merely green in the suite;
    - **two files within tolerance** for `Design review`, so the chooser is on screen after a plain `migrate:fresh --seed`;
    - a `.txt` for `Sprint planning`, so both rendering modes are demonstrable;
    - a **manual** link on `Architecture discussion` pointing at a file whose name matches no pattern at all, proving manual precedence;
    - a **broken** row on `Retro` whose file the seeder deliberately does not create;
    - `Budget review` (cancelled) left unlinked, and the empty day left alone.
  - README documents `KBMS_TRANSCRIPTS_PATH=/absolute/path/to/repo/storage/app/transcripts` as the local-dev pointer, and states that the application only ever reads it.
  - `php artisan migrate:fresh --seed` must produce an agenda with mixed `Notes` / `Transcript` / `Not annotated` badges before the entity task is done.

  ## Test Strategy

  **Bar: `NORMAL`** (from `settings.testing`) — PHPUnit feature and unit tests. No Playwright, Dusk, Pest browser, or viewport matrix. Test tasks interleave with implementation rather than stacking at the end. Every filesystem test builds its own temporary directory and tears it down, so nothing depends on a real pipeline directory.

  | Layer | Coverage |
  | --- | --- |
  | Unit — `TranscriptsDirectoryTest` | Unset / missing / file-not-directory / unreadable base each report `NotConfigured` rather than throwing; the index lists only `.md` and `.txt` (case-insensitive) at one level and does not recurse; `..`, a separator and a null byte in a name are rejected pre-join; a symlink inside the base pointing **outside** it is `Rejected`; a **missing** path inside the base is `Broken`, not `Rejected` — the two must not collapse |
  | Unit — `TranscriptPatternTest` | The default `{date}-{time}-{slug}` compiles and parses `2026-09-07-0930-q4-roadmap-review`; `{time}` parses `0930`, never `09:30`; a custom pattern with different literals compiles; a filename the regex does not match yields no candidate and no error; a pattern lacking `{slug}` or ordering it before `{date}` falls back to the default with a warning instead of matching nothing silently; regex metacharacters in the literal portion are escaped |
  | Unit — `TranscriptResolverTest` | Exact-minute single file links by convention; a −2 min file inside tolerance links; a +11 min file outside a 10-minute tolerance does not; **three files in the window return three ordered candidates and link nothing** — including when one is an exact datetime *and* slug match; candidate ordering is drift, then slug match, then name; an all-day occurrence matches every file on its date; a manual row (and a `NULL`-path manual tombstone) short-circuits resolution entirely; resolution is minute-map lookups, not an O(rows × window × files) scan (`TranscriptPattern` compiled once — assert the regex is built a single time for N events) |
  | Unit — `TranscriptReaderTest` | A file larger than the configured cap returns exactly the cap, flags truncation and renders the notice; truncation lands on a **UTF-8 boundary** for multibyte content (assert `mb_check_encoding`); a file at exactly the cap is not falsely flagged; a missing file is `Broken` and an unreadable one (`chmod 000`) is `Unreadable` — asserted as different states *and* different strings; `.md` renders through `MarkdownRenderer` so an embedded `<script>` in a transcript is **escaped**; `.txt` is escaped, never Markdown-converted |
  | Unit — `MeetingTranscriptTest` | `forOccurrence()` hits the composite key and not a sibling; the unique constraint rejects a second row per occurrence; `link_source` casts to the enum; a `NULL`-path manual row is valid and reads as suppressed |
  | Unit — `MeetingCoverageLookupTest` (extended) | A readable linked transcript flags its occurrence and only its occurrence; broken, unreadable, ambiguous and suppressed all flag **false**; an un-linked occurrence with exactly one convention candidate flags true; the batch issues the documented query count for N events and lists the directory **once** — the assertion is updated, not deleted, and must be able to fail |
  | Feature — `TranscriptPanelTest` (Livewire) | Each of the eight states renders its own distinguishing string from `states.html`; an unambiguous convention match auto-links on first render and persists `link_source = convention`; a second render does not write again; the ambiguous chooser links the selected candidate as `manual`; the picker lists only files inside the base and a submitted path outside it is refused server-side; `Clear link` writes the tombstone, keeps the file on disk (assert `is_file` after) and the next render does **not** re-link; `Use the convention again` deletes the row and re-resolves; the absolute path is rendered and copyable; the preview region carries `role="region"`, `tabindex="0"` and an accessible name; the panel behaves identically on a cancelled occurrence |
  | Feature — `TranscriptDurabilityTest` | A link survives an `EventSynchronizer` run that retitles, reschedules and relocates the occurrence and is still reachable at the same route; **a retitle does not invalidate a convention link** even though the slug no longer matches — the persisted path wins over re-derivation; survives upstream `STATUS:CANCELLED`; survives deletion of the `calendar_events` row and re-attaches when the same (`source_uid`, `recurrence_id`) reappears; changing `KBMS_TRANSCRIPT_PATTERN` does not break an existing persisted link |
  | Feature — `AgendaPageTest` (extended) | A linked meeting renders the `Transcript` badge; a broken link renders `Not annotated`, not `Transcript`; a meeting with both renders both badges; a transcript on one occurrence of the seeded series does not badge its siblings |
  | Feature — `ConfigurationSurfaceTest` (extended) | The two new keys resolve to their documented defaults and appear in `.env.example` |

  **Manual test handoff** (Anne — required at this bar for UI, per the mockup test contract): keyboard-only pass over the transcript panel — tab into the preview region and scroll it with the arrow keys, reach `Relink…` / `Clear link`, open the picker modal, filter, select and dismiss with `Esc`, confirm focus returns to the trigger; copy the path with the keyboard and verify the clipboard; point `KBMS_TRANSCRIPTS_PATH` at a directory containing a genuinely large transcript and confirm the page still renders promptly with the truncation notice; `chmod 000` a linked file and confirm the unreadable wording; delete a linked file and confirm the broken wording; theme toggle in both directions with a rendered transcript; 375 px pass against `mobile.html`.
