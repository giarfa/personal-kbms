    id: TASK-05
    title: 'Add the bounded, UTF-8-safe TranscriptReader'
    body: |-
      ## Description
      Read a linked file for display without ever loading it whole and without collapsing missing / unreadable / rejected into one failure. Plan §6. Shares no files with TASK-03, so it can run beside it.

      **Never `file_get_contents()`.** `fopen` + one `fread($handle, $limit + 1)`: the extra byte detects truncation without reading the remainder of a 40 MB file.

      **Truncate on a UTF-8 boundary.** A byte-count cut mid-codepoint produces invalid UTF-8, which renders as a replacement character and can upset CommonMark. Use `mb_strcut($chunk, 0, $limit, 'UTF-8')`.

      **Reuse `MarkdownRenderer`.** It already escapes HTML input, blocks unsafe links and bounds nesting (US-006 §2), and a transcript is more obviously untrusted than a note the operator typed. Do not add a second converter and do not call `Str::markdown()` here.

      ## Files Involved
      - app/Transcripts/TranscriptReader.php
      - app/Transcripts/TranscriptContent.php

      ## Steps
      1. `php artisan make:class Transcripts/TranscriptReader --no-interaction`; `TranscriptContent` as a `final readonly` DTO (rendered `HtmlString` or escaped text, `isMarkdown`, `truncated`, `bytesRead`, `totalBytes`, `modifiedAt`)
      2. `read(string $absolutePath): TranscriptContent|TranscriptState` — revalidate containment through `TranscriptsDirectory` **on every read** (the base is a `.env` value that can change under a stored absolute path); then `is_file` → `Broken`, `is_readable` or a failed `fopen` → `Unreadable`, containment failure → `Rejected`
      3. Read at most `config('kbms.transcript_preview_bytes')`; flag truncation from the `limit + 1` probe; cut with `mb_strcut`
      4. `.md` → `MarkdownRenderer::render()`; `.txt` → escaped text for `kb-scroll--mono`. Extension decides; the footer (TASK-09) states which applied
      5. Do not use the `@` suppression operator anywhere; every failure is an explicit branch returning a state
      6. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] A file larger than the cap reads exactly the cap and reports truncation
      - [x] Truncated multibyte content is still valid UTF-8
      - [x] Missing, unreadable and rejected return three different states
      - [x] `file_get_contents` appears nowhere in the class; no `@` suppression
      - [x] Markdown goes through the existing `MarkdownRenderer`
      - [x] Pint + Larastan level 5 clean

      ## Test Data
      - N/A — no model or schema change in this task

      ## Git Deliverables
      - Commit: `feat(US-007): TASK-05 add bounded transcript reader`
      - Push: **skip** (`git_mode: GITFLOW`)
