    id: TASK-02
    title: 'Add TranscriptsDirectory and the compiled TranscriptPattern'
    body: |-
      ## Description
      The two primitives every later task builds on: the canonical, containment-checked base directory with its one-shot file index, and the pattern compiler that turns `KBMS_TRANSCRIPT_PATTERN` into a regex once. Plan §2 and §5.

      **Do not resolve candidates here** — no meeting, no tolerance, no persistence. This task knows about files and filenames only.

      **The containment trap, in full (plan §5).** `realpath()` returns `false` for a file that does not exist, so it cannot be the only check: a deleted-but-legitimate path would report as an escape attempt and collapse `Broken` into `Rejected`, which the spec requires to stay distinct. Reject separators / null bytes / `..` pre-join, canonicalize **lexically** and compare the prefix, and only then `realpath()` to catch a symlink pointing out of the base.

      ## Files Involved
      - app/Transcripts/TranscriptsDirectory.php
      - app/Transcripts/TranscriptPattern.php
      - app/Providers/AppServiceProvider.php

      ## Steps
      1. `php artisan make:class Transcripts/TranscriptsDirectory --no-interaction` and `php artisan make:class Transcripts/TranscriptPattern --no-interaction`
      2. `TranscriptsDirectory`: `configured(): bool`; `base(): ?string` (`realpath` of `config('kbms.transcripts_path')`, must be a readable directory, `null` otherwise); `files(): array<string, int>` — single-level listing of `kbms.transcript_extensions` (case-insensitive), memoized for the instance's lifetime, mapping absolute path to mtime; `contains(string $path): bool` implementing steps 1–3 of the containment rule; `resolve(string $filename): ?string` joining a bare filename to the base with the same checks. **No recursion.**
      3. `TranscriptPattern`: `::compile(): self` from config; escapes literals, substitutes `{date}` → `(\d{4}-\d{2}-\d{2})`, `{time}` → `(\d{4})`, `{slug}` → `(.*)`; `parse(string $basename): ?ParsedFilename` returning the datetime and slug part, `null` when the name does not match; `render(CarbonInterface $at, string $slug): string` for the seeder (TASK-07) so demo data and matching share one compiler
      4. Validate at compile time that the pattern contains `{date}` and ends with `{slug}`; on failure `Log::warning()` and fall back to the packaged default rather than compiling a regex that matches nothing in silence
      5. Bind `TranscriptsDirectory` as **`scoped`** in `AppServiceProvider` — the agenda must list the directory once per request, not once per row (plan §8)
      6. Docblocks must record why `realpath()` alone is wrong and why `{time}` is `Hi` and not `H:i`. The next reader must not "simplify" either
      7. `php artisan larapilot:quality`

      ## Completion Criteria
