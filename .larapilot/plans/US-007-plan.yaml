    title: 'Extend the configuration surface with tolerance and preview bounds'
    body: |-
      ## Description
      Add the two new `.env` keys the resolver and reader need, plus the fixed extension list, and keep every place that documents the configuration surface in step. See plan `## Technical Solution` §9.

      The surface is tested in three places at once (`config/kbms.php` PHPDoc, `.env.example`, `ConfigurationSurfaceTest`) — that is deliberate, and all three move in this task.

      ## Files Involved
      - config/kbms.php
      - .env.example
      - tests/Feature/ConfigurationSurfaceTest.php

      ## Steps
      1. `config/kbms.php`: add `'transcript_tolerance_minutes' => (int) env('KBMS_TRANSCRIPT_TOLERANCE_MINUTES', 10)`, `'transcript_preview_bytes' => (int) env('KBMS_TRANSCRIPT_PREVIEW_BYTES', 2097152)`, and `'transcript_extensions' => ['md', 'txt']` (no env — one place, not two)
      2. Extend the file's array-shape PHPDoc with the three new entries, matching the existing style
      3. `.env.example`: add both keys with their defaults under the Personal KBMS block. Add a comment above `KBMS_TRANSCRIPT_PATTERN` documenting the placeholder grammar — `{date}` = `Y-m-d`, `{time}` = `Hi` (**no colon**, unlike `KBMS_OUTLOOK_URL_TEMPLATE` where `{time}` is `H:i`), `{slug}` = slugified title — and stating that the pattern must end with `{slug}`
      4. `ConfigurationSurfaceTest`: add both keys to the documented-defaults assertions **and** to the `.env.example` key list
      5. `php artisan test --filter=ConfigurationSurfaceTest`
      6. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Both keys resolve to their documented defaults with no `.env` entry
      - [x] `.env.example` documents both keys and the `{time}` = `Hi` divergence
      - [x] Array-shape PHPDoc covers all three new config entries
      - [x] `ConfigurationSurfaceTest` green and asserts the new keys in both tests
      - [x] Pint + Larastan level 5 clean

      ## Test Data
      - N/A — no model or schema change in this task

      ## Git Deliverables
      - Commit: `feat(US-007): TASK-01 add transcript tolerance and preview configuration`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
