    id: TASK-09
    title: 'Build the TranscriptPanel Livewire component with all eight states'
    body: |-
      ## Description
      The meeting-detail surface: resolve, auto-link, preview, relink, clear, and every failure state as its own message. Plan §4, §6 and §7. This replaces the `Transcript linking arrives with US-007.` placeholder in `resources/views/pages/meeting.blade.php` — the seam US-005 left open.

      Class-based Livewire per the recorded `livewire component style` decision (`--class`), tested with `php artisan make:test --phpunit`, and named `TranscriptPanel` so it does not collide with the `MeetingTranscript` model.

      **Store the occurrence's natural key, never the model** — a Livewire-hydrated model reintroduces the surrogate id as identity (US-006 §3).

      **The wording is the contract.** `states.html` says missing, unreadable and unconfigured must not collapse into one message. Each of the eight states carries its own string, and Anne asserts them in TASK-11.

      **`<flux:tab.group>` is Flux Pro and unavailable** — irrelevant here, but `<flux:modal>` **is** in the free set and carries the picker, exactly as it carries the US-006 delete dialog.

      ## Files Involved
      - app/Livewire/TranscriptPanel.php
      - resources/views/livewire/transcript-panel.blade.php
      - resources/views/pages/meeting.blade.php

      ## Steps
      1. `php artisan make:livewire TranscriptPanel --class`
      2. `mount(CalendarEvent $occurrence)`: store `eventUid` / `eventRecurrenceId` as `#[Locked]`; read any `meeting_transcripts` row; apply the §4 precedence — a `manual` row (path set **or** null) wins absolutely, a `convention` row is revalidated and kept even when broken, no row falls through to `TranscriptResolver`
      3. **Auto-link only here, only on an unambiguous convention match**, persisting `path`, `link_source = convention`, `file_size`, `file_mtime`, `linked_at`. A second render must not write again
      4. `Ambiguous`: render the candidate list with drift (`−2 min`) and size, `Link selected` and `Browse for another file…`; `link(string $filename)` re-validates the submitted name against `TranscriptsDirectory` server-side before persisting as `manual` — a Livewire action parameter is client input
      5. Picker modal (`<flux:modal>`): newest-first list of the indexed files with a filter box, per the recorded `transcript manual override mechanism` decision. **No free-text path field** and no `<input type="file">` — the latter never yields an absolute host path
      6. `clearLink()`: write the tombstone (`link_source = manual`, `path = NULL`) — **never** delete the file, and assert nothing on disk changes. `useConvention()`: delete the row and re-resolve
      7. `Linked`: `Linked by convention` / `Linked manually` tag, the absolute path in `kb-path` with the copy button, the bounded preview in `kb-scroll` (`role="region"`, `tabindex="0"`, accessible name `Transcript preview, scrollable`), footer `{size} · modified {when} · .md rendered as Markdown` plus **Read on demand — never copied into the database**
      8. Truncated reads render the `showing first 2 MB — open the file for the rest` notice
      9. `Broken` / `Unreadable` / `Rejected` / `Suppressed` / `NotConfigured` each render their own `kb-banner` or `kb-empty` with the mockup's wording, including the `chmod`-not-relink hint and the `php artisan kbms:doctor` pointer
      10. Mount into `pages/meeting.blade.php` as `<livewire:transcript-panel :occurrence="$row->event" />`, replacing the placeholder section
      11. Verify manually at 1280 and 375 px in both themes
      12. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] All eight states render, each with its own distinguishing wording
      - [x] Unambiguous convention matches auto-link once; ambiguity links nothing until the operator chooses
      - [x] Manual links and the tombstone both win over the convention
      - [x] `Clear link` leaves the file on disk
      - [x] The absolute path is displayed and copyable; the preview region is keyboard-scrollable with an accessible name
      - [x] Placeholder removed from `pages/meeting.blade.php`
      - [x] No inline `style` attributes; styling comes from TASK-08's `kb-*` classes
      - [x] Pint + Larastan level 5 clean

