    id: TASK-12
    title: 'Document the transcript surface and update the PRD'
    body: |-
      ## Description
      Baseline documentation only, per the recorded `documentation scope` decision — README, `.env.example` comments (landed in TASK-01), `CHANGELOG.md`, and the PRD as a living document. No OpenAPI (no public API), no diagrams, no manuals.

      ## Files Involved
      - README.md
      - CHANGELOG.md
      - .larapilot/docs/PRD.md

      ## Steps
      1. README: a transcript section covering the filename convention and its placeholder grammar (`{date}` = `Y-m-d`, `{time}` = **`Hi`**, `{slug}`; the pattern must end with `{slug}`), the **explicit contrast** with `KBMS_OUTLOOK_URL_TEMPLATE`'s `{time}` = `H:i`, the drift tolerance and its default, the preview byte cap, that resolution is **single-level and non-recursive** (a nested pipeline layout is a pattern change, not a code change), that the application only ever **reads** the directory, and the local-dev pointer `KBMS_TRANSCRIPTS_PATH=/absolute/path/to/repo/storage/app/transcripts` for the seeded sample files
      2. README troubleshooting: the four distinct states and their fixes — not configured (`KBMS_TRANSCRIPTS_PATH` + `php artisan kbms:doctor`), missing, unreadable (`chmod`), rejected (path outside the base)
      3. `CHANGELOG.md` `[Unreleased]` → `Added`: transcript linking with drift tolerance, ambiguity resolution, manual override and in-place preview
      4. PRD `### Configuration surface`: add `KBMS_TRANSCRIPT_TOLERANCE_MINUTES` (default `10`) and `KBMS_TRANSCRIPT_PREVIEW_BYTES` (default `2097152`), and note the `{time}` = `Hi` grammar on `KBMS_TRANSCRIPT_PATTERN`
      5. PRD `### Core Components`: mark `meeting_transcripts.path` as **nullable**, carrying the manual-unlink tombstone
      6. PRD `## PRD Revision History`: add a `2026-09-09 | larapilot-plan US-007` row summarising the two new keys, the `{time}` divergence and the nullable `path`
      7. `php artisan larapilot:validate-prd`
      8. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] README documents the grammar, the `{time}` divergence, the tolerance, the byte cap, non-recursion and the read-only guarantee
      - [x] All four failure states documented with their fixes
      - [x] `CHANGELOG.md` `[Unreleased]` updated
      - [x] PRD configuration surface, component list and revision history updated; `validate-prd` passes
      - [x] Pint + Larastan level 5 clean

      ## Test Data
      - N/A — no model or schema change in this task

