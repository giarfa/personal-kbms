    id: TASK-00
    title: 'Bootstrap feature branch from develop'
    body: |-
      ## Description
      Bootstrap Gitflow for US-007: create the feature branch from `develop` and prepare the internal PR description locally. Do **not** push — `settings.git_mode` is `GITFLOW`.

      `develop` is at `999d2aa` (the US-006 merge) and the tree is clean, so this branches cleanly. No catch-up merge is needed.

      ## Files Involved
      - (git only — no application files)

      ## Steps
      1. `git checkout develop`
      2. `git checkout -b feature/US-007-transcript-linking`
      3. Draft the internal PR title/body toward `develop` — title `US-007: Transcript linking and in-place preview`; body links this plan and lists the planned tasks
      4. `git commit --allow-empty -m "chore(US-007): TASK-00 bootstrap feature branch"`

      ## Completion Criteria
      - [x] Branch `feature/US-007-transcript-linking` exists locally, off `999d2aa`
      - [x] PR title/body drafted for `develop`, kept local
      - [x] Nothing pushed

      ## Test Data
      - N/A — no model or schema change in this task

      ## Git Deliverables
      - Commit: `chore(US-007): TASK-00 bootstrap feature branch` (empty commit)
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: prepared locally only
