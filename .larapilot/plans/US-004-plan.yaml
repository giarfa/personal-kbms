      ## Description
      Close the spec: make the seeded demo state coherent with what the new interface renders, document the two new configuration keys, and run the mandatory quality gate. Documentation scope stays **baseline only** per the recorded `documentation scope` decision — README, no new documents.

      ## Files Involved
      - database/seeders/CalendarSyncRunSeeder.php
      - README.md
      - .larapilot/docs/test-results/US-004.md (manual test handoff)

      ## Steps
      1. Seeder: order the runs so the **newest** row is a recent success — `migrate:fresh --seed` should demo a healthy mirror, keeping the failure and 304 rows as history. Today's seeder creates ten successes with random `-7 days` timestamps after the failed row, so which state the pill lands on is effectively luck. Pin explicit `started_at`/`finished_at` values instead.
      2. README env table: add `KBMS_SYNC_STALE_MULTIPLIER` (`3`, No, US-004) and `KBMS_SYNC_STUCK_AFTER_SECONDS` (`300`, No, US-004) with the same column shape as the existing rows.
      3. README: extend the calendar-sync section with a short **Sync health** paragraph — what the pill shows, that `Never synced` / `stale` / `failed` are distinct states, that a manual resync will not overlap a running one, and that a run abandoned by a dead worker is recorded as failed rather than left spinning. Keep it operator-facing; no new document.
      4. Write the manual test handoff to `.larapilot/docs/test-results/US-004.md` (`settings.testing: NORMAL` — the UI itself is verified by hand): keyboard-only reach and activation of the resync control; the pill announced on state change via `aria-live`; the pulse neutralised under `prefers-reduced-motion: reduce`; both themes checked against `states.html`; a 375 px pass.
      5. `php artisan larapilot:quality --fix` (Pint), then re-run for Larastan level 5 — green before review. Also `vendor/bin/pint --dirty --format agent` per the project's PHP rules.
      6. `php artisan migrate:fresh --seed` and `php artisan test --compact` — full suite, one final time.

