  -
    id: TASK-05
    title: 'SyncStatus pill: first Livewire component, header wiring, pill styles'
    type: Impl
    status: DONE
    assignee: Alex
    estimate_hours: 4
    dependencies:
      - TASK-01
      - TASK-03
    body: |
      ## Description
      Render the sync verdict in the app shell header on every page, with a resync control that is present only when resyncing is actually possible. This is the project's first Livewire component, so it also fixes the generation convention for US-005…US-009.

      ## Files Involved
      - config/livewire.php (published — pin `make_command.type` and `emoji`)
      - app/Livewire/SyncStatus.php (new)
      - resources/views/livewire/sync-status.blade.php (new)
      - resources/views/layouts/app.blade.php (replace the reserved `{{-- Sync pill lands here — US-004 --}}` slot)
      - resources/css/app.css (`.kb-sync*` component classes + `kb-pulse` keyframe)

      ## Steps
      1. **Read `.ai/rules/views.md` and `.larapilot/mockups/kbms-app/README.md` first** — the mockup is the agreed visual contract, and `states.html` fixes the wording.
      2. `php artisan livewire:publish --config`, then set `make_command.type => 'class'` and `emoji => false`. Recorded decision `livewire component style` (2026-09-08): class-based, **not** Livewire 4 single-file components, so the logic stays inside Larastan level-5 analysis and the tests stay PHPUnit in `tests/Feature`.
      3. `php artisan make:livewire SyncStatus --class --no-interaction` → `app/Livewire/SyncStatus.php` + `resources/views/livewire/sync-status.blade.php`. Type the class the way the rest of `app/` is typed: explicit return types, PHPDoc, constructor-promoted dependencies where applicable.
      4. `render(): View` resolves `SyncHealthReporter` and passes one `SyncHealth` to the view. `resync(): void` calls `ResyncDispatcher`, and on `AlreadyRunning` simply re-renders — no error toast; the pill already tells the truth.
      5. Dispatch `sync-health-changed` **only when the resolved state differs from the previously rendered one** (hold the last state in a public property). Idle polling must not cause a second round trip for the banner in TASK-06.
      6. View: single root element, `wire:poll.60s` (the cadence the mockup README sanctions for a local tool), `aria-live="polite"`. Per state render the `states.html` wording exactly:
         - `Ok` → `Synced {relative} · {H:i}` + `Resync`
         - `Syncing` → `Syncing now…` + **no control at all** (removed from the DOM, not `disabled` — the mockup calls this out explicitly), and `queued — no worker picked this up` when `awaitingWorker`
         - `Stale` → `Last sync {relative} · stale` + `Resync`
         - `Failed` → `Sync failed · {H:i}` + `Retry`
         - `Never` → `Never synced` + `Sync now`
      7. Timestamps: relative via `diffForHumans()` **and** absolute `H:i` in `config('kbms.timezone')`, with the full ISO datetime on a `<time datetime="…">`/`title`. `Never` renders the literal string — never a humanised epoch.
      8. Wire it into `layouts/app.blade.php` at the reserved header slot, before the theme toggle.
      9. `resources/css/app.css`: add `.kb-sync`, `.kb-sync__dot`, `.kb-sync__label`, the four state modifiers and `.kb-sync__resync`, ported from `.larapilot/mockups/kbms-app/kbms.css` and built on the `--kb-ok/warn/danger/transcript` tokens US-001 already registered. Follow the existing `.kb-skip` precedent — hand-written classes, **not** Tailwind utilities: a non-`--color-*` `@theme` entry generates no `bg-kb-ok` utility, and aliasing the tokens is exactly what the mockup README forbids. Add the `kb-pulse` keyframe for the syncing dot; the file's existing global `prefers-reduced-motion` block already neutralises it.
      10. `npm run build`, then check `/` and `/calendar` by hand at 1280 px and 375 px — the pill must not clip or wrap the header.
      11. `php artisan test --compact --filter=AppShellTest`

      ## Completion Criteria
      - [x] The pill renders on every page of the shell, with last successful sync in **both** relative and absolute form
      - [x] The resync control is **absent from the DOM** while a run is in progress, not merely disabled
      - [x] "Never synced" renders literally when no run exists
      - [x] `config/livewire.php` pins class-based generation for the specs that follow
      - [x] `sync-health-changed` fires on state change only, not on every poll tick
      - [x] Header layout intact at 375 px and 1280 px, both themes
