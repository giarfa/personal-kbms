    title: 'Feature tests for the sync health interface'
    type: Test
    status: DONE
    assignee: Anne
    estimate_hours: 3
    dependencies:
      - TASK-05
      - TASK-06
    body: |
      ## Description
      Cover the acceptance criterion that names all five states, asserting the distinguishing strings from `states.html` rather than status codes — the mockup test contract is explicit that `never synced` ≠ `stale` ≠ `failed` must stay provable.

      ## Files Involved
      - tests/Feature/SyncStatusTest.php (new)
      - tests/Feature/AppShellTest.php (extend — pill present on both routes)

      ## Steps
      1. `php artisan make:test --phpunit SyncStatusTest`, `use RefreshDatabase`. PHPUnit, not Pest — this project's runner, notwithstanding Livewire's Pest scaffolding.
      2. Fixtures from `CalendarSyncRunFactory` states only; freeze time with `travelTo`.
      3. `Livewire::test(SyncStatus::class)` once per state, asserting the exact wording:
         - never synced → `assertSee('Never synced')`, `assertDontSee('ago')`
         - success → relative **and** absolute both present
         - stale → `assertSee('stale')`, `assertDontSee('failed')`
         - failed → `assertSee` the stored error text
         - syncing → `assertSee('Syncing')` **and** `assertDontSee('Resync')` — the control must be absent, which is what distinguishes this from a `disabled` attribute
      4. `Queue::fake()` → `->call('resync')` pushes `SyncCalendarFeed`; calling it again from the syncing state pushes nothing.
      5. `Livewire::test(SyncAlert::class)`: renders the error and `role="alert"` when failed; renders the stale variant; renders nothing when healthy, syncing, or never synced.
      6. `$this->get('/')->assertSeeLivewire('sync-status')` and the same for `/calendar` — added to `AppShellTest` beside the existing shell smoke tests, so the "everywhere" requirement is guarded where the shell is guarded.
      7. `php artisan test --compact`

      ## Completion Criteria
      - [x] Success, failure, in-progress, stale, and never-synced each have a named feature test (the AC's explicit list)
      - [x] Tests assert the distinguishing strings, not just HTTP 200
      - [x] The resync control's **absence** while syncing is asserted, not its `disabled` attribute
      - [x] The pill is proven present on both shell routes
