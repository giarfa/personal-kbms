    id: TASK-03
    title: 'Guarded resync dispatch: no duplicate or overlapping run'
    type: Impl
    status: DONE
    assignee: Alex
    estimate_hours: 3
    dependencies:
      - TASK-01
    body: |
      ## Description
      Make a manual resync safe to trigger from the UI: refuse while a run is in progress, prevent an overlapping queue job, and record enough state that the interface can honestly say "queued" before a worker touches the row.

      ## Files Involved
      - app/Calendar/ResyncDispatcher.php (new)
      - app/Calendar/ResyncOutcome.php (new — enum)
      - app/Jobs/SyncCalendarFeed.php (add `$uniqueFor` and `uniqueId()`)

      ## Steps
      1. `php artisan make:class Calendar/ResyncOutcome` → `enum ResyncOutcome: string` — `Dispatched`, `AlreadyRunning`. Returning an outcome beats throwing: "a run is already going" is an expected result of a race, not an exception.
      2. `php artisan make:class Calendar/ResyncDispatcher` with `dispatch(): ResyncOutcome`. It re-reads `SyncHealthReporter::current()` **inside the call** and returns `AlreadyRunning` when the state is `Syncing` — a poll rendered 60 seconds ago can post into a scheduled run that has since started, and the removed button cannot protect against that.
      3. On dispatch: put a cache marker `kbms.sync.dispatched_at` (value `now()`, TTL = `kbms.sync_stuck_after_seconds`) **before** `SyncCalendarFeed::dispatch()`, so a page render between dispatch and the worker picking the job up can still show `Syncing` rather than an unchanged pill. TASK-01's reporter already reads this marker; the marker is cleared by the run row superseding it, and expires on its own if no worker ever appears.
      4. `SyncCalendarFeed`: add `public int $uniqueFor` returning `config('kbms.sync_stuck_after_seconds')` and an explicit `uniqueId(): string` (a constant key — the whole point is that only one feed sync exists at a time). **This is a bug fix, not decoration:** `ShouldBeUnique` with no `$uniqueFor` holds the lock until the job completes, so a killed worker blocks every future resync forever, on the same failure that TASK-01's stuck-run guard exists to survive. Both now heal on the same clock.
      5. Leave `kbms:sync-calendar` and the scheduler entry alone — `->withoutOverlapping()` covers cron-vs-cron and is unaffected. Sanity-check that `--sync` (`dispatchSync`) still bypasses the queue lock as before.
      6. `php artisan test --compact --filter=SyncCalendarFeed`

      ## Completion Criteria
      - [x] `ResyncDispatcher::dispatch()` returns `AlreadyRunning` and dispatches nothing while a run is in progress
      - [x] `SyncCalendarFeed::$uniqueFor` equals `kbms.sync_stuck_after_seconds`, so a dead worker's lock expires instead of blocking resync permanently
      - [x] The dispatch marker makes `Syncing` visible before the worker creates the run row
      - [x] Existing US-003 job and command tests still pass untouched

      ## Test Data
      - N/A — no model, schema, or factory changes in this task

      ## Git Deliverables
      - Commit: `feat(US-004): TASK-03 guard manual resync against overlapping runs`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes only
    commit:
      sha: bca2da66fec3c7908550d24b9b3bf5dc84ea90cb
      short_sha: bca2da6
      subject: 'feat(US-004): TASK-03 guard manual resync against overlapping runs'
      committed_at: '2026-09-08T07:53:57+02:00'
      url: 'https://github.com/giarfa/personal-kbms/commit/bca2da66fec3c7908550d24b9b3bf5dc84ea90cb'
