    id: TASK-02
    title: 'Unit tests for the sync health reporter'
    type: Test
    status: DONE
    assignee: Anne
    estimate_hours: 3
    dependencies:
      - TASK-01
    body: |
      ## Description
      Pin the reporter's resolution order and its two non-obvious rules (304 counts as success, stuck runs are abandoned) before any UI depends on them.

      ## Files Involved
      - tests/Unit/Calendar/SyncHealthReporterTest.php (new)

      ## Steps
      1. `php artisan make:test --phpunit --unit Calendar/SyncHealthReporterTest`, `use RefreshDatabase` (the reporter reads the database, matching `tests/Unit/Models/CalendarSyncRunTest.php`'s existing precedent for DB-backed unit tests).
      2. Build fixtures **only** from `CalendarSyncRunFactory` states — no hand-built arrays, no duplicated factory definitions.
      3. Freeze time with `$this->travelTo(...)` / `travel(...)`, following `SyncCalendarFeedJobTest`'s convention.
      4. One test per branch of the documented order:
         - no rows at all → `Never`
         - `running()` inside the threshold → `Syncing`
         - recent `successful()` → `Ok`, exposing `lastSuccessAt`
         - recent `notModified()` → `Ok` (**regression guard**: a 304 must not read as stale one interval later)
         - `stale()` with no failure → `Stale`
         - latest finished is `failed()` → `Failed`, exposing `lastError` and `httpStatus`
         - `failed()` **and** stale → `Failed` wins (precedence, not both)
         - `abandoned()` → row is persisted as `Failed` with a reason containing `queue:work`, and the resolved state is no longer `Syncing`
         - only `failed()` rows ever recorded → `Never` (defensive branch 5)
      5. Boundary: a success at exactly `sync_minutes × multiplier` is **not** stale; one minute older **is**. Drive it by setting `config(['kbms.sync_minutes' => …, 'kbms.sync_stale_multiplier' => …])` so the test proves the values are configurable rather than hard-coded.
      6. `php artisan test --compact --filter=SyncHealthReporterTest`

      ## Completion Criteria
      - [x] Every branch of the resolution order has a named test
      - [x] The stale boundary is asserted from config, not from a literal 45 minutes
      - [x] The 304-is-success and stuck-run cases each have a dedicated test
      - [x] `php artisan test --compact` fully green

      ## Git Deliverables
      - Commit: `test(US-004): TASK-02 cover sync health resolution order`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes only
