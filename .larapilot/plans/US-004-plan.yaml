code: US-004
plan_body: |
  ## Technical Solution

  US-004 turns the `calendar_sync_runs` history US-003 already writes into a **health verdict** the shell renders everywhere, plus a guarded manual resync. No new table, no migration — one derived read model, one dispatch guard, two Livewire components.

  ### Derived read model (no schema change)

  `App\Calendar\SyncHealthState` (enum, string-backed) — `Never`, `Syncing`, `Ok`, `Stale`, `Failed`. `App\Calendar\SyncHealth` (final readonly value object) — the enum plus `lastSuccessAt`, `lastAttemptAt`, `lastError`, `lastErrorAt`, `httpStatus`, `awaitingWorker`. `App\Calendar\SyncHealthReporter` — a container-resolved service that reads the run history once and returns a `SyncHealth`. Views never query `CalendarSyncRun` directly.

  **Resolution order** (first match wins — this ordering is the contract, and TASK-02 pins it):

  1. A `Running` run started within `kbms.sync_stuck_after_seconds` → `Syncing`.
  2. A resync dispatch marker in cache with no run row yet → `Syncing` with `awaitingWorker` once the marker outlives the grace window (renders "queued — no worker picked this up").
  3. No run rows at all → `Never`.
  4. Latest finished run is `Failed` → `Failed` (carrying `error` + `http_status`; the previous mirror stays on screen).
  5. No `Success`/`NotModified` run recorded → `Never` (defensive: every success pruned or abandoned).
  6. `lastSuccessAt` older than `sync_minutes × sync_stale_multiplier` → `Stale`.
  7. Otherwise → `Ok`.

  **`NotModified` counts as a successful sync.** A 304 means the mirror was confirmed current against the feed. Treating it as "not a success" would mark a perfectly healthy calendar that simply has not changed as stale within one interval — the exact false alarm this spec exists to avoid. `CalendarSyncRun::latestValidators()` already groups the two statuses this way; the reporter reuses that grouping.

  **Stuck-run guard.** A `Running` row whose worker died never finishes, so the pill would read "Syncing" forever *and* the resync control would stay hidden — a silent failure worse than the stale mirror this spec is about. The reporter marks `Running` rows older than `kbms.sync_stuck_after_seconds` (default 300s = 2× the job's 120s timeout) as `Failed` with a legible reason naming `php artisan queue:work`, then resolves against the corrected history. This is a write during a read path: it is idempotent, touches at most the one abandoned row, and keeps the persisted history honest rather than papering over it in the view layer. The alternative — a scheduled reaper command — is more machinery than a single-operator localhost tool earns.

  ### Duplicate-run prevention (AC: error case)

  Three independent layers, because each fails differently:

  1. **UI** — when the state is `Syncing`, the resync control is **removed from the DOM, not disabled** (the mockup states this explicitly). A hidden control cannot be clicked, focused, or submitted.
  2. **Action** — `App\Calendar\ResyncDispatcher` re-reads the health inside the request and refuses when a run is in progress, returning a `ResyncOutcome` enum rather than throwing. A stale poll that POSTs a resync a second after a scheduled run started hits this, not the queue.
  3. **Queue** — `SyncCalendarFeed` already implements `ShouldBeUnique`, but with **no `$uniqueFor`** the lock is held until the job completes; a killed worker holds it forever and permanently blocks every future resync. TASK-03 sets `$uniqueFor` to the same stuck threshold and an explicit `uniqueId()`, so the lock self-heals on the same clock as the stuck-run guard.

  The scheduler's existing `->withoutOverlapping()` covers cron-vs-cron; it does **not** cover UI-vs-cron, which is why layers 2 and 3 are needed.

  ### Presentation

  Two **class-based** Livewire components (recorded decision `livewire component style`, 2026-09-08 — class-based keeps component logic inside the mandatory Larastan level-5 analysis, which does not scan Blade-embedded anonymous classes, and keeps tests in `tests/Feature` under PHPUnit rather than the Pest file `make:livewire --test` scaffolds for SFCs):

  - **`App\Livewire\SyncStatus`** — the header pill. Owns `wire:poll.60s` (the mockup's stated cadence for a local tool) and the `resync()` action. `aria-live="polite"`.
  - **`App\Livewire\SyncAlert`** — the full-width failure/stale banner above the page slot, `role="alert"`, carrying the error text, the affected config key, and a `php artisan kbms:doctor` hint. It does **not** poll: `SyncStatus` dispatches `sync-health-changed` only when the resolved state actually changes, and `SyncAlert` listens via `#[On]`. One poll for the shell, no drifting double state.

  `layouts/app.blade.php` already reserves the header slot (`{{-- Sync pill lands here — US-004 --}}`). Pill styling follows the existing `.kb-skip` precedent: hand-written `.kb-sync*` classes in `resources/css/app.css` built on the `--kb-ok/warn/danger/transcript` tokens US-001 already registered. Tailwind 4 generates no `bg-kb-ok` utility from a non-`--color-*` `@theme` entry, so utilities are not an option here without aliasing tokens the mockup README forbids touching.

  ### Timestamps

  Every state renders **relative and absolute** together (`Synced 4 min ago · 12:36`), formatted in `config('kbms.timezone')`, with the full ISO datetime in `title`/`datetime`. `Never` renders the literal string "Never synced" — never a humanised epoch, never an empty span.

  ### Wording is contract

  `states.html` fixes five mutually distinguishable strings: **never synced ≠ stale ≠ failed ≠ syncing ≠ synced**. TASK-07 asserts on those strings, not on status codes.

  ### New configuration

  | Key | Env | Default | Purpose |
  | --- | --- | --- | --- |
  | `kbms.sync_stale_multiplier` | `KBMS_SYNC_STALE_MULTIPLIER` | `3` | Stale after this many sync intervals without a success (mockup: ">3× the interval") |
  | `kbms.sync_stuck_after_seconds` | `KBMS_SYNC_STUCK_AFTER_SECONDS` | `300` | A `Running` run older than this is abandoned; also `SyncCalendarFeed::$uniqueFor` |

  `config/livewire.php` is published in TASK-05 solely to pin `make_command.type = class` and `emoji = false`, so future components (US-005…US-009) are generated the agreed way rather than relying on every agent remembering a flag.

  ### Out of scope

  No broadcasting/websockets (polling is sufficient and the PRD keeps this machine-local); no sync history page (FR-010 asks for last success + last error, not an audit UI); no notification surface.

  ## Git & Branching

  - Mode: `GITFLOW` (from `settings.git_mode`) — **never auto-push**
  - Branch: `feature/US-004-sync-health-resync` from `develop` (`develop` is current and carries the merged US-003 work)
  - TASK-00: bootstrap the branch and draft the internal PR body locally
  - Per task: one atomic Conventional Commit `type(US-004): TASK-NN summary` — never batch tasks
  - PR toward `develop` prepared locally; open/update the remote only if the user asks in-session
  - Merge to `develop` only after human `/larapilot-review` approval

  ## Test Data Strategy

  - `CalendarSyncRunFactory` already ships `successful()`, `failed()`, `notModified()`, `running()`. TASK-01 adds `abandoned()` (a `Running` row started well past the stuck threshold) and `stale()` (a success old enough to trip the multiplier) so every rendered state is expressible in one factory call.
  - No new model and no migration — `calendar_events` and `calendar_sync_runs` are unchanged. `CalendarEventFactory` is untouched.
  - `CalendarSyncRunSeeder` is refreshed in TASK-08 so `migrate:fresh --seed` lands on a **healthy** mirror by default (a recent success), with the failure and 304 rows kept as history rather than as the current verdict — today's seeder leaves the newest row ambiguous for a demo.
  - Verify `php artisan migrate:fresh --seed` before `task-done` on TASK-01 and TASK-08.

  ## Test Strategy

  - Bar: **`NORMAL`** (from `settings.testing`). No Playwright, no Dusk, no Pest browser, no viewport matrix, no axe automation. PHPUnit throughout — this project runs PHPUnit, not Pest, despite Livewire's Pest scaffolding.
  - **Unit** (`tests/Unit/Calendar/SyncHealthReporterTest.php`, TASK-02) — the resolution order above, one test per branch: never / syncing / ok / stale / failed, plus 304-counts-as-success, the stale boundary at exactly `n ×` the interval, and stuck-run abandonment writing a legible error.
  - **Feature — dispatch** (`tests/Feature/SyncResyncTest.php`, TASK-04) — `Queue::fake()` duplicate suppression, refusal while a run is in progress, `$uniqueFor` present and equal to the stuck threshold, dispatch-marker lifecycle.
  - **Feature — UI** (`tests/Feature/SyncStatusTest.php`, TASK-07) — `Livewire::test()` over all five states asserting the distinguishing strings; the resync control **absent** (not merely disabled) while syncing; `resync()` dispatching the job and transitioning state; the banner rendering the failure reason and `role="alert"`; the pill present on both `/` and `/calendar` via `assertSeeLivewire`.
  - Time-sensitive tests use `$this->travelTo()` / `travel()`, matching `SyncCalendarFeedJobTest`'s existing convention.
  - `php artisan larapilot:quality` (Pint + Larastan level 5) green before review — TASK-08.
  - **Manual test handoff** (UI, per the mockup test contract): keyboard-only reach and activation of the resync control; the pill announced by a screen reader on state change (`aria-live`); the pulse neutralised under `prefers-reduced-motion: reduce`; both themes checked against `states.html`; a 375 px pass confirming the pill does not clip the header.
