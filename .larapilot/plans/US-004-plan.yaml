    id: TASK-06
    title: 'SyncAlert banner: failure reason legible without opening storage/logs'
    type: Impl
    status: DONE
    assignee: Joe
    estimate_hours: 3
    dependencies:
      - TASK-05
    body: |
      ## Description
      Render the full-width warning surface for the failed and stale states, carrying the actual error text. This is the acceptance criterion that says the operator must never open `storage/logs` to learn why the mirror is behind.

      ## Files Involved
      - app/Livewire/SyncAlert.php (new)
      - resources/views/livewire/sync-alert.blade.php (new)
      - resources/views/layouts/app.blade.php (mount above `{{ $slot }}` inside `flux:main`)
      - resources/css/app.css (`.kb-banner*` classes)

      ## Steps
      1. `php artisan make:livewire SyncAlert --class --no-interaction`.
      2. `#[On('sync-health-changed')]` refresh listener — **no `wire:poll` here.** `SyncStatus` owns the single poll for the shell; two independent polls would let the pill and the banner disagree mid-flight.
      3. Render nothing (`@if ($health->needsAttention())` around the whole root) when the state is `Ok`, `Syncing`, or `Never` — `Never` is the pill's story, and a banner on first run would be noise, not information.
      4. `Failed` → `role="alert"`, `<strong>Last sync failed at {H:i}</strong>`, the stored `error` in a `<code>`, the `KBMS_ICS_URL` key named, `Showing the mirror from {last success}` (or a plain statement that no mirror exists yet), a `Run php artisan kbms:doctor to check reachability` hint, and a `Retry now` button calling the same `ResyncDispatcher`. Marika's rule holds: name the config key or the action that fixes it — nothing says "Something went wrong".
      5. `Stale` → the same banner shape in the `--kb-warn` tint, stating how long it has been and that **nothing failed** — a stale mirror with no error is a different problem from a failure and must read differently.
      6. Escape the error text normally (`{{ }}`) — it is remote feed and exception content and must never reach the page as raw HTML.
      7. `.kb-banner` / `.kb-banner__actions` in `resources/css/app.css`, ported from `kbms.css`, using `--kb-danger-bg` / `--kb-warn-bg`.
      8. Mount inside `flux:main` above `{{ $slot }}` so it appears on Agenda and Calendar alike, below the header strip.
      9. `npm run build`; check both themes against `states.html` and both banner variants at 375 px.

      ## Completion Criteria
      - [x] The failure reason recorded on the run is legible in the interface — no log file required
      - [x] The banner is `role="alert"` and names the config key plus the `kbms:doctor` remediation
      - [x] Stale and failed read as visibly and textually different states
      - [x] Nothing renders when the mirror is healthy, syncing, or never synced
      - [x] Error text is escaped
      - [x] Banner refreshes from the pill's event without a second poll

      ## Test Data
      - N/A — no model, schema, or factory changes in this task

      ## Git Deliverables
      - Commit: `feat(US-004): TASK-06 surface sync failures and staleness in the shell`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes only
