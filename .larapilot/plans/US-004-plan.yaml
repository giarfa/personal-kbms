    id: TASK-04
    title: 'Feature tests for guarded resync dispatch'
    type: Test
    status: DONE
    assignee: Anne
    estimate_hours: 2
    dependencies:
      - TASK-03
    body: |
      ## Description
      Cover the spec's explicit error case — triggering a resync during a run must not queue a duplicate or produce an overlapping run — at the dispatch layer, independently of the UI.

      ## Files Involved
      - tests/Feature/SyncResyncTest.php (new)

      ## Steps
      1. `php artisan make:test --phpunit SyncResyncTest`, `use RefreshDatabase`.
      2. `Queue::fake()` — with no run in progress, `ResyncDispatcher::dispatch()` returns `Dispatched` and `Queue::assertPushed(SyncCalendarFeed::class, 1)`.
      3. With a `running()` run present, it returns `AlreadyRunning` and `Queue::assertNothingPushed()`.
      4. With an `abandoned()` run present (past the stuck threshold), it **does** dispatch — the stuck guard must not leave resync wedged.
      5. Assert `(new SyncCalendarFeed)->uniqueFor === config('kbms.sync_stuck_after_seconds')` and that the job still implements `ShouldBeUnique` — `SyncCalendarFeedJobTest` already imports that interface, so follow its assertion style.
      6. Assert the cache marker is written on dispatch and that the reporter reads `Syncing` from it with no run row present.
      7. `php artisan test --compact --filter=SyncResyncTest`

      ## Completion Criteria
      - [x] Duplicate dispatch during a live run is proven impossible at the dispatcher, not just hidden in the view
      - [x] The `$uniqueFor` regression (dead worker wedging resync forever) has a failing-without-the-fix test
      - [x] `php artisan test --compact` fully green

      ## Git Deliverables
      - Commit: `test(US-004): TASK-04 cover resync dispatch guards`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes only
    commit:
