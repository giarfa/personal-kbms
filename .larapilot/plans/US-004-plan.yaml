    id: TASK-01
    title: 'Sync health read model: state enum, value object, reporter, stuck-run guard'
    type: Impl
    status: DONE
    assignee: Alex
    estimate_hours: 3.5
    dependencies:
      - TASK-00
    body: |
      ## Description
      Add the derived read model that turns `calendar_sync_runs` history into a single health verdict, so no view ever queries the runs table itself. No migration — this reads what US-003 already writes.

      ## Files Involved
      - app/Calendar/SyncHealthState.php (new — enum)
      - app/Calendar/SyncHealth.php (new — final readonly value object)
      - app/Calendar/SyncHealthReporter.php (new — service)
      - app/Models/CalendarSyncRun.php (add `latestSuccess()`, `latestFinished()`, `activeRun()` query helpers + `abandon()`)
      - config/kbms.php (two new keys + PHPDoc array shape)
      - .env.example
      - database/factories/CalendarSyncRunFactory.php (add `abandoned()`, `stale()` states)

      ## Steps
      1. `php artisan make:class Calendar/SyncHealthState` (convert to `enum SyncHealthState: string` — `Never`, `Syncing`, `Ok`, `Stale`, `Failed`; TitleCase keys per the PHP rules). Give it a `label(): string` returning the exact `states.html` wording, so the strings live in one place and the tests in TASK-02/TASK-07 assert against the same source the view renders.
      2. `php artisan make:class Calendar/SyncHealth` — `final readonly`, constructor-promoted: `SyncHealthState $state`, `?CarbonImmutable $lastSuccessAt`, `?CarbonImmutable $lastAttemptAt`, `?string $lastError`, `?CarbonImmutable $lastErrorAt`, `?int $httpStatus`, `bool $awaitingWorker`. Add `hasEverSynced(): bool` and `needsAttention(): bool` (true for `Failed`/`Stale`) — the banner in TASK-06 keys off the latter.
      3. `php artisan make:class Calendar/SyncHealthReporter` with a `current(): SyncHealth` method implementing the resolution order in the plan body, in that exact precedence. Resolve it from the container (no facade, no static) so tests can inject a frozen clock via `travelTo`.
      4. Add `CalendarSyncRun` query helpers so the reporter issues **at most three indexed queries** and no query inside a loop: `activeRun()` (status `Running`, latest `started_at`), `latestFinished()` (whereNotNull `finished_at`, latest `started_at`), `latestSuccess()` (status in `Success`/`NotModified`, latest `started_at` — reuse the grouping `latestValidators()` already applies). The `started_at` and `(status, finished_at)` indexes from US-003's migration already cover these; verify with `EXPLAIN QUERY PLAN` rather than assuming.
      5. Add `CalendarSyncRun::abandon(string $reason)` — sets `finished_at = now()`, `status = Failed`, `error = $reason`. The reporter calls it for any `Running` row started before `now()->subSeconds(config('kbms.sync_stuck_after_seconds'))`, with a reason that names the fix: `the sync worker did not finish this run within {n}s; check that \`php artisan queue:work\` is running`. Re-resolve against the corrected history afterwards.
      6. `config/kbms.php` — add `sync_stale_multiplier` (`(int) env('KBMS_SYNC_STALE_MULTIPLIER', 3)`) and `sync_stuck_after_seconds` (`(int) env('KBMS_SYNC_STUCK_AFTER_SECONDS', 300)`), and extend the file's `@return` array shape PHPDoc — Larastan reads it.
      7. `.env.example` — add both keys under the `# --- Personal KBMS ---` block with the same one-line-comment style the existing keys use.
      8. Factory: add `abandoned()` (`Running`, `started_at` = 10 minutes ago, `finished_at` null) and `stale()` (`Success`, `started_at`/`finished_at` = `sync_minutes × multiplier + 1` minutes ago). Both are needed by TASK-02 and TASK-07.
      9. `php artisan migrate:fresh --seed` then `php artisan test --compact --filter=CalendarSyncRun`

      ## Completion Criteria
      - [x] `SyncHealthReporter::current()` returns the right state for every branch of the documented order, verified by hand via `tinker` before handing to Anne
      - [x] A `Running` row older than the stuck threshold is persisted as `Failed` with a reason naming `queue:work` — not just hidden in the view
      - [x] A `NotModified` run counts as a successful sync (not stale one interval later)
      - [x] Reporter issues no query inside a loop; the three queries use the existing indexes
      - [x] Both new config keys read from env with the documented defaults and appear in `.env.example`
      - [x] `migrate:fresh --seed` succeeds

      ## Test Data
      - [x] `database/factories/CalendarSyncRunFactory.php` gains `abandoned()` and `stale()` states in **this** task
      - [x] No new model and no migration — `CalendarEventFactory` and the seeders are untouched here (seeder coherence is TASK-08)

      ## Git Deliverables
      - Commit: `feat(US-004): TASK-01 add sync health read model and stuck-run guard`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes only
