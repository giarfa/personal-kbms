code: US-018
plan_body: |-
  ## Technical Solution

  One domain seam, one Blade component, two bounded queries. No migration, no new package, no new `KBMS_*` key, no change to `kbms:sync-calendar`.

  **Where adjacency is decided.** `App\Meetings\SeriesNeighbourLookup` answers "what sits either side of this occurrence in its own series" and is the only place that knows the ordering rule. The detail page asks it once; nothing else in the product has an opinion about series order.

  | Class | Kind | Responsibility |
  | --- | --- | --- |
  | `App\Meetings\SeriesDirection` | enum | `Previous` / `Next` — direction as a type, not a string literal in three files |
  | `App\Meetings\SeriesNeighbour` | readonly | One direction's outcome: the neighbour event or the stated reason there is none, plus the label and accessible name the view renders |
  | `App\Meetings\SeriesNeighbours` | readonly | The pair (`previous`, `next`) handed to the view |
  | `App\Meetings\SeriesNeighbourLookup` | service | `forOccurrence(CalendarEvent): ?SeriesNeighbours` — `null` for a one-off, a pair otherwise |

  `SeriesNeighbour` follows `OutlookLink`'s three-way shape deliberately: a link, or an absence carrying its own reason, never a broken `href`. That is why the disabled control below can reuse the "Open in Outlook" fallback markup rather than invent a second vocabulary for "this affordance exists but leads nowhere".

  **Recurrence is the feed's answer, not a row count.** `forOccurrence()` returns `null` when — and only when — `recurrence_id === ''`. A series whose sync window happens to hold exactly one occurrence still returns a pair, both sides absent with their reason. This is the AC's sharpest line and the one a "count the siblings" implementation gets wrong: the mirror's window and the series' extent are different facts, and the page must never conflate them.

  **The two queries (keyset, not offset).**

  ```php
  // previous
  ->where('source_uid', $occurrence->source_uid)
  ->where(fn ($q) => $q
      ->where('starts_at', '<', $occurrence->starts_at)
      ->orWhere(fn ($q) => $q
          ->where('starts_at', $occurrence->starts_at)
          ->where('recurrence_id', '<', $occurrence->recurrence_id)))
  ->orderByDesc('starts_at')->orderByDesc('recurrence_id')->first();
  ```

  `next` is the same with `>`, `orderBy` ascending. The composite `(starts_at, recurrence_id)` comparison is what makes ties deterministic **and** total: an occurrence is strictly excluded from its own result set, so it can never be its own neighbour, and two rows sharing a `starts_at` resolve past each other in a fixed order rather than pointing at each other. A `RECURRENCE-ID` override that moved an occurrence onto a sibling's start time is exactly the feed shape that produces such a tie, so this is a real case, not a theoretical one.

  Both queries filter on `source_uid`, the **leading column of the existing `(source_uid, recurrence_id)` unique index** — no new index, and the series is never loaded: `first()` with `LIMIT 1`, one row per direction. Cancelled occurrences are not filtered out; per FR-004 they stay in the chain, and the destination page's existing "Cancelled upstream" banner is what states their status. The control itself says nothing about it.

  **Labels.** `SeriesNeighbour::label()` renders the neighbour's own date and time: `Mon 8 Sep 09:00`, or `Mon 8 Sep · all day` for an all-day occurrence, with the year appended when it differs from the current occurrence's year (a weekly series crossing New Year would otherwise offer two indistinguishable "Mon 30 Dec" links). `accessibleName()` prefixes the direction and appends the new-tab announcement: `Previous occurrence, Mon 8 Sep 09:00 (opens in a new tab)`. Absent directions carry a reason that speaks about the mirror only — *"The mirror holds no earlier occurrence of this series."* — never about the series beginning or ending.

  **The control.** `resources/views/components/meeting/series-nav.blade.php`, rendered from `pages/meeting.blade.php` between the cancelled banner and `.kb-detail`, inside a `<nav aria-label="Occurrences of this series">`. Present: `<flux:button variant="outline" :href="…" target="_blank" rel="noopener" :aria-label="…">` — Flux renders an `<a href>`, so cmd/ctrl-click, middle-click, the context menu and back/forward all keep their ordinary meaning. There is **no** `window.open`, no click handler, no `wire:navigate` and no JavaScript in this spec at all; `wire:navigate` in particular would hijack the modifier keys the AC protects. Absent: `<flux:button variant="outline" disabled aria-describedby="…">` plus a visible `kb-note-inline` reason span — byte-for-byte the shape `x-meeting.external-links` already uses for the unavailable Outlook CTA, so the page has one vocabulary for "offered but inert", and the reason stays in the accessible document even though a `disabled` button is not focusable.

  **What this spec does not do:** no prev/next on the agenda or calendar, no "occurrence 3 of 12" position indicator, no series overview page, no prefetch of the neighbour, no keyboard shortcut, and no change to the route contract or to `OccurrenceKey`.

  ## Architecture & quality notes

  - **N+1 / query shape (John, Mike):** the detail page gains exactly two queries, both `LIMIT 1` on an indexed column, independent of series length. No relation is loaded, nothing iterates. TASK-04 pins this with a query-count assertion in the same style as `AgendaColourTest` and `TodoRenderingTest`, so a later refactor that loads the series to find a neighbour fails a test rather than a review.
  - **SOLID:** `SeriesNeighbourLookup` owns ordering and nothing else; `SeriesNeighbour` owns presentation of one outcome; the controller stays a three-line composition root; the Blade component stays a pure renderer, consistent with how `AgendaRow` pre-computes for the views.
  - **Security (Lars):** no new input surface. Neighbour route keys are built from stored `source_uid` / `recurrence_id` through `OccurrenceKey::toRouteKey()`, the same encoder the current URL came from; nothing from the request reaches a query. `rel="noopener"` on every `target="_blank"` link, matching the existing external-link convention. The feed is semi-trusted, but no feed-carried URL is involved here — these are internal routes only.
  - **Larastan level 5:** `forOccurrence()` returns `?SeriesNeighbours` and the private query helper returns `?CalendarEvent`; both need accurate return types rather than PHPDoc-only hints. `php artisan larapilot:quality` runs before every task commit.
  - **UI contract (Elise):** `.larapilot/mockups/kbms-app/README.md` is this project's agreed visual contract (recorded rule `.ai/rules/views.md`) and currently describes a meeting detail page with no such control. TASK-05 updates it — the contract is amended, not bypassed. Layout stays desktop-first per the recorded PRD decision; the obligation is only that the nav does not break below 768 px, where the two controls wrap.

  ## Git & Branching

  - Mode: `GITFLOW_PUSH` (from `settings.git_mode`) — Gitflow **with** push after each task commit
  - Branch: `feature/US-018-series-neighbour-links` from `develop`
  - TASK-00: bootstrap the branch, push it, and prepare the internal PR toward `develop` (`settings.github` is `NO`, so the PR description is drafted locally rather than opened with `gh`)
  - Per task: exactly one Conventional Commit, `type(US-018): TASK-NN summary`; never batch two tasks into one commit
  - Push after every task commit; merge to `develop` only after the review gate

  ## Test Data Strategy

  - No new model, no migration, no schema change — `CalendarEventFactory` already carries everything this spec needs
  - `occurrenceOf(string $sourceUid, string $recurrenceId)` builds series members sharing a `source_uid`; `at(CarbonInterface $start, int $minutes)` pins deterministic start times; `cancelled()` covers the cancelled-neighbour case; `allDay()` covers the all-day label branch
  - No factory state, seeder entry, or `migrate:fresh --seed` step is required by this spec — `## Test Data` is `N/A` on every task

  ## Test Strategy

  - Bar: `NORMAL` (from `settings.testing`) — PHPUnit feature and unit tests; **no** Playwright, Dusk, Pest browser, or viewport E2E suites
  - Unit (`tests/Unit/Meetings/SeriesNeighbourLookupTest.php`): both neighbours present; nearest neighbour chosen over a farther one; first and last stored occurrence; a cancelled sibling is returned, not skipped; a tie on `starts_at` resolved deterministically and never onto itself; a single-occurrence series returns a pair with both sides absent; a one-off returns `null`; label formatting for timed, all-day, and cross-year neighbours
  - Feature (`tests/Feature/MeetingSeriesNavigationTest.php`): the six AC rendering cases, plus the `target="_blank"` / `rel="noopener"` / `<a href>` shape, the accessible name carrying direction, destination and the new-tab announcement, the disabled control's `aria-describedby` reason, and a query-count guard proving the page cost is constant in series length
  - Manual test handoff (UI spec under `NORMAL`): open a recurring occurrence at `http://personal-kbms.test/meetings/{key}`, confirm a plain click opens a new tab while the original stays put, confirm cmd-click and middle-click behave identically, and confirm the two controls wrap rather than overflow below 768 px
  - `php artisan larapilot:quality` (Pint + Larastan level 5) green before every `task-done`
