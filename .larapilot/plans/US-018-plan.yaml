    id: TASK-03
    title: 'Render the previous/next controls on the meeting detail page'
    body: |-
      ## Description
      Surface the two neighbour controls on `/meetings/{occurrence}` as ordinary links that open beside the page, reusing the existing disabled-CTA shape at the mirror's edge.

      ## Files Involved
      - app/Http/Controllers/MeetingController.php
      - resources/views/components/meeting/series-nav.blade.php (new)
      - resources/views/pages/meeting.blade.php
      - resources/css/app.css

      ## Steps
      1. Inject `SeriesNeighbourLookup` into `MeetingController::__invoke()` and pass `neighbours` (nullable) to the view — keep the controller a composition root, no logic
      2. New component `x-meeting.series-nav` taking `:neighbours`. Wrap both controls in `<nav aria-label="{{ __('Occurrences of this series') }}">`
      3. Available direction: `<flux:button variant="outline" :href="route('meetings.show', $neighbour->routeKey())" target="_blank" rel="noopener" :aria-label="$neighbour->accessibleName()">` with a direction glyph marked `aria-hidden` plus the visible label. It must stay a real `<a href>` — **no** `window.open`, no click handler, and no `wire:navigate`, so modifier-click, middle-click, the context menu and back/forward keep their ordinary meaning
      4. Absent direction: `<flux:button variant="outline" disabled aria-describedby="…">` plus a `<span class="kb-note-inline" id="…">` carrying the reason — the same shape as the unavailable "Open in Outlook" CTA in `x-meeting.external-links`. Ids must be unique per direction
      5. Render from `pages/meeting.blade.php` between the cancelled banner and `.kb-detail`, guarded by `@if ($neighbours)` so a one-off renders neither control and no empty nav
      6. Add `.kb-series-nav` to `resources/css/app.css` in the meeting-detail component layer: row layout, `gap`, `flex-wrap`, previous/next pushed to opposite ends, reason spans aligned with their control. Smoke-check at 375, 768 and 1280 px — desktop-first per the recorded PRD decision, but nothing may break below 768 px
      7. `php artisan larapilot:quality` and `npm run build`

      ## Completion Criteria
      - [x] Both controls render on a recurring occurrence, each labelled with the neighbour's own date and time
      - [x] Each available control is an `<a href>` to `meetings.show` with `target="_blank"` and `rel="noopener"`
      - [x] At the mirror's edge the control renders disabled with its reason wired through `aria-describedby`
      - [x] A one-off occurrence renders neither control
      - [x] Layout intact at 375 / 768 / 1280 px (manual smoke)
      - [x] Pint + Larastan level 5 pass

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-018): TASK-03 render previous/next occurrence controls`
      - Push: `origin feature/US-018-series-neighbour-links`
      - PR: update the local PR notes
