    id: TASK-01
    title: 'Series neighbour lookup and its value objects'
    body: |-
      ## Description
      Add the single seam that decides series adjacency: `SeriesNeighbourLookup`, returning a `SeriesNeighbours` pair of `SeriesNeighbour` outcomes, or `null` for a one-off occurrence.

      ## Files Involved
      - app/Meetings/SeriesDirection.php (new)
      - app/Meetings/SeriesNeighbour.php (new)
      - app/Meetings/SeriesNeighbours.php (new)
      - app/Meetings/SeriesNeighbourLookup.php (new)

      ## Steps
      1. `php artisan make:class Meetings/SeriesNeighbourLookup --no-interaction` (and the value objects; `SeriesDirection` is a backed enum with `Previous` / `Next`, TitleCase keys per the PHP conventions)
      2. `SeriesNeighbourLookup::forOccurrence(CalendarEvent $occurrence): ?SeriesNeighbours` — return `null` when `$occurrence->recurrence_id === ''`. Recurrence is decided by the feed-carried `recurrence_id`, **never** by counting stored rows
      3. One private query helper per direction, keyset-style: filter `source_uid`, then `starts_at` strictly before/after the current one **or** equal `starts_at` with `recurrence_id` strictly before/after; order by `starts_at` then `recurrence_id` in the matching direction; `first()`. Do not exclude cancelled occurrences — they stay in the chain (FR-004)
      4. `SeriesNeighbour` carries the direction, the neighbour event or `null`, and the reason when absent. Expose `isAvailable()`, `routeKey()` (via `OccurrenceKey::toRouteKey()`), `label()`, and `accessibleName()` so the Blade layer stays a pure renderer, as `AgendaRow` already establishes
      5. `label()`: `D j M H:i` for a timed occurrence, `D j M · all day` for an all-day one, appending ` Y` when the neighbour's year differs from the current occurrence's. `accessibleName()`: `"{Previous|Next} occurrence, {label} (opens in a new tab)"`
      6. Absent reasons speak about the mirror only: `The mirror holds no earlier occurrence of this series.` / `…no later occurrence…` — never that the series begins or ends there. Wrap user-facing strings in `__()`
      7. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `forOccurrence()` returns `null` for `recurrence_id === ''` and a pair otherwise, including for a series with exactly one stored occurrence
      - [x] Each direction costs exactly one `LIMIT 1` query filtered on `source_uid`; the series is never loaded
      - [x] Ties on `starts_at` break deterministically on `recurrence_id`; an occurrence is never its own neighbour
      - [x] Cancelled occurrences are returned as neighbours, unmarked by the lookup
      - [x] Pint + Larastan level 5 pass

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-018): TASK-01 add series neighbour lookup`
      - Push: `origin feature/US-018-series-neighbour-links`
      - PR: update the local PR notes
