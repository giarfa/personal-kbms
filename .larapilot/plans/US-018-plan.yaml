    id: TASK-02
    title: 'Unit tests for series adjacency and labelling'
    body: |-
      ## Description
      Pin the ordering rule, the one-off/single-occurrence distinction, and the label formatting at the seam that owns them, before any view depends on them.

      ## Files Involved
      - tests/Unit/Meetings/SeriesNeighbourLookupTest.php (new)

      ## Steps
      1. `php artisan make:test --phpunit SeriesNeighbourLookupTest --no-interaction`, then move it under `tests/Unit/Meetings/` alongside `MeetingCoverageLookupTest` and match its namespace and structure
      2. Build series members with `CalendarEvent::factory()->occurrenceOf($uid, $recurrenceId)->at(...)`; freeze time with `Carbon::setTestNow()` as the sibling tests do
      3. Cover: both neighbours present; the **nearest** sibling chosen over a farther one in each direction; the first stored occurrence (previous absent, reason set); the last stored occurrence (next absent); a cancelled sibling returned rather than skipped; a series with exactly one stored occurrence returning a pair with both sides absent; a one-off (`recurrence_id === ''`) returning `null`; an occurrence of a *different* `source_uid` at an adjacent time never returned
      4. Tie-break: two siblings sharing a `starts_at` — assert the resolution is deterministic, that neither resolves to itself, and that they do not resolve onto each other in a cycle
      5. Labels: timed (`Mon 8 Sep 09:00`), all-day (`· all day`), and a neighbour in a different year carrying the year; accessible name carrying direction, destination and the new-tab announcement
      6. `php artisan test --compact --filter=SeriesNeighbourLookupTest`

      ## Completion Criteria
