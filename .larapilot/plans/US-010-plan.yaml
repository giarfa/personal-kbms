    id: TASK-02
    title: 'Order same-drift candidates by slug prefix instead of exact equality'
    body: |
      ## Description
      Replace the resolver's exact slug-equality ordering hint with prefix semantics: among candidates sharing the same drift, one whose file slug *starts with* the event's summary slug sorts ahead of one that does not. Ordering-only — the candidate set and the Missing/Linked/Ambiguous decision are unchanged (AC2).

      ## Files Involved
      - app/Transcripts/TranscriptResolver.php
      - app/Transcripts/TranscriptCandidate.php _(docblock only)_
      - tests/Unit/Transcripts/TranscriptResolverTest.php

      ## Steps
      1. In `candidatesFor()`, slugify the summary with the new separator: `$summarySlug = Str::slug((string) $event->summary, '_')`
      2. Change the candidate construction to `slugMatches: $summarySlug !== '' && str_starts_with($entry['slug'], $summarySlug)`. The `$summarySlug !== ''` guard is required — `str_starts_with($anything, '')` is always `true`, which would flag every candidate on a blank-summary event
      3. Leave the `usort()` comparator byte-for-byte as it is: drift, then `slugMatches`, then filename. Leave `entriesForWindow()`, `entriesForDate()`, `index()`, and `stateFor()` untouched — the prefix hint must not filter the window or break the >= 2 → `Ambiguous` rule
      4. Keep the property name `TranscriptCandidate::$slugMatches` (a prefix match is still a match; renaming would churn both call sites and every assertion for no behavioral gain). Extend its docblock and the `TranscriptResolver` class docblock to state the prefix semantics: `file_slug LIKE 'event_slug%'`, ordering only, never a filter, never a tiebreaker on its own
      5. Update the two existing ordering assertions in `TranscriptResolverTest.php` (`test_three_in_window_files_return_three_ordered_candidates_and_link_nothing`, `test_ordering_is_drift_then_slug_match_then_name`) if the migrated fixtures changed their relative order
      6. `vendor/bin/pint --dirty --format agent`
      7. `php artisan test --compact tests/Unit/Transcripts tests/Feature/TranscriptPanelTest.php`, then the full suite

      ## Completion Criteria
      - [x] For event slug `standup`, a file slug `standup_daily_team` sorts ahead of an equally-drifted `weekly_ops`
      - [x] Both files remain candidates and the state is still `Ambiguous` — the prefix hint filtered nothing
      - [x] An exact datetime *and* slug match beside a second candidate still yields `Ambiguous`, never an auto-link
      - [x] A blank event summary flags no candidate as a match; ordering falls through to filename
      - [x] `stateFor()` thresholds (0 → Missing, 1 → Linked, >= 2 → Ambiguous) unchanged
      - [x] Full suite green, Pint clean

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-010): TASK-02 order same-drift transcript candidates by slug prefix`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes — no remote
