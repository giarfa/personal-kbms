    id: TASK-01
    title: 'Cut TranscriptPattern over to Ymd dates and underscore slugs'
    body: |
      ## Description
      Hard-cutover the filename convention in `TranscriptPattern`: `{date}` becomes `Ymd`, `{slug}` renders with an underscore separator, and the default pattern becomes `{date}_{time}_{slug}`. Migrate every affected test fixture in the same commit so the suite stays green (AC1, AC3, AC4).

      ## Files Involved
      - app/Transcripts/TranscriptPattern.php
      - app/Transcripts/ParsedFilename.php _(docblock only)_
      - config/kbms.php
      - .env.example
      - tests/Unit/Transcripts/TranscriptPatternTest.php
      - tests/Unit/Transcripts/TranscriptResolverTest.php
      - tests/Feature/TranscriptPanelTest.php
      - tests/Feature/ConfigurationSurfaceTest.php
      - tests/Feature/TranscriptDurabilityTest.php _(comment only)_

      ## Steps
      1. `TranscriptPattern::DEFAULT_PATTERN` → `'{date}_{time}_{slug}'`
      2. In `toRegex()`, change the `{date}` placeholder from `(?P<date>\d{4}-\d{2}-\d{2})` to `(?P<date>\d{8})`. Leave `{time}`, `{slug}`, the `preg_split` chunking, and the `preg_quote` escaping of literal chunks exactly as they are — a custom pattern's literal `.` must still be escaped
      3. In `parse()`, change the Carbon call to `CarbonImmutable::createFromFormat('Ymd Hi', "{$date} {$time}")`
      4. Immediately after the existing `null` check in `parse()`, add the rolled-over-date guard: `if ($datetime->format('Ymd Hi') !== "{$date} {$time}") { return null; }` — `20261345_1430_x` must not silently become 2027-02-14
      5. In `render()`, change `'{date}' => $at->format('Ymd')` and `'{slug}' => Str::slug($slug, '_')`. Leave `'{time}' => $at->format('Hi')` untouched
      6. Update the class docblock: the example becomes `20260907_1430_standup.md` and the date framing becomes `Ymd`. **Keep** the `{time}`-vs-`KBMS_OUTLOOK_URL_TEMPLATE` divergence warning — it is still true and still load-bearing. Extend `ParsedFilename::$slug`'s docblock to name the prefix-ordering semantics landing in TASK-02
      7. `config/kbms.php`: default `'transcript_pattern' => env('KBMS_TRANSCRIPT_PATTERN', '{date}_{time}_{slug}')`; refresh the adjacent comment (it currently says "Date + time prefix" and cites the decision journal — cite the superseding entry `da55147854b4096f`)
      8. `.env.example` line 81 → `KBMS_TRANSCRIPT_PATTERN={date}_{time}_{slug}`
      9. Migrate the test fixtures — **`{date}` is `Ymd` for custom patterns too**:
         - `TranscriptPatternTest.php`: `2026-09-07-0930-q4-roadmap-review` → `20260907_0930_q4_roadmap_review`; the colon-rejection pair; the custom pattern `rec_{date}_{time}__{slug}` fixture → `rec_20260907_1430__standup`; the metacharacter pattern `{date}.{time}.{slug}` fixtures → `20260907.0930.standup` / `20260907X0930Xstandup`; both fallback tests' input stems; the `render()` round-trip expectation → `20260907_1430_q4_roadmap_review`
         - `TranscriptResolverTest.php`: all 21 stem literals (`2026-09-07-0930-q4-roadmap-review` → `20260907_0930_q4_roadmap_review`, etc.) — mechanical, but check each slug's hyphens become underscores
         - `TranscriptPanelTest.php`: all 18 literals, including the `selectedCandidate` value and the `assertSee`/`assertStringContainsString` filename assertions
         - `ConfigurationSurfaceTest.php:16`: `assertSame('{date}_{time}_{slug}', config('kbms.transcript_pattern'))`
         - `TranscriptDurabilityTest.php:181`: **leave the old-format filename in place** — post-cutover it is AC5 evidence. Refresh only the inline comment to say the name matches the *retired* convention and is therefore unparseable by the current pattern
      10. `vendor/bin/pint --dirty --format agent`
      11. `php artisan test --compact` — the whole suite, not just the transcript tests

      ## Completion Criteria
      - [x] `20260907_1430_standup` parses to 2026-09-07 14:30 with slug `standup`
      - [x] `render()` on 2026-09-07 14:30 / "Q4 Roadmap Review" yields `20260907_1430_q4_roadmap_review` and round-trips through `parse()`
      - [x] `2026-09-07-1430-standup` parses to `null` — no legacy fallback branch was added
      - [x] `20261345_1430_x` parses to `null` instead of rolling over
      - [x] `isValid()` and the literal-chunk escaping in `toRegex()` are unchanged
      - [x] `config('kbms.transcript_pattern')`, `.env.example`, and `DEFAULT_PATTERN` agree
      - [x] Full suite green — no commit left red
      - [x] Pint clean

      ## Test Data
      - N/A — no model, migration, or relationship changes. Seeders render through `TranscriptPattern::render()` and adapt automatically; verified in TASK-04

      ## Git Deliverables
      - Commit: `feat(US-010): TASK-01 cut the transcript convention over to Ymd dates and underscore slugs`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes — no remote
