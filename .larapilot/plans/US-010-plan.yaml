      1. Reuse the existing helpers — `TranscriptResolverTest::file()` / `eventAt()`,
         `MeetingTranscript::factory()->forOccurrence()->manual()`. Do not add a new temp-directory
         helper or duplicate factory definitions.
      2. `TranscriptResolverTest` — the headline case: write `20260907_0930_q4_roadmap_review.md`
         **and** `20260907_0930_q4_roadmap_review.txt` (same stem, same minute) for an event at
         2026-09-07 09:30, then assert **exactly one** candidate, that it is the `.md`, and that
         `TranscriptState::Linked` — not `Ambiguous` — is the resolved state. Name it for the
         regression it guards (the sibling `.txt` used to double every recording).
      3. `TranscriptResolverTest` — a lone `.txt` inside the tolerance window with no `.md` sibling
         produces **zero** candidates (`Missing`), proving `.txt` is not indexed at all rather than
