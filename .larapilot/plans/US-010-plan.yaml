      4. `TranscriptPanelTest` — the manual picker no longer offers a `.txt`: seed one `.md` and one
         `.txt` in the base and assert the rendered picker list contains the `.md` and not the `.txt`.
      5. `TranscriptDurabilityTest` — an existing `meeting_transcripts` row whose stored `path` is a
         `.txt` still resolves as `Linked` and renders as escaped plain text under the md-only
         config. This is the durability half of the AC and the one that would silently rot if
         someone later "enforces" the extension in the reader.
      6. `php artisan test --compact tests/Unit/Transcripts tests/Feature/TranscriptPanelTest.php tests/Feature/TranscriptDurabilityTest.php`, then the full suite
