    title: 'Re-route the plain-text panel state through a manual link'
    body: |-
      ## Description
      Fix: the `.txt` plain-text rendering state is currently reached through convention
      resolution, which TASK-05 removes. Keep the state fully demonstrable and covered by
      re-reaching it the way the operator now must — a **manual link** — rather than deleting the
      state or its test.

      ## Files Involved
      - database/seeders/MeetingTranscriptSeeder.php _(`seedTextTranscript()`, lines ~144-165)_
      - tests/Feature/TranscriptPanelTest.php _(`test_a_txt_transcript_renders_as_plain_text_not_markdown`, lines ~304-311)_

      ## Steps
      1. `MeetingTranscriptSeeder::seedTextTranscript()` still **writes** the sprint-planning
         `.txt` file — the file must exist on disk for the reader to open it. What changes is that
         the convention will no longer find it, so the seeder must now also persist the link.
         Follow the shape `seedManualLink()` (line ~171) already uses in this same class:
         `MeetingTranscript::factory()->forOccurrence($event)->manual()` with the `.txt` path.
         Reuse the existing factory states — do **not** add a new one.
      2. Refresh that method's docblock: the `.txt` state now demonstrates plain-text rendering
         **through a manual override**, since convention resolution is md-only.
      3. `TranscriptPanelTest::test_a_txt_transcript_renders_as_plain_text_not_markdown()` seeds a
         `.txt` at line 307 and expects the panel to resolve it. Rework it to link the file
         explicitly (persisted `MeetingTranscript` row, or drive the component's `link()` action —
         match whichever shape the neighbouring manual-override tests in this file already use) and
         keep the `.txt rendered as plain text` assertion intact. Rename it to say the state is
         reached manually.
      4. `test_the_picker_lists_only_files_inside_the_base()` (line 212) — read it and check
         whether any fixture it writes is a `.txt`; if so the expected list shrinks. Adjust only
         what the extension change actually moved.
      5. Re-seed end to end: clear `storage/app/transcripts`, run `php artisan migrate:fresh --seed`,
         and confirm **every** panel state is still reachable — linked, ambiguous, `.txt` (now
         manual), manual, broken.
      6. `vendor/bin/pint --dirty --format agent`
      7. `php artisan test --compact tests/Feature/TranscriptPanelTest.php`, then the full suite

      ## Completion Criteria
      - [x] Sprint-planning `.txt` file is still written to disk by the seeder
      - [x] It is now linked via `MeetingTranscript::factory()->manual()`, not convention
      - [x] `migrate:fresh --seed` succeeds and all five panel states remain reachable
      - [x] The plain-text rendering assertion still runs and passes
      - [x] No new factory state was introduced
      - [x] Full suite green except the known `kbms.ics_url` env-leak failure; Pint clean

      ## Test Data
      - [x] `MeetingTranscriptSeeder` updated to persist the `.txt` link manually
      - [x] `MeetingTranscriptFactory` **unchanged** — `manual()` and `forOccurrence()` already exist

