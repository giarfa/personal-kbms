code: US-010
plan_body: |
  ## Technical Solution

  A convention-only cutover inside `app/Transcripts`. No migration, no model, no new class, no change to the resolver's minute-keyed index or to the persisted-link read path.

  ### 1. `TranscriptPattern` — the date/slug convention (AC1, AC3, AC4)

  | Surface | Today | After |
  | --- | --- | --- |
  | `DEFAULT_PATTERN` | `{date}-{time}-{slug}` | `{date}_{time}_{slug}` |
  | `{date}` regex | `(?P<date>\d{4}-\d{2}-\d{2})` | `(?P<date>\d{8})` |
  | `parse()` format | `CarbonImmutable::createFromFormat('Y-m-d Hi', ...)` | `CarbonImmutable::createFromFormat('Ymd Hi', ...)` |
  | `render()` date | `$at->format('Y-m-d')` | `$at->format('Ymd')` |
  | `render()` slug | `Str::slug($slug)` | `Str::slug($slug, '_')` |
  | `{time}` | `Hi` | **unchanged** — `Hi` |
  | `{slug}` regex | `(?P<slug>.*)` | **unchanged** |
  | `isValid()` | contains `{date}` + ends with `{slug}` | **unchanged** (AC4) |
  | `toRegex()` chunk-splitting/escaping | — | **unchanged** |

  **AC3 (hard cutover) falls out of the regex change, not out of extra code.** `2026-09-07-1430-standup` no longer matches `#^(?P<date>\d{8})_(?P<time>\d{4})_(?P<slug>.*)$#u`, so `parse()` returns `null` and `TranscriptResolver::index()` skips it exactly like any other unclaimed file. Do **not** add a legacy-format fallback branch, a deprecation shim, or a second regex — the spec calls for a hard cutover and the decision journal records it (`da55147854b4096f`, supersedes `d0418cd210a42d9c`).

  **Trap — `{date}` is `Ymd` for custom patterns too.** The placeholder is global: a custom `KBMS_TRANSCRIPT_PATTERN` keeps its own literals but inherits `Ymd`. Every custom-pattern test fixture must move from `2026-09-07` to `20260907` (`rec_{date}_{time}__{slug}`, `{date}.{time}.{slug}`, `{slug}-{date}-{time}`). AC4 is about the **validation rule and the render/parse round-trip** staying intact — not about custom patterns keeping `Y-m-d`.

  **Hardening (Andrew).** `CarbonImmutable::createFromFormat('Ymd Hi', '20261345 1430')` silently rolls over to `2027-02-14 14:30` — a latent defect that already exists with `Y-m-d` and that `\d{8}` inherits. Add a round-trip guard in `parse()` immediately after the Carbon call:

  ```php
  if ($datetime->format('Ymd Hi') !== "{$date} {$time}") {
      return null;
  }
  ```

  A name that carries an impossible date is a name this convention does not claim — same contract as any other non-matching filename. The guard must be derived from the pattern's own date format, not hardcoded twice.

  **Docblock debt.** The class docblock currently cites `2026-09-07-1430-standup.md` as "the recorded convention's own example" and the `{time}` divergence from `KBMS_OUTLOOK_URL_TEMPLATE`. The `{time}` divergence note **stays** (still true, still load-bearing); the example and the `Y-m-d` framing move to `20260907_1430_standup.md` / `Ymd`.

  ### 2. `TranscriptResolver` — prefix ordering (AC2)

  Two lines change in `candidatesFor()`:

  ```php
  $summarySlug = Str::slug((string) $event->summary, '_');   // was Str::slug((string) $event->summary)

  slugMatches: $summarySlug !== '' && str_starts_with($entry['slug'], $summarySlug),
  ```

  - **Ordering-only, never a filter.** The `usort()` comparator keeps its exact shape — drift, then slug, then filename. `entriesForWindow()` / `entriesForDate()` are untouched: every file inside the tolerance window is still a candidate regardless of slug, and two candidates still yield `Ambiguous` even when one is an exact datetime *and* slug match.
  - **Empty-summary guard.** An event with a blank summary slugifies to `''`, and `str_starts_with($anything, '')` is always `true` — which would flag every candidate as a match. Guarding on `$summarySlug !== ''` makes the hint honestly `false` for all of them and lets the filename tiebreak decide, matching today's behavior.
  - **`TranscriptCandidate::$slugMatches` keeps its name.** A prefix match is still a match; renaming it to `slugPrefixMatches` would churn the DTO, both call sites, and the assertions for no behavioral gain. The docblock on the property (`"ordering hint only — never filters and never breaks a tie"`) is extended to state the prefix semantics explicitly, as is the `ParsedFilename::$slug` docblock.

  ### 3. Configuration and documentation surface

  `config/kbms.php` default, `.env.example`, the README config table + "Transcript linking" prose, and the CHANGELOG Unreleased section all carry the hyphenated example verbatim and all move together. The **operator's own `.env`** pins `KBMS_TRANSCRIPT_PATTERN={date}-{time}-{slug}`, which would defeat the new default on the one machine that matters — clearing that line is part of the manual handoff, not a code change.

  ### 4. Explicitly out of scope

  - Any migration or backfill of existing `meeting_transcripts` rows (AC5 is satisfied by *not* touching that path — `TranscriptPanel::readerViewData()` reads the stored `path` directly and never re-derives it).
  - A rename/move tool for old-format files on disk. The application only ever reads `KBMS_TRANSCRIPTS_PATH`; renaming the operator's files is the pipeline's business.
  - Any change to `{time}`, to tolerance handling, to `TranscriptsDirectory`, `TranscriptReader`, `MeetingCoverageLookup`, or to the eight panel states.

  ## Git & Branching

  - Mode: `GITFLOW` (from `settings.git_mode`) — **never auto-push**; the internal PR toward `develop` is prepared locally only.
  - Branch: `feature/US-010-transcript-filename-convention` from `develop`.
  - TASK-00 bootstraps the branch and carries the four pending `.larapilot` artifacts (`backlog.yaml`, `decisions.yaml`, `docs/PRD.md`, `specs/US-010.yaml`) plus the plan file, matching the `chore(US-009)` precedent.
  - One atomic Conventional Commit per task: `type(US-010): TASK-NN summary`. Never batch tasks.
  - `vendor/bin/pint --dirty` and `php artisan test` green before every commit.
  - `CHANGELOG.md` Unreleased is updated in TASK-04 (user-facing behavior change).
  - Merge to `develop` only after human `/larapilot-review` approval.

  ## Test Data Strategy

  - **No factory or seeder change is required.** No model, migration, column, enum, or relationship is touched.
  - `MeetingTranscriptSeeder` and `PromptLaunchSeeder` already write their fixture files through `TranscriptPattern::render()` — the same compiler the resolver matches against — so they inherit the new convention automatically and cannot drift from the matcher. This is the property that makes the cutover cheap; do not hardcode filenames in seeders to "fix" anything.
  - Verification is still mandatory: `php artisan migrate:fresh --seed` must succeed and `storage/app/transcripts` must afterwards contain underscore/`Ymd` names (e.g. `20260907_0930_q4_roadmap_review.md`), with every panel state (linked, ambiguous, `.txt`, manual, broken) still reachable.
  - Any old-format file left over in `storage/app/transcripts` from a previous seed simply stops being indexed — that is AC3 working, not a defect. Clear the directory before re-seeding to see a clean state.

  ## Test Strategy

  - Bar: **`NORMAL`** (from `settings.testing`). PHPUnit only (`php artisan make:test --phpunit`), matching the existing class-based suite. **No** Playwright, Dusk, Pest browser, viewport matrix, or axe automation.
  - **Fixture migration lands in the same commit as the behavior change** so no commit is left red. 45 hyphenated stem literals across four files move to the new convention: `tests/Unit/Transcripts/TranscriptPatternTest.php` (5), `tests/Unit/Transcripts/TranscriptResolverTest.php` (21), `tests/Feature/TranscriptPanelTest.php` (18), plus the default-value assertion in `tests/Feature/ConfigurationSurfaceTest.php:16`.
  - `tests/Feature/TranscriptDurabilityTest.php:162` (`test_changing_the_transcript_pattern_does_not_break_an_existing_persisted_link`) **keeps its old-format filename deliberately** — post-cutover it is direct AC5 evidence that an unparseable name stays linked when a row exists. Only its inline comment is refreshed.
  - New coverage, one test per acceptance criterion plus the hardening:

  | AC | Test |
  | --- | --- |
  | AC1 | `20260907_1430_standup` parses to 2026-09-07 14:30 with slug `standup` |
  | AC1 | `render()` produces `20260907_1430_q4_roadmap_review` and `parse()` round-trips it |
  | AC1 | Special characters are stripped: `Standup \| Team #1` renders slug `standup_team_1` |
  | AC2 | Same drift, file slug `standup_daily_team` sorts ahead of `weekly_ops` for event slug `standup` |
  | AC2 | Prefix is ordering-only: both files stay candidates and the state is still `Ambiguous` |
  | AC2 | Blank event summary flags no candidate as a slug match and falls through to filename order |
  | AC3 | `2026-09-07-1430-standup` parses to `null` and is absent from the resolver's candidates |
  | AC4 | Custom `rec_{date}_{time}__{slug}` still compiles, parses `rec_20260907_1430__standup`, and round-trips |
  | AC4 | A pattern missing `{date}` / not ending in `{slug}` still falls back to the default with a logged warning |
  | AC5 | An existing `meeting_transcripts` row with an old-format `path` still renders as linked |
  | Hardening | `20261345_1430_x` parses to `null` instead of rolling over to 2027-02-14 |

  - **Manual test handoff (Anne).** Automation cannot reach the operator's real pipeline directory, so the human verifies on their machine before approval — steps in TASK-04's completion criteria.
  - Quality gate before review: `php artisan larapilot:quality` (Pint + Larastan level 5+) must pass.
