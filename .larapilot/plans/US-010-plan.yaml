    id: TASK-08
    title: 'Document md-only resolution and fix the stale env comment'
    body: |-
      ## Description
      Fix: bring the documented behavior in line with md-only resolution, and correct the
      `.env.example` comment the review caught — TASK-04 updated the value and the README prose but
      left the placeholder comment describing the retired `Y-m-d` date. Runs in parallel with
      TASK-05/06/07 — no shared files.

      ## Files Involved
      - README.md _(lines ~109, ~113, ~115)_
      - CHANGELOG.md _(Unreleased)_
      - .env.example _(line 79)_

      ## Steps
      1. **`.env.example:79`** currently reads
         `# Placeholders: {date} (Y-m-d), {time} (Hi — NO colon, ...), {slug} (slugified title).`
         directly above `KBMS_TRANSCRIPT_PATTERN={date}_{time}_{slug}`. Change `{date}` to **`Ymd`**
         and describe `{slug}` as underscore-separated. **Keep** the `NO colon, unlike
         KBMS_OUTLOOK_URL_TEMPLATE` warning and the `must end with {slug}` line on 80 verbatim.
         Note the unrelated `.env.example:96` placeholder comment belongs to
         `KBMS_OUTLOOK_URL_TEMPLATE`, where `{date}` really is `Y-m-d` — **do not touch it**.
      2. **README.md:113** — `` `.md` renders through the same hardened Markdown converter as notes;
         `.txt` is shown as escaped plain text. `` Extend: only `.md` files are indexed and offered
         by the picker; a `.txt` is reachable only through a link made before this change, and still
         renders as escaped plain text. Explain the why in one clause — a pipeline that emits a
         `.md` + `.txt` pair per recording would otherwise make every meeting ambiguous.
      3. **README.md:109** — the manual-override sentence says the picker has no free-text path
         field. Add that the picker lists `.md` files only.
      4. **README.md:115** — the local-dev paragraph lists the seeded panel states as
         "(linked, ambiguous, `.txt`, manual, broken)". The `.txt` state is now seeded as a manual
         link; adjust the wording so it stays accurate after TASK-06.
      5. **CHANGELOG.md** Unreleased → `### Changed`: transcript resolution now indexes `.md` only.
         State plainly that this is **breaking** for anyone relying on `.txt` auto-linking or on
         picking a `.txt` manually, and that transcripts already linked to a `.txt` are unaffected.
         Fold it next to the existing US-010 convention entry rather than opening a second bullet
         about the same feature.
      6. Re-read the whole "Transcript linking" section end to end — after three passes of edits it
         must still read as one coherent explanation, not a changelog of patches.

      ## Completion Criteria
      - [ ] `.env.example:79` says `Ymd` and underscore slug; the colon warning and the
            `{slug}`-terminator rule survive verbatim
      - [ ] `.env.example:96` (Outlook template) untouched
      - [ ] README states md-only indexing + picker, and that a pre-existing `.txt` link still renders
      - [ ] README's seeded-panel-state list matches what TASK-06 actually seeds
      - [ ] CHANGELOG records the md-only restriction and flags it as breaking for unlinked `.txt`
      - [ ] The "Transcript linking" section reads coherently start to finish

      ## Test Data
      - N/A — documentation only

