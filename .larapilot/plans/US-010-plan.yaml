    id: TASK-05
    title: 'Narrow transcript_extensions to md-only and migrate the affected fixtures'
    body: |-
      ## Description
      Fix: convention resolution (and the manual picker) must consider `.md` files only, so a
      `.txt` sibling sharing a stem stops turning every single-transcript meeting into
      `Ambiguous`. Config change plus the fixture migration it forces — **in one commit**, so no
      commit is left red (same discipline TASK-01 used).

      ## Files Involved
      - config/kbms.php
      - tests/Feature/ConfigurationSurfaceTest.php
      - tests/Unit/Transcripts/TranscriptsDirectoryTest.php
      - tests/Unit/Transcripts/TranscriptResolverTest.php
      - .larapilot/ artifacts _(housekeeping — see step 1)_

      ## Steps
      1. **Housekeeping first.** Stage and commit the `.larapilot` artifacts left uncommitted at
         review time (`backlog.yaml`, `specs/US-010.yaml`, `plans/US-010-plan.yaml`,
         `decisions.yaml`, `usage/ledger.jsonl`) and delete the stray
         `.larapilot/plans/US-010-plan.yaml.lock`. This may be folded into the TASK-05 commit.
      2. `config/kbms.php:46` → `'transcript_extensions' => ['md'],`. Replace the adjacent comment
         with one naming the reason: the operator's pipeline emits a `.md` + `.txt` pair per
         recording, so indexing both made every meeting `Ambiguous` (decision journal
         `14f91842c55d2d7f`). The `list<string>` shape in the config docblock at `config/kbms.php:13`
         is **unchanged**.
      3. **`app/Transcripts/TranscriptsDirectory.php` needs no code change** — the filter at
         line 107 is already config-driven. Confirm by reading it; do **not** refactor it, and do
         **not** add an extension check to `TranscriptReader`.
      4. `tests/Feature/ConfigurationSurfaceTest.php:19` → `$this->assertSame(['md'], config('kbms.transcript_extensions'));`.
         Leave every other assertion in that test alone — in particular the `kbms.ics_url` line,
         which fails from a local `.env` leak and is not ours.
      5. `tests/Unit/Transcripts/TranscriptsDirectoryTest.php:106`
         (`test_the_index_lists_only_configured_extensions_case_insensitively`) currently writes
         `a.md`, `b.TXT`, `c.pdf` and asserts **2** files. Case-insensitivity is still load-bearing
         coverage, so keep it and re-express with the new list: write `a.md`, `b.MD`, `c.txt`,
         `d.pdf`; assert **2** files, both `.md`/`.MD` present, and `.txt` **and** `.pdf` both
         absent. Rename the test to say md-only (e.g.
         `test_the_index_lists_only_md_files_case_insensitively`).
      6. `tests/Unit/Transcripts/TranscriptResolverTest.php:102,112`
         (`test_three_in_window_files_return_three_ordered_candidates_and_link_nothing`) seeds
         `20260907_0933_untitled_call` as `.txt`. Change it to the default `.md` and update the
         line 112 assertion to `20260907_0933_untitled_call.md`. Ordering is drift-driven here
         (0, -2, +3), so the candidate order and the count of 3 do **not** change. The exclusion
         case gets its own test in TASK-07 — do not overload this one.
      7. `vendor/bin/pint --dirty --format agent`
      8. `php artisan test --compact` — full suite. Expect exactly one failure: the pre-existing
         `kbms.ics_url` env leak in `ConfigurationSurfaceTest`. Any other failure is yours.

      ## Completion Criteria
      - [x] `config('kbms.transcript_extensions')` is `['md']` and the comment explains why
      - [x] `TranscriptsDirectory` and `TranscriptReader` are unmodified
      - [x] Directory index test still proves case-insensitivity, now with `.txt` explicitly excluded
      - [x] Resolver ordering test still asserts 3 candidates in the same order
      - [x] Stray `US-010-plan.yaml.lock` gone; `.larapilot` artifacts committed
      - [x] Full suite green except the known `kbms.ics_url` env-leak failure
      - [x] Pint clean

      ## Test Data
      - N/A — no model, migration, column, or relationship change. Seeder impact is TASK-06.

