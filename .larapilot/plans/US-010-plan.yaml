    id: TASK-01
    title: 'Cut TranscriptPattern over to Ymd dates and underscore slugs'
    body: |
      ## Description
      Hard-cutover the filename convention in `TranscriptPattern`: `{date}` becomes `Ymd`, `{slug}` renders with an underscore separator, and the default pattern becomes `{date}_{time}_{slug}`. Migrate every affected test fixture in the same commit so the suite stays green (AC1, AC3, AC4).

      ## Files Involved
      - app/Transcripts/TranscriptPattern.php
      - app/Transcripts/ParsedFilename.php _(docblock only)_
      - config/kbms.php
      - .env.example
      - tests/Unit/Transcripts/TranscriptPatternTest.php
      - tests/Unit/Transcripts/TranscriptResolverTest.php
      - tests/Feature/TranscriptPanelTest.php
      - tests/Feature/ConfigurationSurfaceTest.php
      - tests/Feature/TranscriptDurabilityTest.php _(comment only)_

      ## Steps
      1. `TranscriptPattern::DEFAULT_PATTERN` → `'{date}_{time}_{slug}'`
      2. In `toRegex()`, change the `{date}` placeholder from `(?P<date>\d{4}-\d{2}-\d{2})` to `(?P<date>\d{8})`. Leave `{time}`, `{slug}`, the `preg_split` chunking, and the `preg_quote` escaping of literal chunks exactly as they are — a custom pattern's literal `.` must still be escaped
      3. In `parse()`, change the Carbon call to `CarbonImmutable::createFromFormat('Ymd Hi', "{$date} {$time}")`
      4. Immediately after the existing `null` check in `parse()`, add the rolled-over-date guard: `if ($datetime->format('Ymd Hi') !== "{$date} {$time}") { return null; }` — `20261345_1430_x` must not silently become 2027-02-14
      5. In `render()`, change `'{date}' => $at->format('Ymd')` and `'{slug}' => Str::slug($slug, '_')`. Leave `'{time}' => $at->format('Hi')` untouched
      6. Update the class docblock: the example becomes `20260907_1430_standup.md` and the date framing becomes `Ymd`. **Keep** the `{time}`-vs-`KBMS_OUTLOOK_URL_TEMPLATE` divergence warning — it is still true and still load-bearing. Extend `ParsedFilename::$slug`'s docblock to name the prefix-ordering semantics landing in TASK-02
      7. `config/kbms.php`: default `'transcript_pattern' => env('KBMS_TRANSCRIPT_PATTERN', '{date}_{time}_{slug}')`; refresh the adjacent comment (it currently says "Date + time prefix" and cites the decision journal — cite the superseding entry `da55147854b4096f`)
      8. `.env.example` line 81 → `KBMS_TRANSCRIPT_PATTERN={date}_{time}_{slug}`
      9. Migrate the test fixtures — **`{date}` is `Ymd` for custom patterns too**:
         - `TranscriptPatternTest.php`: `2026-09-07-0930-q4-roadmap-review` → `20260907_0930_q4_roadmap_review`; the colon-rejection pair; the custom pattern `rec_{date}_{time}__{slug}` fixture → `rec_20260907_1430__standup`; the metacharacter pattern `{date}.{time}.{slug}` fixtures → `20260907.0930.standup` / `20260907X0930Xstandup`; both fallback tests' input stems; the `render()` round-trip expectation → `20260907_1430_q4_roadmap_review`
         - `TranscriptResolverTest.php`: all 21 stem literals (`2026-09-07-0930-q4-roadmap-review` → `20260907_0930_q4_roadmap_review`, etc.) — mechanical, but check each slug's hyphens become underscores
         - `TranscriptPanelTest.php`: all 18 literals, including the `selectedCandidate` value and the `assertSee`/`assertStringContainsString` filename assertions
         - `ConfigurationSurfaceTest.php:16`: `assertSame('{date}_{time}_{slug}', config('kbms.transcript_pattern'))`
         - `TranscriptDurabilityTest.php:181`: **leave the old-format filename in place** — post-cutover it is AC5 evidence. Refresh only the inline comment to say the name matches the *retired* convention and is therefore unparseable by the current pattern
      10. `vendor/bin/pint --dirty --format agent`
      11. `php artisan test --compact` — the whole suite, not just the transcript tests

      ## Completion Criteria
      - [ ] `20260907_1430_standup` parses to 2026-09-07 14:30 with slug `standup`
      - [ ] `render()` on 2026-09-07 14:30 / "Q4 Roadmap Review" yields `20260907_1430_q4_roadmap_review` and round-trips through `parse()`
      - [ ] `2026-09-07-1430-standup` parses to `null` — no legacy fallback branch was added
      - [ ] `20261345_1430_x` parses to `null` instead of rolling over
      - [ ] `isValid()` and the literal-chunk escaping in `toRegex()` are unchanged
      - [ ] `config('kbms.transcript_pattern')`, `.env.example`, and `DEFAULT_PATTERN` agree
      - [ ] Full suite green — no commit left red
      - [ ] Pint clean

      ## Test Data
      - N/A — no model, migration, or relationship changes. Seeders render through `TranscriptPattern::render()` and adapt automatically; verified in TASK-04

      ## Git Deliverables
      - Commit: `feat(US-010): TASK-01 cut the transcript convention over to Ymd dates and underscore slugs`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes — no remote
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 2.5
    dependencies:
      - TASK-00
  -
    id: TASK-02
    title: 'Order same-drift candidates by slug prefix instead of exact equality'
    body: |
      ## Description
      Replace the resolver's exact slug-equality ordering hint with prefix semantics: among candidates sharing the same drift, one whose file slug *starts with* the event's summary slug sorts ahead of one that does not. Ordering-only — the candidate set and the Missing/Linked/Ambiguous decision are unchanged (AC2).

      ## Files Involved
      - app/Transcripts/TranscriptResolver.php
      - app/Transcripts/TranscriptCandidate.php _(docblock only)_
      - tests/Unit/Transcripts/TranscriptResolverTest.php

      ## Steps
      1. In `candidatesFor()`, slugify the summary with the new separator: `$summarySlug = Str::slug((string) $event->summary, '_')`
      2. Change the candidate construction to `slugMatches: $summarySlug !== '' && str_starts_with($entry['slug'], $summarySlug)`. The `$summarySlug !== ''` guard is required — `str_starts_with($anything, '')` is always `true`, which would flag every candidate on a blank-summary event
      3. Leave the `usort()` comparator byte-for-byte as it is: drift, then `slugMatches`, then filename. Leave `entriesForWindow()`, `entriesForDate()`, `index()`, and `stateFor()` untouched — the prefix hint must not filter the window or break the >= 2 → `Ambiguous` rule
      4. Keep the property name `TranscriptCandidate::$slugMatches` (a prefix match is still a match; renaming would churn both call sites and every assertion for no behavioral gain). Extend its docblock and the `TranscriptResolver` class docblock to state the prefix semantics: `file_slug LIKE 'event_slug%'`, ordering only, never a filter, never a tiebreaker on its own
      5. Update the two existing ordering assertions in `TranscriptResolverTest.php` (`test_three_in_window_files_return_three_ordered_candidates_and_link_nothing`, `test_ordering_is_drift_then_slug_match_then_name`) if the migrated fixtures changed their relative order
      6. `vendor/bin/pint --dirty --format agent`
      7. `php artisan test --compact tests/Unit/Transcripts tests/Feature/TranscriptPanelTest.php`, then the full suite

      ## Completion Criteria
      - [ ] For event slug `standup`, a file slug `standup_daily_team` sorts ahead of an equally-drifted `weekly_ops`
      - [ ] Both files remain candidates and the state is still `Ambiguous` — the prefix hint filtered nothing
      - [ ] An exact datetime *and* slug match beside a second candidate still yields `Ambiguous`, never an auto-link
      - [ ] A blank event summary flags no candidate as a match; ordering falls through to filename
      - [ ] `stateFor()` thresholds (0 → Missing, 1 → Linked, >= 2 → Ambiguous) unchanged
      - [ ] Full suite green, Pint clean

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-010): TASK-02 order same-drift transcript candidates by slug prefix`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes — no remote
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 1
    dependencies:
      - TASK-01
  -
    id: TASK-03
    title: 'Add acceptance coverage for the new convention and prefix ordering'
    body: |
      ## Description
      Add the PHPUnit coverage that pins each acceptance criterion, beyond the fixture migration already carried by TASK-01 and TASK-02. Bar is `NORMAL` — no browser, viewport, or E2E suites.

      ## Files Involved
      - tests/Unit/Transcripts/TranscriptPatternTest.php
      - tests/Unit/Transcripts/TranscriptResolverTest.php
      - tests/Feature/TranscriptDurabilityTest.php

      ## Steps
      1. Reuse the existing fixtures and helpers — `TranscriptResolverTest::file()` / `eventAt()`, `MeetingTranscript::factory()->forOccurrence()->convention()`. Do not duplicate factory definitions or introduce a new temp-directory helper
      2. `TranscriptPatternTest` — add:
         - AC1: `20260907_1430_standup` parses to 2026-09-07 14:30, slug `standup`
         - AC1: special characters are stripped by the underscore slugifier — `render()` on a title like `Standup | Team #1` yields slug `standup_team_1` and round-trips
         - AC3: `parse('2026-09-07-1430-standup')` returns `null` under the default pattern (name the test for the retired convention so its intent survives)
         - Hardening: `parse('20261345_1430_x')` returns `null`
         - AC4: assert the custom-pattern round-trip explicitly — `render()` under `rec_{date}_{time}__{slug}` feeds back into `parse()`
      3. `TranscriptResolverTest` — add:
         - AC2: two same-drift files, slugs `standup_daily_team` and `weekly_ops`, event summary `Standup` → the prefix candidate is `$candidates[0]` and its `slugMatches` is `true`
         - AC2 (ordering-only): the same two files still produce 2 candidates and `TranscriptState::Ambiguous`
         - AC3: an old-format file inside the tolerance window produces **zero** candidates
         - AC2 (empty slug): an event with a blank summary yields `slugMatches === false` on every candidate and filename ordering
      4. `TranscriptDurabilityTest` — AC5 is already covered by `test_changing_the_transcript_pattern_does_not_break_an_existing_persisted_link` with its now-retired-format filename. Add one focused assertion or a sibling test proving that an occurrence whose stored `path` uses the old convention still resolves as linked under the *default* (not just a bogus custom) pattern
      5. `php artisan test --compact tests/Unit/Transcripts tests/Feature/TranscriptDurabilityTest.php`, then the full suite
      6. `php artisan larapilot:quality` — Pint + Larastan level 5+

      ## Completion Criteria
      - [ ] One test per acceptance criterion (AC1 x3, AC2 x4, AC3 x2, AC4 x2, AC5 x1) plus the rolled-over-date guard
      - [ ] No Playwright, Dusk, Pest browser, or viewport suites were added
      - [ ] Existing factories reused — no duplicated fixture scaffolding
      - [ ] Full suite green
      - [ ] `larapilot:quality` passes (Pint + Larastan level 5+)

      ## Git Deliverables
      - Commit: `test(US-010): TASK-03 cover the Ymd/underscore convention and prefix ordering`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes — no remote
    type: Test
    status: TODO
    assignee: Anne
    estimate_hours: 1.5
