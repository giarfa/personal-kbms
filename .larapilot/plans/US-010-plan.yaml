    id: TASK-03
    title: 'Add acceptance coverage for the new convention and prefix ordering'
    body: |
      ## Description
      Add the PHPUnit coverage that pins each acceptance criterion, beyond the fixture migration already carried by TASK-01 and TASK-02. Bar is `NORMAL` — no browser, viewport, or E2E suites.

      ## Files Involved
      - tests/Unit/Transcripts/TranscriptPatternTest.php
      - tests/Unit/Transcripts/TranscriptResolverTest.php
      - tests/Feature/TranscriptDurabilityTest.php

      ## Steps
      1. Reuse the existing fixtures and helpers — `TranscriptResolverTest::file()` / `eventAt()`, `MeetingTranscript::factory()->forOccurrence()->convention()`. Do not duplicate factory definitions or introduce a new temp-directory helper
      2. `TranscriptPatternTest` — add:
         - AC1: `20260907_1430_standup` parses to 2026-09-07 14:30, slug `standup`
