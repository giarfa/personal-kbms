    id: TASK-04
    title: 'Update README, CHANGELOG, and the operator environment handoff'
    body: |
      ## Description
      Bring the documented convention in line with the code and hand the operator the two things automation cannot do for them: clear the stale `.env` override and confirm resolution against the real pipeline directory. Runs in parallel with TASK-01/TASK-02 — no shared files.

      ## Files Involved
      - README.md _(config table row + the "Transcript linking" section)_
      - CHANGELOG.md _(Unreleased)_
      - .env _(operator's local file — **not** committed, gitignored)_

      ## Steps
      1. README config table (line ~40): `KBMS_TRANSCRIPT_PATTERN` default → `` `{date}_{time}_{slug}` ``; add US-010 alongside US-007 in "Consumed by"
      2. README "Transcript linking" section (line ~105) — rewrite the placeholder sentence:
         - default is `{date}_{time}_{slug}`
         - `{date}` renders **`Ymd`** (e.g. `20260907`), `{time}` stays **`Hi`**, `{slug}` is the meeting title through `Str::slug($title, '_')` — lowercase, underscore-separated, special characters such as `|` and `#` stripped
         - worked example `20260907_1430_standup.md`
         - **keep** the "deliberate divergence from `KBMS_OUTLOOK_URL_TEMPLATE`" paragraph verbatim — `{time}` is still `Hi` here and `H:i` there
         - **keep** the "must end with `{slug}`" rule — unchanged by this spec
         - add one sentence: same-drift candidates are ordered by slug **prefix** (a file slug starting with the event slug sorts first); this is ordering only and never removes a candidate
         - add one sentence: the previous hyphenated `Y-m-d` convention is retired — such filenames are simply not indexed, while transcripts already linked keep working because the stored path is read directly
      3. `CHANGELOG.md` Unreleased → `### Changed`: the transcript filename convention is now `{date}_{time}_{slug}` with `Ymd` dates and underscore slugs, matching the operator's transcription pipeline; **breaking for unlinked files** — old hyphenated names are no longer recognized; already-linked transcripts are unaffected. Add `### Fixed` for the rolled-over-date guard if TASK-01 landed it
      4. **Operator `.env`:** line 73 pins `KBMS_TRANSCRIPT_PATTERN={date}-{time}-{slug}`, which would override the new default on the one machine that matters. Remove the line (or set it to `{date}_{time}_{slug}`), then `php artisan config:clear`
      5. Verify the seed path: clear `storage/app/transcripts`, run `php artisan migrate:fresh --seed`, confirm the generated fixture files carry `Ymd`/underscore names (e.g. `20260907_0930_q4_roadmap_review.md`) and that the panel still shows every state — linked, ambiguous, `.txt`, manual, broken
      6. `php artisan kbms:doctor` — transcripts-directory check still passes

      ## Completion Criteria
      - [x] README table and prose describe `Ymd` + underscore slug + prefix ordering, with the `20260907_1430_standup.md` example
      - [x] The `KBMS_OUTLOOK_URL_TEMPLATE` divergence warning and the "must end with `{slug}`" rule survive unchanged
      - [x] CHANGELOG Unreleased records the change and flags the hard cutover for unlinked files
      - [x] Operator `.env` no longer pins the retired pattern; `config:clear` run
      - [x] `migrate:fresh --seed` succeeds and produces underscore/`Ymd` fixture filenames; all panel states reachable
      - [x] **Manual test handoff (operator, before review approval):** point `KBMS_TRANSCRIPTS_PATH` at the real pipeline directory, open a meeting whose transcript the pipeline produced as `Ymd_Hi_slug.md`, and confirm it auto-links instead of showing Missing or Ambiguous; confirm one previously linked meeting still shows its transcript

      ## Test Data
      - N/A — no model or schema changes; seeders adapt through `TranscriptPattern::render()` and are verified in step 5

