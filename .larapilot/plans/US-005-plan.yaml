    id: TASK-01
    title: 'Occurrence addressing: OccurrenceKey, route binding and canonical meeting route'
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 3
    dependencies:
      - TASK-00
    body: |
      ## Description
      Give every occurrence a canonical route addressed by the feed's natural key (`source_uid`, `recurrence_id`), never by the UUID surrogate a resync can change. Laravel matches route parameters against `$request->decodedPath()`, so `%2F` inside a segment is decoded before matching — an arbitrary RFC 5545 `UID` cannot be interpolated raw. One URL-safe composite segment solves it without a schema change.

      ## Files Involved
      - app/Meetings/OccurrenceKey.php (new)
      - app/Models/CalendarEvent.php
      - app/Providers/AppServiceProvider.php
      - routes/web.php

      ## Steps
      1. `php artisan make:class Meetings/OccurrenceKey` — `final readonly class` with `public function __construct(public string $sourceUid, public string $recurrenceId = '')`.
         - `toRouteKey(): string` — `base64url(sourceUid)`, plus `'.'.base64url(recurrenceId)` when `recurrenceId !== ''`; `base64url` = `rtrim(strtr(base64_encode($v), '+/', '-_'), '=')`.
         - `public static function fromRouteKey(string $key): ?self` — split on the first `.`, strict-decode each half, return `null` on anything malformed (never throw).
         - Add PHPDoc; keep it dependency-free so it is unit-testable without the container.
      2. `CalendarEvent::occurrenceKey(): OccurrenceKey` and `scopeForOccurrence(Builder $query, OccurrenceKey $key): Builder` (`where source_uid` + `where recurrence_id`) — the existing `unique(['source_uid','recurrence_id'])` index serves it as a single indexed row read.
      3. `AppServiceProvider::boot()`: `Route::bind('occurrence', fn (string $value) => CalendarEvent::query()->forOccurrence(OccurrenceKey::fromRouteKey($value) ?? abort(404))->firstOrFail())` — keep the 404 explicit so the AC's not-found path is a real branch, not an uncaught exception.
      4. `routes/web.php`: `Route::get('meetings/{occurrence}', MeetingController::class)->name('meetings.show');` with a stub invokable controller (`php artisan make:controller MeetingController --invokable`) returning the view added in TASK-09.
      5. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] `route('meetings.show', $event->occurrenceKey()->toRouteKey())` resolves for a plain UID, a UID containing `/`, and an occurrence of a recurring series
      - [ ] An unknown or malformed key returns `404`, not a `500`
      - [ ] Detail lookup is a single query against the natural-key unique index
      - [ ] Pint + Larastan level 5 green

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-005): TASK-01 address meeting occurrences by their natural key`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
  -
    id: TASK-02
    title: 'Extend the calendar factory and seeder with the agenda fixture matrix'
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 2
    dependencies:
      - TASK-00
    body: |
      ## Description
      The current seeder scatters events randomly across ±45 days, so the default 7-day agenda window can come up empty and none of the link-resolution branches are represented. Give both the UI and the test suite the exact shapes this spec must prove: multi-day, overlapping, cancelled, feed-link, Teams-link, no-link, and one genuinely empty day.

      No new model — `CalendarEvent` is unchanged. This is a factory + seeder task.

      ## Files Involved
      - database/factories/CalendarEventFactory.php
      - database/seeders/CalendarEventSeeder.php

      ## Steps
      1. Add factory states alongside the existing `allDay()` / `cancelled()` / `withTeamsLink()` / `occurrenceOf()` / `stale()`:
         - `withEventUrl(): static` — a plausible OWA `event_url`, so the feed-link branch is reachable.
         - `spanning(int $days): static` — all-day event whose `ends_at` is `$days` after `starts_at`, for the multi-day clamp path.
         - `at(CarbonInterface $start, int $minutes = 30): static` — deterministic placement; random dates make agenda tests flaky.
      2. Rework `CalendarEventSeeder` into a **fixture week anchored on today** in `config('kbms.timezone')`, keeping the existing weekly-series block so recurrence identity stays demonstrable:
         - a `spanning(1)` all-day offsite starting today
         - two timed meetings today that overlap (e.g. 09:30–10:30 and 10:00–11:00)
         - a `cancelled()` occurrence today
         - one meeting `withTeamsLink()` only, one `withEventUrl()` only, one with neither
         - **no** events on one date inside the window, so the per-day empty state is visible without editing the database
      3. Keep attendee/organizer values domain-realistic — the mirror panel renders them verbatim.
      4. `php artisan migrate:fresh --seed` and open `/` — the fixture week must render once TASK-08 lands; until then verify by row counts.
      5. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Every acceptance-criterion shape (multi-day, overlapping, cancelled, feed link, Teams link, no link, empty day) exists in the seeded default window
      - [ ] `migrate:fresh --seed` succeeds and produces no orphan or contradictory rows
      - [ ] Existing US-003/US-004 tests still pass
      - [ ] Pint + Larastan level 5 green

      ## Test Data
      - [x] `database/factories/CalendarEventFactory.php` extended with `withEventUrl()`, `spanning()`, `at()`
      - [x] `database/seeders/CalendarEventSeeder.php` produces the anchored fixture week
      - [x] Factory and seeder updated in **this same task**

      ## Git Deliverables
      - Commit: `feat(US-005): TASK-02 seed an agenda fixture week with every link and coverage shape`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
  -
    id: TASK-03
    title: 'OutlookLinkBuilder: feed link preference, template fallback and disabled reason'
    type: Impl
    status: TODO
    assignee: Matt
    estimate_hours: 3
    dependencies:
      - TASK-00
    body: |
      ## Description
      Resolve the "Open in Outlook" call-to-action in one place, with an explicit three-way outcome, so the view never has to decide between a real URL and a broken one. The Teams join URL is resolved independently — it is a distinct action, never merged into the calendar CTA.

      ## Files Involved
      - app/Meetings/OutlookLink.php (new)
      - app/Meetings/OutlookLinkSource.php (new — enum)
      - app/Meetings/OutlookLinkBuilder.php (new)
      - .env.example
      - README.md
      - .larapilot/docs/PRD.md

      ## Steps
      1. `OutlookLinkSource` enum (TitleCase keys): `Feed`, `Template`, `Unavailable`.
      2. `OutlookLink` — `final readonly` DTO: `?string $url`, `OutlookLinkSource $source`, `?string $reason`.
      3. `OutlookLinkBuilder::for(CalendarEvent $event): OutlookLink`, in strict order:
         - `event->event_url` present → `Feed`.
         - else `config('kbms.outlook_url_template')` filled → substitute `{date}` (`Y-m-d`), `{time}` (`H:i`) and `{datetime}` (ISO 8601), all rendered in `config('kbms.timezone')`; all-day events use the stored naive date and substitute `00:00` for `{time}` without a timezone conversion → `Template`.
         - else → `Unavailable` with reason `No feed link and KBMS_OUTLOOK_URL_TEMPLATE is unset.` (Marika's wording from `states.html` — it names the configuration key that fixes it).
      4. `OutlookLinkBuilder::teamsUrl(CalendarEvent $event): ?string` — returns `join_url` or `null`. Kept on the same collaborator, deliberately a separate method so the view cannot conflate the two CTAs.
      5. Document the placeholder vocabulary — it is new public configuration surface:
         - `.env.example`: comment above `KBMS_OUTLOOK_URL_TEMPLATE` listing `{date}`, `{time}`, `{datetime}` with a worked OWA example.
         - `README.md`: same, in the configuration section.
         - `.larapilot/docs/PRD.md`: extend `## Configuration surface` with the placeholder set and add a `## PRD Revision History` row (`2026-09-08 | larapilot-plan US-005 | Recorded the KBMS_OUTLOOK_URL_TEMPLATE placeholder vocabulary`). PRD is a living document.
      6. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Feed-carried `event_url` always wins over the template
      - [ ] Template substitution is correct in `config('kbms.timezone')`, including for all-day events
      - [ ] Neither source available → `Unavailable` carrying a reason that names `KBMS_OUTLOOK_URL_TEMPLATE`; never a partial or broken URL
      - [ ] Teams join URL resolved separately from the calendar CTA
      - [ ] `.env.example`, `README.md` and the PRD configuration surface all document the placeholders
      - [ ] Pint + Larastan level 5 green

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-005): TASK-03 resolve Outlook and Teams links with an explicit unavailable state`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
  -
    id: TASK-04
    title: 'Port the agenda and meeting-detail kb-* component layer'
    type: Impl
    status: TODO
    assignee: Joe
    estimate_hours: 3
    dependencies:
      - TASK-00
    body: |
      ## Description
      Bring the mockup's agenda and detail components into the application stylesheet. The `--kb-*` tokens already landed with US-001/US-004; this task adds only the component rules those two screens need, so the mockup stays the visual contract rather than a thing to eyeball against.

      ## Files Involved
      - resources/css/app.css

      ## Steps
      1. Port from `.larapilot/mockups/kbms-app/kbms.css`, **additive only** — never redefine a Starter Kit token or an existing `--kb-*` value:
         - agenda: `kb-page-head`, `kb-toolbar`, `kb-legend`, `kb-count`, `kb-daygroup` (+ `--today`, sticky `__head`), `kb-agenda`, `kb-row` (+ `__time`, `__title`, `__meta`, `__badges`, `--cancelled`, `--now`, `is-focused`), `kb-nowline`, `kb-empty`
         - detail: `kb-detail` grid, `kb-mirror` (+ `__flag`), `kb-facts` (+ `__desc` with `white-space: pre-line`), `kb-chips`, `kb-path`, `kb-owned-flag`, `kb-panel`
         - shared: `kb-tag` variants (`--note`, `--transcript`, `--bare`, `--cancelled`, `--muted`, `--ok`, `--warn`), `kb-sronly`, `kb-inline`, `kb-stack`, `kb-iconbtn`
      2. Keep the mockup's deliberate choices: tabular numerals + `--kb-mono` for agenda times and paths, `--kb-frame-max: 88rem` content cap, no shadow beyond the kit's `shadow-xs` feel.
      3. Focus contract: 3px `--ring` halo **plus** a border change on `:focus-visible` — never outline-only, never suppressed. `.is-focused` in the mockup is the reference rendering.
      4. Respect `prefers-reduced-motion: reduce` (already global in the mockup layer — carry it over if not already present).
      5. `npm run build` to confirm the layer compiles under Tailwind 4.

      ## Completion Criteria
      - [ ] Every class the TASK-08/TASK-09 views need exists and renders in both themes
      - [ ] No Starter Kit token and no existing `--kb-*` value is redefined
      - [ ] `npm run build` succeeds
      - [ ] Badge set is legible on `--card` in light and dark (WCAG 2.2 AA spot-check)

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-005): TASK-04 port agenda and meeting detail component styles`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
