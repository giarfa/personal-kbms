      2. `AgendaQueryTest`, using TASK-02 factory states only:
         - a timed event at `23:30` local lands on the **local** day, not the UTC one
         - an event spanning a DST transition keeps its local start time
         - an `allDay()` event is not shifted by the UTC offset
         - a `spanning(2)` event appears **once**, in its start day, and is clamped to the range start when it began before the window
         - two overlapping timed events both appear, ordered by `starts_at`, with the all-day row above both
         - a range with no events returns the full set of dates with zero rows each
         - `cancelled()` occurrences are returned, not filtered out
