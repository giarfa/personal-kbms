code: US-005
plan_body: |
  ## Technical Solution

  US-005 is the first **reading surface** over the mirror US-003 built. No schema change, no new model: everything is a read model over `calendar_events` plus two new pure-logic collaborators, so a resync can never invalidate what this spec ships.

  ### 1. Occurrence addressing (John)

  The detail route must be keyed on (`source_uid`, `recurrence_id`) — the natural key the feed owns — never on the UUID surrogate `calendar_events.id`, which a `migrate:fresh` or a re-ingest can change.

  Constraint that shapes the design: Laravel matches route parameters against `$request->decodedPath()`, so a `%2F` inside a segment is decoded to `/` before matching and breaks a `[^/]+` pattern. ICS `UID`s are arbitrary text per RFC 5545 and Outlook's are long hex strings, so raw interpolation is not safe.

  **Decision:** one route segment carrying a URL-safe composite of the natural key.

  - `app/Meetings/OccurrenceKey.php` — `final readonly` value object with `sourceUid` + `recurrenceId`.
    - `toRouteKey(): string` — `base64url(source_uid)` and, when `recurrence_id !== ''`, `'.'.base64url(recurrence_id)` (`base64url` = `rtrim(strtr(base64_encode($v), '+/', '-_'), '=')`).
    - `fromRouteKey(string): ?self` — strict decode; malformed input returns `null` so the caller 404s instead of throwing.
  - `Route::bind('occurrence', …)` in `AppServiceProvider::boot()` resolves the segment to a `CalendarEvent` via `CalendarEvent::scopeForOccurrence()` and `abort(404)` on miss — the AC's "clear not-found state, not an exception" becomes a first-class, testable path.
  - `CalendarEvent::occurrenceKey(): OccurrenceKey` and `scopeForOccurrence(Builder, OccurrenceKey)` — the scope hits the existing `unique(['source_uid','recurrence_id'])` index directly, so detail lookup is one indexed row read.
  - The **human-readable** `UID` / `RECURRENCE-ID` stay visible and copyable on the detail page per the mockup; the route segment is the machine form of the same pair, not a second identity.

  ### 2. Agenda read model (Mike + John)

  Two storage conventions from US-003 that the agenda must respect, or day grouping silently drifts:

  | Kind | Stored as | Grouped by |
  | --- | --- | --- |
  | Timed | `starts_at` / `ends_at` in **UTC** (`$document->expand()` normalizes to UTC) | `starts_at` converted to `config('kbms.timezone')`, then local date |
  | All-day | naive date at `00:00` (`VALUE=DATE`, never timezone-converted; `timezone` is `null`) | the raw date — **no** conversion, or a positive UTC offset shifts the day |

  - `app/Meetings/AgendaRange.php` — anchor date (default **today** in `config('kbms.timezone')`) + a 7-day window. `previous()` / `next()` step by the window length, `today()` resets, `jumpTo(CarbonInterface)` re-anchors. `label()` renders `Mon 7 – Sun 13 Sep 2026` per the mockup toolbar. Range navigation therefore reaches the recent past as well as forward (FR-003).
  - `app/Meetings/AgendaQuery.php` — one query, overlap-based so a meeting that began before the window is not dropped:
    - timed: `is_all_day = 0 AND starts_at < :toUtc AND ends_at > :fromUtc`
    - all-day: `is_all_day = 1 AND date(starts_at) <= :toDate AND date(ends_at) >= :fromDate`
    - ordered by day, all-day first within a day, then `starts_at` — matches the mockup, where the offsite sits above the 08:45 standup.
    - `starts_at` is already indexed; no relations are loaded, so there is nothing to eager-load and no per-row query. A 7-day window over a ~270-day mirror is a bounded, single-digit-millisecond read.
  - `AgendaDay` / `AgendaRow` value objects: the query returns **every** date in the range, empty ones included, so the per-day empty state in the mockup is structural rather than a Blade `@if`.
  - **Multi-day and overlapping events** follow the mockup contract: a spanning event is rendered **once**, in the day group where it starts, clamped to the range's first visible day when it began earlier, with a `Sep 7 – Sep 8` span label. It is not repeated into each covered day (the mockup's Tue 8 group deliberately does not carry the offsite) and it is not dropped.

  ### 3. Coverage badges — the US-006/US-007 seam

  FR-003 wants note and transcript presence inline, but `meeting_notes` and `meeting_transcripts` do not exist until US-006 and US-007, which are both blocked by this spec. US-005 therefore renders the full badge vocabulary — `Cancelled`, `All-day`, `Not annotated` — from a `MeetingCoverage` DTO whose `hasNotes` / `hasTranscript` are hard `false` with an explicit `US-006` / `US-007` marker. Nothing is faked and no view has to be restructured later: those two specs fill the DTO and the badges light up.

  ### 4. Outlook and Teams links (Matt)

  `app/Meetings/OutlookLinkBuilder.php` returns an `OutlookLink` DTO carrying `url`, `source` (`feed` | `template` | `unavailable`) and, when unavailable, a `reason` string:

  1. `event_url` from the feed wins whenever present (`feed`).
  2. Otherwise `config('kbms.outlook_url_template')` with `{date}` (`Y-m-d`), `{time}` (`H:i`) and `{datetime}` (ISO 8601), all rendered in `config('kbms.timezone')` (`template`). The known constraint stands: without Graph there is no item id, so this targets the correct calendar **date/view**.
  3. Neither available → `unavailable`, and the CTA renders as a **disabled** `<button>` with `aria-describedby` pointing at the reason (`No feed link and KBMS_OUTLOOK_URL_TEMPLATE is unset.`) — never a broken `href`.

  The placeholder vocabulary is new public configuration surface, so `.env.example`, `README.md`, and the PRD `## Configuration surface` + revision history are updated in the same spec (PRD living document).

  `join_url` is a **separate** CTA (`Join Teams meeting`), never merged into the Outlook one. Both anchors carry `target="_blank"` and `rel="noopener"`.

  ### 5. UI (Elise + Joe)

  Desktop-first per the recorded PRD decision; the obligation is only that nothing breaks below `768px`. `.larapilot/mockups/kbms-app/README.md` is the contract — `index.html` for the agenda, `meeting.html` for the detail, `states.html` for the wording of every empty/disabled state.

  - Agenda is a **full-page Livewire component** (`App\Livewire\Agenda`, class-based per the recorded `livewire component style` decision), with `#[Url]` on the anchor date so ranges are bookmarkable and browser back/forward work. Rows are plain `<a>` elements in a `<ul>` — keyboard reachable with no JS, focus ring per the frozen `.is-focused` reference (3px `--ring` halo **plus** border change, never outline-only).
  - Meeting detail is a **controller + Blade view**, not Livewire: US-005 adds no interactive state to it. US-006/US-007/US-009 mount their own Livewire components into the owned column, which ships in this spec as the two-column grid with placeholder panels — the same convention the repo already uses for the agenda/calendar stubs.
  - The `kb-*` classes the mockup defines for these two screens are ported from `.larapilot/mockups/kbms-app/kbms.css` into `resources/css/app.css`, additive-only: the existing `--kb-*` `@theme` tokens are already in place from US-001/US-004 and must not be redefined.
  - Copy is Marika's, verbatim in meaning: `Mirrored from the feed · read-only`, `These fields can change under you on the next sync.`, and the empty-day line that names the last successful sync (read from the existing `SyncHealthReporter`) so an empty day reads as trustworthy rather than broken.

  ## Git & Branching

  - **Mode:** `GITFLOW` (from `settings.git_mode`) — branch + atomic commits + PR body prepared **locally**; nothing is pushed.
  - **Branch point:** `feature/US-005-agenda-meeting-detail` from `develop`. `develop` is currently at `652cd44` and does **not** contain the US-004 work, even though US-004 is `DONE` and approved (`20801a0`). TASK-00 therefore commits the outstanding `.larapilot` artifacts, merges `feature/US-004-sync-health-resync` into `develop`, and branches from there — rather than repeating the US-002 precedent of stacking on an unmerged feature branch.
  - Per task: one Conventional Commit `type(US-005): TASK-NN summary`. No batched multi-task commits.
  - `php artisan larapilot:quality` (Pint + Larastan level 5) green before every `task-done`.
  - Merge to `develop` only after human `larapilot-review` approval.

  ## Test Data Strategy

  - No new model, so no new factory — `CalendarEventFactory` and `CalendarEventSeeder` are **extended** in TASK-02 so both the UI and the tests have the shapes this spec must prove:
    - `withEventUrl()` — feed-carried Outlook link (the preferred branch).
    - `spanning(int $days)` — multi-day all-day event, for the clamp and span-label path.
    - `at(CarbonInterface $start, int $minutes)` — deterministic placement, so seeded and tested fixtures land inside the default 7-day window instead of a random one.
  - `CalendarEventSeeder` gains a **fixture week anchored on today**: a multi-day all-day offsite crossing today/tomorrow, two overlapping timed meetings, a cancelled occurrence, one meeting with `join_url` only, one with `event_url`, one with neither, and one deliberately empty day inside the window — the exact matrix the acceptance criteria name.
  - `php artisan migrate:fresh --seed` must produce a usable agenda before TASK-02 is done.

  ## Test Strategy

  **Bar: `NORMAL`** (from `settings.testing`) — PHPUnit feature and unit tests, no Playwright, Dusk, Pest browser, or viewport matrix. Test tasks are interleaved, not stacked at the end.

  | Layer | Coverage |
  | --- | --- |
  | Unit — `OccurrenceKeyTest` | round-trip for a plain UID, a UID containing `/` and `+`, an empty vs a populated `recurrence_id`; malformed input returns `null` |
  | Unit — `OutlookLinkBuilderTest` | feed link preferred over template; template substitution of `{date}`/`{time}`/`{datetime}` in the configured timezone; both absent → `unavailable` with reason; Teams link resolved independently |
  | Unit — `AgendaRangeTest` / `AgendaQueryTest` | default anchor is today in `kbms.timezone`; prev/next/today/jump; timed events grouped by **local** day across a DST boundary; all-day never shifted; multi-day clamped to the first visible day and rendered once; overlapping events both present and correctly ordered; a range with no meetings yields days with zero rows |
  | Feature — `AgendaPageTest` | default range renders today's meetings; navigation forward and back; cancelled rows marked, not hidden; empty day renders its state; whole-empty range renders the range-level state; rows link to the occurrence route |
  | Feature — `MeetingDetailTest` | every mirrored field rendered (title, start, end, duration, location, organizer, attendees, description); occurrence key shown; cancelled banner; unknown occurrence → `404`; Outlook CTA shows the feed link when present, the template URL when not, and a **disabled** control with its reason when neither; Teams CTA distinct; both anchors carry `target="_blank"` and `rel="noopener"` |

  **Manual test handoff** (Anne — required at this bar for UI, per the mockup test contract): keyboard-only pass agenda → row → detail → back; visible focus on every row and CTA; theme toggle in both directions on both screens; 375px pass against `mobile.html`; contrast spot-check of the badge set on `--card` in light and dark.
