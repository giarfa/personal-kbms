    id: TASK-00
    title: 'Bootstrap feature branch from an up-to-date develop'
    type: Impl
    status: TODO
    assignee: Sarah
    estimate_hours: 1
    dependencies: {}
    body: |
      ## Description
      Bootstrap Gitflow for US-005. `develop` is at `652cd44` and does not contain US-004, which is already `DONE` and approved at `20801a0`; the working tree also carries uncommitted `.larapilot` artifacts from that review. Land US-004 on `develop` first, then branch — rather than stacking US-005 on an unmerged feature branch as US-002 had to.

      Under `git_mode: GITFLOW` nothing is pushed: the PR description is prepared locally.

      ## Files Involved
      - (git only — `.larapilot/backlog.yaml`, `.larapilot/decisions.yaml`, `.larapilot/specs/US-004.yaml`, `.larapilot/usage/ledger.jsonl` are committed as review artifacts, no application files)

      ## Steps
      1. On `feature/US-004-sync-health-resync`, commit the outstanding review artifacts: `chore(US-004): record review approval artifacts`
      2. `git checkout develop && git merge --no-ff feature/US-004-sync-health-resync` (fast-forward is fine if history is linear)
      3. Confirm `git branch --contains 20801a0` now lists `develop`
      4. `git checkout -b feature/US-005-agenda-meeting-detail`
      5. Draft the internal PR title/body toward `develop` — title `US-005: Agenda view, meeting detail and Open in Outlook`; body links this plan and lists the planned tasks. Keep it local.
      6. Anchor commit: `chore(US-005): TASK-00 bootstrap feature branch`

      ## Completion Criteria
      - [ ] US-004 review artifacts committed on its own branch, not carried into US-005
      - [ ] `develop` contains `20801a0`
      - [ ] Branch `feature/US-005-agenda-meeting-detail` exists locally off `develop`
      - [ ] PR title/body drafted for `develop` (not opened remotely)

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Git Deliverables
      - Commit: `chore(US-005): TASK-00 bootstrap feature branch` (empty commit allowed)
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: prepared locally — open remotely only if the operator asks
