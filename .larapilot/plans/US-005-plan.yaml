    id: TASK-09
    title: 'Meeting detail page: mirrored feed panel, occurrence key and the Outlook/Teams CTAs'
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 5
    dependencies:
      - TASK-01
      - TASK-03
      - TASK-04
    body: |
      ## Description
      The canonical page per occurrence. Its point is the separation of surfaces: the feed column is a mirror that changes under you on the next sync, the right column is yours. That separation is by **surface** — `--kb-mirror-bg` with a dashed rule and a text flag — not just a heading, so it survives both themes and does not depend on colour.

      No Livewire here: US-005 adds no interactive state to this page. US-006/US-007/US-009 mount their components into the owned column, which ships now as the grid plus placeholder panels — the convention this repo already uses for its stub pages.

      ## Files Involved
      - app/Http/Controllers/MeetingController.php
      - resources/views/pages/meeting.blade.php (new)
      - resources/views/components/meeting/mirror-panel.blade.php (new)
      - resources/views/components/meeting/external-links.blade.php (new)

      ## Steps
      1. `MeetingController::__invoke(CalendarEvent $occurrence)` — the route binding from TASK-01 already 404s on an unknown or malformed key. Resolve `OutlookLinkBuilder::for()` and `teamsUrl()` and pass both to the view; keep the controller thin.
      2. Page head: breadcrumb `Agenda / {title}`, `<h1>` = the meeting summary, subtitle `Mon 7 Sep 2026 · 09:30–10:30 Europe/Rome`, and for a recurring occurrence the `one occurrence of a weekly series` note. `#[Title]`-equivalent: pass `:title="$event->summary.' — Personal KBMS'"` so the browser history is legible.
      3. `external-links` component — the two CTAs, side by side, never merged:
         - Outlook: `Feed` / `Template` → `<a target="_blank" rel="noopener">`; `Unavailable` → a **disabled `<button>`** with `aria-describedby` pointing at the rendered reason. Never a broken `href`.
         - Teams: rendered only when `join_url` is present, `<a target="_blank" rel="noopener">`, labelled `Join Teams meeting`.
      4. `mirror-panel` component — `kb-mirror` with the `Mirrored from the feed · read-only` flag, the `These fields can change under you on the next sync. Your notes and transcript link cannot.` line, and a `<dl class="kb-facts">`: When (with `TZID`), Duration, Location, Organiser, Attendees as `kb-chips` with an overflow count, Description with `white-space: pre-line`, **Occurrence key** (`UID` and `RECURRENCE-ID`, each copyable), Last seen in feed.
         - All-day occurrences render a date range, never a midnight-to-midnight block.
         - Cancelled occurrences render a clearly marked banner and a `Cancelled` tag on `Last seen in feed` — marked in the detail as well as the agenda.
         - Missing optional fields (`location`, `organizer`, empty `attendees`, no `description`) render an explicit `—`, not a blank row.
      5. Owned column: `kb-owned` with placeholder `kb-panel`s carrying the `Yours` flag — `Notes` (US-006), `Transcript` (US-007), `Ask Claude Code` (US-009) — each stating which spec brings it, matching how `pages/calendar.blade.php` already names US-008.
      6. Layout: two columns at ≥1024px (mirror 21rem / owned fluid), one column below with the **mirror panel first**, so read-only context is read before the editors.
      7. Smoke-check at 375, 768, 1280px; keyboard pass over both CTAs and the copy buttons.
      8. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Every mirrored field renders read-only: title, start, end, duration, location, organizer, attendees, description
      - [ ] Feed data is visually distinct from operator-owned panels by surface and by text flag, in both themes
      - [ ] Occurrence key (`UID` + `RECURRENCE-ID`) is displayed and copyable
      - [ ] Cancelled occurrences are clearly marked
      - [ ] Outlook CTA prefers the feed link, falls back to the template, and is disabled with a visible reason when neither exists
      - [ ] Teams CTA is a distinct action; both external links carry `target="_blank"` and `rel="noopener"`
      - [ ] Unknown occurrence returns a clear 404, not an exception
      - [ ] Usable at 375/768/1280px
      - [ ] Pint + Larastan level 5 green

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-005): TASK-09 build the meeting detail page with mirrored feed data and external CTAs`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
