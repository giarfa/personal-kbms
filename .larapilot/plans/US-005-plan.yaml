    id: TASK-05
    title: 'Unit tests: occurrence key round-trip and Outlook link resolution'
    type: Test
    status: TODO
    assignee: Anne
    estimate_hours: 2
    dependencies:
      - TASK-01
      - TASK-03
    body: |
      ## Description
      Cover the two pure-logic collaborators before they get consumed by views, where a wrong branch would only show up as a rendering difference.

      ## Files Involved
      - tests/Unit/Meetings/OccurrenceKeyTest.php
      - tests/Unit/Meetings/OutlookLinkBuilderTest.php

      ## Steps
      1. `php artisan make:test --phpunit --unit OccurrenceKeyTest` (move under `tests/Unit/Meetings/`, matching the existing `tests/Unit/Calendar/` layout).
      2. `OccurrenceKeyTest`: round-trip a plain hex Outlook UID; a UID containing `/`, `+` and `=`; an empty `recurrence_id` vs `20260907T073000Z`; an all-day `recurrence_id` (`2026-09-07`). Malformed and empty route keys return `null` rather than throwing.
      3. `OutlookLinkBuilderTest`: use `CalendarEventFactory` states from TASK-02 — never redefine fixtures here.
         - `withEventUrl()` + a configured template → source is `Feed`.
         - no `event_url` + configured template → `Template`, with `{date}`/`{time}`/`{datetime}` substituted in `config('kbms.timezone')` (assert an event stored in UTC renders its **local** time).
         - `allDay()` + template → date substituted without a timezone shift.
         - no `event_url`, template unset → `Unavailable`, reason mentions `KBMS_OUTLOOK_URL_TEMPLATE`.
         - `withTeamsLink()` → `teamsUrl()` returns it; without → `null`. Teams presence never changes the Outlook outcome.
      4. `php artisan test --filter=OccurrenceKey` and `--filter=OutlookLinkBuilder`
      5. No Playwright, Dusk, Pest browser, or viewport suite — `settings.testing: NORMAL`.

      ## Completion Criteria
      - [ ] Both suites pass
      - [ ] Link resolution order and the unavailable reason are asserted, not just the happy path
      - [ ] Pint + Larastan level 5 green

      ## Git Deliverables
      - Commit: `test(US-005): TASK-05 cover occurrence keys and Outlook link resolution`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
  -
    id: TASK-06
    title: 'Agenda read model: range navigation, timezone-correct day grouping and overlap query'
    type: Impl
    status: TODO
    assignee: Mike
    estimate_hours: 5
    dependencies:
      - TASK-01
      - TASK-02
    body: |
      ## Description
      The agenda's correctness lives here, not in the Blade. US-003 stores timed events in **UTC** and all-day events as **naive dates**; grouping both by `starts_at` without distinguishing them shifts all-day events by the UTC offset and puts late-evening meetings on the wrong day. Build the read model that gets this right once, so the view is a pure renderer.

      ## Files Involved
      - app/Meetings/AgendaRange.php (new)
      - app/Meetings/AgendaQuery.php (new)
      - app/Meetings/AgendaDay.php (new)
      - app/Meetings/AgendaRow.php (new)
      - app/Meetings/MeetingCoverage.php (new)

      ## Steps
      1. `AgendaRange` — `final readonly`: anchor `CarbonImmutable` date + `int $days = 7`. `today()` (anchor = today in `config('kbms.timezone')`), `previous()`, `next()`, `jumpTo(CarbonInterface)`, `dates(): array<CarbonImmutable>`, `label(): string` rendering `Mon 7 – Sun 13 Sep 2026` per the mockup toolbar. Stepping backwards is what reaches the recent past (FR-003).
      2. `AgendaQuery::for(AgendaRange $range): Collection<AgendaDay>` — **one** query, overlap-based so an event that began before the window is not dropped:
         - timed: `is_all_day = 0 AND starts_at < :toUtc AND ends_at > :fromUtc` (window boundaries converted from local to UTC)
         - all-day: `is_all_day = 1 AND date(starts_at) <= :toDate AND date(ends_at) >= :fromDate` (raw dates, no conversion)
         - order by effective day, then all-day first, then `starts_at` — the mockup puts the offsite above the 08:45 standup.
      3. Grouping: timed rows group by `starts_at->setTimezone(config('kbms.timezone'))->toDateString()`; all-day rows group by the stored date. A **multi-day event is emitted once**, in the day group where it starts, clamped to the range's first visible day when it began earlier, carrying a span label (`Sep 7 – Sep 8`) — matching the mockup, whose Tue 8 group deliberately does not repeat the offsite.
      4. `AgendaQuery` returns an `AgendaDay` for **every** date in the range, empty ones included, each with `date`, `rows`, `isToday`, `meetingCount`, `annotatedCount` — so the per-day empty state is structural rather than a Blade conditional.
      5. `AgendaRow` — `final readonly`: the `CalendarEvent`, its local start/end, duration in minutes, `isAllDay`, `spanLabel`, `isCancelled`, `routeKey`, and `MeetingCoverage`.
      6. `MeetingCoverage` — `final readonly` with `hasNotes` and `hasTranscript`, both hard `false` in this spec with a PHPDoc note naming **US-006** and **US-007** as the specs that fill them. Do not fake presence and do not add a schema placeholder.
      7. No relations are loaded, so there is no eager-load requirement and no per-row query; `starts_at` is already indexed. Assert the single-query shape in TASK-07.
      8. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Default range anchors on today in `config('kbms.timezone')`
      - [ ] Timed events group by local day; all-day events are never timezone-shifted
      - [ ] Multi-day events appear exactly once, clamped to the first visible day, with a span label
      - [ ] Overlapping events both appear, correctly ordered
      - [ ] Every date in the range is represented, including empty ones
      - [ ] One query per agenda render — no N+1
      - [ ] Pint + Larastan level 5 green

      ## Test Data
      - N/A — no model/schema changes in this task (fixtures came with TASK-02)

      ## Git Deliverables
      - Commit: `feat(US-005): TASK-06 add the agenda read model with timezone-correct day grouping`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
