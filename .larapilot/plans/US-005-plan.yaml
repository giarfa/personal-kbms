    body: |
      ## Description
      Replace the `pages.agenda` placeholder with the real triage surface. `index.html` in the mockup folder is the contract, including its copy. Rows must be keyboard-reachable without JavaScript, so they are plain links in a list, not click-handled divs.

      ## Files Involved
      - app/Livewire/Agenda.php (new)
      - resources/views/livewire/agenda.blade.php (new)
      - resources/views/pages/agenda.blade.php (removed — replaced by the full-page component)
      - routes/web.php

      ## Steps
      1. `php artisan make:livewire Agenda --class` — class-based per the recorded `livewire component style` decision (Livewire 4 SFCs escape the Larastan gate and this project runs PHPUnit).
      2. Route the component full-page: `Route::get('/', Agenda::class)->name('agenda');`. `config/livewire.php` already sets `component_layout` to `layouts::app`; set the page title with `#[Title('Agenda')]`.
      3. Public state: `#[Url] public ?string $date = null` (the range anchor), resolved into an `AgendaRange` — ranges become bookmarkable and browser back/forward work without extra wiring. Actions: `previous()`, `next()`, `today()`, and a `wire:model.live` `<input type="date">` jump.
      4. `render()` calls `AgendaQuery::for($range)` and passes `days` plus the `SyncHealthReporter` snapshot (already present from US-004) — the empty-day copy names the last successful sync, which is what makes an empty day read as trustworthy.
      5. View, following the mockup structure:
         - `kb-page-head` with `<h1>Agenda</h1>` and the mirrored-vs-yours sentence; `Calendar view` link.
         - `kb-toolbar` `role="group" aria-label="Date range"`: prev / next / `Today` / `aria-live="polite"` range label / labelled date jump.
         - `kb-legend` showing the full badge vocabulary.
         - One `kb-daygroup` per date with a sticky `<h2>` (`Today · Mon 7 Sep`, `Tomorrow · …`, else `Wed 9 Sep`) and a `kb-count` (`5 meetings · 3 annotated`, or `No meetings`).
         - `<ul class="kb-agenda">` of `<a class="kb-row" href="{{ route('meetings.show', $row->routeKey) }}" wire:navigate>`: time column (start + duration, or `All day` + span label), title + meta (organizer, location, attendee count), badges.
         - Cancelled rows get `kb-row--cancelled` plus a `Cancelled` badge and the `Cancelled upstream · notes kept` meta line — marked, never hidden.
         - `Now` divider is `aria-hidden="true"` decoration; the following row carries `kb-row--now`.
         - Empty day → the `kb-empty` block; a wholly empty range → one range-level empty state naming the last successful sync.
      6. Accessibility: one `<h1>`; day groups are `<h2>`; badges carry **text**, never colour alone; visible focus per the `.is-focused` reference; the existing `.kb-skip` link still targets `#main`.
      7. Smoke-check at 375, 768 and 1280px — three columns collapse to a stack below 768px; nothing clipped. Desktop-first per the recorded PRD decision, but nothing may break below 768px.
      8. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Agenda defaults to today and navigates forward and back; `Today` resets; the date jump re-anchors
      - [ ] Rows are keyboard reachable with visible focus and open the occurrence route
      - [ ] Cancelled, all-day and multi-day rows render per the mockup
      - [ ] Empty day and empty range both render their explicit states
      - [ ] Usable at 375/768/1280px (manual smoke at this test bar)
      - [ ] Pint + Larastan level 5 green

