    id: TASK-05
    title: 'Add ClaudeSessionLauncher and the LaunchClaudeSession queued job'
    body: |-
      ## Description
      Execution. The job waits for the exit code under a bounded timeout, per recorded decision `terminal launch mode` (`d184baee682dd396`, superseding `2deaf85cb3b47934`). See plan `## Technical Solution` §4, §5, §6.

      ## Files Involved
      - app/Launcher/ClaudeSessionLauncher.php
      - app/Launcher/LaunchOutcome.php
      - app/Jobs/LaunchClaudeSession.php

      ## Steps
      1. `App\Launcher\LaunchOutcome`: `final readonly` — `PromptLaunchStatus $status`, `?int $exitCode`, `?string $error`. Named constructors `launched()`, `failed()`, `timedOut()`
      2. `App\Launcher\ClaudeSessionLauncher::run(LaunchCommand $command): LaunchOutcome`. **No string overload.** Body: `Process::timeout(config('kbms.launch_timeout_seconds'))->run($command->toArray())`. Exit `0` → `launched`; non-zero → `failed` with the exit code and a bounded stderr excerpt (cap at ~2000 chars — a runaway script must not write an unbounded blob into SQLite); `ProcessTimedOutException` → `timedOut` with the contract-violation message from plan §4. Allocate no TTY and no PTY
      3. `php artisan make:job LaunchClaudeSession --no-interaction`. Constructor takes `public string $launchId`. `public int $tries = 1` with a docblock stating **why** — a retry opens a second terminal window and nothing can suppress the duplicate. `public int $timeout` = `kbms.launch_timeout_seconds + 15` so the worker timeout never fires before the process timeout. No `ShouldBeUnique`
      4. `handle(LaunchPreflight $preflight, ClaudeSessionLauncher $launcher)`: load the row; **return immediately unless `status === Queued`** (the double-dispatch guard); re-run preflight against the current occurrence and question; a `LaunchBlock` writes `status = Blocked` with the reason and returns **without running any process**; otherwise set `launched_at`, run, and persist status / exit code / error
      5. Structured `Log::info('kbms.launch', [...])` with the launch id, status, and exit code — never the question text, matching the `kbms.calendar.sync` logging shape
      6. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `ClaudeSessionLauncher::run()` accepts only a `LaunchCommand`; no code path anywhere builds a command string
      - [x] The job is `tries = 1`, with the reason docblocked
      - [x] A row not in `Queued` status is skipped without running a process
      - [x] Second-pass preflight failure records `Blocked` and runs nothing
      - [x] Non-zero exit records `exit_code` and a bounded stderr excerpt; timeout records the contract-violation message
      - [x] Pint + Larastan green

      ## Test Data
      - N/A — no model or schema change in this task

