      5. `PromptLaunchFactory`: domain-realistic questions (not `lorem`); `command` built by calling `LaunchCommand` is **not** available yet, so build the array literally here and add the TASK-03 follow-up note in the factory docblock — TASK-03 replaces it with a `LaunchCommand::toArray()` call. States: `queued()`, `launched()`, `failed(int $exitCode = 127)`, `timedOut()`, `blocked()`
      6. `PromptLaunchSeeder`: three launches across two seeded meetings that already have linked transcripts, `context_path` pointing at the US-007 seeder's fixture files — one `launched`, one `failed` with exit `127`, one `queued`. Register it in `DatabaseSeeder` **after** `MeetingTranscriptSeeder`
      7. `php artisan migrate:fresh --seed`
