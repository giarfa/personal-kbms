    id: TASK-03
    title: 'Build the launcher domain: command, blocks, script resolution and preflight'
    body: |-
      ## Description
      The security core of the spec. One value object owns the argument array; eight named refusals; the doctor's launcher checks are extracted so `kbms:doctor` and the panel share one implementation. See plan `## Technical Solution` §2, §3, §5, §8.

      ## Files Involved
      - app/Launcher/LaunchCommand.php
      - app/Launcher/LaunchBlock.php
      - app/Launcher/LauncherScript.php
      - app/Launcher/LaunchPreflight.php
      - app/Doctor/Checks/LauncherScriptCheck.php (refactor to consume `LauncherScript`)
      - database/factories/PromptLaunchFactory.php (switch `command` to `LaunchCommand::toArray()`)

      ## Steps
      1. `App\Launcher\LaunchCommand`: `final readonly` with promoted `string $script, string $contextPath, string $question`. `toArray(): list<string>` returns exactly `[$script, $contextPath, $question]`. `display(): string` renders the three quoted lines — single-quote wrapping with `'` escaped as `'\''`. Docblock `display()` as **presentation only, never passed to a process**, and `toArray()` as the single construction site of the argument array
      2. `App\Launcher\LaunchBlock`: backed enum with the eight cases and a `message(): string` per plan §3's table. Cases needing interpolation (`LauncherMissing`, `LauncherNotExecutable`, `TranscriptUnreadable`, `QuestionTooLong`) take their detail through a `message(?string $detail = null)` parameter rather than becoming stringly-typed
      3. `App\Launcher\LauncherScript`: `resolve(): string|LaunchBlock` — unset → `LauncherNotConfigured`, `! is_file()` → `LauncherMissing`, `! is_executable()` → `LauncherNotExecutable`, else the path
      4. Refactor `LauncherScriptCheck` to call `LauncherScript::resolve()` and map its three block cases onto the **existing** `CheckResult` wording. `DoctorCommandTest` must pass unchanged — if it needs editing, the refactor changed behavior and is wrong
      5. `App\Launcher\LaunchPreflight`: `for(CalendarEvent $occurrence, string $question): LaunchCommand|LaunchBlock`. Order: launcher script → transcript row (missing row or tombstone → `NoTranscript`) → `TranscriptsDirectory::contains()` → readable → question trimmed non-empty → no null byte → within `kbms.question_max_chars`. Lock that order in a test in TASK-04
      6. Update `PromptLaunchFactory` to build `command` via `LaunchCommand::toArray()`, removing the TASK-02 placeholder note
      7. `php artisan test --filter=DoctorCommandTest` and `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `ClaudeSessionLauncher` does not exist yet, but no class in `app/Launcher/` builds a command string anywhere — no `sh -c`, no `nohup`, no concatenation
      - [x] `LaunchCommand::toArray()` is the only place the argument array is constructed; `display()` is docblocked as presentation-only
      - [x] All eight `LaunchBlock` cases return distinct messages naming a configuration key or an action
      - [x] `LauncherScriptCheck` consumes `LauncherScript` and `DoctorCommandTest` passes **unedited**
      - [x] `LaunchPreflight` returns a `LaunchCommand` or a `LaunchBlock`, never throws, never returns null
      - [x] Pint + Larastan green

      ## Test Data
      - [x] `PromptLaunchFactory` updated to build `command` through `LaunchCommand::toArray()`

