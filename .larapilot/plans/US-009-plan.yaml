    id: TASK-02
    title: 'Add the prompt_launches table, model, factory and seeder'
    body: |-
      ## Description
      The persisted launch record — PRD `## Core Components` shape plus `exit_code`. See plan `## Technical Solution` §6.

      Runs in parallel with TASK-01 — no shared files.

      ## Files Involved
      - database/migrations/xxxx_create_prompt_launches_table.php
      - app/Models/PromptLaunch.php
      - app/Launcher/PromptLaunchStatus.php
      - database/factories/PromptLaunchFactory.php
      - database/seeders/PromptLaunchSeeder.php
      - database/seeders/DatabaseSeeder.php
      - tests/Unit/Models/PromptLaunchTest.php

      ## Steps
      1. `php artisan make:migration create_prompt_launches_table --no-interaction`. Columns: `uuid('id')->primary()`, `string('event_uid')`, `string('event_recurrence_id')->default('')`, `string('context_path')`, `text('question')`, `json('command')`, `string('status')`, `integer('exit_code')->nullable()`, `text('error')->nullable()`, `timestamp('launched_at')->nullable()`, `timestamps()`, `index(['event_uid', 'event_recurrence_id', 'created_at'])`
      2. Docblock the migration with the **no-foreign-key** reasoning, copying the shape used in `create_meeting_transcripts_table` — the only targetable column is the UUID surrogate `id`, exactly the identity a resync may change, and a cascade would give the feed a route to destroy operator data
      3. `App\Launcher\PromptLaunchStatus`: backed enum `Queued` \| `Launched` \| `Failed` \| `TimedOut` \| `Blocked`, TitleCase keys, lower_snake values
