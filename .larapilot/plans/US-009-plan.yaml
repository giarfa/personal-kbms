    title: 'Build the Ask Claude Code panel and wire it into the meeting page'
    body: |-
      ## Description
      The operator-facing surface, built to `meeting.html` L243-273 and `states.html` L310-367. Replaces the `US-009` placeholder currently in `resources/views/pages/meeting.blade.php`. See plan `## Technical Solution` §7.

      Read `.larapilot/mockups/kbms-app/README.md` before starting — it is the agreed visual contract (`.ai/rules/views.md`).

      ## Files Involved
      - app/Livewire/AskClaude.php
      - resources/views/livewire/ask-claude.blade.php
      - resources/views/pages/meeting.blade.php
      - resources/css/app.css

      ## Steps
      1. `php artisan make:livewire AskClaude --class --no-interaction` (class-based, per `.ai/rules/livewire.md`)
      2. `#[Locked] string $eventUid` and `$eventRecurrenceId` set in `mount()` from the occurrence — store the natural key, never the model, matching `MeetingNotes` and `TranscriptPanel`. `public string $question = ''`
      3. `render()` runs `LaunchPreflight` and passes either the `LaunchCommand` (for `display()`) or the `LaunchBlock` (for its message) to the view, plus the latest `PromptLaunch` for this occurrence. `render()` performs **no writes** — the same discipline `TranscriptPanel` documents
      4. `launch()`: validate the question (`required`, trimmed non-empty, `max:` from `kbms.question_max_chars`) with the mockup's wording; re-run preflight; write the `PromptLaunch` row with `status = Queued` and `command` from `LaunchCommand::toArray()`; `LaunchClaudeSession::dispatch($row->id)`
      5. View, to the mockup: `Yours` flag; `Launcher ready` / `Blocked` tag; `kb-textarea kb-textarea--sm` with the help line *"Handed to your script as the second argument, exactly as typed — quotes, newlines and `$(...)` included, never interpreted."*; the **only** `sk-btn--primary` on the page, disabled with `aria-describedby` pointing at the block reason when preflight refuses; `<pre class="kb-command">` with the three lines and `.kb-arg` / `.kb-arg--2`; a Copy invocation button reusing `onclick="navigator.clipboard.writeText(@js($display))"` from `transcript-panel.blade.php` L108-114; the caption *"Two arguments, in order: context file, then question."*
      6. Empty-question error: `aria-invalid="true"` on the textarea, `role="alert"` on the message
      7. Latest outcome: `Dispatched` tag while `queued`; `kb-banner role="alert"` with *"Launcher exited {code}"* on `failed`; the timeout message on `timed_out`; the block reason on `blocked`
      8. `wire:poll.1s` **only** while the latest launch is `queued`; after `2 × kbms.launch_timeout_seconds` still queued, add *"still queued — is `php artisan queue:work` running?"*
      9. Port `.kb-command`, `.kb-command .kb-arg`, `.kb-command .kb-arg--2` from `.larapilot/mockups/kbms-app/kbms.css` L324-331 into `resources/css/app.css`
      10. Replace the placeholder `<section>` in `pages/meeting.blade.php` with `<livewire:ask-claude :occurrence="$row->event" />`
      11. `npm run build`; smoke-check both themes at 1280 and 768 px — the `<pre>` scrolls horizontally rather than wrapping the arguments
      12. `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] Each blocked precondition renders its own distinct sentence, naming its configuration key or action
      - [x] The rendered invocation is `LaunchCommand::display()` — the panel and the job derive from the same object
      - [x] `render()` writes nothing
      - [x] Polling runs only while a launch is `queued` and stops on a terminal status
      - [x] The `US-009` placeholder text is gone from `pages/meeting.blade.php`
