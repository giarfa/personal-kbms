    id: TASK-04
    title: 'Fail kbms:doctor when the worker is older than the .env it should be running'
    body: |-
      ## Description
      Add the check that `kbms:doctor` was structurally missing: a fresh process can see the queue is reachable, but not that the long-lived worker is answering from a superseded `.env`. This is the check whose false PASS is the defect under repair.

      ## Files Involved
      - app/Doctor/Checks/QueueWorkerFreshnessCheck.php (new)
      - app/Providers/AppServiceProvider.php

      ## Steps
      1. `QueueWorkerFreshnessCheck implements EnvironmentCheck`, label `Queue worker configuration`. Constructor takes the `QueueWorkerProbe` and an optional `?string $envPath = null` (defaulting to `base_path('.env')`) so tests can point it at a temp file.
      2. `.env` mtime via `filemtime()`. Not a readable file, or `filemtime()` returns `false` → `CheckResult::failed()` whose detail says the check **could not determine** the answer and names the path; remediation states that an undeterminable answer is reported as a failure by design.
      3. `$probe->observe()`:
         - `Undetermined` → `failed()` repeating the probe's reason, remediation `run \`php artisan queue:restart\` after any \`.env\` change — this check refuses to pass when it cannot prove the worker is current`.
         - `NotRunning` → `pass()` with a detail stating no `queue:work` worker for this project is running, so there is nothing to be stale. Do **not** restate the queue-connection check's "reachable ≠ running" line — that check already owns it and the operator must not read it twice.
         - `Running` → compute `$effective = max($startedAt, $restartBroadcastAt)`, where `$restartBroadcastAt` is `Cache::get('illuminate:queue:restart')` cast to a timestamp when present (the key `queue:restart` writes and the worker reads; the project's cache store is `database`, so it is visible across processes). Stale when `envMtime >= $effective` → `failed()` naming the worker's start time, the `.env` mtime, and `php artisan queue:restart` as the remedy. Otherwise `pass()` naming the worker's start time.
      4. Document the `>=` tie-break in the class docblock: `ps` and `filemtime` are both second-granular, so a same-second tie is reported **stale**; a false PASS is the failure mode this check exists to remove, and the named remedy writes a strictly later restart timestamp that clears the tie.
      5. Register in `AppServiceProvider`'s `CheckSuite` singleton immediately after `QueueConnectionCheck`, resolving the probe lazily inside the closure (`$this->app->make(QueueWorkerProbe::class)`) so tests can swap it.
      6. `php artisan kbms:doctor` on this machine — confirm the check appears and reports truthfully against the live LaunchAgent worker.

      ## Completion Criteria
      - [x] A worker that booted before the current `.env` was last written fails the check, with `php artisan queue:restart` as the remediation
      - [x] An undeterminable worker state is reported as a FAIL naming "could not determine", never a PASS
      - [x] No worker running at all passes this check and does not duplicate the queue-connection check's wording
      - [x] A `queue:restart` broadcast later than the `.env` write clears the stale condition
      - [x] An `.env` untouched since boot passes — the signal is "older than `.env`", never "older than some fixed age"
      - [x] The check is registered and visible in `kbms:doctor` output

      ## Test Data
      - N/A — no model or schema changes

      ## Git Deliverables
      - Commit: `feat(US-016): TASK-04 fail doctor on a stale queue worker`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes only
