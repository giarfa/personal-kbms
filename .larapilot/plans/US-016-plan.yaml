code: US-016
plan_body: |
  ## Technical Solution

  **Root cause.** `LaunchClaudeSession::handle()` re-runs `LaunchPreflight` inside the worker (`app/Jobs/LaunchClaudeSession.php:52`) — correct by design. But `queue:work` is long-lived (LaunchAgent `com.personal-kbms.queue-worker`, `KeepAlive: true`) and answers `config('kbms.claude_launcher')` from the `.env` it read at boot, so the job resolves `null` where the web request resolved a path. `kbms:doctor` boots a fresh process and is therefore structurally blind to that divergence: it reports `Claude launcher script .. PASS` while every launch is refused.

  Two independent halves, one per FR.

  ### Half A — the refusal names the divergence (FR-008)

  The dispatching request already recorded what the **web process** resolved: `prompt_launches.command[0]`. No process inspection is needed at launch time — the comparison is between a column and the worker's own `config()`.

  1. New enum case `LaunchBlock::LauncherStaleWorker` with its own sentence, per the `states.html` contract that every blocked state names the action that fixes it. Wording must name a **stale worker** and `php artisan queue:restart`, and must **not** interpolate the launcher path or any value (Lars: the existing `LauncherNotConfigured` message shows no path — the new one must not leak one either). `LaunchBlockDetail::for()` needs no arm; the case falls to `default => null`.
  2. New named collaborator `App\Launcher\StaleWorkerDivergence` — a pure static function over `(LaunchBlock $block, PromptLaunch $launch): LaunchBlock`. It substitutes `LauncherStaleWorker` when **all** hold:
     - `$block` is one of the launcher blocks (`LauncherNotConfigured`, `LauncherMissing`, `LauncherNotExecutable`) — transcript and question blocks are never config divergence;
     - `$launch->command[0]` exists and is a non-empty string;
     - the launcher value **as this process resolves it** — `(string) config('kbms.claude_launcher')` — differs from `command[0]`.
     Otherwise `$block` is returned untouched. The comparison is on the **value**, not on the block case: this is what keeps a genuinely unset key (identical in both processes) on its existing `LauncherNotConfigured` message, and keeps a launcher file deleted after dispatch (same path in both processes) on `LauncherMissing` — both already asserted by `LaunchClaudeSessionJobTest`.
  3. `LaunchClaudeSession::handle()` passes the second-pass block through `StaleWorkerDivergence::resolve()` before composing the detail and persisting the error. One line; the job stays thin and the rule stays unit-testable without a queue.

  Deliberately **not** done: no attempt to re-read `.env` from inside the job and no config reload. The job must report the divergence, not paper over it — silently launching with a value the worker never had is a worse outcome than a named refusal.

  ### Half B — the doctor sees a stale worker (FR-011)

  `kbms:doctor` gains **one new check** that answers a question no fresh process can answer by itself: is the running worker older than the configuration it is supposed to be running?

  1. `App\Doctor\Worker\QueueWorkerProbe` (interface) → `observe(): QueueWorkerObservation`, a tri-state value object: `Running($startedAt)`, `NotRunning`, `Undetermined($reason)`. The interface is the test seam — the unit tests never depend on a real worker.
  2. `App\Doctor\Worker\PsQueueWorkerProbe` (Sarah) — macOS/Herd is load-bearing for this product (README §Requirements), so process inspection is in-contract:
     - `ps -axo pid=,etime=,command=` via Laravel's `Process` facade with an **argument array**, never a shell string;
     - keep lines whose command contains `artisan queue:work`;
     - attribute each candidate to **this** project by resolving its working directory: `lsof -a -p {pid} -d cwd -Fn` → the line starting with `n`; keep only `=== base_path()`. Without this, another project's worker on the same machine would produce a false verdict;
     - parse `etime` (`[[dd-]hh:]mm:ss`, locale-free) into elapsed seconds and derive `startedAt = now()->subSeconds($elapsed)`. **Not** `lstart`: its output is locale-dependent and would parse differently on a non-English machine;
     - no candidate lines → `NotRunning`; several → the **oldest** start time wins (the most conservative answer);
     - `ps` unavailable/non-zero/unparsable, or `lsof` unavailable/failing for a candidate → `Undetermined` with the reason — never a silent empty result treated as "no worker".
  3. `App\Doctor\Checks\QueueWorkerFreshnessCheck` — label `Queue worker configuration`, registered in `AppServiceProvider` immediately after `QueueConnectionCheck`. Logic:
     - `.env` mtime: `filemtime(base_path('.env'))`. Unreadable/absent → `CheckResult::failed(...)` naming that it **could not determine** the answer;
     - `Undetermined` → `failed()` with the probe's reason. A check that cannot answer refuses to pass — a false PASS is the defect under repair;
     - `NotRunning` → `pass()`, detail stating no worker for this project is running. The existing `QueueConnectionCheck` already owns "reachable queue ≠ running worker"; this check must not say it a second time;
     - `Running` → `$effective = max($startedAt, $restartBroadcastAt)` where `$restartBroadcastAt` is `Cache::get('illuminate:queue:restart')` (the key `queue:restart` writes and `Worker::queueShouldRestart()` reads — verified in `vendor/laravel/framework/.../Queue/Worker.php:914` and `Console/RestartCommand.php:55`; the project's cache store is `database`, shared across processes). Stale when `envMtime >= $effective`; remediation names `php artisan queue:restart`.
     - **Tie-break deliberately resolved as stale** (`>=`, not `>`): `ps` and `filemtime` are both second-granular, and a one-second window that reports a stale worker as fresh is the exact failure being fixed. The cost is a rare false FAIL whose own named remediation (`queue:restart`, which writes a strictly later timestamp) clears it.
     - The restart broadcast is what satisfies the second edge case: it clears the stale condition even though the worker process itself is still older than the file, because the worker is about to exit and `KeepAlive` will restart it.

  **Determinism in the suite.** `DoctorCommandTest` runs the real `CheckSuite`, and this machine has a live worker — the probe **must** be bound through the container (`$this->app->make(QueueWorkerProbe::class)` inside the `CheckSuite` closure, resolved lazily) so tests can bind a fake instance and the suite stops depending on whatever `ps` says at that moment.

  ## Git & Branching
  - Mode: GITFLOW (from `settings.git_mode`)
  - Branch: `feature/US-016-stale-worker-refusal` from `develop`
  - TASK-00: bootstrap (no push — PR prepared locally only)
  - Per task: one atomic Conventional Commit; no push, no remote PR under GITFLOW
  - `app/Launcher/LauncherScript.php` carries two uncommitted duplicate `\Log::debug()` lines from operator debugging and is dirty on `develop` — TASK-00 removes them so the feature branch starts clean; they are not part of the defect
  - Merge after `larapilot-review` approval (`auto_approve: YES`, so autopilot may approve with no open blockers)

  ## Test Data Strategy
  - No new or changed Eloquent models, migrations, or relationships — `Test Data` is `N/A` on every task
  - Existing `PromptLaunchFactory` (with `queued()` / `forOccurrence()` states) and `MeetingTranscriptFactory` cover every case; no seeder change — the demo dataset does not depend on worker freshness
  - No `migrate:fresh --seed` gate for this spec

  ## Test Strategy
  - Bar: NORMAL (`settings.testing`) — Pest/PHPUnit feature + unit only, no browser, E2E, or viewport suites
  - Anne (TASK-02) — divergence regression, the AC's named reproduction: a queued launch whose `command[0]` holds a path while `config('kbms.claude_launcher')` is `null` in the job's process asserts the **stale-worker** message and explicitly asserts the absence of `` `KBMS_CLAUDE_LAUNCHER` is not configured. ``; plus unit coverage of `StaleWorkerDivergence` for each guard (non-launcher block untouched, empty/missing `command`, identical value untouched)
  - Anne (TASK-02) — negative regressions must stay green unchanged: `test_launcher_deleted_after_dispatch_blocks_and_runs_nothing` (same path in both processes → `LauncherMissing`) and `LaunchBlockTest::test_every_case_has_its_own_distinct_non_empty_message` (extend for the new case)
  - Anne (TASK-05) — `QueueWorkerFreshnessCheck` unit tests against a **fake probe** and a temp `.env` file with a controlled `touch()` mtime, plus `travelTo()` for the clock: pass (worker newer than `.env`), stale (worker older), restart-broadcast-clears-stale, tie (same second → stale), indeterminate probe → FAIL naming "could not determine", no worker → PASS and **not** a duplicate of the queue-connection wording, `.env` unreadable → FAIL. No test may depend on a real running worker
  - Anne (TASK-05) — `PsQueueWorkerProbe` covered with `Process::fake()` over canned `ps`/`lsof` output: parses `etime` in all three shapes (`mm:ss`, `hh:mm:ss`, `dd-hh:mm:ss`), filters a foreign-cwd worker out, picks the oldest of several, and returns `Undetermined` on a `ps` failure and on an `lsof` failure
  - Anne (TASK-05) — `DoctorCommandTest` binds a fake probe in `setUp()` so the suite is machine-independent
  - Full suite green (`php artisan test`) and `php artisan larapilot:quality` (Pint + Larastan level 5) clean before handoff
  - **Manual test handoff** (the one thing automation cannot prove — it needs a real long-lived worker): with the LaunchAgent worker running, change `KBMS_CLAUDE_LAUNCHER` in `.env` without restarting, then (1) `php artisan kbms:doctor` → `Queue worker configuration .. FAIL` naming `queue:restart`, (2) launch a session from a meeting → blocked with the stale-worker message, (3) `php artisan queue:restart`, wait for `KeepAlive` to respawn, re-run both → check passes and the launch runs
