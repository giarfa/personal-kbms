    id: TASK-03
    title: "Probe the running queue worker's start time (macOS/Herd)"
    body: |-
      ## Description
      Give the doctor a way to answer "is a worker for **this** project running, and since when?" — with an explicit third answer, *could not determine*, that the check is required to treat as a failure. Parallel with TASK-01: no shared files.

      ## Files Involved
      - app/Doctor/Worker/QueueWorkerProbe.php (new, interface)
      - app/Doctor/Worker/QueueWorkerObservation.php (new)
      - app/Doctor/Worker/QueueWorkerState.php (new, enum)
      - app/Doctor/Worker/PsQueueWorkerProbe.php (new)

      ## Steps
      1. `QueueWorkerState`: `Running`, `NotRunning`, `Undetermined`. `QueueWorkerObservation`: `final readonly`, static constructors `running(CarbonImmutable $startedAt)`, `notRunning()`, `undetermined(string $reason)`; `?CarbonImmutable $startedAt`, `?string $reason`.
      2. `QueueWorkerProbe`: one method, `observe(): QueueWorkerObservation`. Docblock states the contract: never throws, and never reports `NotRunning` for a question it could not answer.
      3. `PsQueueWorkerProbe`:
         - run `ps -axo pid=,etime=,command=` through the `Process` facade as an **argument array** (no shell string, nothing interpolated);
         - non-zero exit or empty output → `undetermined()` naming `ps`;
         - keep lines whose command contains `artisan queue:work`; none → `notRunning()`;
         - for each candidate resolve its cwd with `lsof -a -p {pid} -d cwd -Fn` (argument array; `{pid}` is an int parsed from our own `ps` output) and read the `n`-prefixed line. `lsof` missing or failing → `undetermined()` naming `lsof`. Keep only candidates whose cwd is exactly `base_path()`; none left → `notRunning()`;
         - parse `etime` as `[[dd-]hh:]mm:ss` into seconds — **not** `lstart`, whose format is locale-dependent; unparsable → `undetermined()`;
         - `startedAt = now()->subSeconds($elapsed)`; several workers → the **oldest** start time (most conservative).
      4. Bind `QueueWorkerProbe` → `PsQueueWorkerProbe` in `AppServiceProvider::register()` so the check and the tests resolve it through the container.
      5. Sanity-check against the real machine once (`php artisan tinker --execute 'dump(app(App\Doctor\Worker\QueueWorkerProbe::class)->observe());'`) — the LaunchAgent worker must be seen, with a plausible start time.

      ## Completion Criteria
      - [x] Three states exist and `Undetermined` always carries a reason naming the tool that failed
      - [x] Workers belonging to another project (different cwd) are excluded
      - [x] No shell string is ever built; both external commands run as argument arrays
      - [x] `QueueWorkerProbe` is bound in the container
      - [x] The real running worker is observed correctly on this machine

      ## Test Data
      - N/A — no model or schema changes

      ## Git Deliverables
      - Commit: `feat(US-016): TASK-03 probe the running queue worker start time`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes only
