    id: TASK-05
    title: 'Unit coverage for the freshness check and the probe, with no real worker'
    body: |-
      ## Description
      Cover every outcome of the new check and probe against a faked clock, a temp `.env`, and canned process output — and make `DoctorCommandTest` independent of whatever is actually running on the machine executing the suite.

      ## Files Involved
      - tests/Unit/Doctor/QueueWorkerFreshnessCheckTest.php (new)
      - tests/Unit/Doctor/PsQueueWorkerProbeTest.php (new)
      - tests/Feature/DoctorCommandTest.php

      ## Steps
      1. `QueueWorkerFreshnessCheckTest` — a small in-test fake implementing `QueueWorkerProbe`, a temp `.env` whose mtime is set with `touch($path, $timestamp)`, and `$this->travelTo()` for the clock. Cases: worker started after the `.env` write → PASS; worker started before → FAIL naming `queue:restart`; same second → FAIL (the documented tie-break); `Cache::put('illuminate:queue:restart', <after the .env write>)` with an older worker → PASS; `Undetermined` → FAIL whose detail contains "could not determine"; `NotRunning` → PASS, asserting the detail does **not** repeat the queue-connection check's wording; missing/unreadable `.env` → FAIL.
      2. `PsQueueWorkerProbeTest` — `Process::fake()` with canned `ps` and `lsof` output: all three `etime` shapes (`06:20`, `01:06:20`, `2-01:06:20`) map to the right elapsed seconds; a candidate whose `lsof` cwd is another project is excluded; two workers for this project yield the **oldest** start time; a failed `ps` and a failed `lsof` each yield `Undetermined` with a reason naming the tool; output with no `artisan queue:work` line yields `NotRunning`.
      3. `DoctorCommandTest` — bind a fake probe in `setUp()` (`$this->app->instance(QueueWorkerProbe::class, …)` returning `notRunning()`) before the suite is resolved, so existing all-pass assertions stay true on any machine; add one case binding a stale observation and asserting the command exits non-zero with `queue:restart` in the output.
      4. `php artisan test` — full suite green.
      5. `php artisan larapilot:quality` — Pint + Larastan level 5 clean (`--fix` for formatting only).

