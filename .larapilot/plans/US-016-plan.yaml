  -
    id: TASK-06
    title: 'Document the LaunchAgent worker and the queue:restart rule in the README'
    body: |-
      ## Description
      The `.env`-change-requires-`queue:restart` rule has to live where the operator sets the worker up, not only in a general note — the LaunchAgent worker (`com.personal-kbms.queue-worker`, `KeepAlive: true`) is how this machine actually runs `queue:work`, and the README does not mention it at all today.

      ## Files Involved
      - README.md
      - CHANGELOG.md

      ## Steps
      1. §"Running the background processes" — add a subsection describing the always-on worker as a macOS **LaunchAgent** (`~/Library/LaunchAgents/com.personal-kbms.queue-worker.plist`, `RunAtLoad` + `KeepAlive`, `WorkingDirectory` at the project root, output to `storage/logs/queue-worker.log`), including the `launchctl load`/`kickstart` lines used to manage it.
      2. In that same subsection, state the rule plainly: **any `.env` change requires `php artisan queue:restart`** — the worker is long-lived and answers from the `.env` it booted with, and under `KeepAlive` the restart is what makes the new value take effect. Note that `kbms:doctor` now reports a stale worker as its own failure.
      3. §"Troubleshooting" — extend entry 1 with the new `Queue worker configuration` check in the list of what `kbms:doctor` verifies, and add a numbered entry for the symptom the operator will actually hit: a launch blocked as a stale worker while the panel reads **Launcher ready** → run `php artisan queue:restart`.
      4. §"The launcher script contract" — one sentence that the queued job resolves configuration in the worker's own process, so a launcher path added without a restart is refused by name rather than reported as unset.
      5. `CHANGELOG.md` `[Unreleased] -> ### Added` — a line for the new doctor check (the TASK-01 `### Fixed` line already covers the refusal).

      ## Completion Criteria
      - [x] The `queue:restart` rule appears in the LaunchAgent worker setup subsection, not only as a general note
      - [x] The LaunchAgent setup itself is documented (label, KeepAlive, working directory, log path, management commands)
      - [x] Troubleshooting names the stale-worker symptom and its remedy, and the doctor check list includes the new check
      - [x] CHANGELOG updated

