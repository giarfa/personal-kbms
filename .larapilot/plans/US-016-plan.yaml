    id: TASK-01
    title: 'Refuse a divergent launch as a stale worker, not as an unset key'
    body: |-
      ## Description
      A launch dispatched with a launcher path the **web process** resolved, and refused by a **worker** that resolves a different value (typically none), must be blocked with its own named reason pointing at `php artisan queue:restart` — never with `` `KBMS_CLAUDE_LAUNCHER` is not configured. ``, which sends the operator to an `.env` that is already correct.

      ## Files Involved
      - app/Launcher/LaunchBlock.php
      - app/Launcher/StaleWorkerDivergence.php (new)
      - app/Jobs/LaunchClaudeSession.php

      ## Steps
      1. Add `LaunchBlock::LauncherStaleWorker` with its own `message()` arm. Wording names the divergence and the remedy, e.g. *"This launch was offered with a launcher script configured, but the queue worker that ran it resolved a different configuration — it is running the `.env` it booted with. Run `php artisan queue:restart`."* **Lars gate:** the sentence must not interpolate the launcher path, the configured value, or `command[0]` — `LauncherNotConfigured` leaks nothing today and this message must leak nothing either. No `LaunchBlockDetail` arm is needed (`default => null`).
      2. Add `App\Launcher\StaleWorkerDivergence` with a single static `resolve(LaunchBlock $block, PromptLaunch $launch): LaunchBlock`, documented as the one place the two processes' answers are compared. Substitute `LauncherStaleWorker` only when all three hold:
         - `$block` is `LauncherNotConfigured`, `LauncherMissing`, or `LauncherNotExecutable`;
         - `$launch->command[0]` is present and a non-empty string;
         - `(string) config('kbms.claude_launcher')` (this process's answer) `!==` that `command[0]`.
         Return `$block` unchanged otherwise. Compare **values**, never block cases — that is what leaves a genuinely unset key and a launcher deleted after dispatch on their existing messages.
      3. In `LaunchClaudeSession::handle()`, pass the second-pass block through `StaleWorkerDivergence::resolve($result, $launch)` before `LaunchBlockDetail::for(...)` and the `update()`. Keep the existing `Log::info('kbms.launch', …)` shape unchanged.
      4. Add a `CHANGELOG.md` `[Unreleased] -> ### Fixed` line describing the refusal (docs for README land in TASK-06).
      5. `php artisan test --filter=LaunchClaudeSessionJobTest` — the existing launcher-deleted and transcripts-repointed regressions must stay green untouched.

      ## Completion Criteria
      - [x] A job whose preflight resolves no launcher, against a launch row whose `command[0]` holds one, blocks with the stale-worker message
      - [x] That message never contains the launcher path or any configured value
      - [x] A key genuinely unset in both processes still blocks with the unchanged `` `KBMS_CLAUDE_LAUNCHER` is not configured. `` message
      - [x] A launcher file deleted after dispatch (same path both sides) still blocks with the unchanged `LauncherMissing` message
      - [x] The comparison lives in exactly one named place; the job gained one line, not a branch tree
      - [x] CHANGELOG updated

      ## Test Data
      - N/A — no model or schema changes

      ## Git Deliverables
      - Commit: `fix(US-016): TASK-01 refuse a divergent launch as a stale worker`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes only
