    id: TASK-03
    title: 'Resync the mirror, verify the healed rows and record the fix'
    body: |-
      ## Description
      Heal the mirror with one forced resync, verify the corrected row count, record the security position accurately, and note the fix in the changelog.

      ## Files Involved
      - CHANGELOG.md
      - (no application code)

      ## Steps
      1. Full suite: `php artisan test --compact` — 641+ tests green, no skips introduced by this spec.
      2. `php artisan larapilot:quality` — Pint plus Larastan level 5 clean.
      3. `php artisan kbms:sync-calendar --sync --force` — `--force` bypasses the stored ETag/Last-Modified so the unchanged feed is re-fetched and re-parsed; `--sync` keeps it inline. Capture the run's output.
      4. Verify and record both counts:
         ```sql
         SELECT COUNT(*) AS total,
                SUM(CASE WHEN join_url LIKE '%>' THEN 1 ELSE 0 END) AS still_broken
         FROM calendar_events
         WHERE join_url IS NOT NULL AND starts_at >= '2026-06-18';
         ```
         `still_broken` must be `0`. Run the mirror query for `starts_at < '2026-06-18'` and report that remainder (expected 25) as the accepted, out-of-window residue — decision `f2afd78b2c6575f1`.
      5. Lars' security note for the review record, stated against what the code actually does: `OutlookLinkBuilder::isSafeUrl()` constrains the **scheme** (`http`/`https`) and nothing else — it does not check the host — and removing a suffix from a matched URL cannot change its scheme or its host, so there is no regression. Do **not** claim a host check the code does not perform.
      6. `CHANGELOG.md` → `## [Unreleased]` → add a `### Fixed` section (create it if absent, ordered after `### Added` per Keep a Changelog) with one entry in the project's established voice: the Teams join link harvested from a meeting description no longer carries the closing angle bracket of Outlook's own wrapper, so the button opens the meeting instead of a Teams page Microsoft does not recognise; the match now ends at characters a URL cannot contain, an HTML-escaped `&gt;` wrapper is removed as a guarded suffix, and punctuation that legitimately belongs to a URL is preserved; occurrences inside the sync window heal on the next `kbms:sync-calendar`, occurrences already older than `KBMS_ICS_WINDOW_PAST_DAYS` keep their stored value.
      7. No PRD edit — decision `acfb777dc90ee720`.

      ## Completion Criteria
      - [ ] Full suite green; `larapilot:quality` clean
      - [ ] `kbms:sync-calendar --sync --force` completed successfully
      - [ ] Zero rows with `starts_at >= 2026-06-18` and a `join_url` containing `>`, count recorded for the review notes
      - [ ] Out-of-window remainder counted and reported as accepted residue
      - [ ] Security position recorded accurately (scheme guard, no host guard, no regression)
      - [ ] `CHANGELOG.md` Unreleased carries the `### Fixed` entry

      ## Test Data
      - N/A — no model or schema changes; the resync writes through the existing ingestion path

      ## Git Deliverables
      - Commit: `fix(US-020): TASK-03 resync the mirror and record the healed join links`
      - Push: `origin feature/US-020-teams-join-url-delimiter`
      - PR: update the prepared body with TASK-03 and the verification counts
    type: Fix
