    id: TASK-02
    title: 'Pin the trimming boundary with a test matrix'
    body: |-
      ## Description
      Pin the trimming boundary with an explicit test matrix, so the next person who touches the pattern learns from a failing test rather than from a dead Teams page.

      ## Files Involved
      - tests/Unit/Calendar/IcsParserTest.php
      - tests/Unit/Meetings/OutlookLinkBuilderTest.php

      ## Steps
      1. Reuse `tests/Fixtures/ics/teams-link-wrapped.ics` from TASK-01 via the existing `parse()` helper — add no second fixture and no inline ICS strings.
      2. `test_an_html_escaped_wrapper_is_stripped_from_a_description_teams_link()` — `uid-wrapped-002` yields the same URL as `uid-wrapped-001`'s shape, with no `&gt;` and no `>`.
      3. `test_punctuation_that_belongs_to_the_teams_link_is_preserved()` — `uid-wrapped-004` keeps its trailing `.`, `,`, `;` and `)` verbatim. Assert the full string, not a `str_ends_with`, and state the intent in the test name: this is the boundary the spec asked to pin, and it must fail loudly if someone later adds a blanket `rtrim()`.
      4. `test_the_first_teams_link_in_a_description_still_wins()` — `uid-wrapped-003` returns the *first* link, cleanly ended; the second is not returned.
      5. `test_a_minimum_shape_teams_link_survives_trimming()` — `uid-wrapped-005` yields `https://teams.microsoft.com/l/meetup-join/a`, not an empty string and not `null`.
      6. `test_the_skype_teams_meeting_url_property_wins_over_a_wrapped_description_link()` — `uid-wrapped-006` returns the property's value verbatim, proving the precedence branch never reaches the trimming path.
      7. In `OutlookLinkBuilderTest`, add a case building a `CalendarEvent` whose `join_url` is a trimmed wrapped URL and assert `teamsUrl()` returns it — the fix produces values the existing scheme guard still accepts, and a `javascript:` `join_url` is still rejected (keep or extend whatever negative case already exists rather than duplicating it).
      8. `php artisan test --filter=IcsParserTest` and `php artisan test --filter=OutlookLinkBuilderTest`.

      ## Completion Criteria
      - [ ] All six boundary cases covered by named tests that read as the contract
      - [ ] A URL legitimately ending in `.` `,` `;` `)` is proven preserved
      - [ ] `teamsUrl()` accepts a trimmed URL and still rejects a non-http(s) scheme
      - [ ] Both filtered runs green

      ## Test Data
      - N/A — reuses the TASK-01 fixture and existing `CalendarEvent` factory states

      ## Git Deliverables
      - Commit: `test(US-020): TASK-02 pin the Teams link trimming boundary`
      - Push: `origin feature/US-020-teams-join-url-delimiter`
      - PR: update the prepared body with TASK-02
    type: Test
    status: TODO
    assignee: Anne
    estimate_hours: 1
