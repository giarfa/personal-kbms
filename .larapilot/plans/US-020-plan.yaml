    id: TASK-01
    title: 'Stop the Teams link match at characters a URL cannot contain'
    body: |-
      ## Description
      Fix: stop the description Teams-link match at characters a URL cannot contain, strip an HTML-escaped wrapper as a guarded suffix, and land the real-shape fixture plus the regression test in the same green commit.

      ## Files Involved
      - app/Calendar/IcsParser.php
      - tests/Fixtures/ics/teams-link-wrapped.ics (new)
      - tests/Unit/Calendar/IcsParserTest.php

      ## Steps
      1. Replace `TEAMS_LINK_PATTERN`'s trailing `\S+` with the negated class `[^\s<>"^`{}|\[\]\\\\]+` (RFC 3986's forbidden ASCII outside the authority). Verify the PHP single-quoted escaping of the backslash and the brackets with an actual run, not by eye.
      2. Add `private function stripEscapedWrapper(string $url): string` — `preg_replace('/(?:&gt;)+$/i', '', $url) ?? $url`, returned **only** when `preg_match(self::TEAMS_LINK_PATTERN, $trimmed) === 1`, otherwise the original match. Call it from `readJoinUrl()` on `$matches[0]`. Leave the `X-MICROSOFT-SKYPETEAMSMEETINGURL` branch above it completely untouched.
      3. Write the docblock stated in the plan on `stripEscapedWrapper()` — it is the record of why one delimiter is trimmed and the rest are structural. PHPDoc, not inline comments, per the PHP conventions.
      4. Create `tests/Fixtures/ics/teams-link-wrapped.ics` with six non-recurring `VEVENT`s inside March 2026, mirroring the live feed: **folded** `DESCRIPTION` lines (continuation lines starting with a single space), iCalendar-escaped `,` and `;` where they occur.
         - `uid-wrapped-001` — the reported shape: `…Need help?<https://aka.ms/JoinTeamsMeeting?omkt=en-GB> | System reference<https://teams.microsoft.com/l/meetup-join/19%3ameeting_wrapped001%40thread.v2/0?context=%7b%22Tid%22%3a%2205001249-320e-4144-af6d-4bf9030aa9b6%22%7d>` **followed by** `\nFor organisers: Meeting options<https://teams.microsoft.com/meetingOptions/?organizerId=…>`
         - `uid-wrapped-002` — same link ending `%7d&gt;` instead of `%7d>`
         - `uid-wrapped-003` — two `meetup-join` links: a wrapped `…_first…` then a bare `…_second`
         - `uid-wrapped-004` — a link whose final segment legitimately ends in punctuation: `…/meetup-join/19%3ameeting_punct.\,\;)`
         - `uid-wrapped-005` — minimum shape, wrapped: `<https://teams.microsoft.com/l/meetup-join/a>`
         - `uid-wrapped-006` — `X-MICROSOFT-SKYPETEAMSMEETINGURL:https://teams.microsoft.com/l/meetup-join/19%3ameeting_property%7d` **plus** a wrapped, different link in the `DESCRIPTION`
      5. Add `test_a_wrapped_description_teams_link_drops_the_closing_angle_bracket()` to `IcsParserTest` using the existing `parse()` helper: assert `uid-wrapped-001`'s `joinUrl` is exactly the reported URL ending `%7d`, and assert `str_contains($joinUrl, '>') === false`.
      6. `php artisan test --filter=IcsParserTest` — the new test and every pre-existing one (including the bare-link assertion against `cancelled.ics`) must pass in the same run.
      7. `vendor/bin/pint --dirty --format agent` and `php artisan larapilot:quality`.

      ## Completion Criteria
      - [ ] A `DESCRIPTION` wrapping the link in angle brackets yields a `join_url` ending `%7d` with no trailing `>`
      - [ ] The bare, unwrapped link in `cancelled.ics` is still captured whole and unchanged
      - [ ] `X-MICROSOFT-SKYPETEAMSMEETINGURL` still takes precedence and its value is returned verbatim
      - [ ] `tests/Fixtures/ics/teams-link-wrapped.ics` carries the link as the live feed emits it — wrapped, folded, with text following the closing bracket
      - [ ] `php artisan test --filter=IcsParserTest` green; Pint and Larastan level 5 clean

      ## Test Data
      - [ ] `tests/Fixtures/ics/teams-link-wrapped.ics` created with all six events
      - [ ] `tests/Fixtures/ics/cancelled.ics` left unchanged — it is the bare-link guard
      - [ ] N/A for Eloquent factories/seeders — no model or schema change

      ## Git Deliverables
      - Commit: `fix(US-020): TASK-01 stop the Teams link match at characters a URL cannot contain`
      - Push: `origin feature/US-020-teams-join-url-delimiter`
      - PR: update the prepared body with TASK-01
    type: Fix
    status: TODO
