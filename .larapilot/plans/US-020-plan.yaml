code: US-020
plan_body: |-
  ## Technical Solution

  The defect is one character wide and lives in one method. `IcsParser::readJoinUrl()` matches the description with `TEAMS_LINK_PATTERN = '#https://teams\.microsoft\.com/l/meetup-join/\S+#i'` and returns `$matches[0]` verbatim. `\S+` accepts every non-whitespace character, so Outlook's own wrapper — confirmed in the live mirror as `System reference<https://teams.microsoft.com/l/meetup-join/…%7d>\nFor organisers: …` — ends up inside the match. 940 of the 942 stored `join_url` values end in a literal `>`; the two clean ones came through `X-MICROSOFT-SKYPETEAMSMEETINGURL`, which is a structured property and never touched the regex.

  ### 1. Stop the match at characters a URL cannot contain

  Replace the trailing `\S+` with an explicit negated class:

  ```php
  private const TEAMS_LINK_PATTERN = '#https://teams\.microsoft\.com/l/meetup-join/[^\s<>"^`{}|\[\]\\\\]+#i';
  ```

  The excluded set is exactly RFC 3986's forbidden ASCII outside the authority: whitespace, `<`, `>`, `"`, `^`, backtick, `{`, `}`, `|`, `[`, `]`, and backslash. None of them can appear unescaped in a valid URL, so excluding them is not a heuristic — a match that stops at one of them has stopped at the end of the URL by definition. This alone fixes the reported bug: the wrapper's closing `>` is no longer matchable, and so is never captured, in the wrapped case *and* in the `Need help?<…>` / `Meeting options<…>` links that surround it in the same description.

  Note `%7b`/`%7d` in the `?context=` parameter are percent-encoded braces, so excluding literal `{`/`}` costs nothing; the reported URL keeps its `%7d` ending intact.

  ### 2. Remove an HTML-escaped wrapper, and only that

  A client that HTML-escapes the description emits `…%7d&gt;` instead of `…%7d>`. Every character of `&gt;` is legal in a URL, so no character class can reject it — it has to be removed after the match, as a suffix, with a guard:

  ```php
  if (preg_match(self::TEAMS_LINK_PATTERN, $description, $matches) === 1) {
      return $this->stripEscapedWrapper($matches[0]);
  }
  ```

  ```php
  /**
   * A client that HTML-escapes Outlook's wrapper emits `…%7d&gt;` where another
   * emits `…%7d>`. The literal `>` can never enter the match — the pattern's
   * character class excludes it — but the escaped form is built from characters
   * a URL may legitimately carry, so it is removed here, at the end, and only
   * when what remains is still a complete meetup-join link.
   */
  private function stripEscapedWrapper(string $url): string
  {
      $trimmed = preg_replace('/(?:&gt;)+$/i', '', $url) ?? $url;

      return preg_match(self::TEAMS_LINK_PATTERN, $trimmed) === 1 ? $trimmed : $url;
  }
  ```

  Re-running the pattern over the trimmed value is what satisfies the minimum-shape criterion without a length check: the pattern requires at least one character after `meetup-join/`, so a strip that would empty the path fails its own re-match and the original match is returned untouched.

  ## The boundary, pinned (Anne)

  The spec's implementation notes suggested stripping a trailing delimiter *set* — `)`, `]`, `>`, `"`, `'`, `,`, `.`, `;` — while acceptance criterion 3 requires that a URL whose final segment legitimately ends in `.` `,` `;` `)` is **preserved**. Those two cannot both hold. The criterion is binding and the notes are explicitly non-prescriptive, so the boundary is drawn by *possibility*, not by *likelihood*:

  | Class | Characters | Treatment |
  | --- | --- | --- |
  | Cannot occur in a URL | whitespace `<` `>` `"` `^` `` ` `` `{` `}` `|` `[` `]` `\` | **Never matched** — excluded by the character class, so they end the match instead of being trimmed off it |
  | HTML-escaped wrapper | trailing `&gt;` | **Stripped**, suffix-only, guarded by a re-match |
  | Valid URL characters | `.` `,` `;` `:` `)` `'` `!` `?` `&` `~` and everything else RFC 3986 permits | **Always preserved**, wherever they sit, including last |

  The consequence is stated plainly so nobody re-litigates it at review: a Teams link written in prose as `(https://teams.microsoft.com/l/meetup-join/…)` keeps its closing `)`. That is the deliberate cost of never truncating a URL at a character that may belong to it. The live feed does not produce that shape; it produces the angle-bracket wrapper, which this fix handles structurally.

  ## Deliberately not changed

  - **Which link wins.** The `X-MICROSOFT-SKYPETEAMSMEETINGURL` branch keeps absolute precedence, and within a description the *first* `meetup-join` match still wins. This fix moves only where a match ends.
  - **`OutlookLinkBuilder`.** No read-time normalisation — decision journal `f2afd78b2c6575f1`. The parser is the single place a `join_url` is shaped.
  - **No data migration.** Same decision: the 915 in-window occurrences self-heal on resync because `join_url` is inside `ParsedOccurrence::contentHash()`; the 25 occurrences older than `KBMS_ICS_WINDOW_PAST_DAYS` keep their malformed value, accepted by the operator.
  - **No new config key, no new model, no schema change.**

  ## Git & Branching

  - Mode: **GITFLOW_PUSH** (`settings.git_mode`)
  - Branch: `feature/US-020-teams-join-url-delimiter`, cut from `develop` in TASK-00
  - One Conventional Commit per task; push after each task commit
  - PR toward `develop`: title and body prepared in TASK-00 and kept current, **opened by the operator by hand** — the GitHub forge toggle is deliberately OFF (decision journal `6b1c177837a2417b`)
  - Merge into `develop` only after `/larapilot-review` approval

  ## Test Data Strategy

  - **No model, migration, factory or seeder change** — this spec touches a parser and its fixtures only. `migrate:fresh --seed` is not a gate here.
  - The test data that matters is an **ICS fixture**: `tests/Fixtures/ics/teams-link-wrapped.ics`, carrying the description shape the live feed actually emits — folded `DESCRIPTION` lines, the link inside angle brackets, and more text after the closing bracket.
  - `tests/Fixtures/ics/cancelled.ics` is left **unchanged on purpose**: its bare, unwrapped link is now the explicit non-regression guard for acceptance criterion 2.
  - Existing Eloquent factories (`CalendarEvent::factory()`) are reused as-is by any feature-level assertion.

  ## Test Strategy

  Bar: **NORMAL** (`settings.testing`). PHPUnit only — no Playwright, Dusk, Pest browser, or viewport suite. New tests go in the existing `tests/Unit/Calendar/IcsParserTest.php` via its `parse()` fixture helper; create anything new with `php artisan make:test --phpunit`.

  - **TASK-01** ships the fix together with the fixture and the one regression test that pins the reported URL — the commit is green when it lands.
  - **TASK-02** is Anne's boundary matrix: HTML-escaped wrapper, punctuation preservation, first-link-wins, minimum shape, `X-MICROSOFT-SKYPETEAMSMEETINGURL` precedence, bare-link non-regression, and one `OutlookLinkBuilder::teamsUrl()` assertion proving a trimmed URL still passes the scheme guard.
  - **TASK-03** runs the full suite, `php artisan larapilot:quality` (Pint + Larastan level 5), the forced resync, and the SQL verification of the healed row count.

  Manual test handoff for the operator (one step, after TASK-03): open a meeting whose link came from the description and press **Join Teams meeting** — Teams must open the meeting, not an error page.

  ## Backfill & verification

  After the parser change lands, one run heals the window:

  ```bash
  php artisan kbms:sync-calendar --sync --force
  ```

  `--force` ignores the stored ETag/Last-Modified so the feed body is re-fetched and re-parsed even though nothing changed upstream; `--sync` keeps it inline so the result is observable in the same terminal. Every re-parsed occurrence produces a different `contentHash()` (the malformed `join_url` was part of it), so `EventSynchronizer` writes the corrected value.

  Verification query, whose result is recorded in the review notes:

  ```sql
  SELECT COUNT(*) AS total,
         SUM(CASE WHEN join_url LIKE '%>' THEN 1 ELSE 0 END) AS still_broken
  FROM calendar_events
  WHERE join_url IS NOT NULL AND starts_at >= '2026-06-18';
  ```

  Expected: `still_broken = 0`. The out-of-window remainder (`starts_at < 2026-06-18`, 25 rows) is reported separately and left alone.

  ## Observations logged, not actioned (for a future spec)

  1. `OutlookLinkBuilder::isSafeUrl()` checks the **scheme only** (`http`/`https`) — it does not constrain the host, and it accepts plain `http`. Acceptance criterion 8 should be read against what the code actually guarantees: no scheme regression, and trimming a suffix can never change a URL's host. Lars states it in those terms in TASK-03 rather than asserting a host check that does not exist.
  2. This feed's description now carries a **newer** primary link — `Join: https://teams.microsoft.com/meet/{id}?p={passcode}` — while the harvested one is the `l/meetup-join/` link labelled *System reference*. Both open the meeting, and this spec must not change which link wins. Whether the shorter `meet/` form should be preferred is a separate product question.
