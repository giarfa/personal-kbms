    id: TASK-08
    title: 'PHPUnit coverage for the scaffold'
    body: |
      ## Description
      Cover the scaffold at the `NORMAL` bar and, crucially, assert the **absences** this spec is defined by: no auth routes, no `User` model, no login affordance. An absence that no test guards will creep back on the next `composer update`. No browser, Dusk, or viewport suites at this bar; UI verification is a documented manual handoff.

      ## Files Involved
      - tests/Feature/AppShellTest.php (new)
      - tests/Feature/AuthenticationRemovedTest.php (new)
      - tests/Feature/LoopbackAccessTest.php (new)
      - tests/Feature/ConfigurationSurfaceTest.php (new)
      - tests/Feature/QueueAndScheduleTest.php (new)
      - tests/Feature/DatabaseUnavailableTest.php (new)
      - .larapilot/docs/test-results/US-001.md (manual test handoff)

      ## Steps
      1. Create each test with `php artisan make:test --phpunit {Name}` — no suite directory in the name. No factories exist to reuse and none should be created; this spec introduces no Eloquent model
      2. `AppShellTest`: `GET /` is 200 and renders one `<h1>`, the sidebar nav groups, the skip link, `noindex, nofollow`, and the `/favicon.svg` link; the Agenda and Calendar routes resolve by name and return 200
      3. `AuthenticationRemovedTest`: `Route::has('login')`, `'register'`, `'logout'`, `'password.request'`, `'profile.edit'`, `'two-factor.login'` are all false; no registered route name matches `/^(auth\.|password\.|two-factor\.|settings\.)/`; `class_exists(App\Models\User::class)` is false; `config('auth')` is absent; the rendered shell contains no `Log out` or `Settings` affordance; `GET /login` is 404
      4. `LoopbackAccessTest`: `127.0.0.1` and `::1` pass; an external `REMOTE_ADDR` gets 403 with the reason view; `kbms.allow_non_loopback = true` lifts the block; a spoofed `X-Forwarded-For` does not change the outcome
      5. `ConfigurationSurfaceTest`: each of the nine PRD keys resolves through `config('kbms.*')` with its documented default; assert `.env.example` file contents contain all nine key names (a string assertion, since `.env.example` is the operator's contract)
      6. `QueueAndScheduleTest`: `config('queue.default')` is `database`; `Queue::fake()` proves `kbms:queue-test` dispatches `QueueSelfTestJob`, and a separate assertion proves the job's `handle()` writes the expected log line via `Log::spy()`; the registered schedule contains a `kbms:sync-calendar` event whose expression matches `config('kbms.sync_minutes')` and which has `withoutOverlapping` set
      7. `DatabaseUnavailableTest`: point the sqlite connection at a nonexistent path, force `APP_DEBUG=true`, assert the response is 503, contains the configured path and the `touch` remedy, and does **not** contain a stack-trace marker; assert a genuine SQL error against a missing table still throws normally
      8. `php artisan test --compact`; iterate until green. Re-run the narrowest filter after each edit
      9. Write the manual test handoff to `.larapilot/docs/test-results/US-001.md`: keyboard-only pass (skip link → nav → placeholder pages, visible focus at every stop); theme toggle both directions with `@fluxAppearance` persistence; 375 px pass against `.larapilot/mockups/kbms-app/mobile.html`; no-login-prompt confirmation; rename-the-sqlite-file check
      10. `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] All six feature tests pass via `php artisan test --compact`
      - [ ] Coverage matches the `NORMAL` bar; no Playwright, Dusk, Pest browser, or viewport suite was added
      - [ ] The auth-absence assertions fail if `App\Models\User` or any auth route is reintroduced (verify by temporarily re-adding one, then reverting)
      - [ ] `.larapilot/docs/test-results/US-001.md` records the manual handoff steps
