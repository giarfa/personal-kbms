    id: TASK-06
    title: 'Enforce loopback-only access and verify secret hygiene'
    body: |
      ## Description
      Make the PRD's compensating control enforceable rather than aspirational. With no authentication by recorded operator choice, the only thing standing between the transcript surface and the network is that the application is reachable on loopback alone — so express it as middleware a test can assert, and verify on the branch that no ICS URL or filesystem path was ever committed.

      ## Files Involved
      - app/Http/Middleware/EnsureLoopbackRequest.php (new)
      - bootstrap/app.php
      - resources/views/errors/403.blade.php (new — plain, states the reason)
      - .env.example (KBMS_ALLOW_NON_LOOPBACK comment)
      - README.md is TASK-09's file — record the `php artisan serve --host=127.0.0.1` note in the commit body for Albert to pick up

      ## Steps
      1. `php artisan make:middleware EnsureLoopbackRequest` — abort `403` unless `$request->ip()` is in `['127.0.0.1', '::1']`, short-circuiting to allow when `config('kbms.allow_non_loopback')` is true. Type-hint `Request` and declare the `Response` return type
      2. Register it globally in `bootstrap/app.php` via `$middleware->append(...)` inside `withMiddleware`, so no route can opt out by omission
      3. Log a single structured warning on rejection (`Log::warning` with the rejected IP) — the operator should be able to see that something reached the port
      4. Add a plain `resources/views/errors/403.blade.php` stating that this application serves loopback only and naming `KBMS_ALLOW_NON_LOOPBACK` as the deliberate override. No product voice; the copy tone recorded in the mockup README applies
      5. Confirm the Herd site serves on loopback: `http://personal-kbms.test` resolves to `127.0.0.1` and the middleware allows it. Verify the reject path with `curl -H 'X-Forwarded-For: 203.0.113.7'` — and confirm it is **not** honoured, because no trusted-proxy configuration is in place (a spoofed header must not bypass or trigger the control)
      6. Secret hygiene on the branch: `git ls-files | grep -E '^\.env$'` is empty; `git grep -nE 'https?://[^ ]*\.ics|/Users/[a-z_]+/' -- . ':!.larapilot' ':!*.lock'` returns nothing outside artifacts; `.env.example` carries placeholders only
      7. `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] `EnsureLoopbackRequest` is registered globally in `bootstrap/app.php`
      - [ ] A request from a non-loopback IP receives 403 and the reason view; `127.0.0.1` and `::1` pass
      - [ ] `config('kbms.allow_non_loopback')` defaults to `false` and flipping it to `true` lifts the block
      - [ ] A spoofed `X-Forwarded-For` header cannot influence the decision (no trusted proxies configured)
      - [ ] Rejections write one structured warning to the log
      - [ ] `.env` is untracked; no real ICS URL or filesystem path appears anywhere in tracked application files
      - [ ] `http://personal-kbms.test` still serves the shell normally
      - [ ] `php artisan larapilot:quality` passes

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-001): TASK-06 enforce loopback-only access and verify secret hygiene`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes with the secret-hygiene grep results
