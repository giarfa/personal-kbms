    id: TASK-03
    title: 'Build the KBMS app shell, theme tokens and navigation'
    body: |
      ## Description
      Turn the kit shell into the Personal KBMS shell per the agreed visual contract in `.larapilot/mockups/kbms-app/README.md`: sidebar with the favicon mark and the Workspace / Later nav groups, header strip with breadcrumbs and the theme toggle, environment block where the kit put the user menu, `--kb-*` tokens mapped into Tailwind 4, `favicon.svg` shipped, and `noindex` insurance in the root layout. Agenda and Calendar exist as **placeholder pages** so the nav is live — their content is US-005 and US-008.

      ## Files Involved
      - resources/views/layouts/app/sidebar.blade.php, resources/views/layouts/app/header.blade.php, resources/views/layouts/app.blade.php
      - resources/views/partials/head.blade.php
      - resources/views/pages/agenda.blade.php, resources/views/pages/calendar.blade.php (placeholders)
      - resources/views/components/app-logo.blade.php, resources/views/components/app-logo-icon.blade.php
      - resources/views/components/environment-block.blade.php (new)
      - resources/css/app.css
      - public/favicon.svg (copied from .larapilot/mockups/kbms-app/favicon.svg)
      - routes/web.php
      - config/app.php (APP_NAME), .env, .env.example (APP_NAME, APP_URL)
      - Delete: resources/views/welcome.blade.php, resources/views/dashboard.blade.php, resources/views/components/placeholder-pattern.blade.php

      ## Steps
      1. Read `.larapilot/mockups/kbms-app/README.md` and open `index.html`, `dark.html`, and `mobile.html` at `/mockups/kbms-app` before touching a view — it is the agreed contract, not a suggestion
      2. Copy `.larapilot/mockups/kbms-app/favicon.svg` to `public/favicon.svg`. In `partials/head.blade.php`: point the icon link at `/favicon.svg`, drop the `favicon.ico` / `apple-touch-icon.png` links (neither asset exists — no OG or social assets by PRD decision), and add `<meta name="robots" content="noindex, nofollow">`
      3. Map the seven `--kb-*` token pairs from `.larapilot/mockups/kbms-app/kbms.css` into `resources/css/app.css` as Tailwind 4 `@theme` entries plus a `.dark` block that **flips lightness rather than reusing light values**. Add only `--kb-*`; never redefine a Flux/kit token. Port `--kb-mono`, `--kb-frame-max`, tabular numerals, and the `prefers-reduced-motion` neutraliser
      4. Remove the hardcoded `class="dark"` from `<html>` in `layouts/app/sidebar.blade.php` and rely on the kit's `@fluxAppearance` light/dark/system setting. **Do not port `theme.js`** — delete it from consideration; the kit's own appearance setting is the implementation
      5. Sidebar: `Personal KBMS` wordmark with `favicon.svg` as the 24×24 mark (`alt=""`); **Workspace** group → Agenda, Calendar; **Later** group → Search (FR-013) and Transcript inbox (FR-014) rendered **disabled with their FR tag**; drop the kit's Repository and Documentation items and the mockup-only Reference group
      6. Sidebar footer: `<x-environment-block>` in place of the deleted user menu — `127.0.0.1`, `config('app.timezone')`, `SQLite`, `no accounts`. Reads config only; no user concept anywhere
      7. Header strip: sidebar toggle, breadcrumbs, theme toggle, and a **named slot for the sync pill** left empty with a comment pointing at US-004. Do not build the pill here
      8. Add the `.kb-skip` skip link as the first focusable element in the layout, targeting `#main`; wrap page content in `<main id="main">`; one `<h1>` per page; `header` / `nav` / `main` landmarks
      9. `routes/web.php`: `Route::view('/', 'pages.agenda')->name('agenda')` and `Route::view('calendar', 'pages.calendar')->name('calendar')`, both as placeholder pages that state which spec fills them. Delete `welcome.blade.php`, `dashboard.blade.php`, and `components/placeholder-pattern.blade.php`
      10. Set `APP_NAME="Personal KBMS"` and `APP_URL=http://personal-kbms.test` in `.env` and `.env.example`; per-page `<title>` follows the kit's `{{ $title }} - {{ config('app.name') }}` pattern
      11. `npm run build`; smoke-check 375 / 768 / 1280 px in light and dark against `mobile.html`
      12. `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`

