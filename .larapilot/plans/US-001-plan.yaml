code: US-001
plan_body: |
  ## Technical Solution

  Turn the bare `laravel/laravel` 13.30.1 skeleton in `/Users/excellence_innovation/dev-code/personal-kbms` into the application shell every later spec lands on: the official Livewire + Flux starter kit installed as scaffold, its authentication surface removed outright, SQLite + `database` queue + scheduler wired, the full `KBMS_*` configuration surface declared, and a loopback-only access control that makes the PRD's "binds to `127.0.0.1`" an enforced property rather than a README sentence.

  **Delivery target is MVP** (PRD `## MVP Scope`), so architecture depth is a thin vertical slice: no service boundaries to design yet, no API surface, queues only where the PRD already requires them (calendar sync FR-001, launch bridge FR-008). There are **no Eloquent domain models in this spec** — `calendar_events`, `meeting_notes`, `meeting_transcripts`, `prompt_launches`, and `calendar_sync_runs` all belong to US-003 and later.

  ### Starter-kit reality check (verified against upstream, not assumed)

  `laravel/livewire-starter-kit@main` `composer.json` requires:

  - `livewire/livewire ^4.1`, `livewire/flux ^2.13.1`, `livewire/blaze ^1.0`, `laravel/chisel ^0.1.0`, `laravel/fortify ^1.37.2`, `laravel/framework ^13.17`, `laravel/tinker ^3.0`

  **Discrepancy with the PRD, recorded rather than absorbed:** the PRD `## Technical Architecture` states *"Livewire 3, Alpine, Tailwind 4"*. The kit ships **Livewire 4.1 with Flux 2**. This plan targets what the kit actually ships — the AC says "the official Laravel Livewire + Flux starter kit is installed", which is version-agnostic. The PRD stack line needs a revision entry; that is a PRD edit, not a task deliverable of this spec, and is raised for the human at review.

  Two further upstream facts that shape tasks:

  1. `livewire/flux` is Packagist-public and installs without credentials; its license field reads `proprietary` (free tier). **Flux Pro (`livewire/flux-pro`) is not used** — €0 recurring holds (Aurora).
  2. The kit registers `@php artisan install:features` in `post-update-cmd` and ships `app/Console/Commands/InstallFeaturesCommand.php`. Left in place, a future `composer update` **re-scaffolds the authentication features this spec removes**. Neutralising that hook is an explicit deliverable of TASK-02, not an afterthought.

  The kit's `require-dev` pins `phpunit/phpunit ^12.5` and includes `laravel/sail`. This project already runs **PHPUnit 13.3.2** and has chosen **Herd** (PRD `## Technical Architecture` → Local dev; decision journal `local development environment`). Neither is downgraded and Sail is not installed.

  ### Installation strategy

  The kit is a separate repository, not a package — there is no `artisan` installer for an existing app. Scaffold it into a throwaway directory with the Laravel Installer (5.31.1, present in Herd's bin) or a shallow `git clone`, then port the scaffold over the current skeleton while **preserving** the Larapilot and agent surfaces:

  - Preserve: `.larapilot/`, `.ai/`, `.claude/`, `.agents/`, `.github/skills/`, `.codex/`, `.cursor/`, `.grok/`, `.junie/`, `.kiro/`, `.larapilot/`, `.mcp.json`, `AGENTS.md`, `CLAUDE.md`, `boost.json`, `phpstan.neon.dist`, `pint.json`, `phpunit.xml`, the existing `.env`, and the `andreapollastri/larapilot` + `larastan` + `pao` composer entries
  - Take from the kit: `composer.json` `require` additions, `package.json`, `vite.config.js`, `resources/css`, `resources/js`, `resources/views`, `app/` scaffold, `config/` deltas, `routes/`, `database/` deltas

  The kit is installed **whole, including Fortify** (TASK-01), and authentication is then removed in the immediately following atomic commit (TASK-02). This is deliberate: the AC demands authentication be *removed, not left dormant*, and installing-then-removing makes the removal a reviewable diff instead of an unverifiable absence. TASK-01 therefore commits a transient auth-bearing state on the feature branch; TASK-02 is not optional and the two must not be reordered.

  ### Authentication removal inventory (verified file list)

  Files confirmed present in the upstream kit tree and slated for deletion in TASK-02:

  - Models / actions / concerns: `app/Models/User.php`, `app/Actions/Fortify/CreateNewUser.php`, `app/Actions/Fortify/ResetUserPassword.php`, `app/Concerns/PasswordValidationRules.php`, `app/Concerns/ProfileValidationRules.php`, `app/Livewire/Actions/Logout.php`
  - Providers / config: `app/Providers/FortifyServiceProvider.php` (+ its `bootstrap/providers.php` entry), `config/fortify.php`, `config/auth.php`
  - Console hook: `app/Console/Commands/InstallFeaturesCommand.php` + the `install:features` line in `composer.json` `post-update-cmd`
  - Migrations: `0001_01_01_000000_create_users_table.php`, `2024_01_01_000000_create_passkeys_table.php`, `2025_08_14_170933_add_two_factor_columns_to_users_table.php`
  - Factories / seeders: `database/factories/UserFactory.php`; `database/seeders/DatabaseSeeder.php` emptied of user seeding
  - Views: `layouts/auth.blade.php`, `layouts/auth/{card,simple,split}.blade.php`, `pages/auth/*` (7 files), `pages/settings/*` (7 files), `partials/settings-heading.blade.php`, `components/auth-header.blade.php`, `components/auth-session-status.blade.php`, `components/desktop-user-menu.blade.php`, `components/passkey-registration.blade.php`, `components/passkey-verify.blade.php`
  - Routes: `routes/settings.php` and its `require` in `routes/web.php`; the `['auth','verified']` middleware group
  - JS: `resources/js/passkeys.js`
  - Tests: `tests/Feature/Auth/*` (6 files), `tests/Feature/Settings/*` (2 files), `tests/Feature/DashboardTest.php`
  - Composer: `composer remove laravel/fortify`

  The kit's `layouts/app/sidebar.blade.php` calls `auth()->user()->name` / `->initials()` in three places and links `route('profile.edit')` / `route('logout')`. Those references die with the user menu — per `.ai/rules/views.md` and the mockup README, the menu is **deleted, not stubbed with a placeholder name**, and the sidebar footer carries the environment block instead.

  The `sessions` and `cache` migrations **stay**: Livewire needs session and CSRF state even with no accounts. `SESSION_DRIVER=database` is retained.

  ### Configuration surface

  `config/kbms.php` declares all nine PRD values with their documented defaults; `.env.example` carries every key with an explanatory comment. No machine-specific value becomes a code constant, and `KBMS_TIMEZONE` feeds `config('app.timezone')`.

  | Key | Default | Consumer spec |
  | --- | --- | --- |
  | `KBMS_ICS_URL` | *(none — required)* | US-003 |
  | `KBMS_ICS_SYNC_MINUTES` | `15` | US-003 (scheduler here) |
  | `KBMS_ICS_WINDOW_PAST_DAYS` | `90` | US-003 |
  | `KBMS_ICS_WINDOW_FUTURE_DAYS` | `180` | US-003 |
  | `KBMS_TRANSCRIPTS_PATH` | *(none — required)* | US-007 |
  | `KBMS_TRANSCRIPT_PATTERN` | `{date}-{time}-{slug}` | US-007 |
  | `KBMS_CLAUDE_LAUNCHER` | *(none — required)* | US-009 |
  | `KBMS_OUTLOOK_URL_TEMPLATE` | *(none — optional)* | US-005 |
  | `KBMS_TIMEZONE` | `Europe/Rome` | all |

  Declaring keys is in scope; **validating** them is US-002 (`kbms:doctor`).

  ### Loopback-only access control (Lars)

  The PRD records **no authentication** as the operator's explicit choice (decision journal `access and authentication`) with the accepted risk that "anything able to reach the port reads every transcript". The standard Larapilot security baseline — Fortify 2FA, `Password::defaults()`, Argon2id, Socialite, UUID PKs on a `User` — is therefore **not applicable**, and this is a recorded PRD position rather than an omission.

  The compensating control is made enforceable: `EnsureLoopbackRequest` middleware, registered globally in `bootstrap/app.php`, aborts `403` when `$request->ip()` is not `127.0.0.1` / `::1`, with a `kbms.allow_non_loopback` escape hatch defaulting to `false`. Under Herd the site is served on loopback via `http://personal-kbms.test`; the middleware is what makes the property hold if the port is ever bound wider, and it is what a test can assert.

  ### Error surface (AC 12)

  A missing or unreadable `database/database.sqlite` must not produce a stack trace on the shell page — and `APP_DEBUG=true` is the local default, so this cannot lean on Laravel's production error page. `withExceptions` maps `Illuminate\Database\QueryException` whose SQLSTATE/driver message indicates *unable to open database file* to a dedicated Blade view naming the offending `DB_DATABASE` value and the fix (`touch database/database.sqlite`, then `php artisan migrate`).

  ### Scope boundaries — what US-001 deliberately does not build

  Stated so the increment is reviewable against the right line:

  - **Sync pill** — the mockup README puts it in the shell because US-004 requires it everywhere. US-001 ships the shell and a named slot; the Livewire component is **US-004**.
  - **`kbms:sync-calendar`** — AC 6 requires `schedule:list` to show the calendar sync entry, so the command is created as a **registered stub** that exits non-zero with "not implemented — US-003". Its body is US-003.
  - **`kbms:doctor`** — US-002. The README references it as the first troubleshooting step (a documented forward reference, not a stub).
  - **`kbms:scan-transcripts`** — FR-014, future phase. Not created.
  - Agenda and Calendar routes exist as **empty placeholder pages** only, so the nav is live and navigable; their content is US-005 and US-008.
  - No domain models, migrations, factories, or seeders. The PRD's fixture-calendar seeder arrives with US-003.

  ### Deliberate omissions, with reasons

  - **`public/.well-known/security.txt` and `SECURITY.md`** — the Larapilot ship gate scopes both to *public apps*. This application binds to loopback, has no accounts, and is never deployed (PRD: no deploy platform). Not scaffolded; revisit only if FR-022 leaves the Won't list.
  - **`robots.txt` / `sitemap.xml` / `llms.txt`** — N/A per the mockup README `## SEO & discoverability`. A `<meta name="robots" content="noindex, nofollow">` ships in the root layout as cheap insurance.
  - **CI/CD pipeline** — no remote forge is enabled (`settings.github: NO`); `.github/` holds agent skills only, no workflows. `php artisan larapilot:quality` is the gate. Sarah has no pipeline YAML to author in this spec.
  - **OpenAPI, diagrams, runbooks, client manuals** — decision journal `documentation scope`: baseline only.
  - **Playwright / Dusk / viewport matrix** — `settings.testing: NORMAL`.

  ## Git & Branching

  - Mode: **`GITFLOW`** (`settings.git_mode`) — branch and atomic commits, internal PR prepared locally, **never auto-pushed**
  - **Repository precondition (Sarah):** `git log` reports *"your current branch 'main' does not have any commits yet"* — there is no commit, no `develop`, and no remote. TASK-00 therefore creates the **initial commit on `main`**, branches `develop` from it, then branches the feature branch from `develop`. The standard TASK-00 template assumes `develop` exists; this is the documented deviation.
  - Branch: `feature/US-001-app-scaffold` from `develop`
  - Per task: one Conventional Commit `type(US-001): TASK-NN summary`; no batched multi-task commits
  - Push: **skip** in every task. PR title/body toward `develop` prepared locally only
  - Hygiene: `php artisan larapilot:quality` and the relevant tests green before each `task-done`; `composer audit` after every `composer require` / `composer remove`
  - Merge to `develop` only after human `larapilot-review` approval

  ## Test Data Strategy

  - **No Eloquent domain models are introduced by this spec**, so there is no factory or seeder to create. Every Impl task carries `## Test Data — N/A` explicitly, except TASK-02, which **removes** `database/factories/UserFactory.php` and empties `database/seeders/DatabaseSeeder.php` of user seeding.
  - `php artisan migrate:fresh --seed` must still succeed after TASK-02 against an empty seeder — a passing no-op seed is the check that the auth removal left no dangling reference.
  - Demo volumes: none. The PRD's fixture calendar plus sample transcript files arrive with US-003; nothing here should pre-empt that shape.
  - `phpunit.xml` already pins `DB_DATABASE=:memory:` and `QUEUE_CONNECTION=sync` for tests; queue-connection assertions read config rather than relying on the test environment.

  ## Test Strategy

  - Bar: **`NORMAL`** (`settings.testing`) — PHPUnit feature and unit tests. **No** Playwright, Dusk, Pest browser, or viewport E2E suites. Tests are created with `php artisan make:test --phpunit`.
  - Interleaved, not deferred: TASK-02, TASK-04, TASK-06, and TASK-07 each verify their own outcome before `task-done`; TASK-08 is Anne's consolidating suite over the finished scaffold.

  Anne's coverage, mapped to acceptance criteria:

  | Assertion | AC |
  | --- | --- |
  | `GET /` returns 200 and renders the shell (`<h1>`, sidebar nav, skip link, `noindex` meta, `favicon.svg` link) | 1, 9 |
  | Agenda and Calendar placeholder routes resolve by name and return 200 | 1 |
  | `Route::has('login')`, `'register'`, `'logout'`, `'password.request'`, `'profile.edit'`, `'two-factor.login'` are **all false**; no route name matches `/^(auth\.|password\.|two-factor\.|settings\.)/` | 2 |
  | `class_exists(App\Models\User::class)` is false; `app/Actions/Fortify` and `resources/views/pages/auth` do not exist; rendered shell HTML contains no `Log out` / `Settings` menu affordance | 2 |
  | `EnsureLoopbackRequest` allows `127.0.0.1` and `::1`, aborts 403 for an external `REMOTE_ADDR`, and honours `kbms.allow_non_loopback` | 3 |
  | `config('database.default') === 'sqlite'`; `migrate:fresh` succeeds against `:memory:`; `migrate:fresh --seed` succeeds | 4 |
  | `config('queue.default') === 'database'`; the self-test job is queued to the `database` connection when not faked, and its handler writes the expected log line | 5 |
  | The registered schedule contains a `kbms:sync-calendar` event with the interval derived from `KBMS_ICS_SYNC_MINUTES` and `withoutOverlapping` set | 6 |
  | Every one of the nine `KBMS_*` keys resolves through `config('kbms.*')` with the documented default; `.env.example` contains all nine keys | 7 |
  | A `QueryException` for an unopenable SQLite file renders the actionable view — asserting the `DB_DATABASE` path and the `touch database/database.sqlite` remedy, and **not** an exception trace — with `APP_DEBUG=true` | 12 |

  **Manual test handoff** (UI, per `settings.testing: NORMAL` — Anne documents, the operator runs):

  1. Keyboard-only pass: skip link → sidebar nav → placeholder pages; visible focus ring at every stop, never outline-only
  2. Theme toggle both directions; confirm the kit's `@fluxAppearance` persists the choice and that `theme.js` was not ported
  3. 375 px pass using `.larapilot/mockups/kbms-app/mobile.html` as the checklist: sidebar collapses to the toggle, no clipped controls, touch targets ≥ 44 px
  4. Confirm `http://personal-kbms.test` serves without a login prompt and that no `/login` or `/register` URL resolves
  5. Rename `database/database.sqlite` and reload — confirm the actionable message, then restore

  ## Risks

  | Risk | Mitigation |
  | --- | --- |
  | Porting the kit over an existing skeleton clobbers Larapilot artifacts | Explicit preserve list above; TASK-00's initial commit means every subsequent step is recoverable via `git checkout` |
  | `composer update` silently re-scaffolds auth via `install:features` | TASK-02 deletes the command **and** the `post-update-cmd` hook; TASK-08 asserts no auth routes exist |
  | Kit `require-dev` would downgrade PHPUnit 13 → 12 and add Sail | TASK-01 ports `require` only; `require-dev` is reconciled by hand and `composer audit` runs after |
  | `laravel/chisel` and `livewire/blaze` are young dependencies (`^0.1`, `^1.0`) on the critical path | They are the kit's own choices, not ours; `composer audit` after install, and TASK-01 records resolved versions in the commit body |
  | Livewire 4 page-component conventions differ from the PRD's Livewire 3 assumption | Flagged above; US-006/US-007/US-009 plans must be written against Livewire 4 |
tasks:
  -
    id: TASK-00
    title: 'Bootstrap repository history and Gitflow branches'
    body: |
      ## Description
      Establish the Git baseline this spec's Gitflow discipline assumes. The repository currently has **no commits at all** (`git log` → *"your current branch 'main' does not have any commits yet"*), no `develop` branch, and no remote, so the standard TASK-00 template's `git checkout develop` cannot run. Create the initial commit on `main` from the current skeleton plus the Larapilot artifacts, branch `develop`, then branch the feature branch from `develop`. Nothing is pushed (`git_mode: GITFLOW`).

      ## Files Involved
      - (git only, plus a `.gitignore` verification pass — no application code)
      - .gitignore

      ## Steps
      1. Verify `.gitignore` ignores `.env` (it does, line `.env`) and that `database/.gitignore` ignores `*.sqlite`; add `/database/*.sqlite*` if the kit's version is not yet in place
      2. `git status --porcelain | grep -c '^??'` and confirm no `.env`, `vendor/`, `node_modules/`, or `*.sqlite` file is staged: `git add -A && git status --short | grep -E '\.env$|^A\s+vendor/|node_modules/|\.sqlite'` must return nothing
      3. Initial commit on `main`: `git commit -m "chore: initial commit — Laravel 13 skeleton with Larapilot workflow artifacts"`
      4. `git branch develop main`
      5. `git checkout develop && git checkout -b feature/US-001-app-scaffold`
      6. Draft the internal PR title (`US-001: Application scaffold and local environment`) and body (link `.larapilot/plans/US-001-plan.yaml`, list TASK-00…TASK-10) into local notes — **do not push and do not open a remote PR**

      ## Completion Criteria
      - [x] `main` has exactly one commit containing the skeleton and `.larapilot/` artifacts
      - [x] `.env` and `database/database.sqlite` are **not** tracked (`git ls-files | grep -E '^\.env$|\.sqlite$'` is empty)
      - [x] `develop` exists and points at `main`
      - [x] `feature/US-001-app-scaffold` is checked out
      - [x] PR title/body drafted locally; no remote configured, nothing pushed

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `chore: initial commit — Laravel 13 skeleton with Larapilot workflow artifacts` (on `main`), then `chore(US-001): TASK-00 bootstrap feature branch` (empty commit allowed on the feature branch)
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: prepared locally toward `develop`; open remotely only if the operator asks
