    id: TASK-04
    title: 'Wire SQLite, the database queue and the scheduler'
    body: |
      ## Description
      Make the persistence and background surfaces real: SQLite as the configured database with a clean-checkout migration path, the `database` queue driver processing a verifiable test job, and a registered scheduler entry for the calendar sync. `kbms:sync-calendar` is created as a **registered stub** so `schedule:list` shows the entry as the AC requires; US-003 implements its body.

      ## Files Involved
      - config/database.php, config/queue.php
      - .env, .env.example (DB_CONNECTION, DB_DATABASE, QUEUE_CONNECTION)
      - database/.gitignore
      - routes/console.php
      - app/Console/Commands/SyncCalendarCommand.php (new — stub)
      - app/Console/Commands/QueueSelfTestCommand.php (new)
      - app/Jobs/QueueSelfTestJob.php (new)
      - composer.json (verify the `setup` script's sqlite touch)

      ## Steps
      1. Confirm `DB_CONNECTION=sqlite` and set `DB_DATABASE=database/database.sqlite` explicitly in `.env` and `.env.example`; confirm `database/.gitignore` ignores `*.sqlite*`
      2. Verify the existing `composer.json` `setup` script already touches `database/database.sqlite` before `php artisan migrate --force`, so a clean checkout needs **no manual file creation**; test the claim end to end with `git clone` into the scratchpad + `composer setup`
      3. Confirm `QUEUE_CONNECTION=database` in `.env` / `.env.example` and that the `jobs` / `job_batches` / `failed_jobs` migrations from the skeleton are present (`php artisan queue:table` only if missing)
      4. `php artisan make:job QueueSelfTestJob` — implements `ShouldQueue`, writes a single structured `Log::info` line with a context array, no model dependency
      5. `php artisan make:command QueueSelfTestCommand --command=kbms:queue-test` — dispatches `QueueSelfTestJob` and prints where to look for the log line. This is the operator's and the AC's demonstration that `queue:work` processes a job, and US-002's `kbms:doctor` reuses it
      6. `php artisan make:command SyncCalendarCommand --command=kbms:sync-calendar` — **stub**: a PHPDoc block stating US-003 owns the implementation, and a `handle()` that reports `not implemented — US-003` and returns `Command::FAILURE`. No ICS logic here
      7. In `routes/console.php`: `Schedule::command('kbms:sync-calendar')->cron(...)` driven by `config('kbms.sync_minutes')` — falling back to a literal `15` until TASK-05 introduces `config/kbms.php`, then reconciled there — with `->withoutOverlapping()`. Confirm `php artisan schedule:list` shows the entry
      8. Verify: `php artisan migrate:fresh` clean; `php artisan kbms:queue-test` then `php artisan queue:work --stop-when-empty` processes it and the log line appears in `storage/logs`; `php artisan schedule:list` shows `kbms:sync-calendar`
      9. `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `php artisan config:show database.default` reports `sqlite` and `database.connections.sqlite.database` resolves to `database/database.sqlite`
      - [x] A fresh `git clone` + `composer setup` migrates with **no manual file creation**
      - [x] `php artisan config:show queue.default` reports `database`; `jobs`, `job_batches`, and `failed_jobs` tables exist after migrate
      - [x] `php artisan kbms:queue-test` + `php artisan queue:work --stop-when-empty` processes the job and writes the expected log line
      - [x] `php artisan schedule:list` shows `kbms:sync-calendar` at the configured interval with `withoutOverlapping`
      - [x] `php artisan kbms:sync-calendar` exits non-zero with the `not implemented — US-003` message — it does not pretend to sync
      - [x] `database/database.sqlite` is not tracked by git
      - [x] `php artisan larapilot:quality` passes

      ## Test Data
      - N/A — no Eloquent domain model or schema of our own; only the framework's queue tables

