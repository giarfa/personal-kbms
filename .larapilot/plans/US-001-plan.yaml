    id: TASK-09
    title: 'Write the baseline README and CHANGELOG'
    body: |
      ## Description
      Replace the current Italian Larapilot scratch `README.md` with the operator-facing baseline the PRD and the decision journal call for — **baseline only**, per the recorded `documentation scope` choice: no OpenAPI, no diagrams, no runbook, no client manual. Add a minimal `CHANGELOG.md` with an Unreleased section so release discipline has somewhere to accumulate.

      ## Files Involved
      - README.md (rewritten)
      - CHANGELOG.md (new)

      ## Steps
      1. Rewrite `README.md` in English, matching the PRD and backlog language, with these sections:
         - **What this is** — local-first meeting knowledge cockpit; two sources (ICS feed, transcripts); never produces calendar entries or transcripts and never hosts the LLM
         - **Requirements** — PHP 8.4, Laravel Herd, Node; a note that **Herd is load-bearing, not a preference**: a container could not read the host transcript directory or invoke the host launcher script
         - **Setup** — clone, `composer setup` (installs, copies `.env`, generates the key, touches the SQLite file, migrates, builds assets), Herd site at `http://personal-kbms.test`
         - **Configuration** — a table of all nine `KBMS_*` values plus `KBMS_ALLOW_NON_LOOPBACK`, each with its default, whether it is required, and which capability consumes it
         - **Running the background processes** — `php artisan queue:work` and `php artisan schedule:work`, why both are needed (calendar sync and the launch bridge are queued jobs), and `composer dev` for the combined local loop
         - **The launcher script contract** — the operator's `.sh` is invoked with **exactly two positional arguments, in order: (1) the resolved context file path, (2) the question text**. Arguments are passed as an argument array, never an interpolated shell string. The script opens its own terminal window and the application **never captures Claude's reply**. Include a minimal example script
         - **Troubleshooting** — `php artisan kbms:doctor` as the first step (a forward reference: US-002 implements it), `php artisan kbms:queue-test` to prove the worker, `php artisan schedule:list` to confirm the sync entry, and the SQLite-missing message with its `touch` remedy
         - **Access model** — no authentication by design; loopback-only enforcement; the recorded accepted risk that anything able to reach the port reads every transcript
         - **Quality** — `php artisan larapilot:quality` (Pint + Larastan level 5) and `php artisan test`
      2. Keep the tone recorded in the mockup README: plain, specific, operator-to-operator. No product voice
      3. Create `CHANGELOG.md` in Keep a Changelog format with an `## [Unreleased]` section listing `Added` (application scaffold, configuration surface, loopback control) and `Removed` (starter-kit authentication). No version tag yet
      4. Do **not** create `SECURITY.md` or `public/.well-known/security.txt` — the ship gate scopes both to public apps and this one binds to loopback and is never deployed. State that omission in the commit body so it reads as a decision, not an oversight
      5. Cross-check every command and `.env` key in the README against the actual code — a README that documents a key `config/kbms.php` does not have is worse than no README
      6. `vendor/bin/pint --dirty --format agent` (no PHP touched, but run for consistency)

      ## Completion Criteria
      - [ ] `README.md` covers Herd setup, the complete `.env` surface, the queue worker and scheduler, and the launcher's two-argument contract
      - [ ] Every `KBMS_*` key documented in the README exists in `config/kbms.php` and `.env.example`, and vice versa
      - [ ] Every command quoted in the README runs successfully as written
      - [ ] `kbms:doctor` is presented as the first troubleshooting step, marked as arriving with US-002
      - [ ] Baseline only: no OpenAPI, diagrams, runbook, or client manual
      - [ ] `CHANGELOG.md` exists with an Unreleased section
      - [ ] `SECURITY.md` and `security.txt` deliberately absent, with the reason recorded in the commit body

      ## Test Data
      - N/A — documentation only

