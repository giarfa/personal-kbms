    id: TASK-05
    title: 'Declare the KBMS configuration surface'
    body: |
      ## Description
      Give every machine-specific assumption from the PRD `## Configuration surface` a config entry and a documented `.env.example` line, so no later spec hardcodes a path, URL, or interval. Declaration only — **validating** these values is US-002 (`kbms:doctor`).

      ## Files Involved
      - config/kbms.php (new)
      - config/app.php (timezone bound to KBMS_TIMEZONE)
      - .env, .env.example
      - routes/console.php (reconcile the TASK-04 interval fallback onto config('kbms.sync_minutes'))

      ## Steps
      1. `php artisan make:class` is not the right generator for config — create `config/kbms.php` by hand, returning a typed array with the nine PRD keys and their documented defaults: `ics_url` (`KBMS_ICS_URL`, null), `sync_minutes` (`KBMS_ICS_SYNC_MINUTES`, `15`), `window_past_days` (`KBMS_ICS_WINDOW_PAST_DAYS`, `90`), `window_future_days` (`KBMS_ICS_WINDOW_FUTURE_DAYS`, `180`), `transcripts_path` (`KBMS_TRANSCRIPTS_PATH`, null), `transcript_pattern` (`KBMS_TRANSCRIPT_PATTERN`, `{date}-{time}-{slug}`), `claude_launcher` (`KBMS_CLAUDE_LAUNCHER`, null), `outlook_url_template` (`KBMS_OUTLOOK_URL_TEMPLATE`, null), `timezone` (`KBMS_TIMEZONE`, `Europe/Rome`). Add `allow_non_loopback` (`KBMS_ALLOW_NON_LOOPBACK`, `false`) for TASK-06
      2. Cast integers with `(int) env(...)` and booleans with `(bool) env(...)`; add an array-shape PHPDoc block at the top of the file
      3. The default `transcript_pattern` follows the recorded decision journal entry `transcript filename convention` — *date + time prefix, resolver keys off meeting start datetime* (e.g. `2026-09-07-1430-standup.md`). Do not invent a different convention
      4. Bind `config('app.timezone')` to `env('KBMS_TIMEZONE', 'Europe/Rome')` so the operator's timezone is set in one place
      5. Add all ten keys to `.env.example`, each with a one-line comment naming its default and the spec that consumes it; group them under a `# --- Personal KBMS ---` header. Set real local values in `.env` only
      6. Reconcile the TASK-04 scheduler interval onto `config('kbms.sync_minutes')` and re-run `php artisan schedule:list`
      7. Verify every key resolves: `php artisan config:show kbms`
      8. `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `php artisan config:show kbms` lists all ten keys with the documented defaults
      - [x] `.env.example` contains `KBMS_ICS_URL`, `KBMS_ICS_SYNC_MINUTES`, `KBMS_ICS_WINDOW_PAST_DAYS`, `KBMS_ICS_WINDOW_FUTURE_DAYS`, `KBMS_TRANSCRIPTS_PATH`, `KBMS_TRANSCRIPT_PATTERN`, `KBMS_CLAUDE_LAUNCHER`, `KBMS_OUTLOOK_URL_TEMPLATE`, `KBMS_TIMEZONE`, `KBMS_ALLOW_NON_LOOPBACK` — each with a default and a comment
      - [x] `config('app.timezone')` follows `KBMS_TIMEZONE`
      - [x] `php artisan schedule:list` shows the interval derived from `config('kbms.sync_minutes')`
      - [x] No `.env.example` value contains a real ICS URL or a real filesystem path
      - [x] `php artisan larapilot:quality` passes

