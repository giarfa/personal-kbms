    id: TASK-07
    title: 'Render an actionable message when SQLite is unavailable'
    body: |
      ## Description
      Satisfy the spec's error case: a missing or unreadable `database/database.sqlite` must produce a clear, actionable message on the shell page — not a stack trace. `APP_DEBUG=true` is the local default, so this cannot rely on Laravel's production error page and must be an explicit exception mapping.

      ## Files Involved
      - bootstrap/app.php (withExceptions)
      - app/Exceptions/DatabaseUnavailableException.php (new)
      - resources/views/errors/database-unavailable.blade.php (new)

      ## Steps
      1. In `withExceptions`, add a `render` callback for `Illuminate\Database\QueryException` that detects an unopenable SQLite file — match the driver message (`unable to open database file`) and/or SQLSTATE `HY000`, scoped to the `sqlite` connection so a genuine SQL error still surfaces normally
      2. Map it to `resources/views/errors/database-unavailable.blade.php`, returning HTTP 503
      3. The view names the resolved `config('database.connections.sqlite.database')` value and the remedy verbatim: `touch database/database.sqlite`, then `php artisan migrate`. Per the recorded copy tone, it names the configuration key and the fixing action — never "Something went wrong". Reuse the shell's tokens; do **not** depend on a database read to render
      4. Distinguish the two cases the AC implies: **missing** file versus **present but unreadable** (permissions) — different sentences, both actionable, matching the `missing ≠ unreadable` distinction the mockup `states.html` contract requires elsewhere
      5. Verify with `APP_DEBUG=true`: rename `database/database.sqlite`, load `http://personal-kbms.test`, confirm the actionable page and no trace; `chmod 000` the restored file and confirm the unreadable variant; restore and confirm normal service
      6. `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] With the SQLite file missing and `APP_DEBUG=true`, the shell page shows the actionable message and no exception trace
      - [ ] With the file present but unreadable, a distinct and equally actionable message renders
      - [ ] The message names the configured `DB_DATABASE` path and the `touch` + `migrate` remedy
      - [ ] A genuine SQL error (e.g. a query against a missing table) still surfaces as a normal exception — the mapping is not a catch-all
      - [ ] Restoring the file restores normal service with no cache clearing
      - [ ] `php artisan larapilot:quality` passes

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-001): TASK-07 render actionable message when SQLite is unavailable`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
