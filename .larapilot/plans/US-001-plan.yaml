    id: TASK-01
    title: 'Install the Livewire + Flux starter kit as the application scaffold'
    body: |
      ## Description
      Install the official **Laravel Livewire + Flux starter kit** (`laravel/livewire-starter-kit`) over the existing bare `laravel/laravel` skeleton, preserving the Larapilot and agent surfaces. The kit is installed **whole, Fortify included** — TASK-02 removes authentication in the next atomic commit, which makes the removal a reviewable diff. Record the exact resolved versions in the commit body.

      ## Files Involved
      - composer.json, composer.lock
      - package.json, vite.config.js
      - app/ (kit scaffold: `Console/Commands/InstallFeaturesCommand.php`, `Actions/Fortify/*`, `Concerns/*`, `Livewire/Actions/Logout.php`, `Models/User.php`, `Providers/*`)
      - bootstrap/app.php, bootstrap/providers.php
      - config/ (`fortify.php` plus kit deltas to `app.php`, `auth.php`, `database.php`, `queue.php`, `session.php`)
      - database/migrations/, database/factories/UserFactory.php, database/seeders/DatabaseSeeder.php
      - resources/css/app.css, resources/js/app.js, resources/js/passkeys.js
      - resources/views/ (layouts, pages, partials, components, flux icon overrides)
      - routes/web.php, routes/settings.php, routes/console.php

      ## Steps
      1. Scaffold the kit into a throwaway directory outside the project: `laravel new kit-tmp --livewire --no-interaction` (Laravel Installer 5.31.1 is on PATH via Herd), or `git clone --depth=1 https://github.com/laravel/livewire-starter-kit.git kit-tmp`. Use the scratchpad, never a path inside the repo
      2. Port the scaffold into the project. **Preserve and never overwrite:** `.larapilot/`, `.ai/`, `.claude/`, `.agents/`, `.github/`, `.codex/`, `.cursor/`, `.grok/`, `.junie/`, `.kiro/`, `.mcp.json`, `AGENTS.md`, `CLAUDE.md`, `boost.json`, `phpstan.neon.dist`, `pint.json`, `phpunit.xml`, `.env`
      3. Merge `composer.json` `require` by hand — add `livewire/livewire ^4.1`, `livewire/flux ^2.13.1`, `livewire/blaze ^1.0`, `laravel/chisel ^0.1.0`, `laravel/fortify ^1.37.2`; keep `laravel/framework ^13.30`. **Do not** take the kit's `require-dev` wholesale: keep this project's `phpunit/phpunit ^13.3`, keep `andreapollastri/larapilot`, `larastan/larastan`, `laravel/pao`, `laravel/pail`, and **do not** add `laravel/sail` (PRD chose Herd)
      4. Keep this project's existing `scripts` block (it already has `setup`, `dev`, `lint`, `analyse`, `test`). Take the kit's `post-update-cmd` **without** the `install:features` line — that hook re-scaffolds authentication on `composer update` and TASK-02 removes its command
      5. `composer install`, then `composer audit` and record the result
      6. `npm install && npm run build`
      7. `php artisan migrate` against `database/database.sqlite`, then confirm `http://personal-kbms.test` renders the kit shell in both light and dark
      8. `vendor/bin/pint --dirty --format agent`, then `php artisan larapilot:quality`
      9. Record the resolved versions of `livewire/livewire`, `livewire/flux`, `livewire/blaze`, `laravel/chisel`, and `laravel/fortify` (`composer show --direct`) in the commit body

      ## Completion Criteria
      - [x] `composer show --direct` lists `livewire/livewire ^4.x`, `livewire/flux ^2.x`, `livewire/blaze`, `laravel/chisel`
      - [x] `phpunit/phpunit` is still `13.x` and `laravel/sail` is absent
      - [x] `composer.json` `post-update-cmd` does **not** contain `install:features`
      - [x] `.larapilot/`, `.ai/`, `.claude/`, `phpstan.neon.dist`, `pint.json`, `phpunit.xml`, and `.env` are byte-identical to their pre-task state (`git diff --stat` shows no changes under those paths)
      - [x] `npm run build` succeeds and Vite writes `public/build`
      - [x] `http://personal-kbms.test` renders the kit shell in light and dark
      - [x] `composer audit` reports no advisory, or any advisory is recorded in the commit body
      - [x] `php artisan larapilot:quality` passes
      - [x] The throwaway scaffold directory is deleted and never committed

      ## Test Data
      - N/A — no model or schema changes authored by this task (the kit's own `UserFactory` arrives here and is deleted in TASK-02)

      ## Git Deliverables
      - Commit: `feat(US-001): TASK-01 install Livewire + Flux starter kit scaffold`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes with the resolved dependency versions
