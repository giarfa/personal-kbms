    id: TASK-02
    title: 'Remove starter-kit authentication outright'
    body: |
      ## Description
      Delete the starter kit's entire authentication surface so no half-wired login remains: no auth routes, no login/register views, no `User` model or migration, no password-reset or 2FA or passkey scaffolding, and no Fortify. Also neutralise the `install:features` hook that would silently re-scaffold all of it on a future `composer update`. Per `.ai/rules/views.md` and the mockup README, the sidebar user menu is **deleted, not stubbed** — a placeholder name would re-introduce a login surface.

      ## Files Involved
      - Delete: app/Models/User.php, app/Actions/Fortify/CreateNewUser.php, app/Actions/Fortify/ResetUserPassword.php, app/Concerns/PasswordValidationRules.php, app/Concerns/ProfileValidationRules.php, app/Livewire/Actions/Logout.php, app/Providers/FortifyServiceProvider.php, app/Console/Commands/InstallFeaturesCommand.php
      - Delete: config/fortify.php, config/auth.php
      - Delete: database/migrations/0001_01_01_000000_create_users_table.php, database/migrations/2024_01_01_000000_create_passkeys_table.php, database/migrations/2025_08_14_170933_add_two_factor_columns_to_users_table.php, database/factories/UserFactory.php
      - Delete: resources/views/layouts/auth.blade.php, resources/views/layouts/auth/{card,simple,split}.blade.php, resources/views/pages/auth/ (7 files), resources/views/pages/settings/ (7 files), resources/views/partials/settings-heading.blade.php, resources/views/components/auth-header.blade.php, resources/views/components/auth-session-status.blade.php, resources/views/components/desktop-user-menu.blade.php, resources/views/components/passkey-registration.blade.php, resources/views/components/passkey-verify.blade.php
      - Delete: resources/js/passkeys.js
      - Delete: routes/settings.php
      - Delete: tests/Feature/Auth/ (6 files), tests/Feature/Settings/ (2 files), tests/Feature/DashboardTest.php
      - Edit: routes/web.php, bootstrap/providers.php, resources/views/layouts/app/sidebar.blade.php, resources/views/layouts/app/header.blade.php, resources/js/app.js, database/seeders/DatabaseSeeder.php, composer.json

      ## Steps
      1. `composer remove laravel/fortify`, then `composer audit`
      2. Delete every file in the list above
      3. Remove `App\Providers\FortifyServiceProvider::class` from `bootstrap/providers.php`
      4. Rewrite `routes/web.php`: drop `require __DIR__.'/settings.php'` and the `->middleware(['auth', 'verified'])` group; leave `Route::view('/', 'welcome')` in place for now (TASK-03 replaces it with the Agenda route)
      5. Strip the auth references from `resources/views/layouts/app/sidebar.blade.php` and `header.blade.php`: remove `<x-desktop-user-menu>`, the mobile `flux:dropdown` profile block, and every `auth()->user()->...`, `route('profile.edit')`, `route('logout')` reference. Leave the footer slot empty — TASK-03 fills it with the environment block
      6. Remove the `passkeys.js` import from `resources/js/app.js`
      7. Empty `database/seeders/DatabaseSeeder.php` of user seeding, leaving a valid no-op `run()`
      8. Confirm the `sessions` and `cache` migrations are **retained** — Livewire needs session and CSRF state — and that `SESSION_DRIVER=database` is unchanged
      9. Verify removal: `php artisan route:list --except-vendor` shows no auth route; `php artisan route:list | grep -iE 'login|register|logout|password|two-factor|profile|settings'` is empty; `grep -rn "auth()" app/ resources/views/ routes/` is empty; `grep -rn "App\\Models\\User\|Fortify" app/ config/ bootstrap/ database/ routes/ tests/` is empty
