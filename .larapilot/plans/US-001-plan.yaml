    title: 'Final quality gate and Laravel idiom review'
    body: |
      ## Description
      Close the spec on a verified gate rather than an assumed one: Pint and Larastan clean across the new scaffold, `composer audit` clean after this spec's dependency changes, the full test suite green, and a short Laravel-idiom pass over what the kit port left behind.

      ## Files Involved
      - phpstan.neon.dist (verify paths cover the new directories)
      - composer.json (verify scripts are coherent after the kit port)
      - Any file needing a fix surfaced by the gate

      ## Steps
      1. `php artisan larapilot:quality` — Pint plus Larastan level 5. Confirm `phpstan.neon.dist` `paths` still cover `app`, `bootstrap`, `config`, `database`, `routes`, `tests`, and that **level 5 was not lowered**
      2. `composer audit` — clean, or any advisory recorded with its reasoning
      3. `php artisan test --compact` — full suite green
      4. `npm run build` — clean
      5. Andrew's idiom pass over the ported scaffold: no business logic in routes; the loopback middleware and exception mapping sit in the right layers; the stub command is honest about being a stub; no leftover kit artifact referencing a user, Fortify, passkeys, or 2FA (`grep -rniE 'fortify|passkey|two.?factor|auth\(\)' app/ config/ resources/ routes/ tests/ bootstrap/` is empty); no dead Blade component or unused CSS token; `composer.json` scripts still coherent
      6. `php artisan route:list --except-vendor` and `php artisan schedule:list` — capture both outputs for the review handoff
      7. Confirm the branch history is one atomic commit per task with `type(US-001): TASK-NN` messages and nothing pushed: `git log --oneline develop..HEAD` and `git remote -v`

      ## Completion Criteria
      - [ ] `php artisan larapilot:quality` passes with Larastan at level 5 or higher
      - [ ] `composer audit` clean, or advisories recorded
      - [ ] `php artisan test --compact` green
      - [ ] `npm run build` clean
      - [ ] No residual reference to Fortify, passkeys, two-factor, `auth()`, or a `User` anywhere in application code
      - [ ] `route:list` and `schedule:list` outputs captured for review
      - [ ] One atomic commit per task, Conventional Commit messages, no remote, nothing pushed

