    id: TASK-01
    title: 'Add the LaunchChord enum holding the platform chord labels'
    body: |-
      ## Description
      Introduce `App\\Launcher\\LaunchChord`, the single source of truth for how the launch chord is written — symbolically for sighted users and in words for screen readers. Platform *detection* stays client-side (recorded decision `ask claude keyboard shortcut affordance`); this enum owns only the vocabulary, which is what makes the mapping unit-testable without a browser suite.

      ## Files Involved
      - app/Launcher/LaunchChord.php (new)

      ## Steps
      1. `php artisan make:enum Launcher/LaunchChord --no-interaction` (or `make:class` and convert) — a pure `enum LaunchChord: string` with cases `Command = 'mac'` and `Control = 'other'`, TitleCase keys per the PHP rules
      2. `public function label(): string` — `'⌘ Enter'` for `Command`, `'Ctrl Enter'` for `Control`. Symbolic, for the visible chip only
      3. `public function spokenLabel(): string` — `'Command-Enter'` / `'Control-Enter'`. The phrase a screen reader should read; hyphenated so it is announced as one chord rather than two words
      4. `public static function labels(): array` and `public static function spokenLabels(): array` — `array_column`-style maps keyed by the case value (`['mac' => …, 'other' => …]`), built by iterating `self::cases()` so a future case cannot be silently omitted. PHPDoc them with `array<string, string>` shapes
      5. Docblock the enum with why detection is client-side and why the table lives in PHP
      6. `vendor/bin/pint --dirty --format agent` and `php artisan larapilot:quality`

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-019): TASK-01 add the LaunchChord label vocabulary`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes

      ## Completion Criteria
      - [x] `LaunchChord` exists with both cases, `label()`, `spokenLabel()`, `labels()`, `spokenLabels()`
      - [x] Maps are derived from `self::cases()`, not hand-written literals
      - [x] Explicit return types and PHPDoc array shapes throughout
      - [x] Pint clean, Larastan level 5 clean
