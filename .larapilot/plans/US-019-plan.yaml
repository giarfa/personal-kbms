    id: TASK-03
    title: 'Bind the launch chord to the question textarea'
    body: |-
      ## Description
      Add the `kbLaunchShortcut` Alpine component and bind it to `#question` so `Cmd`/`Ctrl`+`Enter` fires the same `launch()` action the button fires — gated identically, racing nothing, and duplicating nothing. JS and Blade binding ship in one commit because either half alone is a broken intermediate state.

      ## Files Involved
      - resources/js/launch-shortcut.js (new)
      - resources/js/app.js
      - resources/views/livewire/ask-claude.blade.php

      ## Steps
      1. Create `resources/js/launch-shortcut.js` following the house pattern in `self-refresh.js`: a `document.addEventListener('alpine:init', …)` block registering `Alpine.data('kbLaunchShortcut', (config) => ({ … }))`. Add `import './launch-shortcut.js';` to `resources/js/app.js`
      2. Component state: `busy: false`, plus `max` from `config`
      3. `submit($event)`:
         - `if ($event.repeat || this.busy) return;` — OS auto-repeat and in-flight launches both fall out here, so holding the chord queues exactly one launch
         - `const value = $event.target.value;` — read the DOM, **never** `$wire.question`. This is the whole defence against the `wire:model.live.debounce.400ms` race (US-014's failure mode on the keyboard path): the debounced copy is never consulted, so it can never be stale or empty
         - `if (value.trim() === '' || value.length > this.max) return;` — inert exactly where the button is disabled, and **no server call**, so no validation message is raised. The existing on-screen block reason stays the only explanation (decision `ask claude keyboard shortcut blocked behaviour`)
         - `this.busy = true;` then `await this.$wire.set('question', value, false)` (deferred — no request) and `await this.$wire.launch()`, so one commit carries the update and the call, `updates` applied before `calls`
         - `finally { this.busy = false; }`
      4. In `ask-claude.blade.php`, put `x-data="kbLaunchShortcut({ max: @js((int) config('kbms.question_max_chars')) })"` on the existing `.sk-field` wrapper (extend it in TASK-04 with the label config), and add `x-on:keydown.cmd.enter.prevent="submit($event)"` and `x-on:keydown.ctrl.enter.prevent="submit($event)"` to the `<textarea id="question">` — **on the element itself**, no `.window`/`.document` modifier (decision `ask claude keyboard shortcut listener scope`). Leave `wire:model.live.debounce.400ms` exactly as it is
      5. Document in the JS file *why* the value comes from the DOM and not from `$wire` — it reads like a shortcut otherwise and will be "tidied" back into the bug
      6. `npm run build`, `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`, `php artisan test --compact`
      7. Smoke-check the panel at 375 / 768 / 1280 px — layout is desktop-first by recorded PRD decision, the obligation is only that nothing breaks below 768 px

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-019): TASK-03 launch the session from the question field with Cmd/Ctrl+Enter`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes

      ## Completion Criteria
      - [x] `kbLaunchShortcut` registered on `alpine:init` and imported from `app.js`
      - [x] Listeners live on the `#question` textarea only — no page-, window- or document-level handler
      - [x] Question is read from `$event.target.value`, never from `$wire.question`
      - [x] `$event.repeat` and the in-flight `busy` flag both short-circuit
      - [x] Empty, whitespace-only and over-length values return before any server call
      - [x] Bare `Enter` and `Shift`+`Enter` still insert newlines
      - [x] `npm run build` green; Pint and Larastan level 5 clean; suite green
