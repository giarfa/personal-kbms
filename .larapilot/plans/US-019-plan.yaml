    id: TASK-06
    title: 'Update the mockup contract and write the manual test handoff'
    body: |-
      ## Description
      `.larapilot/mockups/kbms-app/README.md` is the repo's stated UI contract (`.ai/rules/views.md`) — a new affordance beside the page's only primary button belongs in it, or the next agent builds against a stale contract. Pair it with the manual handoff note for the keystroke behaviour PHPUnit cannot reach.

      ## Files Involved
      - .larapilot/mockups/kbms-app/meeting.html
      - .larapilot/mockups/kbms-app/states.html
      - .larapilot/mockups/kbms-app/README.md
      - .larapilot/docs/test-results/US-019-manual.md (new)

      ## Steps
      1. Add the chord chip next to **Launch session** in `meeting.html` (line ~261) and in the ready variant in `states.html` (line ~317); leave the three disabled variants without it — the hint only shows when the launcher is ready
      2. Extend the README's "Ask Claude Code" line (≈ line 92) so the panel reads: question textarea → the page's only `sk-btn--primary` **plus the platform chord hint** → the exact invocation. Record that the chip is `aria-hidden` and that the fact reaches screen readers through `#question`'s `aria-describedby`, so nobody removes one half later
      3. Write `.larapilot/docs/test-results/US-019-manual.md` — an operator checklist against https://personal-kbms.test on a meeting with a linked transcript:
