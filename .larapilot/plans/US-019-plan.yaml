    id: TASK-05
    title: 'Feature-test launch parity, the blocked no-op, and the markup contract'
    body: |-
      ## Description
      Cover what PHPUnit can reach: that the action the chord calls behaves identically to the button's, that a blocked launcher writes nothing, and that the bindings and the accessible description are actually in the rendered markup. `settings.testing: NORMAL` — no Playwright, Dusk, Pest browser or viewport suite.

      ## Files Involved
      - tests/Feature/AskClaudePanelTest.php

      ## Steps
      1. Reuse the existing `readyEvent()` / `readableTranscriptPath()` helpers and the `setUp()` launcher fixture — do not build new fixtures
      2. **Parity**: `Livewire::test(AskClaude::class, ['occurrence' => $event])->set('question', …)->call('launch')` on a ready occurrence creates exactly one `PromptLaunch` row whose `context_path`, `question` and `command` match what `LaunchPreflight::for()` resolves, and pushes exactly one `LaunchClaudeSession`. Note in the test docblock that the chord invokes this same action, which is why parity is structural rather than separately driven
      3. **Blocked no-op**: with the launcher blocked (extend the existing blocked-state cases), assert `PromptLaunch::count()` is `0` alongside the current `Queue::assertNothingPushed()`, and that the on-screen block reason is still the only thing rendered
      4. **Markup contract**: assert the rendered component contains `x-on:keydown.cmd.enter`, `x-on:keydown.ctrl.enter`, `kbLaunchShortcut`, that `#question`'s `aria-describedby` includes `question-shortcut`, and that both chord labels reach the payload. Assert the hint is present in the ready state and absent in a blocked state
      5. Update the class docblock's manual-handoff note to cover US-019 alongside the existing US-014 paragraph
      6. `php artisan test --compact --filter=AskClaudePanelTest`, then the full `php artisan test --compact`

      ## Git Deliverables
      - Commit: `test(US-019): TASK-05 cover launch parity and the shortcut markup contract`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes

      ## Completion Criteria
      - [ ] Parity test asserts one row, one job, and matching context/question/command
      - [ ] Blocked case asserts no row, no job, no new message
      - [ ] Markup contract covers both keydown bindings, the `x-data` wrapper, and the `aria-describedby` wiring
      - [ ] Hint asserted present when ready and absent when blocked
      - [ ] Full suite green; Pint and Larastan level 5 clean
