    id: TASK-04
    title: 'Render the platform-aware chord hint beside Launch session'
    body: |-
      ## Description
      Show the operator which chord to press, next to the button it aliases (recorded decision `ask claude keyboard shortcut affordance`), in the panel's existing `kb-tag` / `kb-note-inline` idiom — and make sure screen-reader users get the same fact through the textarea's accessible description rather than losing it to `aria-hidden`.

      ## Files Involved
      - resources/views/livewire/ask-claude.blade.php
      - resources/js/launch-shortcut.js

      ## Steps
      1. Extend the `kbLaunchShortcut` config with `labels`, `spokenLabels` (from `LaunchChord::labels()` / `spokenLabels()`, passed with `@js(…)`) and `spokenTemplate` (`@js(__('Press :chord to launch the session.'))`)
      2. In the component's `init()`, detect the platform client-side — `navigator.userAgentData?.platform ?? navigator.platform`, matched case-insensitively against `mac|iphone|ipad` — and resolve `this.platform` to `'mac'` or `'other'`. Expose `chordLabel` and `spokenHint` getters that index the two maps and interpolate `:chord`. The JS only *picks a key*; the words themselves come from PHP
      3. In the `.kb-inline` row holding **Launch session**, inside the existing `@if ($command)` branch so the hint appears exactly when the button is enabled, add after the button:
         - `<span class="kb-tag kb-tag--muted" aria-hidden="true" x-text="chordLabel"></span>` followed by `<span class="kb-note-inline">{{ __('to launch') }}</span>`
         - `<span id="question-shortcut" class="sr-only" x-text="spokenHint"></span>` (`sr-only` is Tailwind v4's, already imported — no new CSS)
      4. Append `question-shortcut` to `#question`'s `aria-describedby`, keeping the existing `question-help` and conditional `question-error` ids in order. The chip may only be `aria-hidden` **because** this description exists — do not ship one without the other
      5. Check the hint does not crowd the existing "Queued · opens its own terminal window …" note at 375 px; `.kb-inline` already wraps, verify it does
      6. `npm run build`, `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`, `php artisan test --compact`

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-019): TASK-04 show the platform chord beside the launch button`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes

      ## Completion Criteria
      - [x] Hint renders beside **Launch session**, only while the launcher is ready
      - [x] `⌘ Enter` on macOS, `Ctrl Enter` elsewhere, chosen client-side from the PHP-owned label maps
      - [x] Visible chip is `aria-hidden`, and `#question`'s `aria-describedby` carries `question-shortcut` with the spoken phrase
      - [x] Every new string passes through `__()`
      - [x] Visual language matches the existing `kb-tag` / `kb-note-inline` idiom; nothing breaks at 375 px
      - [x] `npm run build` green; Pint and Larastan level 5 clean; suite green
