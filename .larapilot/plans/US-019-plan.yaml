code: US-019
plan_body: |
  ## Technical Solution

  `AskClaude` (`app/Livewire/AskClaude.php`) already owns the entire launch gate: `launch()` validates, re-runs `LaunchPreflight::for()`, writes the `prompt_launches` row and dispatches `LaunchClaudeSession`. The shortcut adds **no** server-side path — it calls that same action. Everything new is client-side plus one presentational enum.

  ### 1. Chord vocabulary — `app/Launcher/LaunchChord.php`

  A PHP enum with cases `Command` and `Control`:

  - `label()` → `⌘ Enter` / `Ctrl Enter` (visible, symbolic)
  - `spokenLabel()` → `Command-Enter` / `Control-Enter` (screen-reader phrase)
  - `LaunchChord::labels()` / `LaunchChord::spokenLabels()` → `['mac' => …, 'other' => …]` maps handed to the view as `@js(…)`

  Detection stays **client-side** per recorded decision `ask claude keyboard shortcut affordance`; JS only picks a key. The mapping table itself is PHP, which is what makes the AC's "unit or component level" coverage of the chord mapping possible without a browser suite.

  ### 2. Listener — `resources/js/launch-shortcut.js`

  Registered as `Alpine.data('kbLaunchShortcut', …)` inside an `alpine:init` listener, matching the house pattern of `self-refresh.js` (`kbSelfRefresh`) and `calendar.js` (`kbCalendar`); imported from `resources/js/app.js`.

  Bound via `x-data="kbLaunchShortcut({ max: …, macLabel: …, otherLabel: …, … })"` on the existing `.sk-field` wrapper, with `x-on:keydown.cmd.enter.prevent` and `x-on:keydown.ctrl.enter.prevent` on the **`#question` textarea element only** (decision `ask claude keyboard shortcut listener scope`) — no `.window`, no `.document`, no page-level handler. The notes editor and transcript panel carry no listener, so the chord is inert there by construction rather than by a guard. Bare `Enter` and `Shift`+`Enter` match no listener at all, so the browser's newline behaviour is untouched.

  Handler contract (`submit($event)`):

  1. `return` when `$event.repeat` (OS auto-repeat) or when the component's own `busy` flag is set (a launch is in flight) → no duplicate row.
  2. Read the question from **`$event.target.value`**, i.e. straight from the DOM — never from `$wire.question`. This is the whole answer to the debounce race the AC restates from US-014: the 400 ms `wire:model.live.debounce` sync is irrelevant because the handler never reads the debounced copy.
  3. `return` when the value trims to empty or exceeds `max` (`config('kbms.question_max_chars')`) → the chord is inert exactly where the button is disabled, and crucially **no validation message is produced**, honouring decision `ask claude keyboard shortcut blocked behaviour` (the existing on-screen block reason stays the only explanation).
  4. Otherwise `await $wire.set('question', value, false)` (third argument `false` = defer, no request) then `await $wire.launch()` — one commit whose `updates` are applied before its `calls`, so the server sees the text as typed at the instant of the keypress.
  5. `finally` clears `busy`.

  Server-side blocks the client cannot see — script missing or not executable, no linked context file, unreadable `.txt` sibling — still reach `launch()`, which returns early on `LaunchBlock` before any write. That path is unchanged and is what the error-case AC rests on.

  ### 3. Affordance — `resources/views/livewire/ask-claude.blade.php`

  Inside the existing `.kb-inline` row that holds **Launch session**, immediately after the button and only when `$command` is non-null (so the hint appears exactly when the button is enabled):

  - a visible chip in the panel's own idiom — `<span class="kb-tag kb-tag--muted" aria-hidden="true" x-text="chordLabel">` — followed by the existing `kb-note-inline` wording, `{{ __('to launch') }}`
  - `<span id="question-shortcut" class="sr-only" x-text="spokenHint">`, where `spokenHint` interpolates the spoken label into a `__('Press :chord to launch the session.')` template passed in from Blade; `#question`'s `aria-describedby` gains `question-shortcut`

  The symbolic chip is hidden from assistive tech **only because** the same fact reaches screen-reader users through the control's accessible description — exactly the condition the AC attaches to `aria-hidden`. `sr-only` is Tailwind's (v4, imported at the top of `resources/css/app.css`); no new CSS. Every string goes through `__()`; the project has no `lang/` directory, so English is the passthrough source, as for every other string in the panel.

  ## Git & Branching

  - Mode: **GITFLOW** (from `settings.git_mode`) — Gitflow **without** automatic push
  - Branch: `feature/US-019-launch-shortcut`, cut from `develop` in TASK-00
  - One Conventional Commit per task; no batched multi-task commits
  - PR description toward `develop` prepared **locally**; do not `git push` and do not open a remote PR unless the operator asks in-session
  - Merge into `develop` only after human `/larapilot-review` approval

  ## Test Data Strategy

  - **No schema change, no new model, no new migration.** Nothing to add to factories or seeders.
  - Existing fixtures are reused as-is: `CalendarEvent::factory()`, `MeetingTranscript::factory()->forOccurrence($event)->manual()`, and `AskClaudePanelTest`'s established `readyEvent()` / `readableTranscriptPath()` helpers (which also write the `.txt` sibling US-015 requires).
  - No seeder change; `migrate:fresh --seed` is not part of this spec's gates.

  ## Test Strategy

  Bar: **NORMAL** (`settings.testing`). PHPUnit only — **no** Playwright, Dusk, Pest browser, or viewport matrix. Create tests with `php artisan make:test --phpunit`.

  - **Unit** — `tests/Unit/Launcher/LaunchChordTest.php`: the platform → chord mapping, both the visible and the spoken label for each case, and that `labels()` / `spokenLabels()` cover every enum case with no gaps. This is the AC's unit-level coverage of the chord mapping.
  - **Feature** — `tests/Feature/AskClaudePanelTest.php`, extended (the chord calls the identical action, so asserting the action's contract is asserting the shortcut's):
    - *parity*: `->set('question', …)->call('launch')` on a ready occurrence produces exactly one `PromptLaunch` row and one queued `LaunchClaudeSession`, with `context_path`, `question` and `command` matching what `LaunchPreflight` resolved — the same row the button produces
    - *blocked no-op*: with the launcher blocked, `call('launch')` writes no row (`PromptLaunch::count()` stays 0) and pushes no job (`Queue::assertNothingPushed()`)
    - *markup contract*: the rendered textarea carries `x-on:keydown.cmd.enter` and `x-on:keydown.ctrl.enter`, the `kbLaunchShortcut` `x-data` wrapper is present, `#question`'s `aria-describedby` includes `question-shortcut`, both chord labels reach the payload, and the hint renders in the ready state but not in a blocked state
  - **Manual handoff** — the true keystroke round-trip only reproduces in a browser, so it is documented rather than automated, following the US-014 precedent already recorded in `AskClaudePanelTest`'s class docblock. Written to `.larapilot/docs/test-results/US-019-manual.md`: chord fired immediately after the last keystroke launches with the full text; bare `Enter` and `Shift`+`Enter` insert newlines; the chord in the notes editor and the transcript panel does nothing; holding the chord down queues one launch; the hint reads `⌘ Enter` on macOS.
  - **Gates before every `task-done`**: `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality` (Pint + Larastan level 5), `php artisan test --compact`, plus `npm run build` for tasks touching `resources/js` or `resources/views`.

  ## Risks & reviewer notes

  - `$wire.set(prop, value, false)` deferring without firing a request is documented Livewire behaviour (livewire/livewire 4.4.4). If the installed build ever diverged, the fallback is the documented `x-on` idiom `$wire.question = value` in the same tick before `$wire.launch()` — Livewire pools both into one commit and applies `updates` before `calls`. Either way the feature-test parity assertion and the manual handoff are what prove it, not the mechanism's name.
  - Alpine state on Livewire-rendered markup survives DOM diffing, so no `wire:ignore` is needed, and `wire:navigate` re-initialises `x-data` normally. No `$cleanup()` is required either: this is a plain element-scoped `x-on`, not a subscription like `kbSelfRefresh`'s tick.
  - **Flagged for review:** binding both `.cmd` and `.ctrl` means `Ctrl`+`Enter` also launches on macOS. Deliberate — the AC requires each platform's chord to work, not that the other be rejected, and the hint still shows only the platform-native chord. Reject it in review and the fix is a single `if (isMac !== $event.metaKey) return;` guard in the handler.
  - No security surface change: no new input path, no new write path, and `LaunchPreflight` / `LaunchCommand` argument quoting is untouched (Lars).
