code: US-012
plan_body: |
  ## Technical Solution

  A closed-vocabulary rule engine in `app/Meetings/`, evaluated in memory against fields the two existing queries already load. No table, no migration, no `.env` key, no UI.

  **Vocabulary — three enums, all closed.** A rule that names anything outside them is not a rule at all: it is dropped at construction, so a bad colour, field, or condition can never reach the browser as markup.

  - `EventColourField` — `summary`, `location`, `description`, `organizer`. All four are scalar string columns already selected by `AgendaQuery` and `CalendarFeedQuery`.
  - `EventColourCondition` — `contains` and `empty`, and deliberately nothing else. `contains` is a **case-insensitive** substring match (`PING`, `Ping`, `ping` all hit). `empty` is true when the field is `null`, absent, or whitespace-only, so an ICS feed emitting `LOCATION:` with a single space counts as empty.
  - `EventColour` — the closed palette: `yellow`, `purple`, `green`, `blue`, `orange`, `grey`. The enum value is only ever used to build a class-name suffix; the actual colour is resolved in the stylesheet. Configuration cannot supply a CSS value.

  **Rules.** `EventColourRule` is a readonly value object with a `fromArray()` factory that returns `null` for anything malformed — unknown field, unknown condition, unknown colour, missing label, or a `contains` rule with no needle (which would otherwise match every occurrence, since `str_contains($x, '')` is always true). `EventColourRules::fromConfig()` maps `config('kbms.event_colour_rules')` through that factory, silently dropping the nulls, and exposes exactly two operations: `match(CalendarEvent): ?EventColourRule` (**top-down, first hit wins, later rules skipped**) and `all()` for the legend. An empty or absent list is valid and is the "off" state — no legend, no classes, both views render exactly as they do today.

  `EventColourRules` is **not** container-bound. It is constructed once per query call, which costs a handful of array reads and keeps `config()` overrides in tests honest — a singleton would go stale the moment a test set a different rule list.

  **Where matching happens — once per row, zero extra queries.** `AgendaQuery::for()` and `CalendarFeedQuery::for()` each build the rule set **once**, outside the row loop, and pass the matched rule (or `null`) into `AgendaRow` and `CalendarEventPayload`. Matching reads only `$event->summary` / `location` / `description` / `organizer`, all already hydrated. A dense month window issues exactly the same queries it does today — this is structural, not a benchmark claim.

  `AgendaRow`'s new constructor parameter is optional and defaults to `null`, so `MeetingController` keeps building an uncoloured row for the detail page without a change. That is the mechanism enforcing "no colouring on `/meetings/{occurrence}`", not a rendering omission that could drift.

  **Rendering — three channels that cannot consume each other.** The channel split is enforced by which CSS properties each one is allowed to touch:

  | Channel | Owns | Never touches |
  | --- | --- | --- |
  | Rule colour (FR-023) | `background`, `color` — the fill | borders, marks, tags |
  | Coverage (FR-002) | left/right edge borders, the dot/square marks, the agenda tags | fill |
  | Cancelled | dashed border, transparent fill, strike-through, muted text | — (wins over fill) |

  - *Calendar* — `CalendarEventPayload::classNames()` appends `kb-ev--colour-{token}`. The stylesheet rule sets only `background` and `color`, and is written `:not(.kb-ev--cancelled)` so cancelled wins **by selector rather than by source order** — a later refactor that reorders the stylesheet cannot silently un-cancel an event. Coverage's `border-left` / `border-right` are untouched, so an annotated PING meeting still shows its edge marks over a yellow fill.
  - *Agenda* — `kb-row--colour-{token}` on the same terms. `kb-row--cancelled` and `kb-row--now` keep their own borders.
  - *All-day* — `kb-ev--allday` currently supplies its own indigo tint. A rule-coloured all-day event now takes the rule's fill instead; the all-day signal survives in FullCalendar's separate all-day lane and in the agenda's `All-day` tag. Noted as a deliberate, minor precedence choice rather than a regression.

  **Palette — inherited contrast, not re-guessed.** Each token gets `--kb-rule-{token}` (text) and `--kb-rule-{token}-bg` (fill), defined with the **same oklch lightness pairs the already-verified `--kb-note` / `--kb-transcript` tokens use**: `L 0.45` on `L 0.955` in light, `L 0.80` on `L 0.28` in dark. Identical lightness means identical contrast ratio, so AA carries over by construction (≈4.8:1 light, ≈5.9:1 dark) instead of resting on a fresh eyeball check. Hues are chosen to stay clear of the two existing coverage hues — note is teal `205`, transcript is indigo `285` — so `blue` sits at `250`, `purple` at `320`, `green` at `140` (clear of `--kb-ok` at `155`), `yellow` at `90`, `orange` at `55`, and `grey` at chroma `0`.

  **Accessibility.** The rule label rides the accessible name on both surfaces: appended to `CalendarEventPayload::accessibleName()` alongside the coverage words, and added to the agenda row as a `.kb-sronly` span so the visible link text stays natural. Colour is never the only carrier. Both legends are generated from `EventColourRules::all()` — adding a third rule to the config array makes it appear in both pages with no view edit, which is itself an acceptance criterion and is tested as one.

  **Defaults shipped.** `config/kbms.php` gains `event_colour_rules` with exactly the two rules the operator asked for, in this order: `summary contains PING` → `yellow` / "Ping", then `location empty` → `purple` / "No location". Order is the priority, so a meeting that is both renders yellow.

  ## Git & Branching
  - Mode: `GITFLOW` (from `settings.git_mode`)
  - Branch: `feature/US-012-event-colour-rules` from `develop`
  - TASK-00: bootstrap the branch and prepare the internal PR description locally
  - Per task: one Conventional Commit `type(US-012): TASK-NN summary`; **no push**, no remote PR
  - Merge into `develop` after the review gate

  ## Test Data Strategy
  - No new or changed Eloquent model, migration, factory or seeder. Rules are configuration over existing columns.
  - Tests reuse `CalendarEventFactory` (`at()`, `allDay()`, `cancelled()`) and set rule lists with `config(['kbms.event_colour_rules' => …])` per case.
  - One factory gap to close: the default factory gives `location` a 50% chance of being `null`, which would make an `empty`-rule test flaky. Tests set `location` explicitly rather than relying on the factory's coin flip — no factory change needed.
  - `migrate:fresh --seed` unaffected.

  ## Test Strategy
  - Bar: `NORMAL` (from `settings.testing`) — PHPUnit feature and unit tests. **No** Playwright, Dusk, Pest browser, or viewport matrix.
  - **Unit** (`tests/Unit/Meetings/EventColourRulesTest.php`): case-insensitive `contains`; `empty` across `null` / absent / `''` / whitespace-only; first-match-wins with a two-rule overlap; every malformed shape dropped (unknown field, unknown condition, unknown colour, missing label, `contains` with no needle, non-array entry, non-array config); empty list is the off state; a `null` summary matches no `contains` rule and throws nothing.
  - **Feature — agenda** (`tests/Feature/AgendaColourTest.php`): a PING meeting carries its class and its `.kb-sronly` label; an empty-location meeting carries the purple class; a meeting matching both renders yellow only; a cancelled match keeps `kb-row--cancelled`; an annotated match still shows its coverage tags; the legend lists every configured rule and nothing when the list is empty; a third rule added to config appears in the legend with no view edit; a malformed rule leaves the page rendering and the event uncoloured.
  - **Feature — calendar** (`tests/Feature/CalendarColourTest.php`): the same matrix through `GET /calendar/events`, asserting `classNames` and `accessibleName` on the JSON payload, plus the legend on `GET /calendar`.
  - **Query count**: assert with `DB::listen` that a window of many occurrences issues the same number of queries with rules configured as with none — the no-per-occurrence-query criterion, proven rather than asserted in prose.
  - Contrast is verified by construction (identical lightness pairs to the existing AA-verified tokens) and recorded in the manual handoff for a visual confirmation in both themes.
  - `larapilot:quality` (Pint + Larastan level 5) before each backend `task-done`; `npm run build` after CSS changes.
