    id: TASK-07
    title: 'Document the rule vocabulary in README and CHANGELOG'
    body: |
      ## Description
      The rule list is the operator's only control surface for this feature, so it has to be written down exhaustively — every field, every condition, every colour.

      ## Files Involved
      - README.md
      - CHANGELOG.md

      ## Steps
      1. README: a `## Event colour rules` section covering — where rules live (`config/kbms.php`, **not** `.env`, and why); the rule shape; the four allowed `field` values; the two `condition` values with their exact semantics (case-insensitive substring; null/absent/whitespace-only); the six palette colours; that array order is the priority and the first match wins; that an invalid rule is dropped and its event renders uncoloured; that an empty list is the supported "off" state.
      2. README: state that rule colour, note/transcript coverage, and cancelled styling are independent channels that render together, and that the meeting detail page is deliberately excluded.
      3. README: add the shipped two-rule default as a copyable snippet.
