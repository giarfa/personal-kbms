  -
    id: TASK-01
    title: 'Colour rule engine: closed vocabulary, first-match-wins, shipped defaults'
    body: |
      ## Description
      Add the rule engine and the two default rules. Nothing renders yet — TASK-04 and TASK-05 consume it.

      ## Files Involved
      - app/Meetings/EventColour.php (new)
      - app/Meetings/EventColourField.php (new)
      - app/Meetings/EventColourCondition.php (new)
      - app/Meetings/EventColourRule.php (new)
      - app/Meetings/EventColourRules.php (new)
      - config/kbms.php

      ## Steps
      1. `php artisan make:class` for each of the five classes (backed enums written by hand where the generator does not fit).
      2. `EventColour: string` — `Yellow`, `Purple`, `Green`, `Blue`, `Orange`, `Grey` (TitleCase keys, lowercase values). Docblock: values are class-name suffixes only; the colour itself is resolved in `resources/css/app.css`, never supplied by configuration.
      3. `EventColourField: string` — `Summary`, `Location`, `Description`, `Organizer`. Add `valueFor(CalendarEvent $event): ?string`.
      4. `EventColourCondition: string` — `Contains`, `Empty`. Add `matches(?string $fieldValue, ?string $needle): bool`:
         - `Contains` → `$needle !== null && $needle !== '' && str_contains(Str::lower((string) $fieldValue), Str::lower($needle))`
         - `Empty` → `trim((string) $fieldValue) === ''`
      5. `EventColourRule` — `final readonly`, promoted constructor (`EventColourField $field`, `EventColourCondition $condition`, `?string $value`, `EventColour $colour`, `string $label`), a `matches(CalendarEvent $event): bool`, and `public static function fromArray(mixed $rule): ?self`. `fromArray` returns **null** for: a non-array entry; an unknown or missing `field` / `condition` / `colour`; a missing or blank `label`; a `contains` rule whose `value` is missing or empty. Document why the last one matters — `str_contains($x, '')` is always true, so an empty needle would paint every occurrence.
      6. `EventColourRules` — `final readonly`, holds `list<EventColourRule>`; `fromConfig(): self` (tolerating a non-array config value), `match(CalendarEvent $event): ?EventColourRule` (**top-down, returns the first hit, skips the rest**), `all(): list<EventColourRule>`. Docblock: not container-bound on purpose, so a `config()` override in a test is always honoured.
      7. `config/kbms.php` — add `event_colour_rules` with the two shipped defaults, **in this order**: `['field' => 'summary', 'condition' => 'contains', 'value' => 'PING', 'colour' => 'yellow', 'label' => 'Ping']` then `['field' => 'location', 'condition' => 'empty', 'colour' => 'purple', 'label' => 'No location']`. Extend the file's array-shape PHPDoc to cover the new key. Comment that order is the priority and that reordering the array is the only reprioritising mechanism.
      8. **No** `env()` call for this key and no `.env.example` entry — rules are product shape, not machine shape.
      9. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Five classes in place with explicit return types and array-shape PHPDoc
      - [ ] Every malformed rule shape yields `null` from `fromArray` and is dropped from the set
      - [ ] `match()` returns the first hit in array order and evaluates nothing after it
      - [ ] An absent, empty, or non-array config value yields an empty rule set rather than an error
      - [ ] `config/kbms.php` carries the two defaults in the right order, with its PHPDoc updated
      - [ ] No new `KBMS_*` env key anywhere
      - [ ] Pint and Larastan (level 5) clean

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-012): TASK-01 add the event colour rule engine and shipped defaults`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 3
    dependencies:
      - TASK-00
  -
    id: TASK-02
    title: 'Unit-test the rule engine'
    body: |
      ## Description
      Pin the rule engine's semantics before anything renders them, so a later rendering change cannot quietly redefine what a match means.

      ## Files Involved
      - tests/Unit/Meetings/EventColourRulesTest.php (new)

      ## Steps
      1. `php artisan make:test --phpunit --unit EventColourRulesTest` and move it under `tests/Unit/Meetings/` to match the existing layout.
      2. Use `CalendarEventFactory` with explicit field values — never the factory's 50/50 `location` coin flip.
      3. Cover:
         - `contains` matches case-insensitively: `PING`, `Ping`, `ping`, and mid-title occurrences
         - `contains` does not match when the needle is absent
         - `empty` is true for `null`, for `''`, and for whitespace-only (`' '`, `"\t"`) — the `LOCATION:` single-space case named in the spec
         - `empty` is false for a real value
         - first match wins: a `PING` meeting with no location, against `[ping-rule, no-location-rule]`, resolves to the ping rule; reversing the array reverses the outcome
         - every rule after the first hit is skipped (assert the returned rule identity, not just the colour)
         - a `null` summary matches no `contains` rule and raises nothing
         - malformed rules are dropped and do not shift a valid rule's own behaviour: unknown field, unknown condition, unknown colour, missing label, blank label, `contains` with a missing or empty `value`, a non-array entry
         - a non-array or absent `kbms.event_colour_rules` yields an empty set
         - an empty set matches nothing and reports `all() === []`
      4. `php artisan test --compact --filter=EventColourRulesTest`

      ## Completion Criteria
      - [ ] Every bullet above is a named test
      - [ ] Tests pass; Pint and Larastan clean

      ## Test Data
      - N/A — reuses `CalendarEventFactory` with explicit attribute overrides

      ## Git Deliverables
      - Commit: `test(US-012): TASK-02 cover the colour rule engine`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
    type: Test
    status: TODO
    assignee: Anne
    estimate_hours: 2
    dependencies:
      - TASK-01
  -
    id: TASK-03
    title: 'Palette tokens and the fill-only channel rules'
    body: |
      ## Description
      Define the six closed palette tokens in both themes and the CSS that lets rule colour fill an event without touching coverage or cancelled styling.

      ## Files Involved
      - resources/css/app.css

      ## Steps
      1. In the `@theme` block, add `--kb-rule-{token}` and `--kb-rule-{token}-bg` for `yellow`, `purple`, `green`, `blue`, `orange`, `grey`, using the **same oklch lightness pairs the existing coverage tokens use** — `oklch(0.45 C H)` text on `oklch(0.955 C' H)` fill. Mirror them in the `.dark` block at `oklch(0.80 C H)` on `oklch(0.28 C' H)`.
      2. Hues, chosen to stay clear of the coverage hues (note `205`, transcript `285`) and of `--kb-ok` (`155`): yellow `90`, orange `55`, green `140`, blue `250`, purple `320`, grey chroma `0`.
      3. Comment the block: lightness is inherited from the AA-verified `--kb-note` / `--kb-transcript` pair on purpose, so contrast carries over by construction rather than by a fresh eyeball check; a future token must keep the same L values.
      4. Calendar fill — for each token, `.kb-cal .fc-event.kb-ev--colour-{token}:not(.kb-ev--cancelled) { background: …-bg; color: …; }`. **Only** `background` and `color`. Never `border`, never `border-left`, never `border-color` — those belong to coverage.
      5. Write the `:not(.kb-ev--cancelled)` guard explicitly rather than relying on source order, so reordering the stylesheet cannot un-cancel an event.
      6. Agenda fill — `.kb-row--colour-{token}:not(.kb-row--cancelled)` on the same terms.
      7. Legend swatch — `.kb-legend__swatch` reusing the existing `.kb-inline` legend idiom, with a `--colour-{token}` modifier painting the swatch.
      8. Place the new rules **after** `.kb-ev--allday` so a rule-coloured all-day event takes the rule's fill; leave a comment saying so, since it is a deliberate precedence choice.
      9. `npm run build`, then eyeball `/` and `/calendar` in light and dark.

      ## Completion Criteria
      - [ ] Twelve tokens (six colours × text/fill) defined in both themes, on the inherited lightness pairs
      - [ ] Fill rules set only `background` and `color`; no border property anywhere in them
      - [ ] Cancelled wins by selector, not by source order, on both surfaces
      - [ ] Legend swatch style in place
      - [ ] `npm run build` succeeds; both themes render sanely

      ## Test Data
      - N/A — stylesheet only

      ## Git Deliverables
      - Commit: `feat(US-012): TASK-03 add the closed colour palette and fill-only channel rules`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
    type: Impl
    status: TODO
    assignee: Joe
    estimate_hours: 2
    dependencies:
      - TASK-01
  -
    id: TASK-04
    title: 'Colour the agenda rows and generate its legend'
    body: |
      ## Description
      Carry the matched rule onto agenda rows and build the legend from configuration.

      ## Files Involved
      - app/Meetings/AgendaRow.php
      - app/Meetings/AgendaQuery.php
      - app/Livewire/Agenda.php
      - resources/views/livewire/agenda.blade.php

      ## Steps
      1. `AgendaRow`: add a third constructor parameter `?EventColourRule $colourRule = null`, promoted to a public readonly property. **The default is load-bearing** — it is what keeps `MeetingController`'s detail-page row uncoloured without a second code path. Say so in the docblock.
      2. `AgendaQuery::for()`: build `EventColourRules::fromConfig()` **once, before the row loop**, and pass `$rules->match($event)` into each `AgendaRow`. Extend the existing query-count docblock to state that colouring adds no query.
      3. `Agenda::render()`: pass `'colourRules' => EventColourRules::fromConfig()->all()` to the view.
      4. Blade: add `kb-row--colour-{{ $row->colourRule->colour->value }}` to the row's class list when a rule matched. Leave `kb-row--cancelled` and `kb-row--now` exactly as they are.
      5. Blade: after the title, add `@if ($row->colourRule)<span class="kb-sronly">{{ $row->colourRule->label }}</span>@endif` so the classification is in the accessible name alongside the coverage words already carried by the visible tags.
      6. Blade: extend the existing `.kb-legend` paragraph with one swatch-plus-label per configured rule, looped from `$colourRules`. Render nothing extra when the list is empty — that is the documented "off" state.
      7. Do not touch the coverage tags, the cancelled treatment, or the `All-day` tag.
      8. `php artisan larapilot:quality` and `php artisan test --compact --filter=Agenda`

      ## Completion Criteria
      - [ ] A matched agenda row carries its colour class and its screen-reader label
      - [ ] An unmatched row renders byte-identically to before this spec
      - [ ] Cancelled and coverage rendering unchanged on a coloured row
      - [ ] The legend is generated from config — a third rule appears with no view edit; an empty list yields no extra legend entries
      - [ ] The meeting detail page is still uncoloured, via the constructor default
      - [ ] Existing agenda tests pass; Pint and Larastan clean

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-012): TASK-04 colour agenda rows and generate the legend from config`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 2.5
    dependencies:
      - TASK-02
      - TASK-03
  -
    id: TASK-05
    title: 'Colour the calendar events and generate its legend'
    body: |
      ## Description
      Carry the matched rule into the FullCalendar payload — class name and accessible name — and build the calendar legend from the same configuration.

      ## Files Involved
      - app/Meetings/CalendarEventPayload.php
      - app/Meetings/CalendarFeedQuery.php
      - routes/web.php
      - resources/views/pages/calendar.blade.php

      ## Steps
      1. `CalendarEventPayload`: add a `?string $colourLabel` property and accept `?EventColourRule $colourRule = null` in `from()`. Append `kb-ev--colour-{token}` in `classNames()` and the rule label to `accessibleName()`, placed after the coverage words and before the `cancelled` suffix so the existing wording order is preserved. Extend the `toArray()` array-shape PHPDoc.
      2. `CalendarFeedQuery::for()`: build `EventColourRules::fromConfig()` **once, before the map**, and pass `$rules->match($event)` into each payload. Extend the query-count docblock.
      3. `routes/web.php` calendar route: pass `'colourRules' => EventColourRules::fromConfig()->all()` to the view.
      4. `resources/views/pages/calendar.blade.php`: extend the existing `.kb-legend` paragraph with one swatch-plus-label per rule, looped from `$colourRules`, alongside the coverage entries already there. Nothing extra when the list is empty.
      5. No change to `resources/js/calendar.js` — the class name arrives through FullCalendar's own `classNames`, and `eventDidMount` already writes `accessibleName` onto the element. Confirm this rather than assuming it, and note it in the commit body.
      6. `php artisan larapilot:quality`; `php artisan test --compact --filter=Calendar`; `npm run build` and check month, week and day.

      ## Completion Criteria
      - [ ] A matched occurrence's JSON payload carries its colour class and its label in the accessible name
      - [ ] The colour renders in month, week **and** day views
      - [ ] Coverage marks and edge borders still render on a coloured event; a cancelled match stays dashed, struck and muted
      - [ ] The calendar legend is generated from config and matches the agenda's
      - [ ] `calendar.js` needed no change
      - [ ] Existing calendar tests pass; Pint and Larastan clean; build clean

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-012): TASK-05 colour calendar events and generate the legend from config`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 2.5
    dependencies:
      - TASK-02
      - TASK-03
  -
    id: TASK-06
    title: 'Feature-test both surfaces and prove the query count'
    body: |
      ## Description
      Cover the rendered contract on the agenda and the calendar feed, including the two criteria most likely to rot: the config-generated legend and the no-extra-queries promise.

      ## Files Involved
      - tests/Feature/AgendaColourTest.php (new)
      - tests/Feature/CalendarColourTest.php (new)
      - .larapilot/docs/test-results/US-012-manual.md (new)

      ## Steps
      1. `php artisan make:test --phpunit AgendaColourTest` and `CalendarColourTest`.
      2. Set rule lists per test with `config(['kbms.event_colour_rules' => …])`; set `location` explicitly on every factory call so the factory's 50/50 null never decides an outcome.
      3. **Agenda:** a `PING weekly` meeting carries `kb-row--colour-yellow` and its `Ping` label in a `.kb-sronly` span; a meeting with no location carries `kb-row--colour-purple`; a meeting that is **both** carries yellow and **not** purple; a cancelled match keeps `kb-row--cancelled`; an annotated match still shows its `Notes` / `Transcript` tags; an unmatched meeting carries no colour class; the legend lists every configured rule; a **third** rule added to config appears in the legend with no view edit; an empty rule list produces no legend entries and no colour classes; a malformed rule leaves the page `200` with the event uncoloured.
      4. **Calendar:** the same matrix against `GET /calendar/events`, asserting `classNames` and `accessibleName` on the JSON, plus the legend on `GET /calendar`. Assert the accessible name keeps its existing coverage wording **and** gains the label, and that a cancelled coloured event still ends with `cancelled`.
      5. **Query count:** create ~30 occurrences across a window, count queries with `DB::listen` for `GET /calendar/events` with no rules configured and with two rules configured, and assert the two counts are equal. Repeat for the agenda render. This is the "no per-occurrence queries" criterion — assert it, do not describe it.
      6. `.larapilot/docs/test-results/US-012-manual.md`: the visual half — both fills legible in light **and** dark, each distinguishable from the note teal and the transcript indigo, coverage marks still visible over a fill, cancelled still unmistakable, and the legend swatches matching the rendered fills on both pages.
      7. `php artisan test --compact` (full suite) and `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Every bullet above is a named test and passes
      - [ ] Query-count equality proven for both surfaces
      - [ ] Full suite green
      - [ ] Manual handoff written
      - [ ] Pint and Larastan clean

      ## Test Data
      - N/A — reuses existing factories with explicit attribute overrides

      ## Git Deliverables
      - Commit: `test(US-012): TASK-06 cover colour rendering on both surfaces and the query count`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
    type: Test
    status: TODO
