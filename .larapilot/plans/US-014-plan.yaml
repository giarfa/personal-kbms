code: US-014
plan_body: |-
  ## Technical Solution
  The "Launch session" button in `resources/views/livewire/ask-claude.blade.php:53` carries a native HTML `disabled` attribute driven by the server-computed `$command` view variable (`app/Livewire/AskClaude.php:89-98`, backed by `LaunchPreflight::for()`). The question `<textarea>` binds with a plain `wire:model="question"` (`ask-claude.blade.php:29`) — deferred in Livewire 3, so typing only updates the client-side Alpine copy and never round-trips to the server. `$command` therefore never recomputes from user input, the native `disabled` attribute never clears, and (because it is a native attribute, not `wire:target`/Alpine-driven) the browser blocks `wire:click="launch"` from firing at all while it is set.

  Fix: change the binding to `wire:model.live.debounce.400ms="question"` so edits are synced to the server on a short debounce, `render()` recomputes `$command` from the live value, and the button's `disabled` attribute tracks the real block reason (empty/whitespace question, question too long, no transcript, misconfigured script) as the user types. No change to `AskClaude::launch()`, `LaunchPreflight`, or `LaunchCommand` — the security-critical argument-array behavior from US-009 is untouched.

  ## Git & Branching
  - Mode: GITFLOW (no automatic push)
  - Branch: `feature/US-014-launch-button-live-question` from `develop`
  - TASK-00: bootstrap
  - Per task: one Conventional Commit; push/PR remain local until the user asks
  - Merge after human `larapilot-review` approval

  ## Test Data Strategy
  - No Eloquent model or schema changes in this fix — N/A

  ## Test Strategy
  - Bar: NORMAL — Pest feature tests only, no Playwright/Dusk/E2E
  - Anne extends `tests/Feature/AskClaudePanelTest.php` with explicit `assertSeeHtml`/`assertDontSeeHtml` checks on the button's `disabled` attribute across question states (empty, whitespace-only, valid) reusing the existing `readyEvent()`/`Queue::fake()` fixtures — this guards `render()`'s `$command`-driven disabled logic, which the existing suite exercises only indirectly via `assertSee` on messages.
  - Anne adds one lightweight regression assertion that the Blade source keeps `wire:model.live` (not plain deferred `wire:model`) on the question textarea, so a future edit cannot silently reintroduce the deferred-binding bug.
  - The actual keystroke-to-network-request behavior only reproduces in a real browser; Anne documents a **manual test handoff** step for the human to click through in Herd, since Playwright/Dusk are out of scope under `testing: NORMAL`.
