    id: TASK-02
    title: "Regression coverage for the launch button's disabled state and the live binding"
    body: |-
      ## Description
      Add Pest coverage that guards the launch-button regression: the button's `disabled` attribute must track `$command`/the block reason across question states, and the textarea binding must stay `wire:model.live` so the deferred-binding bug cannot silently return.

      ## Files Involved
      - tests/Feature/AskClaudePanelTest.php

      ## Steps
      1. Reuse the existing `readyEvent()` fixture and `Queue::fake()` from `AskClaudePanelTest`.
      2. Add a test asserting the rendered button carries the `disabled` attribute when `question` is empty/whitespace-only (`assertSeeHtml`/`assertDontSeeHtml` on the button markup, or `assertSeeHtmlInOrder` around the `disabled` token), and does **not** carry it once a valid question is set — covering the same `$command` states `render()` already computes.
      3. Add a lightweight assertion (e.g. `assertStringContainsString('wire:model.live', file_get_contents(resource_path('views/livewire/ask-claude.blade.php')))`) that pins the `.live` modifier on the question textarea, guarding against a future revert to plain deferred `wire:model`.
      4. Document a **manual test handoff** note in the test class docblock (or PR notes) instructing the human to type a question in a real browser at `https://personal-kbms.test` and confirm the button enables without blur/other action — the true keystroke round-trip only reproduces in a browser and Playwright/Dusk are out of scope under `testing: NORMAL`.
      5. `php artisan test --filter=AskClaudePanelTest`

      ## Completion Criteria
      - [x] New tests pass locally alongside the existing `AskClaudePanelTest` suite
      - [x] Regression guard on the `.live` modifier is in place
      - [x] Manual test handoff note recorded for human browser verification

      ## Git Deliverables
      - Commit: `test(US-014): TASK-02 cover launch button disabled state and live binding regression`
      - Push: skip (`git_mode: GITFLOW`)
      - PR: update local PR notes only
