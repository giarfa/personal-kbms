    id: TASK-01
    title: 'Sync the question textarea live so the launch button re-evaluates on input'
    body: |-
      ## Description
      Fix: the "Launch session" button stays disabled after typing a question because `wire:model="question"` is deferred and never recomputes the server-side `$command` that drives the button's `disabled` attribute.

      ## Files Involved
      - resources/views/livewire/ask-claude.blade.php

      ## Steps
      1. Change `wire:model="question"` (line 29) to `wire:model.live.debounce.400ms="question"` so edits sync to the server on a short debounce instead of staying client-side only.
      2. Confirm `AskClaude::render()` (`app/Livewire/AskClaude.php:89-98`) already recomputes `$command`/`$isQuestionBlock`/`$blockMessage` from `$this->question` on every request — no server-side change needed, only the binding.
      3. Do not touch `AskClaude::launch()`, `LaunchPreflight`, or `LaunchCommand` — the shell-argument-array security behavior from US-009 must stay exactly as is.
      4. `php artisan test --filter=AskClaudePanelTest`

      ## Completion Criteria
      - [x] Typing a non-whitespace question makes the "Launch session" button clickable without any other action
      - [x] Button's enabled/disabled state stays in sync with the server-side block reason as the user edits the question
      - [x] No regression to `LaunchPreflight`/`LaunchCommand` argument handling
      - [x] Tests pass

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Git Deliverables
      - Commit: `fix(US-014): TASK-01 sync question input live so launch button re-evaluates`
      - Push: skip (`git_mode: GITFLOW`)
      - PR: update local PR notes only
