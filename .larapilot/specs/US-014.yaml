body: |
  #### US-014: Fix — Launch session button stays disabled after typing a question

  **Epic:** EP-005 | **Priority:** HIGH | **Points:** 2 | **Status:** TODO
  **Type:** Fix
  **Severity:** High
  **Security:** Lars/Oliver — no
  **Related:** US-009 (Claude Code session launch bridge — regression)

  **User Story**
  As the operator,
  I want the "Launch session" button to become clickable as soon as I type a valid question,
  so that I can actually start a Claude Code session instead of being stuck on a disabled button.

  **Demonstrates**
  Typing a non-whitespace question into the Ask Claude Code textarea enables the "Launch session"
  button without any other action, and clicking it dispatches the launch job as before.

  **Steps to Reproduce**
  1. Open a meeting detail page with a linked transcript.
  2. Type any text into the "Your question" textarea on the Ask Claude Code form.
  3. Observe the "Launch session" button remains disabled/non-clickable.

  **Root cause**
  The button (`resources/views/livewire/ask-claude.blade.php:53`) carries a native HTML `disabled`
  attribute driven by the server-computed `$command` (`app/Livewire/AskClaude.php:89-98`, via
  `LaunchPreflight::for()`). The question textarea binds with a plain `wire:model="question"`
  (no `.live`/`.blur`, `ask-claude.blade.php:27`), which Livewire 3 defers client-side only — typing
  never triggers a server round-trip, so `$command` is never recomputed and the native `disabled`
  attribute never clears. Because it's a native `disabled` attribute (not Alpine/`wire:target`-driven),
  the browser also blocks `wire:click="launch"` from firing at all while it's set.

  **Acceptance Criteria**
  - [ ] Typing a non-whitespace question into the textarea makes the "Launch session" button clickable
        without any other action
  - [ ] The button's enabled/disabled state stays in sync with the server-side block reason (empty
        question, question too long, no transcript, misconfigured script) as the user edits the question
  - [ ] Regression test covers: button disabled on empty/whitespace-only question, button enabled once
        valid question text is present, and the launch flow still fires correctly (Anne)
  - [ ] No regression to the existing shell-argument safety behavior in `LaunchPreflight`/`LaunchCommand` (Lars)
