body: |
  #### US-005: Agenda view, meeting detail and Open in Outlook

  **Epic:** EP-003 | **Priority:** HIGH | **Points:** 10 | **Status:** TODO
  **Blocked by:** US-003

  **Traces to:** FR-003, FR-004, FR-009 (MoSCoW: Must)

  **User Story**
  As the operator,
  I want a chronological agenda I can scan and a canonical page per meeting that also gets me into Outlook when I need a real calendar action,
  so that triaging my day and opening a specific meeting is one continuous motion instead of a hunt across tools.

  **Demonstrates**
  After implementing this spec, the agenda lists recent and upcoming meetings defaulting to today, each row opens a meeting detail page showing all mirrored feed data, and an "Open in Outlook" call-to-action reaches the right place in Outlook on the web.

  **Acceptance Criteria**
  - [ ] The agenda lists meetings chronologically, **defaults to today**, and supports date-range navigation forward and back
  - [ ] The agenda is fully **keyboard navigable** with visible focus states, and rows are reachable without a pointer
  - [ ] Each meeting occurrence has a canonical detail route addressed by (`source_uid`, `recurrence_id`) — **not** by a surrogate row id that a resync could change
  - [ ] The detail page shows mirrored feed fields read-only: title, start, end, duration, location, organizer, attendees, description
  - [ ] Mirrored feed data is **visually distinct** from operator-owned surfaces, so it is obvious which side can change under you on the next sync
  - [ ] Cancelled occurrences are clearly marked in both agenda and detail rather than hidden
  - [ ] "Open in Outlook" **prefers a feed-carried link** (`event_url`) when present, and otherwise falls back to the configurable `KBMS_OUTLOOK_URL_TEMPLATE` with the event's date and time substituted
  - [ ] When a Teams join URL was captured, it is offered as a **distinct action** from the Outlook calendar call-to-action
  - [ ] Both links open in a new tab and are safe against tab-nabbing (`rel="noopener"`)
  - [ ] Layout is desktop-first, does not break below `768px`, and meets WCAG 2.2 AA contrast in both light and dark themes
  - [ ] **Error case:** requesting a detail route for an occurrence that no longer exists returns a clear not-found state, not an exception
  - [ ] **Edge case:** with `KBMS_OUTLOOK_URL_TEMPLATE` unset and no feed-carried link, the call-to-action is disabled with an explanatory tooltip rather than producing a broken URL
  - [ ] **Edge case:** a date range containing no meetings shows an explicit empty state
  - [ ] **Edge case:** overlapping and multi-day events render without collapsing into each other or being dropped
  - [ ] Feature tests cover agenda ranges, detail rendering, link preference order, and the disabled call-to-action path
