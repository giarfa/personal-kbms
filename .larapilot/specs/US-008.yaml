body: |
  #### US-008: Calendar views: month, week and day

  **Epic:** EP-003 | **Priority:** HIGH | **Points:** 8 | **Status:** TODO
  **Blocked by:** US-006, US-007

  **User Story**
  As the operator,
  I want month, week, and day views of my mirrored calendar that show me at a glance which meetings I have already annotated,
  so that the calendar doubles as a coverage map and I can see where my knowledge base has gaps.

  **Traces to:** FR-002 (MoSCoW: Must). Sequenced after US-006 and US-007 because the note and transcript presence indicators cannot be demonstrated until those surfaces exist.

  **Demonstrates**
  After implementing this spec, month, week, and day views render the mirrored calendar, meetings carrying notes or a linked transcript are visually distinguished from bare ones, and clicking any event opens its detail page.

  **Acceptance Criteria**
  - [ ] Month, week, and day views render mirrored events using FullCalendar **MIT core plugins only** — no premium plugins
  - [ ] Meetings carrying notes and/or a linked transcript are **visually distinguished** from bare ones, with the distinction legible without hovering
  - [ ] The indicator distinguishes "has notes", "has transcript", and "has both"
  - [ ] Clicking or activating an event opens the US-005 detail route
  - [ ] Views are **keyboard navigable** with visible focus, and the calendar grid carries deliberate screen-reader semantics — FullCalendar's defaults alone are not sufficient
  - [ ] Events render in `KBMS_TIMEZONE` and remain correct across a DST boundary
  - [ ] All-day events render in the all-day lane, not as midnight-to-midnight blocks
  - [ ] Cancelled occurrences are visually distinct from active ones
  - [ ] View and date position survive navigation to a meeting and back
  - [ ] AA contrast holds for every event state in both light and dark themes
  - [ ] Only the visible range is queried — the view does not load the whole mirror
  - [ ] **Error case:** a range with no events renders an empty grid, not a broken layout
  - [ ] **Edge case:** a day with many overlapping meetings degrades gracefully (stacking or a "+N more" affordance) without hiding events silently
  - [ ] **Edge case:** multi-day events span correctly in month view
